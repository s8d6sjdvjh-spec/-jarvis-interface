<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Test voix Jarvis</title>

<style>
body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    height: 100vh;
}

button {
    font-size: 24px;
    padding: 25px 40px;
    border-radius: 20px;
    border: none;
    background: #222;
    color: white;
}
</style>
</head>

<body>

<button id="test">🔊 TESTER LA VOIX</button>

<script>

document.getElementById("test").addEventListener("click", function () {

    const synth = window.speechSynthesis;

    synth.cancel();

    const voix = new SpeechSynthesisUtterance(
        "Bonjour monsieur. Je suis Jarvis."
    );

    voix.lang = "fr-FR";
    voix.rate = 0.85;
    voix.pitch = 1;
    voix.volume = 1;

    synth.speak(voix);

});

</script>

</body>
</html>
