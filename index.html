<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,
               user-scalable=no">

<title>JARVIS — Voice Core</title>

<style>
:root{
  --cyan:#35e8ff;
  --cyan2:#83f6ff;
  --blue:#4d9dff;
  --violet:#9c78ff;
  --gold:#e4b45a;
  --bg:#020b10;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:#dffcff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

body{
  position:relative;
}

/* =========================================================
   BACKGROUND
========================================================= */

#background{
  position:fixed;
  inset:0;
  background:
    radial-gradient(
      ellipse at 50% 48%,
      rgba(12,75,94,.22) 0%,
      rgba(2,16,22,.10) 35%,
      rgba(1,8,12,1) 72%
    ),
    linear-gradient(
      rgba(30,130,150,.075) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(30,130,150,.075) 1px,
      transparent 1px
    );
  background-size:
    100% 100%,
    26px 26px,
    26px 26px;
}

#background:after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(rgba(74,212,238,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(74,212,238,.035) 1px,transparent 1px);
  background-size:130px 130px;
  pointer-events:none;
}

/* =========================================================
   HEADER
========================================================= */

header{
  position:absolute;
  z-index:20;
  top:calc(env(safe-area-inset-top) + 25px);
  left:30px;
  right:24px;
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:31px;
  font-weight:300;
  letter-spacing:.28em;
  white-space:nowrap;
}

.status{
  display:flex;
  gap:20px;
  align-items:center;
  font-size:11px;
  letter-spacing:.28em;
  color:rgba(190,235,243,.58);
  white-space:nowrap;
}

.status span{
  display:flex;
  align-items:center;
  gap:8px;
}

.status i{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--cyan);
  box-shadow:
    0 0 8px var(--cyan),
    0 0 18px rgba(53,232,255,.7);
}

.title{
  position:absolute;
  z-index:20;
  top:calc(env(safe-area-inset-top) + 105px);
  left:0;
  width:100%;
  text-align:center;
  font-size:13px;
  letter-spacing:.34em;
  color:rgba(137,214,225,.68);
}

.subtitle{
  position:absolute;
  z-index:20;
  top:calc(env(safe-area-inset-top) + 137px);
  width:100%;
  text-align:center;
  font-size:9px;
  letter-spacing:.34em;
  color:rgba(105,170,182,.48);
}

/* =========================================================
   MAIN CORE
========================================================= */

#coreStage{
  position:absolute;
  z-index:5;

  /*
    Zone centrale volontairement généreuse.
    Les couronnes restent parfaitement centrées.
  */
  top:calc(env(safe-area-inset-top) + 175px);
  left:50%;
  width:min(96vw,520px);
  height:min(96vw,520px);
  transform:translateX(-50%);
}

/* canvas is the entire visual system */
#visual{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

/* =========================================================
   CORE LABEL
========================================================= */

.coreLabel{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:8;
  text-align:center;
  pointer-events:none;
  text-shadow:0 0 12px rgba(100,240,255,.75);
}

.coreLabel .main{
  font-size:15px;
  letter-spacing:.48em;
  padding-left:.48em;
}

.coreLabel .sub{
  margin-top:8px;
  font-size:8px;
  letter-spacing:.35em;
  color:rgba(170,239,246,.62);
}

/* =========================================================
   AUDIO / TRANSCRIPT
========================================================= */

#voicePanel{
  position:absolute;
  z-index:20;
  top:calc(env(safe-area-inset-top) + 710px);
  left:7%;
  right:7%;
  height:76px;
  border-top:1px solid rgba(55,226,249,.34);
  border-bottom:1px solid rgba(55,226,249,.34);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.voiceState{
  font-size:9px;
  letter-spacing:.34em;
  color:rgba(126,219,231,.58);
  margin-bottom:8px;
}

#transcript{
  max-width:90%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:17px;
  letter-spacing:.08em;
  color:#e4fbff;
}

/* =========================================================
   BUTTONS
========================================================= */

.controls{
  position:absolute;
  z-index:30;
  left:6%;
  right:6%;
  bottom:calc(env(safe-area-inset-bottom) + 25px);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

button{
  height:76px;
  border:1px solid rgba(48,229,255,.62);
  background:
    linear-gradient(
      135deg,
      rgba(20,111,131,.18),
      rgba(2,24,32,.48)
    );
  color:#d9fbff;
  font:inherit;
  letter-spacing:.2em;
  font-size:10px;
  box-shadow:
    inset 0 0 20px rgba(40,210,240,.04),
    0 0 12px rgba(30,190,220,.06);
}

button:active{
  transform:scale(.97);
  background:rgba(30,180,205,.16);
}

button.active{
  border-color:#7df6ff;
  box-shadow:
    0 0 18px rgba(53,232,255,.42),
    inset 0 0 25px rgba(53,232,255,.12);
}

.micDot{
  display:block;
  width:10px;
  height:10px;
  margin:0 auto 8px;
  border-radius:50%;
  background:var(--cyan);
  box-shadow:0 0 15px var(--cyan);
}

/* =========================================================
   SMALL DEVICES
========================================================= */

@media(max-height:760px){
  #coreStage{
    top:calc(env(safe-area-inset-top) + 145px);
    width:88vw;
    height:88vw;
  }

  #voicePanel{
    top:calc(env(safe-area-inset-top) + 590px);
  }

  .controls{
    bottom:calc(env(safe-area-inset-bottom) + 12px);
  }

  button{
    height:62px;
  }
}
</style>
</head>

<body>

<div id="background"></div>

<header>
  <div class="logo">JARVIS</div>

  <div class="status">
    <span><i></i>ONLINE</span>
    <span><i></i>SECURE</span>
    <span><i></i>VOICE</span>
  </div>
</header>

<div class="title">
  VOICE CORE · CRYSTALLINE MATRIX · 3 AXIS
</div>

<div class="subtitle">
  HOLOGRAPHIC CONCENTRIC SYSTEM · AUDIO REACTIVE
</div>

<div id="coreStage">
  <canvas id="visual"></canvas>

  <div class="coreLabel">
    <div class="main">CORE</div>
    <div class="sub">READY</div>
  </div>
</div>

<div id="voicePanel">
  <div class="voiceState" id="voiceState">
    VOICE SYSTEM · READY
  </div>
  <div id="transcript">EN ATTENTE DE COMMANDE</div>
</div>

<div class="controls">

  <button id="micButton">
    <span class="micDot"></span>
    MICRO ACTIF
  </button>

  <button id="shortcutButton">
    ↗<br>
    ENVOYER<br>
    RACCOURCIS
  </button>

  <button id="speakButton">
    ◌<br>
    VOIX JARVIS
  </button>

</div>

<script>

/* =========================================================
   JARVIS VISUAL ENGINE
   Aucun framework externe.
   Fonctionne directement dans GitHub Pages.
========================================================= */

const canvas = document.getElementById("visual");
const ctx = canvas.getContext("2d");

const stage = document.getElementById("coreStage");
const micButton = document.getElementById("micButton");
const shortcutButton = document.getElementById("shortcutButton");
const speakButton = document.getElementById("speakButton");

const voiceState = document.getElementById("voiceState");
const transcript = document.getElementById("transcript");

let W,H,DPR;
let time = 0;

let audioContext = null;
let analyser = null;
let microphone = null;
let audioData = null;

let listening = false;
let level = 0;
let targetLevel = 0;

let recognition = null;
let lastTranscript = "";

/* =========================================================
   RESIZE
========================================================= */

function resize(){

  DPR = Math.min(window.devicePixelRatio || 1,2);

  W = stage.clientWidth;
  H = stage.clientHeight;

  canvas.width = W * DPR;
  canvas.height = H * DPR;

  canvas.style.width = W+"px";
  canvas.style.height = H+"px";

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

window.addEventListener("resize",resize);
resize();

/* =========================================================
   AUDIO
========================================================= */

async function startAudio(){

  try{

    audioContext =
      new (window.AudioContext ||
           window.webkitAudioContext)();

    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true
        }
      });

    microphone =
      audioContext.createMediaStreamSource(stream);

    analyser =
      audioContext.createAnalyser();

    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = .72;

    audioData =
      new Uint8Array(analyser.fftSize);

    microphone.connect(analyser);

    listening = true;

    micButton.classList.add("active");

    voiceState.textContent =
      "VOICE SYSTEM · LISTENING";

    startRecognition();

  }catch(error){

    voiceState.textContent =
      "MICROPHONE · PERMISSION REQUIRED";

    console.log(error);
  }
}

/* =========================================================
   SPEECH RECOGNITION
========================================================= */

function startRecognition(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    voiceState.textContent =
      "VOICE SYSTEM · AUDIO READY";

    return;
  }

  recognition =
    new SpeechRecognition();

  recognition.lang = "fr-FR";
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onstart = ()=>{
    voiceState.textContent =
      "VOICE SYSTEM · LISTENING";
  };

  recognition.onresult = event =>{

    let text = "";

    for(
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ){

      text +=
        event.results[i][0].transcript;
    }

    text = text.trim();

    if(text){

      lastTranscript = text;
      transcript.textContent = text;

      voiceState.textContent =
        "VOICE SYSTEM · COMMAND RECEIVED";
    }
  };

  recognition.onerror = ()=>{
    voiceState.textContent =
      "VOICE SYSTEM · READY";
  };

  recognition.onend = ()=>{

    if(listening){

      try{
        recognition.start();
      }catch(e){}
    }
  };

  try{
    recognition.start();
  }catch(e){}
}

/* =========================================================
   MICROPHONE BUTTON
========================================================= */

micButton.addEventListener("click",async()=>{

  if(!listening){

    await startAudio();

  }else{

    listening = false;

    micButton.classList.remove("active");

    voiceState.textContent =
      "VOICE SYSTEM · READY";

    if(recognition){

      try{
        recognition.stop();
      }catch(e){}
    }
  }
});

/* =========================================================
   AUDIO LEVEL
========================================================= */

function updateAudio(){

  if(!analyser || !audioData){

    targetLevel =
      listening
      ? .08 + Math.sin(time*.001)*.025
      : 0;

  }else{

    analyser.getByteTimeDomainData(audioData);

    let sum = 0;

    for(let i=0;i<audioData.length;i++){

      const v =
        (audioData[i]-128)/128;

      sum += v*v;
    }

    const rms =
      Math.sqrt(sum/audioData.length);

    targetLevel =
      Math.min(1,rms*5.5);
  }

  /*
    Attack rapide.
    Retour plus lent.
    Cela donne le mouvement "physique"
    demandé lorsque la voix arrive.
  */

  if(targetLevel > level){

    level +=
      (targetLevel-level)*.34;

  }else{

    level +=
      (targetLevel-level)*.075;
  }
}

/* =========================================================
   HELPERS
========================================================= */

function polar(cx,cy,r,a){

  return {
    x:cx+Math.cos(a)*r,
    y:cy+Math.sin(a)*r
  };
}

function glow(color,blur){

  ctx.shadowColor=color;
  ctx.shadowBlur=blur;
}

function noGlow(){

  ctx.shadowBlur=0;
}

/* =========================================================
   BACKGROUND PARTICLES
========================================================= */

const particles = [];

for(let i=0;i<90;i++){

  particles.push({
    x:Math.random(),
    y:Math.random(),
    r:.4+Math.random()*1.2,
    a:.12+Math.random()*.38
  });
}

function drawParticles(){

  for(const p of particles){

    ctx.beginPath();

    ctx.fillStyle=
      `rgba(80,210,230,${p.a})`;

    ctx.arc(
      p.x*W,
      p.y*H,
      p.r,
      0,
      Math.PI*2
    );

    ctx.fill();
  }
}

/* =========================================================
   CORE — LIQUID FACETED GLASS
========================================================= */

function drawCore(cx,cy,baseR){

  /*
    La sphère ne contient PAS de galaxie,
    PAS de fils internes,
    PAS de wireframe.
    
    Seulement :
    - volume liquide
    - facettes translucides
    - lumière réfractée
    - bords lumineux
  */

  const pulse =
    1 + level*.16 + Math.sin(time*.003)*.015;

  const r =
    baseR*pulse;

  /* halo */

  const halo =
    ctx.createRadialGradient(
      cx,cy,0,
      cx,cy,r*1.7
    );

  halo.addColorStop(
    0,
    `rgba(46,224,255,${.20+level*.20})`
  );

  halo.addColorStop(
    .42,
    `rgba(24,138,178,${.10+level*.10})`
  );

  halo.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );

  ctx.fillStyle=halo;

  ctx.beginPath();
  ctx.arc(cx,cy,r*1.7,0,Math.PI*2);
  ctx.fill();

  /* liquid glass body */

  const glass =
    ctx.createRadialGradient(
      cx-r*.3,
      cy-r*.35,
      r*.05,
      cx,
      cy,
      r
    );

  glass.addColorStop(
    0,
    `rgba(170,250,255,${.22+level*.10})`
  );

  glass.addColorStop(
    .22,
    `rgba(35,180,215,${.18+level*.08})`
  );

  glass.addColorStop(
    .58,
    "rgba(5,70,91,.16)"
  );

  glass.addColorStop(
    .84,
    "rgba(2,24,34,.10)"
  );

  glass.addColorStop(
    1,
    "rgba(0,12,20,.04)"
  );

  /*
    polygon irrégulier,
    plus géode que sphère.
  */

  const points=16;
  const verts=[];

  for(let i=0;i<points;i++){

    const a =
      i/points*Math.PI*2;

    const deformation =
      1 +
      Math.sin(i*2.37)*.045 +
      Math.sin(i*4.11)*.025;

    verts.push(
      polar(
        cx,
        cy,
        r*deformation,
        a
      )
    );
  }

  ctx.beginPath();

  verts.forEach((p,i)=>{

    if(i===0) ctx.moveTo(p.x,p.y);
    else ctx.lineTo(p.x,p.y);

  });

  ctx.closePath();

  ctx.fillStyle=glass;

  glow("rgba(40,230,255,.55)",20);

  ctx.fill();

  noGlow();

  /* =====================================================
     FACET SURFACES
     Pas de traits : uniquement des surfaces transparentes.
  ===================================================== */

  const facetCount=18;

  for(let i=0;i<facetCount;i++){

    const a1 =
      Math.random()*Math.PI*2;

    const a2 =
      a1+.35+Math.random()*.8;

    const rr =
      r*(.38+Math.random()*.55);

    const p1=polar(cx,cy,r*.05,a1);
    const p2=polar(cx,cy,rr,a1);
    const p3=polar(cx,cy,rr,a2);
    const p4=polar(cx,cy,r*.05,a2);

    const hue =
      i%4===0
      ? "80,220,255"
      : i%4===1
      ? "100,170,255"
      : i%4===2
      ? "160,120,255"
      : "70,240,220";

    ctx.beginPath();

    ctx.moveTo(p1.x,p1.y);
    ctx.lineTo(p2.x,p2.y);
    ctx.lineTo(p3.x,p3.y);
    ctx.lineTo(p4.x,p4.y);
    ctx.closePath();

    ctx.fillStyle=
      `rgba(${hue},${.025+level*.035})`;

    ctx.fill();
  }

  /* bright refracted edges */

  ctx.save();

  ctx.beginPath();

  for(let i=0;i<verts.length;i++){

    const p=verts[i];

    if(i===0) ctx.moveTo(p.x,p.y);
    else ctx.lineTo(p.x,p.y);
  }

  ctx.closePath();

  ctx.strokeStyle=
    `rgba(130,248,255,${.48+level*.32})`;

  ctx.lineWidth=1.2+level*1.2;

  ctx.shadowColor="#43ecff";
  ctx.shadowBlur=14+level*24;

  ctx.stroke();

  ctx.restore();

  /* moving internal light refractions */

  const lights=5;

  for(let i=0;i<lights;i++){

    const a =
      time*.00045*(i%2?-1:1)
      +i*1.7;

    const rr =
      r*(.18+i*.12);

    const p=polar(cx,cy,rr,a);

    const g=
      ctx.createRadialGradient(
        p.x,p.y,0,
        p.x,p.y,r*.20
      );

    g.addColorStop(
      0,
      `rgba(220,255,255,${.30+level*.25})`
    );

    g.addColorStop(
      .15,
      `rgba(50,230,255,${.12+level*.15})`
    );

    g.addColorStop(
      1,
      "rgba(0,0,0,0)"
    );

    ctx.fillStyle=g;

    ctx.beginPath();
    ctx.arc(p.x,p.y,r*.20,0,Math.PI*2);
    ctx.fill();
  }

  /* specular highlight */

  const spec =
    ctx.createRadialGradient(
      cx-r*.38,
      cy-r*.45,
      0,
      cx-r*.38,
      cy-r*.45,
      r*.34
    );

  spec.addColorStop(
    0,
    "rgba(245,255,255,.72)"
  );

  spec.addColorStop(
    .10,
    "rgba(160,250,255,.25)"
  );

  spec.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );

  ctx.fillStyle=spec;

  ctx.beginPath();

  ctx.arc(
    cx-r*.38,
    cy-r*.45,
    r*.34,
    0,
    Math.PI*2
  );

  ctx.fill();
}

/* =========================================================
   RINGS
========================================================= */

const ringDefinitions=[
  {
    base:.30,
    spread:.17,
    speed:.00038,
    accent:"#4deaff"
  },
  {
    base:.46,
    spread:.19,
    speed:-.00031,
    accent:"#54b7ff"
  },
  {
    base:.63,
    spread:.21,
    speed:.00025,
    accent:"#8f7cff"
  },
  {
    base:.81,
    spread:.23,
    speed:-.00020,
    accent:"#e0b15c"
  }
];

/*
  Informations inspirées visuellement
  des couronnes de montres, objectifs
  photographiques et instruments de précision :
  
  nombres, angles, valeurs, symboles,
  focales, rapports, repères techniques.
*/

const labels=[
  "000","015","030","045","060","075",
  "090","105","120","135","150","165",
  "180","195","210","225","240","255",
  "270","285","300","315","330","345"
];

function drawRing(cx,cy,ring,index){

  /*
    DILATATION IMPORTANTE :
    jusqu'à +23% pendant une voix forte.
    Les quatre couronnes restent concentriques.
  */

  const voiceExpansion =
    level * (ring.spread*1.45);

  const breathe =
    Math.sin(time*.002+index)*.008;

  const radius =
    Math.min(W*.48,
      W*(ring.base+
        voiceExpansion+
        breathe)
    );

  const rotation =
    time*ring.speed;

  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(rotation);

  /* outer luminous body */

  ctx.beginPath();
  ctx.arc(0,0,radius,0,Math.PI*2);

  ctx.strokeStyle=
    ring.accent;

  ctx.globalAlpha=.34+level*.35;
  ctx.lineWidth=1.6+level*2.4;

  ctx.shadowColor=ring.accent;
  ctx.shadowBlur=8+level*18;

  ctx.stroke();

  ctx.shadowBlur=0;

  /* second precision edge */

  ctx.beginPath();

  ctx.arc(
    0,0,
    radius-6-level*4,
    0,Math.PI*2
  );

  ctx.strokeStyle=
    "rgba(130,235,250,.55)";

  ctx.lineWidth=.65;

  ctx.stroke();

  /* =====================================================
     DENSE TECHNICAL BAND
  ===================================================== */

  const ticks=72;

  for(let i=0;i<ticks;i++){

    const a =
      i/ticks*Math.PI*2;

    const major =
      i%6===0;

    const medium =
      i%3===0;

    const inner =
      radius-(major?16:medium?11:7);

    const outer =
      radius-(major?1:medium?4:5);

    const p1=polar(0,0,inner,a);
    const p2=polar(0,0,outer,a);

    ctx.beginPath();
    ctx.moveTo(p1.x,p1.y);
    ctx.lineTo(p2.x,p2.y);

    ctx.strokeStyle=
      major
      ? "rgba(225,250,255,.85)"
      : "rgba(88,220,240,.55)";

    ctx.lineWidth=
      major?1.2:.55;

    ctx.stroke();
  }

  /* =====================================================
     CAMERA / WATCH INFORMATION
  ===================================================== */

  ctx.font =
    `${Math.max(7,W*.020)}px monospace`;

  ctx.textAlign="center";
  ctx.textBaseline="middle";

  for(let i=0;i<labels.length;i++){

    const a =
      i/labels.length*Math.PI*2;

    const rr =
      radius-27;

    const p=polar(0,0,rr,a);

    ctx.save();

    ctx.translate(p.x,p.y);
    ctx.rotate(a+Math.PI/2);

    ctx.fillStyle=
      i%4===0
      ? "rgba(222,247,252,.72)"
      : "rgba(105,205,222,.46)";

    ctx.fillText(
      labels[i],
      0,0
    );

    ctx.restore();
  }

  /* technical values */

  const tech=[
    "1:2.8",
    "ISO 400",
    "f/2.8",
    "24mm",
    "∞",
    "1/125",
    "EV +0.7",
    "AF-C",
    "12B",
    "3.2V",
    "Δ",
    "R08"
  ];

  ctx.font =
    `${Math.max(6,W*.016)}px monospace`;

  for(let i=0;i<tech.length;i++){

    const a =
      i/tech.length*Math.PI*2
      +.18;

    const rr =
      radius-46;

    const p=polar(0,0,rr,a);

    ctx.save();

    ctx.translate(p.x,p.y);
    ctx.rotate(a+Math.PI/2);

    ctx.fillStyle=
      i%3===0
      ? "rgba(226,178,85,.62)"
      : "rgba(151,221,236,.42)";

    ctx.fillText(
      tech[i],
      0,0
    );

    ctx.restore();
  }

  /* =====================================================
     ARCS — rotation inverse des couronnes
  ===================================================== */

  const arcSpeed =
    time*ring.speed*-1.65;

  for(let j=0;j<3;j++){

    const rr =
      radius-12-j*9;

    const start =
      arcSpeed+
      j*2.0+
      index*.6;

    const length =
      .42+j*.16;

    ctx.beginPath();

    ctx.arc(
      0,0,
      rr,
      start,
      start+length
    );

    ctx.strokeStyle=
      j===0
      ? ring.accent
      : j===1
      ? "rgba(230,180,85,.72)"
      : "rgba(130,115,255,.65)";

    ctx.lineWidth=
      j===0
      ? 2.0+level*2
      : .9;

    ctx.globalAlpha=
      .72+level*.2;

    ctx.stroke();
  }

  /* =====================================================
     ACTIVE DATA NODES
  ===================================================== */

  for(let j=0;j<6;j++){

    const a =
      time*ring.speed*.7+
      j*Math.PI/3+
      index*.71;

    const p=
      polar(
        0,
        0,
        radius-2,
        a
      );

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      2.2+level*2.5,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
      j%4===0
      ? "#e7bd63"
      : ring.accent;

    ctx.shadowColor=
      ctx.fillStyle;

    ctx.shadowBlur=
      8+level*15;

    ctx.fill();
  }

  ctx.restore();
}

/* =========================================================
   CENTRAL AXIS LIGHT
========================================================= */

function drawAxisLight(cx,cy){

  const pulse =
    1+level*.7;

  const g=
    ctx.createRadialGradient(
      cx,cy,0,
      cx,cy,55*pulse
    );

  g.addColorStop(
    0,
    `rgba(120,250,255,${.18+level*.25})`
  );

  g.addColorStop(
    .35,
    `rgba(50,210,255,${.08+level*.12})`
  );

  g.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );

  ctx.fillStyle=g;

  ctx.beginPath();
  ctx.arc(cx,cy,55*pulse,0,Math.PI*2);
  ctx.fill();
}

/* =========================================================
   MAIN DRAW
========================================================= */

function draw(){

  time++;

  updateAudio();

  ctx.clearRect(0,0,W,H);

  drawParticles();

  const cx=W/2;
  const cy=H/2;

  /*
    Couronnes dessinées AVANT la géode :
    elles restent derrière le cœur.
  */

  for(
    let i=ringDefinitions.length-1;
    i>=0;
    i--
  ){

    drawRing(
      cx,
      cy,
      ringDefinitions[i],
      i
    );
  }

  drawAxisLight(cx,cy);

  /*
    Géode au-dessus des couronnes.
    Transparence réelle : les couronnes
    restent perceptibles autour mais pas
    comme des traits traversant son volume.
  */

  drawCore(
    cx,
    cy,
    W*.105
  );

  requestAnimationFrame(draw);
}

draw();

/* =========================================================
   SPEECH SYNTHESIS
========================================================= */

speakButton.addEventListener("click",()=>{

  if(!("speechSynthesis" in window)){

    voiceState.textContent =
      "VOICE SYNTHESIS · UNAVAILABLE";

    return;
  }

  const text =
    lastTranscript ||
    "Je vous écoute.";

  speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang="fr-FR";
  utterance.rate=.92;
  utterance.pitch=.78;
  utterance.volume=1;

  const voices =
    speechSynthesis.getVoices();

  const french =
    voices.find(v =>
      v.lang &&
      v.lang.toLowerCase().startsWith("fr")
    );

  if(french){
    utterance.voice=french;
  }

  voiceState.textContent =
    "JARVIS · SPEAKING";

  utterance.onend=()=>{
    voiceState.textContent =
      listening
      ? "VOICE SYSTEM · LISTENING"
      : "VOICE SYSTEM · READY";
  };

  speechSynthesis.speak(utterance);
});

/* =========================================================
   RACCOURCIS iOS
========================================================= */

shortcutButton.addEventListener("click",()=>{

  const text =
    lastTranscript ||
    transcript.textContent ||
    "";

  if(!text) return;

  /*
    Nom du raccourci à modifier ici si nécessaire.
    Exemple : "JARVIS"
  */

  const shortcutName="JARVIS";

  const url =
    "shortcuts://run-shortcut" +
    "?name="+encodeURIComponent(shortcutName)+
    "&input="+encodeURIComponent(text);

  window.location.href=url;

  voiceState.textContent =
    "COMMAND · SENT TO SHORTCUTS";
});

/* =========================================================
   KEYBOARD / TOUCH FEEDBACK
========================================================= */

document.addEventListener(
  "touchstart",
  ()=>{
    if(audioContext &&
       audioContext.state==="suspended"){
      audioContext.resume();
    }
  },
  {passive:true}
);

</script>
