<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02080c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>JARVIS — Neural Interface</title>

<style>
:root{
    --bg:#02080c;
    --cyan:#11dfff;
    --cyan-soft:#68efff;
    --cyan-dim:#126b7a;
    --cyan-faint:#07343f;
    --white:#dffaff;
    --red:#ff4054;
    --gold:#b88b3a;
    --grid:rgba(42,137,155,.075);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    min-height:100%;
    background:var(--bg);
    color:var(--white);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    overflow-x:hidden;
}

body{
    min-height:100svh;
    position:relative;
}

/* =========================================================
   BACKGROUND
   ========================================================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background-image:
        linear-gradient(var(--grid) 1px,transparent 1px),
        linear-gradient(90deg,var(--grid) 1px,transparent 1px);

    background-size:
        72px 72px,
        72px 72px;

    opacity:.75;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(0,111,135,.10),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 42%,
            transparent 48%,
            rgba(0,0,0,.35) 100%
        );
}

/* =========================================================
   MAIN INTERFACE
   ========================================================= */

.interface{
    position:relative;
    width:100%;
    min-height:100svh;
    padding:
        max(24px,env(safe-area-inset-top))
        18px
        max(24px,env(safe-area-inset-bottom));

    display:flex;
    flex-direction:column;
}

/* =========================================================
   HEADER
   ========================================================= */

.header{
    width:100%;
    height:76px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    position:relative;
    z-index:10;
}

.logo{
    font-size:27px;
    font-weight:300;
    letter-spacing:.36em;
    white-space:nowrap;
}

.status{
    display:flex;
    align-items:center;
    gap:18px;

    font-size:10px;
    letter-spacing:.30em;
    color:#54727b;
}

.status-item{
    display:flex;
    align-items:center;
    gap:7px;
    white-space:nowrap;
}

.status-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--cyan);

    box-shadow:
        0 0 7px var(--cyan),
        0 0 16px rgba(0,221,255,.55);

    animation:statusPulse 2.5s ease-in-out infinite;
}

.status-item:nth-child(2) .status-dot{
    animation-delay:.4s;
}

.status-item:nth-child(3) .status-dot{
    animation-delay:.8s;
}

@keyframes statusPulse{
    0%,100%{opacity:.55;transform:scale(.8)}
    50%{opacity:1;transform:scale(1)}
}

/* =========================================================
   TITLE
   ========================================================= */

.system-title{
    text-align:center;
    margin-top:18px;

    font-size:11px;
    letter-spacing:.46em;
    color:#477681;

    white-space:nowrap;
}

.system-subtitle{
    text-align:center;
    margin-top:17px;

    font-size:8px;
    letter-spacing:.42em;
    color:#315760;
}

/* =========================================================
   CORE AREA
   ========================================================= */

.core-area{
    position:relative;

    width:100%;
    height:min(57vh,650px);

    min-height:430px;

    margin-top:8px;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;
}

/*
   IMPORTANT:
   Les quatre couronnes sont dimensionnées à partir
   de la largeur réellement disponible.

   Elles ne peuvent donc pas sortir horizontalement
   de l'écran de l'iPhone.
*/

.ring-system{
    position:absolute;

    width:min(94vw,680px);
    aspect-ratio:1/1;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        rotate(var(--system-rotation,0deg));

    filter:
        drop-shadow(0 0 5px rgba(0,211,255,.08));
}

/* =========================================================
   SVG RINGS
   ========================================================= */

.ring{
    fill:none;
    vector-effect:non-scaling-stroke;
}

.ring-outer{
    stroke:rgba(37,160,181,.43);
    stroke-width:1;
}

.ring-outer-bright{
    stroke:rgba(66,221,241,.72);
    stroke-width:1.4;
}

.ring-mid{
    stroke:rgba(42,139,159,.50);
    stroke-width:1;
}

.ring-fine{
    stroke:rgba(72,182,198,.32);
    stroke-width:.8;
}

.ring-red{
    stroke:var(--red);
    stroke-width:3;
    stroke-linecap:round;
    opacity:.9;
    filter:drop-shadow(0 0 5px rgba(255,64,84,.65));
}

.ring-gold{
    stroke:var(--gold);
    stroke-width:2;
    opacity:.75;
}

/* =========================================================
   ROTATION
   ========================================================= */

.rotate-a{
    animation:
        ringRotationA 32s linear infinite;
}

.rotate-b{
    animation:
        ringRotationB 47s linear infinite reverse;
}

.rotate-c{
    animation:
        ringRotationA 70s linear infinite;
}

.rotate-d{
    animation:
        ringRotationB 91s linear infinite reverse;
}

@keyframes ringRotationA{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

@keyframes ringRotationB{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

/* =========================================================
   CENTRAL ORB
   ========================================================= */

.orb{
    position:absolute;

    /*
      environ 20 % de la hauteur de l'écran,
      avec une limite pour les petits appareils.
    */

    width:min(20svh,180px);
    height:min(20svh,180px);

    min-width:112px;
    min-height:112px;

    border-radius:50%;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:5;

    background:
        radial-gradient(
            circle at 38% 32%,
            rgba(103,243,255,.95) 0%,
            rgba(18,125,151,.60) 8%,
            rgba(4,44,60,.85) 25%,
            rgba(1,17,25,.98) 62%,
            rgba(0,7,11,1) 100%
        );

    box-shadow:
        inset -18px -18px 35px rgba(0,0,0,.72),
        inset 10px 8px 24px rgba(75,218,239,.20),
        0 0 18px rgba(0,208,255,.25),
        0 0 65px rgba(0,130,170,.18);

    overflow:hidden;

    transition:
        transform .18s ease,
        box-shadow .2s ease;
}

/* crystalline shell */

.orb::before{
    content:"";

    position:absolute;
    inset:7%;

    border-radius:50%;

    border:
        1px solid rgba(109,231,247,.55);

    background:
        conic-gradient(
            from 15deg,
            transparent 0deg,
            rgba(34,194,220,.18) 20deg,
            transparent 42deg,
            rgba(255,255,255,.06) 61deg,
            transparent 90deg,
            rgba(20,183,214,.16) 125deg,
            transparent 160deg,
            rgba(255,255,255,.05) 210deg,
            transparent 250deg,
            rgba(35,211,236,.13) 310deg,
            transparent 360deg
        );

    opacity:.8;

    animation:
        orbShell 22s linear infinite;
}

@keyframes orbShell{
    from{transform:rotate(0)}
    to{transform:rotate(360deg)}
}

/* crystalline facets */

.orb::after{
    content:"";

    position:absolute;
    inset:15%;

    border-radius:45% 55% 52% 48%;

    background:
        linear-gradient(
            38deg,
            transparent 0 30%,
            rgba(93,224,241,.13) 31% 33%,
            transparent 34% 100%
        ),
        linear-gradient(
            138deg,
            transparent 0 45%,
            rgba(121,238,255,.09) 46% 49%,
            transparent 50% 100%
        );

    transform:rotate(-12deg);
}

/* =========================================================
   ORB PARTICLES
   ========================================================= */

.orb-particles{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.particle{
    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:#bffaff;

    box-shadow:
        0 0 5px #53eaff,
        0 0 10px rgba(43,221,255,.6);

    animation:
        particleFloat var(--duration) ease-in-out infinite;
}

@keyframes particleFloat{
    0%,100%{
        transform:translate3d(0,0,0);
        opacity:.35;
    }

    50%{
        transform:
            translate3d(
                var(--x),
                var(--y),
                0
            );
        opacity:1;
    }
}

/* =========================================================
   CORE TEXT
   ========================================================= */

.core-label{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:8;

    text-align:center;

    pointer-events:none;
}

.core-label-main{
    font-size:10px;
    letter-spacing:.48em;

    margin-left:.48em;

    color:#c8faff;
}

.core-label-sub{
    margin-top:8px;

    font-size:7px;
    letter-spacing:.42em;

    color:#46727b;

    margin-left:.42em;
}

/* =========================================================
   RING DATA
   ========================================================= */

.ring-number{
    fill:#83bdc7;
    font-size:11px;
    letter-spacing:1px;
}

.ring-number-bright{
    fill:#d8fbff;
    font-size:12px;
}

.ring-small{
    fill:#3d7680;
    font-size:7px;
    letter-spacing:1px;
}

.direction{
    fill:#d9fbff;
    font-size:18px;
    letter-spacing:1px;
}

.corner-mark{
    stroke:#3dd9ed;
    stroke-width:1.4;
    fill:none;
    opacity:.75;
}

/* =========================================================
   VOICE PANEL
   ========================================================= */

.voice-panel{
    position:absolute;

    left:50%;
    bottom:3%;

    transform:translateX(-50%);

    width:min(88%,520px);

    height:52px;

    border:
        1px solid rgba(22,170,191,.45);

    background:
        linear-gradient(
            90deg,
            rgba(0,18,24,.88),
            rgba(0,29,37,.48),
            rgba(0,18,24,.88)
        );

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:20;

    overflow:hidden;
}

.voice-status{
    font-size:8px;
    letter-spacing:.42em;
    color:#527a82;

    transition:.2s;
}

.voice-panel.listening .voice-status{
    color:#7cefff;

    text-shadow:
        0 0 8px rgba(41,226,255,.7);
}

.voice-wave{
    position:absolute;

    left:50%;
    bottom:5px;

    transform:translateX(-50%);

    display:flex;
    align-items:end;

    gap:3px;

    height:18px;

    opacity:.4;
}

.voice-wave span{
    width:2px;
    height:4px;

    background:var(--cyan);

    box-shadow:
        0 0 5px var(--cyan);

    animation:
        wave 1s ease-in-out infinite;
}

.voice-wave span:nth-child(2){animation-delay:.05s}
.voice-wave span:nth-child(3){animation-delay:.1s}
.voice-wave span:nth-child(4){animation-delay:.15s}
.voice-wave span:nth-child(5){animation-delay:.2s}
.voice-wave span:nth-child(6){animation-delay:.25s}
.voice-wave span:nth-child(7){animation-delay:.3s}
.voice-wave span:nth-child(8){animation-delay:.35s}
.voice-wave span:nth-child(9){animation-delay:.4s}
.voice-wave span:nth-child(10){animation-delay:.45s}
.voice-wave span:nth-child(11){animation-delay:.5s}
.voice-wave span:nth-child(12){animation-delay:.55s}
.voice-wave span:nth-child(13){animation-delay:.6s}

@keyframes wave{
    0%,100%{height:3px}
    50%{height:15px}
}

/* =========================================================
   DATA CARDS
   ========================================================= */

.dashboard{
    width:100%;

    display:grid;
    grid-template-columns:1fr 1fr;

    gap:12px;

    margin-top:6px;

    position:relative;
    z-index:30;
}

.card{
    min-height:112px;

    border:
        1px solid rgba(18,180,205,.58);

    background:
        linear-gradient(
            135deg,
            rgba(3,25,32,.92),
            rgba(2,12,17,.72)
        );

    padding:20px 18px;

    position:relative;

    overflow:hidden;
}

.card::after{
    content:"";

    position:absolute;

    left:12%;
    right:12%;
    bottom:10px;

    height:2px;

    background:
        linear-gradient(
            90deg,
            rgba(20,206,233,.65),
            rgba(20,206,233,.12)
        );
}

.card-label{
    font-size:9px;
    letter-spacing:.36em;

    color:#62bdc9;

    margin-bottom:12px;
}

.card-value{
    font-size:32px;
    font-weight:300;

    color:#d9fbff;

    line-height:1;
}

.card-description{
    margin-top:11px;

    font-size:8px;
    letter-spacing:.27em;

    color:#456b73;
}

/* =========================================================
   MICRO BUTTONS
   ========================================================= */

.controls{
    display:flex;
    gap:10px;

    margin-top:14px;

    position:relative;
    z-index:50;
}

.control{
    flex:1;

    min-height:48px;

    background:rgba(2,18,24,.85);

    border:
        1px solid rgba(17,178,201,.48);

    color:#8edce7;

    font-size:8px;
    letter-spacing:.25em;

    text-transform:uppercase;

    cursor:pointer;

    transition:.18s;
}

.control:active{
    transform:scale(.97);
}

.control.active{
    border-color:#19dcf8;

    background:
        rgba(0,89,108,.22);

    box-shadow:
        0 0 18px rgba(0,211,255,.16);
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:430px){

    .interface{
        padding-left:14px;
        padding-right:14px;
    }

    .header{
        height:68px;
    }

    .logo{
        font-size:24px;
    }

    .status{
        gap:9px;
        font-size:8px;
        letter-spacing:.20em;
    }

    .status-dot{
        width:6px;
        height:6px;
    }

    .system-title{
        font-size:9px;
        letter-spacing:.34em;
    }

    .system-subtitle{
        font-size:7px;
    }

    .core-area{
        height:56vh;
        min-height:420px;
    }

    .dashboard{
        gap:9px;
    }

    .card{
        min-height:104px;
        padding:17px 15px;
    }

    .card-value{
        font-size:29px;
    }

    .controls{
        gap:7px;
    }

    .control{
        font-size:7px;
        letter-spacing:.15em;
    }
}

@media(max-width:370px){

    .status-item span{
        display:none;
    }

    .logo{
        font-size:22px;
    }

    .core-area{
        min-height:390px;
    }

    .card{
        min-height:98px;
    }

    .card-value{
        font-size:26px;
    }
}

/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
    }
}
</style>
</head>

<script>

/* ============================================================
   JARVIS NEURAL INTERFACE
   ============================================================ */

/*
   Configuration
   ------------------------------------------------------------

   Si tu souhaites utiliser un raccourci iOS spécifique,
   indique son nom ici.

   Exemple :

   const SHORTCUT_NAME = "Jarvis";

*/

const SHORTCUT_NAME = "Jarvis";


/* ============================================================
   ELEMENTS
   ============================================================ */

const orb =
    document.getElementById("orb");

const orbParticles =
    document.getElementById("orbParticles");

const voicePanel =
    document.getElementById("voicePanel");

const voiceStatus =
    document.getElementById("voiceStatus");

const coreState =
    document.getElementById("coreState");

const micButton =
    document.getElementById("micButton");

const shortcutButton =
    document.getElementById("shortcutButton");

const speakButton =
    document.getElementById("speakButton");


/* ============================================================
   PARTICULES DE L'ORBE
   ============================================================ */

const PARTICLE_COUNT = 46;

for(let i = 0; i < PARTICLE_COUNT; i++){

    const p =
        document.createElement("span");

    p.className = "particle";

    const x =
        Math.random() * 82 + 9;

    const y =
        Math.random() * 82 + 9;

    p.style.left = x + "%";
    p.style.top = y + "%";

    p.style.setProperty(
        "--x",
        ((Math.random()-.5)*28) + "px"
    );

    p.style.setProperty(
        "--y",
        ((Math.random()-.5)*28) + "px"
    );

    p.style.setProperty(
        "--duration",
        (2 + Math.random()*4) + "s"
    );

    p.style.animationDelay =
        (-Math.random()*4) + "s";

    const size =
        1 + Math.random()*3;

    p.style.width =
        size + "px";

    p.style.height =
        size + "px";

    orbParticles.appendChild(p);
}


/* ============================================================
   GRADUATIONS
   ============================================================ */

const tickGroup =
    document.getElementById("ticks");

for(let i = 0; i < 120; i++){

    const angle =
        (i / 120) * Math.PI * 2;

    const major =
        i % 10 === 0;

    const medium =
        i % 5 === 0;

    const outer =
        448;

    const inner =
        major
            ? 420
            : medium
                ? 428
                : 435;

    const x1 =
        500 +
        Math.cos(angle) * inner;

    const y1 =
        500 +
        Math.sin(angle) * inner;

    const x2 =
        500 +
        Math.cos(angle) * outer;

    const y2 =
        500 +
        Math.sin(angle) * outer;

    const line =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );

    line.setAttribute(
        "x1",
        x1
    );

    line.setAttribute(
        "y1",
        y1
    );

    line.setAttribute(
        "x2",
        x2
    );

    line.setAttribute(
        "y2",
        y2
    );

    line.setAttribute(
        "stroke-width",
        major ? "2.2" : medium ? "1.5" : "0.8"
    );

    line.setAttribute(
        "opacity",
        major ? ".95" : medium ? ".7" : ".38"
    );

    tickGroup.appendChild(line);
}


/* ============================================================
   AUDIO STATE
   ============================================================ */

let audioContext = null;
let analyser = null;
let microphoneSource = null;
let audioStream = null;

let audioActive = false;


/* ============================================================
   MICROPHONE
   ============================================================ */

async function startAudioAnalysis(){

    try{

        audioStream =
            await navigator.mediaDevices.getUserMedia({
                audio:true
            });

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        analyser =
            audioContext.createAnalyser();

        analyser.fftSize = 128;

        microphoneSource =
            audioContext.createMediaStreamSource(
                audioStream
            );

        microphoneSource.connect(
            analyser
        );

        audioActive = true;

        updateAudioVisuals();

    }catch(error){

        console.log(
            "Microphone unavailable:",
            error
        );

        voiceStatus.textContent =
            "MICROPHONE NON DISPONIBLE";

    }
}


/* ============================================================
   AUDIO → ORBE
   ============================================================ */

function updateAudioVisuals(){

    if(!audioActive || !analyser){
        return;
    }

    const data =
        new Uint8Array(
            analyser.frequencyBinCount
        );

    analyser.getByteFrequencyData(data);

    let sum = 0;

    for(let i = 0; i < data.length; i++){
        sum += data[i];
    }

    const average =
        sum / data.length;

    const intensity =
        Math.min(
            average / 95,
            1
        );

    const scale =
        1 +
        intensity * .10;

    orb.style.transform =
        `translate(-50%,-50%) scale(${scale})`;

    orb.style.boxShadow = `
        inset -18px -18px 35px rgba(0,0,0,.72),
        inset 10px 8px 24px rgba(75,218,239,.20),
        0 0 ${18 + intensity*20}px rgba(0,208,255,.35),
        0 0 ${65 + intensity*80}px rgba(0,130,170,.25)
    `;

    requestAnimationFrame(
        updateAudioVisuals
    );
}


/* ============================================================
   RECONNAISSANCE VOCALE
   ============================================================ */

let recognition = null;
let listening = false;

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if(SpeechRecognition){

    recognition =
        new SpeechRecognition();

    recognition.lang = "fr-FR";

    recognition.continuous = false;

    recognition.interimResults = true;

    recognition.maxAlternatives = 1;


    recognition.onstart = function(){

        listening = true;

        voicePanel.classList.add(
            "listening"
        );

        micButton.classList.add(
            "active"
        );

        coreState.textContent =
            "LISTENING";

        voiceStatus.textContent =
            "ÉCOUTE EN COURS";

    };


    recognition.onresult =
        function(event){

            let transcript = "";

            for(
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ){

                transcript +=
                    event.results[i][0].transcript;
            }

            transcript =
                transcript.trim();

            if(transcript.length){

                voiceStatus.textContent =
                    transcript;

                /*
                   La transcription est conservée
                   pour le bouton "ENVOYER RACCOURCIS".
                */

                window.jarvisLastCommand =
                    transcript;
            }
        };


    recognition.onerror =
        function(event){

            console.log(
                "Speech recognition error:",
                event.error
            );

            voiceStatus.textContent =
                "ERREUR AUDIO";

        };


    recognition.onend =
        function(){

            listening = false;

            voicePanel.classList.remove(
                "listening"
            );

            micButton.classList.remove(
                "active"
            );

            coreState.textContent =
                "READY";

        };

}


/* ============================================================
   BOUTON MICRO
   ============================================================ */

micButton.addEventListener(
    "click",
    async function(){

        if(!audioActive){

            await startAudioAnalysis();
        }

        if(!recognition){

            voiceStatus.textContent =
                "RECONNAISSANCE VOCALE NON DISPONIBLE";

            return;
        }

        if(listening){

            recognition.stop();

            return;
        }

        window.jarvisLastCommand = "";

        recognition.start();

    }
);


/* ============================================================
   TEXT TO SPEECH
   ============================================================ */

function speakJarvis(text){

    if(
        !("speechSynthesis" in window)
    ){

        voiceStatus.textContent =
            "SYNTHÈSE VOCALE INDISPONIBLE";

        return;
    }

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(
            text
        );

    utterance.lang =
        "fr-FR";

    utterance.rate =
        .92;

    utterance.pitch =
        .78;

    utterance.volume =
        1;

    utterance.onstart =
        function(){

            coreState.textContent =
                "SPEAKING";

            voiceStatus.textContent =
                "TRANSMISSION VOCALE";

            voicePanel.classList.add(
                "listening"
            );

        };

    utterance.onend =
        function(){

            coreState.textContent =
                "READY";

            voiceStatus.textContent =
                "AUDIO LINK · READY";

            voicePanel.classList.remove(
                "listening"
            );

        };

    speechSynthesis.speak(
        utterance
    );
}


speakButton.addEventListener(
    "click",
    function(){

        speakJarvis(
            "Bonjour monsieur. JARVIS est opérationnel."
        );

    }
);


/* ============================================================
   ENVOI VERS RACCOURCIS
   ============================================================ */

shortcutButton.addEventListener(
    "click",
    function(){

        const command =
            window.jarvisLastCommand || "";

        if(!command){

            voiceStatus.textContent =
                "AUCUNE COMMANDE";

            return;
        }

        /*
          URL Scheme iOS.

          Le texte reconnu est encodé pour être transmis
          au raccourci configuré dans SHORTCUT_NAME.
        */

        const url =
            "shortcuts://run-shortcut" +
            "?name=" +
            encodeURIComponent(
                SHORTCUT_NAME
            ) +
            "&input=" +
            encodeURIComponent(
                command
            );

        window.location.href =
            url;

    }
);


/* ============================================================
   TAP SUR L'ORBE
   ============================================================ */

orb.addEventListener(
    "click",
    async function(){

        if(!audioActive){
            await startAudioAnalysis();
        }

        if(recognition){

            try{

                if(!listening){

                    window.jarvisLastCommand =
                        "";

                    recognition.start();

                }else{

                    recognition.stop();

                }

            }catch(error){

                console.log(error);

            }

        }

    }
);


/* ============================================================
   ROTATION GLOBALE LÉGÈRE
   ============================================================ */

let pointerX = 0;
let pointerY = 0;

document.addEventListener(
    "pointermove",
    function(event){

        const x =
            event.clientX /
            window.innerWidth -
            .5;

        const y =
            event.clientY /
            window.innerHeight -
            .5;

        pointerX =
            x * 4;

        pointerY =
            y * 4;

        const system =
            document.querySelector(
                ".ring-system"
            );

        system.style.transform =
            `
            translate(-50%,-50%)
            rotateX(${pointerY}deg)
            rotateY(${pointerX}deg)
            `;

    }
);


/* ============================================================
   INITIAL STATE
   ============================================================ */

window.jarvisLastCommand = "";

coreState.textContent =
    "STANDBY";

voiceStatus.textContent =
    "AUDIO LINK · TAP TO ACTIVATE";


/* ============================================================
   IOS SAFETY
   ============================================================ */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.hidden &&
            recognition &&
            listening
        ){

            try{
                recognition.stop();
            }catch(e){}

        }

    }
);

</script>
