<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>JARVIS — Gyrotourbillon 3 Axes</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#01070a;
  color:#c9f7ff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  background:
    radial-gradient(circle at 50% 38%,
      rgba(0,110,140,.12),
      transparent 28%),
    linear-gradient(#02090d,#010608);
}

#app{
  position:fixed;
  inset:0;
  overflow:hidden;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

/* ---------------- HEADER ---------------- */

header{
  position:absolute;
  z-index:10;
  top:0;
  left:0;
  right:0;
  height:94px;
  padding:
    calc(env(safe-area-inset-top) + 22px)
    28px 0;

  display:flex;
  align-items:flex-start;
  justify-content:space-between;

  pointer-events:none;
}

.brand{
  font-size:19px;
  letter-spacing:.48em;
  font-weight:300;
  white-space:nowrap;
}

.status{
  display:flex;
  gap:24px;
  align-items:center;

  font-size:10px;
  letter-spacing:.32em;
  color:#62828b;
}

.status span{
  display:flex;
  align-items:center;
  gap:8px;
}

.status i{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#08d8ff;
  box-shadow:
    0 0 8px #08d8ff,
    0 0 18px rgba(0,216,255,.45);
}

.subtitle{
  position:absolute;
  top:104px;
  left:0;
  right:0;
  text-align:center;

  font-size:9px;
  letter-spacing:.45em;
  color:#426a74;
}

/* ---------------- PANELS ---------------- */

.panels{
  position:absolute;
  z-index:8;
  left:28px;
  right:28px;
  bottom:28px;

  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.panel{
  min-height:92px;
  padding:16px 18px;

  border:1px solid rgba(0,190,230,.42);

  background:
    linear-gradient(
      135deg,
      rgba(4,30,38,.72),
      rgba(2,12,17,.55)
    );

  box-shadow:
    inset 0 0 20px rgba(0,180,220,.035),
    0 0 14px rgba(0,140,180,.035);
}

.panel .label{
  font-size:9px;
  letter-spacing:.4em;
  color:#54b8c9;
}

.panel .value{
  margin-top:8px;
  font-size:31px;
  font-weight:300;
  letter-spacing:.03em;
  color:#d7fbff;
}

.panel .detail{
  margin-top:5px;
  font-size:9px;
  letter-spacing:.18em;
  color:#53727a;
}

/* ---------------- VIGNETTE ---------------- */

.vignette{
  position:absolute;
  z-index:7;
  inset:0;
  pointer-events:none;

  background:
    radial-gradient(
      circle at 50% 42%,
      transparent 22%,
      rgba(0,0,0,.12) 55%,
      rgba(0,0,0,.58) 100%
    );
}

/* mobile */
@media(max-width:600px){
  header{
    padding-left:32px;
    padding-right:24px;
  }

  .brand{
    font-size:18px;
  }

  .status{
    gap:14px;
  }

  .status span{
    gap:6px;
  }

  .status span:nth-child(3){
    display:none;
  }

  .subtitle{
    top:104px;
    font-size:8px;
  }

  .panels{
    left:28px;
    right:28px;
    bottom:26px;
  }

  .panel{
    min-height:88px;
    padding:14px 16px;
  }

  .panel .value{
    font-size:28px;
  }
}
</style>
</head>

<body>

<div id="app">

<canvas id="scene"></canvas>

<header>
  <div class="brand">JARVIS</div>

  <div class="status">
    <span><i></i>ONLINE</span>
    <span><i></i>SECURE</span>
    <span><i></i>VOICE</span>
  </div>

  <div class="subtitle">
    GYROTOURBILLON&nbsp;&nbsp;·&nbsp;&nbsp;PRECISION CORE&nbsp;&nbsp;·&nbsp;&nbsp;3 AXIS
  </div>
</header>

<div class="panels">

  <div class="panel">
    <div class="label">MAISON</div>
    <div class="value">03</div>
    <div class="detail">DISPOSITIFS ACTIFS</div>
  </div>

  <div class="panel">
    <div class="label">MÉTÉO</div>
    <div class="value">18°</div>
    <div class="detail">CONDITIONS STABLES</div>
  </div>

  <div class="panel">
    <div class="label">SYSTÈME</div>
    <div class="value">82%</div>
    <div class="detail">PERFORMANCE</div>
  </div>

  <div class="panel">
    <div class="label">ACTIVITÉ</div>
    <div class="value">12</div>
    <div class="detail">ÉVÉNEMENTS RÉCENTS</div>
  </div>

</div>

<div class="vignette"></div>

</div>


<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

(() => {

"use strict";

/* ============================================================
   JARVIS — PRECISION GYROTOURBILLON
   ------------------------------------------------------------
   Les grandes couronnes = holographiques.
   Le centre = mécanique métallique.
   Trois cages = trois axes indépendants.
   ============================================================ */

const canvas = document.getElementById("scene");

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias:true,
  alpha:true,
  powerPreference:"high-performance"
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio || 1, 2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight,
  false
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;


/* ============================================================
   SCÈNE
   ============================================================ */

const scene = new THREE.Scene();

scene.fog = new THREE.FogExp2(
  0x010609,
  0.018
);


/* ============================================================
   CAMÉRA
   ============================================================ */

const camera = new THREE.PerspectiveCamera(
  34,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);

camera.position.set(
  0,
  0.12,
  9.4
);

camera.lookAt(0,0,0);


/* ============================================================
   LUMIÈRES
   ============================================================ */

scene.add(
  new THREE.AmbientLight(
    0x38535a,
    1.35
  )
);

const cyanLight = new THREE.PointLight(
  0x26dfff,
  16,
  10
);

cyanLight.position.set(
  -2.5,
  2.4,
  4
);

scene.add(cyanLight);


const whiteLight = new THREE.PointLight(
  0xdffcff,
  22,
  9
);

whiteLight.position.set(
  2.7,
  1.8,
  4.5
);

scene.add(whiteLight);


const warmLight = new THREE.PointLight(
  0xffa52e,
  9,
  7
);

warmLight.position.set(
  1.8,
  -2.2,
  2.8
);

scene.add(warmLight);


/* ============================================================
   MATÉRIAUX
   ============================================================ */

const metalSilver =
  new THREE.MeshPhysicalMaterial({
    color:0xbccbd0,
    metalness:0.94,
    roughness:0.18,
    clearcoat:1,
    clearcoatRoughness:.12
  });

const metalDark =
  new THREE.MeshPhysicalMaterial({
    color:0x18262b,
    metalness:0.97,
    roughness:0.22,
    clearcoat:1,
    clearcoatRoughness:.14
  });

const steel =
  new THREE.MeshPhysicalMaterial({
    color:0x738c92,
    metalness:0.98,
    roughness:0.26
  });

const gold =
  new THREE.MeshPhysicalMaterial({
    color:0xa87527,
    metalness:0.96,
    roughness:0.2,
    clearcoat:1
  });

const blackMetal =
  new THREE.MeshPhysicalMaterial({
    color:0x071014,
    metalness:1,
    roughness:.28
  });

const ruby =
  new THREE.MeshPhysicalMaterial({
    color:0x8b001d,
    metalness:.25,
    roughness:.12,
    emissive:0x30000b,
    emissiveIntensity:1.8,
    clearcoat:1
  });


/* ============================================================
   GROUPE CENTRAL
   ============================================================ */

const machine = new THREE.Group();

machine.scale.setScalar(.92);

scene.add(machine);


/* ============================================================
   OUTILS MÉCANIQUES
   ============================================================ */

/* anneau métallique fin */
function ring(
  radius,
  tube,
  material,
  segments=96
){
  const geometry =
    new THREE.TorusGeometry(
      radius,
      tube,
      12,
      segments
    );

  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );

  return mesh;
}


/* anneau plat façon pièce usinée */
function precisionRing(
  radius,
  thickness,
  depth,
  material
){

  const geometry =
    new THREE.CylinderGeometry(
      radius,
      radius,
      depth,
      128,
      1,
      true
    );

  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );

  mesh.rotation.x =
    Math.PI / 2;

  return mesh;
}


/* ============================================================
   COURONNE MÉTALLIQUE EXTERNE
   ============================================================ */

const outerHousing =
  ring(
    2.18,
    .095,
    metalDark,
    160
  );

machine.add(outerHousing);


/* deuxième chanfrein */
const outerSteel =
  ring(
    2.00,
    .055,
    metalSilver,
    160
  );

machine.add(outerSteel);


/* anneau interne sombre */
const innerHousing =
  ring(
    1.78,
    .075,
    blackMetal,
    144
  );

machine.add(innerHousing);


/* ============================================================
   GRADUATIONS USINÉES
   ============================================================ */

const markings =
  new THREE.Group();

machine.add(markings);

const tickMaterial =
  new THREE.MeshStandardMaterial({
    color:0x82999e,
    metalness:.9,
    roughness:.3
  });

for(let i=0;i<72;i++){

  const a =
    i / 72 * Math.PI * 2;

  const major =
    i % 6 === 0;

  const length =
    major ? .105 : .055;

  const geometry =
    new THREE.BoxGeometry(
      .018,
      length,
      major ? .028 : .018
    );

  const tick =
    new THREE.Mesh(
      geometry,
      tickMaterial
    );

  const r = 1.87;

  tick.position.set(
    Math.cos(a)*r,
    Math.sin(a)*r,
    .03
  );

  tick.rotation.z = a;

  markings.add(tick);
}


/* ============================================================
   CAGES 3 AXES
   ============================================================ */

function createCage(
  radius,
  tube,
  material,
  tiltX,
  tiltY
){

  const cage =
    new THREE.Group();

  cage.rotation.x = tiltX;
  cage.rotation.y = tiltY;

  /* anneau principal */
  const main =
    ring(
      radius,
      tube,
      material,
      128
    );

  cage.add(main);


  /* second anneau intérieur */
  const inner =
    ring(
      radius*.72,
      tube*.48,
      material,
      112
    );

  cage.add(inner);


  /* pont transversal très fin */
  const bridgeGeometry =
    new THREE.CapsuleGeometry(
      tube*.55,
      radius*1.42,
      6,
      16
    );

  const bridge =
    new THREE.Mesh(
      bridgeGeometry,
      material
    );

  bridge.rotation.z =
    Math.PI/2;

  cage.add(bridge);


  /* axe central */
  const shaftGeometry =
    new THREE.CylinderGeometry(
      tube*.32,
      tube*.32,
      radius*1.65,
      24
    );

  const shaft =
    new THREE.Mesh(
      shaftGeometry,
      steel
    );

  shaft.rotation.z =
    Math.PI/2;

  cage.add(shaft);


  /* petites vis sur la cage */
  for(let i=0;i<4;i++){

    const a =
      i * Math.PI/2 + Math.PI/4;

    const screwGeometry =
      new THREE.CylinderGeometry(
        tube*.42,
        tube*.42,
        tube*.25,
        16
      );

    const screw =
      new THREE.Mesh(
        screwGeometry,
        metalSilver
      );

    screw.position.set(
      Math.cos(a)*radius,
      Math.sin(a)*radius,
      .04
    );

    screw.rotation.x =
      Math.PI/2;

    cage.add(screw);
  }

  return cage;
}


/* ============================================================
   AXE 1
   Presque frontal
   ============================================================ */

const cage1 =
  createCage(
    1.38,
    .052,
    metalSilver,
    0.10,
    -0.12
  );

machine.add(cage1);


/* ============================================================
   AXE 2
   Inclinaison importante
   ============================================================ */

const cage2 =
  createCage(
    1.18,
    .047,
    steel,
    Math.PI*.30,
    Math.PI*.14
  );

machine.add(cage2);


/* ============================================================
   AXE 3
   Orientation différente
   ============================================================ */

const cage3 =
  createCage(
    .96,
    .042,
    gold,
    -Math.PI*.24,
    Math.PI*.34
  );

machine.add(cage3);


/* ============================================================
   ROUE DENTÉE CENTRALE
   ============================================================ */

function gear(
  radius,
  teeth,
  material
){

  const group =
    new THREE.Group();

  const body =
    ring(
      radius,
      .045,
      material,
      96
    );

  group.add(body);

  for(let i=0;i<teeth;i++){

    const a =
      i / teeth * Math.PI*2;

    const toothGeometry =
      new THREE.BoxGeometry(
        .055,
        .12,
        .035
      );

    const tooth =
      new THREE.Mesh(
        toothGeometry,
        material
      );

    tooth.position.set(
      Math.cos(a)*radius,
      Math.sin(a)*radius,
      0
    );

    tooth.rotation.z = a;

    group.add(tooth);
  }

  return group;
}

const gearOuter =
  gear(
    .68,
    32,
    steel
  );

machine.add(gearOuter);


/* ============================================================
   PETITE ROUE DORÉE
   ============================================================ */

const gearGold =
  gear(
    .43,
    24,
    gold
  );

machine.add(gearGold);


/* ============================================================
   AXE CENTRAL
   ============================================================ */

const centralShaft =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      .105,
      .105,
      .58,
      48
    ),
    blackMetal
  );

centralShaft.rotation.x =
  Math.PI/2;

machine.add(centralShaft);


/* ============================================================
   RUBIS
   ============================================================ */

const jewel =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .19,
      48,
      32
    ),
    ruby
  );

jewel.position.z=.20;

machine.add(jewel);


/* halo très discret du rubis */
const jewelGlow =
  new THREE.PointLight(
    0xff174f,
    2.2,
    1.2
  );

jewelGlow.position.z=.28;

machine.add(jewelGlow);


/* ============================================================
   PETITS PIVOTS
   ============================================================ */

const pivotMaterial =
  new THREE.MeshPhysicalMaterial({
    color:0xe1f5f7,
    metalness:.92,
    roughness:.14,
    clearcoat:1
  });

for(let i=0;i<8;i++){

  const a =
    i/8*Math.PI*2;

  const pivot =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .055,
        20,
        20
      ),
      pivotMaterial
    );

  pivot.position.set(
    Math.cos(a)*1.48,
    Math.sin(a)*1.48,
    .08
  );

  machine.add(pivot);
}


/* ============================================================
   COURONNES HOLOGRAPHIQUES
   ============================================================ */

const hologram =
  new THREE.Group();

scene.add(hologram);

function holoRing(
  radius,
  tube,
  opacity
){

  const material =
    new THREE.MeshBasicMaterial({
      color:0x00dfff,
      transparent:true,
      opacity,
      blending:THREE.AdditiveBlending,
      depthWrite:false
    });

  const r =
    ring(
      radius,
      tube,
      material,
      160
    );

  hologram.add(r);

  return r;
}


/* grandes couronnes */
holoRing(2.75,.012,.55);
holoRing(3.02,.008,.38);
holoRing(3.28,.006,.25);
holoRing(3.55,.004,.18);


/* ============================================================
   SEGMENTS HUD
   ============================================================ */

const hud =
  new THREE.Group();

scene.add(hud);

const hudMaterial =
  new THREE.MeshBasicMaterial({
    color:0x19dfff,
    transparent:true,
    opacity:.62,
    blending:THREE.AdditiveBlending
  });

for(let r of [2.82,3.10,3.38]){

  for(let i=0;i<24;i++){

    if(i%3===1) continue;

    const a =
      i/24*Math.PI*2;

    const len =
      i%6===0 ? .20 : .10;

    const geometry =
      new THREE.BoxGeometry(
        len,
        .012,
        .012
      );

    const segment =
      new THREE.Mesh(
        geometry,
        hudMaterial
      );

    segment.position.set(
      Math.cos(a)*r,
      Math.sin(a)*r,
      0
    );

    segment.rotation.z=a;

    hud.add(segment);
  }
}


/* ============================================================
   POINTS CARDINAUX
   ============================================================ */

const pointMaterial =
  new THREE.MeshBasicMaterial({
    color:0xd7fbff
  });

for(let i=0;i<4;i++){

  const a =
    i*Math.PI/2;

  const point =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .045,
        16,
        16
      ),
      pointMaterial
    );

  point.position.set(
    Math.cos(a)*3.56,
    Math.sin(a)*3.56,
    0
  );

  scene.add(point);
}


/* ============================================================
   ANIMATION
   ============================================================ */

let clock =
  new THREE.Clock();

function animate(){

  requestAnimationFrame(animate);

  const t =
    clock.getElapsedTime();


  /* ----------------------------------------------------------
     Trois axes réellement indépendants
     ---------------------------------------------------------- */

  cage1.rotation.z =
    t*.34;

  cage1.rotation.x =
    .10 + Math.sin(t*.42)*.055;


  cage2.rotation.z =
    -t*.51;

  cage2.rotation.x =
    Math.PI*.30 +
    Math.sin(t*.31)*.075;


  cage3.rotation.z =
    t*.78;

  cage3.rotation.y =
    Math.PI*.34 +
    Math.sin(t*.37)*.09;


  /* roues */
  gearOuter.rotation.z =
    -t*.72;

  gearGold.rotation.z =
    t*1.05;


  /* mécanisme général très léger */
  machine.rotation.z =
    Math.sin(t*.18)*.018;

  machine.rotation.x =
    Math.sin(t*.23)*.014;

  machine.rotation.y =
    Math.cos(t*.19)*.018;


  /* couronnes holographiques */
  hologram.rotation.z =
    t*.025;

  hud.rotation.z =
    -t*.045;


  /* respiration lumineuse */
  cyanLight.intensity =
    14 + Math.sin(t*1.4)*3;

  jewelGlow.intensity =
    1.8 + Math.sin(t*2.2)*.6;


  renderer.render(
    scene,
    camera
  );
}

animate();


/* ============================================================
   RESPONSIVE
   ============================================================ */

function resize(){

  const w =
    window.innerWidth;

  const h =
    window.innerHeight;

  renderer.setSize(
    w,
    h,
    false
  );

  camera.aspect =
    w/h;

  camera.updateProjectionMatrix();


  /* Le gyrotourbillon reste volontairement compact
     sur téléphone. */

  if(w < 600){
    machine.scale.setScalar(.73);
  }else{
    machine.scale.setScalar(.92);
  }
}

window.addEventListener(
  "resize",
  resize
);

resize();

})();

</script>

</body>
</html>
