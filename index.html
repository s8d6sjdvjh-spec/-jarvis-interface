<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               viewport-fit=cover">

<meta name="theme-color" content="#02090d">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>JARVIS — Voice Core</title>

<style>

/* =========================================================
   JARVIS — VOICE CORE
   VERSION : FIXED CONCENTRIC RINGS
   ========================================================= */

:root{
    --bg:#02080c;
    --cyan:#00d9ff;
    --cyan-soft:#55e9ff;
    --cyan-dim:#16768a;
    --cyan-dark:#073744;

    --white:#dffaff;
    --silver:#a9c6cc;
    --blue:#087d9a;
    --gold:#8b6b35;
    --red:#ff435d;

    --panel:rgba(2,15,21,.72);

    --ring-opacity:.72;
    --voice-level:0;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
        radial-gradient(
            ellipse at 50% 42%,
            rgba(0,75,96,.16) 0%,
            rgba(0,20,30,.08) 28%,
            rgba(0,0,0,0) 58%
        ),
        #02080c;

    color:var(--white);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    -webkit-font-smoothing:antialiased;

    position:relative;
}

/* =========================================================
   BACKGROUND GRID
   ========================================================= */

.background-grid{
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(
            rgba(44,128,147,.075) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(44,128,147,.075) 1px,
            transparent 1px
        );

    background-size:
        72px 72px;

    opacity:.55;

    pointer-events:none;
}

.background-grid::after{
    content:"";

    position:absolute;
    inset:0;

    background:
        radial-gradient(
            circle at center,
            transparent 0%,
            rgba(0,0,0,.08) 45%,
            rgba(0,0,0,.58) 100%
        );
}

/* =========================================================
   TOP HEADER
   ========================================================= */

.header{
    position:absolute;

    top:
        calc(
            env(safe-area-inset-top) + 5.3vh
        );

    left:0;
    right:0;

    height:70px;

    display:flex;
    align-items:center;

    padding:
        0 6.2vw;

    z-index:20;
}

.logo{
    font-size:
        clamp(22px,6vw,34px);

    font-weight:300;

    letter-spacing:
        .48em;

    color:#e2f8fc;

    white-space:nowrap;
}

.status{
    margin-left:auto;

    display:flex;
    gap:18px;

    align-items:center;

    color:#557b84;

    font-size:
        clamp(8px,2.1vw,11px);

    letter-spacing:.30em;

    text-transform:uppercase;
}

.status-item{
    display:flex;
    align-items:center;
    gap:7px;
}

.status-dot{
    width:8px;
    height:8px;

    border-radius:50%;

    background:var(--cyan);

    box-shadow:
        0 0 6px var(--cyan),
        0 0 15px rgba(0,217,255,.55);

    animation:
        statusPulse 2.4s ease-in-out infinite;
}

.status-item:nth-child(2)
.status-dot{
    animation-delay:.4s;
}

.status-item:nth-child(3)
.status-dot{
    animation-delay:.8s;
}

@keyframes statusPulse{

    0%,100%{
        opacity:.55;
        transform:scale(.85);
    }

    50%{
        opacity:1;
        transform:scale(1);
    }
}

/* =========================================================
   SUBTITLE
   ========================================================= */

.subtitle{
    position:absolute;

    top:
        calc(
            env(safe-area-inset-top) + 15.5vh
        );

    left:0;
    right:0;

    text-align:center;

    font-size:
        clamp(8px,2.5vw,12px);

    letter-spacing:
        .46em;

    color:
        rgba(103,169,180,.70);

    text-transform:uppercase;

    z-index:15;
}

/* =========================================================
   MAIN CORE AREA
   ========================================================= */

.core-stage{

    position:absolute;

    /*
       Partie supérieure de l'écran.
       Le cœur occupe environ 20% de la hauteur totale.
    */

    top:
        calc(
            env(safe-area-inset-top) + 20vh
        );

    left:50%;

    width:
        min(
            88vw,
            470px
        );

    height:
        min(
            52vh,
            560px
        );

    transform:
        translateX(-50%);

    display:flex;

    align-items:center;
    justify-content:center;

    z-index:10;

    overflow:visible;
}

/* =========================================================
   RING SYSTEM
   ========================================================= */

.ring-system{

    position:absolute;

    left:50%;
    top:50%;

    width:92%;
    aspect-ratio:1/1;

    transform:
        translate(-50%,-50%);

    overflow:visible;

    pointer-events:none;
}

/*
   IMPORTANT :

   Les couronnes sont fixes.
   Leur centre ne change JAMAIS.

   Elles peuvent uniquement subir
   une dilatation autour de leur centre.
*/

.voice-ring{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(var(--voice-scale,1));

    transform-origin:
        center center;

    transition:
        transform 38ms
        cubic-bezier(.08,.92,.18,1);

    will-change:transform;

    overflow:visible;
}

/* =========================================================
   FOUR RING SIZES
   ========================================================= */

.ring-1{
    width:100%;
    height:100%;

    --voice-scale:1;
}

.ring-2{
    width:84%;
    height:84%;

    --voice-scale:1;
}

.ring-3{
    width:67%;
    height:67%;

    --voice-scale:1;
}

.ring-4{
    width:49%;
    height:49%;

    --voice-scale:1;
}

/* =========================================================
   SVG
   ========================================================= */

.ring-svg{

    width:100%;
    height:100%;

    overflow:visible;
}

.ring-main{
    fill:none;

    stroke:
        rgba(31,185,211,.72);

    stroke-width:1.15;

    filter:
        drop-shadow(
            0 0 4px
            rgba(0,210,255,.22)
        );
}

.ring-secondary{
    fill:none;

    stroke:
        rgba(24,112,133,.55);

    stroke-width:.8;
}

.ring-dim{
    fill:none;

    stroke:
        rgba(19,86,103,.45);

    stroke-width:.65;
}

.ring-gold{
    fill:none;

    stroke:
        rgba(161,118,50,.68);

    stroke-width:1;
}

.tick{
    stroke:
        rgba(116,218,232,.65);

    stroke-width:1;
}

.tick-major{
    stroke:
        rgba(204,242,247,.90);

    stroke-width:1.5;
}

.ring-number{

    fill:
        rgba(156,225,235,.78);

    font-size:10px;

    font-weight:300;

    letter-spacing:.08em;
}

.ring-label{

    fill:
        rgba(83,155,166,.72);

    font-size:7px;

    letter-spacing:.22em;
}

/* =========================================================
   ORB
   ========================================================= */

.orb{

    position:absolute;

    left:50%;
    top:50%;

    width:
        clamp(
            82px,
            20vw,
            108px
        );

    aspect-ratio:1/1;

    transform:
        translate(-50%,-50%)
        scale(1);

    border-radius:50%;

    background:

        radial-gradient(
            circle at 35% 30%,
            rgba(131,246,255,.92) 0%,
            rgba(26,181,212,.72) 7%,
            rgba(5,88,111,.68) 23%,
            rgba(2,30,42,.96) 53%,
            rgba(0,8,13,1) 78%
        );

    border:
        1px solid
        rgba(84,219,235,.82);

    box-shadow:

        inset
        -18px -18px 35px
        rgba(0,0,0,.78),

        inset
        10px 8px 25px
        rgba(71,227,247,.22),

        0 0 22px
        rgba(0,210,255,.35),

        0 0 70px
        rgba(0,122,163,.25);

    transition:

        transform 35ms
        cubic-bezier(.05,.92,.16,1),

        box-shadow 45ms
        ease-out;

    z-index:8;

    will-change:
        transform,
        box-shadow;
}

/* =========================================================
   ORB INTERNAL GEODE STRUCTURE
   ========================================================= */

.orb::before{

    content:"";

    position:absolute;

    inset:9%;

    border-radius:50%;

    background:

        conic-gradient(
            from 12deg,
            transparent 0deg,
            rgba(77,232,255,.28) 17deg,
            transparent 29deg,
            rgba(13,105,128,.35) 47deg,
            transparent 65deg,
            rgba(86,220,235,.20) 83deg,
            transparent 110deg,
            rgba(37,142,164,.34) 140deg,
            transparent 170deg,
            rgba(70,214,232,.20) 205deg,
            transparent 240deg,
            rgba(24,123,146,.30) 275deg,
            transparent 310deg,
            rgba(78,222,239,.22) 340deg,
            transparent 360deg
        );

    opacity:.75;

    mix-blend-mode:screen;

    animation:
        orbStructure 16s linear infinite;
}

@keyframes orbStructure{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

.orb::after{

    content:"";

    position:absolute;

    width:20%;
    height:20%;

    left:21%;
    top:17%;

    border-radius:50%;

    background:
        rgba(196,250,255,.92);

    filter:
        blur(5px);

    opacity:.82;

    box-shadow:
        0 0 18px
        rgba(92,236,255,.95);
}

.orb-core-text{

    position:absolute;

    inset:0;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    z-index:5;

    pointer-events:none;
}

.core-title{

    font-size:11px;

    letter-spacing:
        .42em;

    padding-left:.42em;

    color:
        rgba(216,250,255,.94);
}

.core-state{

    margin-top:7px;

    font-size:7px;

    letter-spacing:
        .34em;

    padding-left:.34em;

    color:
        rgba(74,178,193,.78);

    text-transform:uppercase;
}

/* =========================================================
   AUDIO VISUALIZER
   ========================================================= */

.audio-wave{

    position:absolute;

    bottom:2.5%;

    left:50%;

    transform:
        translateX(-50%);

    width:62%;

    height:34px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:3px;

    opacity:.65;

    z-index:12;
}

.audio-bar{

    width:2px;

    height:5px;

    background:
        var(--cyan);

    box-shadow:
        0 0 6px
        rgba(0,217,255,.65);

    transform-origin:center;

    transition:
        height 45ms linear;
}

/* =========================================================
   VOICE TEXT
   ========================================================= */

.voice-output{

    position:absolute;

    left:7vw;
    right:7vw;

    top:
        calc(
            env(safe-area-inset-top) + 71vh
        );

    min-height:46px;

    border-left:
        1px solid
        rgba(0,205,239,.55);

    border-right:
        1px solid
        rgba(0,205,239,.25);

    background:
        linear-gradient(
            90deg,
            rgba(0,70,87,.08),
            rgba(0,120,145,.08),
            rgba(0,70,87,.08)
        );

    display:flex;

    align-items:center;
    justify-content:center;

    padding:8px 20px;

    z-index:20;
}

.voice-text{

    color:
        rgba(170,232,240,.72);

    font-size:
        clamp(8px,2.5vw,12px);

    letter-spacing:
        .18em;

    text-align:center;

    text-transform:uppercase;
}

/* =========================================================
   CONTROL PANEL
   ========================================================= */

.controls{

    position:absolute;

    left:5vw;
    right:5vw;

    bottom:
        calc(
            env(safe-area-inset-bottom) + 8vh
        );

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:10px;

    z-index:30;
}

.control{

    height:58px;

    background:
        rgba(2,16,22,.76);

    border:
        1px solid
        rgba(0,194,222,.55);

    color:
        rgba(145,220,230,.88);

    font-size:
        clamp(8px,2.2vw,10px);

    letter-spacing:
        .20em;

    text-transform:uppercase;

    cursor:pointer;

    -webkit-tap-highlight-color:
        transparent;

    transition:
        background .15s ease,
        border-color .15s ease,
        box-shadow .15s ease;

    display:flex;

    align-items:center;
    justify-content:center;

    text-align:center;
}

.control:active{

    background:
        rgba(0,100,120,.32);

    border-color:
        rgba(73,230,255,.95);

    box-shadow:
        0 0 20px
        rgba(0,205,255,.22);
}

.control.active{

    border-color:
        var(--cyan);

    color:
        #d8fbff;

    box-shadow:
        inset 0 0 18px
        rgba(0,211,255,.08),

        0 0 15px
        rgba(0,211,255,.12);
}

/* =========================================================
   SMALL SYSTEM INDICATOR
   ========================================================= */

.system-readout{

    position:absolute;

    top:
        calc(
            env(safe-area-inset-top) + 18.8vh
        );

    left:0;
    right:0;

    text-align:center;

    font-size:7px;

    letter-spacing:
        .38em;

    color:
        rgba(69,134,145,.68);

    z-index:15;
}

/* =========================================================
   MOBILE ADAPTATION
   ========================================================= */

@media(max-width:430px){

    .header{
        padding-left:5.5vw;
        padding-right:5.5vw;
    }

    .status{
        gap:10px;
    }

    .status-item{
        gap:5px;
    }

    .status-item span{
        letter-spacing:.18em;
    }

    .core-stage{
        width:96vw;
        height:51vh;
    }

    .ring-system{
        width:94%;
    }

    .voice-output{
        top:
            calc(
                env(safe-area-inset-top) + 69vh
            );
    }

    .controls{
        bottom:
            calc(
                env(safe-area-inset-bottom) + 5.5vh
            );
    }

    .control{
        height:54px;
        font-size:7.5px;
    }
}

@media(min-height:800px){

    .core-stage{
        top:
            calc(
                env(safe-area-inset-top) + 20.5vh
            );
    }
}

</style>
</head>

<script>

/* =========================================================
   JARVIS VOICE ENGINE
   ========================================================= */


/* =========================================================
   DOM
   ========================================================= */

const orb =
    document.getElementById("orb");

const coreState =
    document.getElementById("coreState");

const voiceText =
    document.getElementById("voiceText");

const microButton =
    document.getElementById("microButton");

const shortcutButton =
    document.getElementById("shortcutButton");

const speakButton =
    document.getElementById("speakButton");

const audioWave =
    document.getElementById("audioWave");

const ring1 =
    document.querySelector(".ring-1");

const ring2 =
    document.querySelector(".ring-2");

const ring3 =
    document.querySelector(".ring-3");

const ring4 =
    document.querySelector(".ring-4");


/* =========================================================
   AUDIO
   ========================================================= */

let audioContext = null;

let analyser = null;

let microphoneSource = null;

let microphoneStream = null;

let audioActive = false;

let animationRunning = false;


/* =========================================================
   VOICE
   ========================================================= */

let recognition = null;

let recognitionActive = false;

let finalTranscript = "";

let lastSpeechText =
    "Bonjour. Je suis prêt.";


/* =========================================================
   VISUAL STATE
   ========================================================= */

let visualVoiceLevel = 0;

let targetVoiceLevel = 0;

let lastAudioTime =
    performance.now();


/* =========================================================
   CREATE AUDIO WAVE
   ========================================================= */

const audioBars =

/* =========================================================
   GENERATE TICKS
   ========================================================= */

function createTicks(
    elementId,
    count,
    radius,
    majorEvery
){

    const group =
        document.getElementById(
            elementId
        );

    if(!group){
        return;
    }

    const cx = 250;
    const cy = 250;

    for(
        let i = 0;
        i < count;
        i++
    ){

        const angle =
            (
                i / count
            ) *
            Math.PI *
            2;

        const isMajor =
            i % majorEvery === 0;

        const outer =
            radius;

        const inner =
            radius -
            (
                isMajor
                    ? 12
                    : 6
            );

        const x1 =
            cx +
            Math.cos(angle) *
            inner;

        const y1 =
            cy +
            Math.sin(angle) *
            inner;

        const x2 =
            cx +
            Math.cos(angle) *
            outer;

        const y2 =
            cy +
            Math.sin(angle) *
            outer;

        const line =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "line"
            );

        line.setAttribute(
            "x1",
            x1
        );

        line.setAttribute(
            "y1",
            y1
        );

        line.setAttribute(
            "x2",
            x2
        );

        line.setAttribute(
            "y2",
            y2
        );

        line.setAttribute(
            "class",
            isMajor
                ? "tick-major"
                : "tick"
        );

        group.appendChild(line);
    }
}

/* =========================================================
   START MICROPHONE
   ========================================================= */

async function startMicrophone(){

    if(audioActive){
        return;
    }

    try{

        microphoneStream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio:{
                        echoCancellation:true,
                        noiseSuppression:true,
                        autoGainControl:true
                    }
                });


        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        analyser =
            audioContext.createAnalyser();


        analyser.fftSize =
            256;

        analyser.smoothingTimeConstant =
            .55;


        microphoneSource =
            audioContext.createMediaStreamSource(
                microphoneStream
            );


        microphoneSource.connect(
            analyser
        );


        audioActive = true;

        microButton.classList.add(
            "active"
        );

        microButton.innerHTML =
            "MICRO<br>ACTIF";

        coreState.textContent =
            "LISTENING";


        startVisualLoop();

        startRecognition();


    }catch(error){

        console.error(
            "Microphone error:",
            error
        );

        voiceText.textContent =
            "MICROPHONE NON DISPONIBLE";

        coreState.textContent =
            "MIC ERROR";
    }
}


/* =========================================================
   STOP MICROPHONE
   ========================================================= */

function stopMicrophone(){

    if(
        microphoneStream
    ){

        microphoneStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );
    }


    if(
        microphoneSource
    ){

        microphoneSource.disconnect();

        microphoneSource = null;
    }


    if(
        audioContext
    ){

        audioContext.close();

        audioContext = null;
    }


    analyser = null;

    audioActive = false;

    visualVoiceLevel = 0;

    targetVoiceLevel = 0;


    ring1.style.setProperty(
        "--voice-scale",
        "1"
    );

    ring2.style.setProperty(
        "--voice-scale",
        "1"
    );

    ring3.style.setProperty(
        "--voice-scale",
        "1"
    );

    ring4.style.setProperty(
        "--voice-scale",
        "1"
    );


    orb.style.transform =
        "translate(-50%,-50%) scale(1)";


    orb.style.boxShadow = `
        inset -18px -18px 35px rgba(0,0,0,.78),
        inset 10px 8px 25px rgba(71,227,247,.22),
        0 0 22px rgba(0,210,255,.35),
        0 0 70px rgba(0,122,163,.25)
    `;


    microButton.classList.remove(
        "active"
    );

    microButton.innerHTML =
        "ACTIVER<br>MICRO";

    coreState.textContent =
        "READY";
}


/* =========================================================
   VISUAL AUDIO LOOP
   ========================================================= */

function startVisualLoop(){

    if(animationRunning){
        return;
    }

    animationRunning = true;

    requestAnimationFrame(
        updateAudioVisuals
    );
}


function updateAudioVisuals(){

    if(
        !audioActive ||
        !analyser
    ){

        animationRunning = false;

        return;
    }


    const data =
        new Uint8Array(
            analyser.frequencyBinCount
        );


    analyser.getByteFrequencyData(
        data
    );


    /*
       Bande principalement vocale.
    */

    let sum = 0;

    let count = 0;


    for(
        let i = 2;
        i < Math.min(
            data.length,
            42
        );
        i++
    ){

        sum += data[i];

        count++;
    }


    const average =
        count
            ? sum / count
            : 0;


    targetVoiceLevel =
        Math.min(
            average / 76,
            1
        );


    /*
       Attaque très rapide.
       Relâchement contrôlé.
    */

    const now =
        performance.now();

    const delta =
        Math.min(
            (
                now -
                lastAudioTime
            ) / 1000,
            .05
        );


    lastAudioTime =
        now;


    if(
        targetVoiceLevel >
        visualVoiceLevel
    ){

        visualVoiceLevel +=
            (
                targetVoiceLevel -
                visualVoiceLevel
            ) *
            Math.min(
                delta * 38,
                1
            );

    }else{

        visualVoiceLevel +=
            (
                targetVoiceLevel -
                visualVoiceLevel
            ) *
            Math.min(
                delta * 15,
                1
            );
    }


    if(
        visualVoiceLevel <
        .025
    ){

        visualVoiceLevel = 0;
    }


    /*
       ==============================================
       COURONNES
       ==============================================
    */


    const s1 =
        1 +
        visualVoiceLevel *
        .125;


    const s2 =
        1 +
        visualVoiceLevel *
        .103;


    const s3 =
        1 +
        visualVoiceLevel *
        .083;


    const s4 =
        1 +
        visualVoiceLevel *
        .062;


    ring1.style.setProperty(
        "--voice-scale",
        s1
    );

    ring2.style.setProperty(
        "--voice-scale",
        s2
    );

    ring3.style.setProperty(
        "--voice-scale",
        s3
    );

    ring4.style.setProperty(
        "--voice-scale",
        s4
    );


    /*
       ==============================================
       ORBE
       ==============================================
    */

    const orbScale =
        1 +
        visualVoiceLevel *
        .15;


    orb.style.transform =
        `
        translate(-50%,-50%)
        scale(${orbScale})
        `;


    const glow =
        22 +
        visualVoiceLevel *
        44;


    const deepGlow =
        70 +
        visualVoiceLevel *
        120;


    orb.style.boxShadow = `
        inset -18px -18px 35px rgba(0,0,0,.78),
        inset 10px 8px 25px rgba(71,227,247,.25),
        0 0 ${glow}px rgba(0,220,255,.48),
        0 0 ${deepGlow}px rgba(0,130,170,.30)
    `;


    /*
       ==============================================
       AUDIO BARS
       ==============================================
    */

    audioBars.forEach(
        (
            bar,
            index
        ) => {

            const position =
                index /
                (
                    audioBars.length -
                    1
                );


            const frequencyIndex =
                Math.floor(
                    position *
                    Math.min(
                        data.length,
                        55
                    )
                );


            const value =
                data[
                    frequencyIndex
                ] || 0;


            const local =
                value / 255;


            const height =
                4 +
                local *
                27 *
                (
                    .4 +
                    visualVoiceLevel *
                    1.8
                );


            bar.style.height =
                `${height}px`;
        }
    );


    /*
       ==============================================
       STATE
       ==============================================
    */

    if(
        visualVoiceLevel >
        .075
    ){

        coreState.textContent =
            "LISTENING";

    }else{

        coreState.textContent =
            "READY";
    }


    requestAnimationFrame(
        updateAudioVisuals
    );
}


/* =========================================================
   SPEECH RECOGNITION
   ========================================================= */

function startRecognition(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        voiceText.textContent =
            "RECONNAISSANCE VOCALE NON DISPONIBLE";

        return;
    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "fr-FR";


    recognition.continuous =
        true;


    recognition.interimResults =
        true;


    recognition.maxAlternatives =
        1;


    recognition.onstart =
        () => {

            recognitionActive =
                true;
        };


    recognition.onresult =
        event => {

            let interim = "";

            let finalText = "";


            for(
                let i =
                    event.resultIndex;
                i <
                    event.results.length;
                i++
            ){

                const result =
                    event.results[i];


                const text =
                    result[0].transcript;


                if(
                    result.isFinal
                ){

                    finalText +=
                        text + " ";

                }else{

                    interim +=
                        text;
                }
            }


            if(finalText){

                finalTranscript +=
                    finalText;
            }


            const display =
                (
                    finalTranscript +
                    interim
                ).trim();


            if(display){

                voiceText.textContent =
                    display.toUpperCase();
            }
        };


    recognition.onerror =
        error => {

            console.log(
                "Speech recognition:",
                error
            );
        };


    recognition.onend =
        () => {

            recognitionActive =
                false;


            /*
               Sur iOS/Safari, la reconnaissance
               peut s'arrêter automatiquement.
            */

            if(
                audioActive
            ){

                setTimeout(
                    () => {

                        try{

                            recognition.start();

                        }catch(e){}

                    },
                    250
                );
            }
        };


    try{

        recognition.start();

    }catch(error){

        console.log(error);
    }
}


/* =========================================================
   SEND TO SHORTCUTS
   ========================================================= */

function sendToShortcuts(){

    const command =
        (
            finalTranscript ||
            voiceText.textContent ||
            ""
        ).trim();


    if(!command){
        return;
    }


    /*
       Première méthode :
       tentative d'utilisation du schéma
       shortcuts://

       Le nom du raccourci peut être changé
       ici.
    */

    const shortcutName =
        "JARVIS";


    const url =
        "shortcuts://run-shortcut?name=" +
        encodeURIComponent(
            shortcutName
        ) +
        "&input=" +
        encodeURIComponent(
            command
        );


    window.location.href =
        url;
}


/* =========================================================
   SYNTHÈSE VOCALE
   ========================================================= */

function speakJarvis(){

    if(
        !("speechSynthesis" in window)
    ){

        voiceText.textContent =
            "SYNTHÈSE VOCALE NON DISPONIBLE";

        return;
    }


    let text =
        finalTranscript.trim();


    if(!text){

        text =
            "Je suis prêt. Quelle est votre commande ?";
    }


    lastSpeechText =
        text;


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "fr-FR";


    utterance.rate =
        .91;


    utterance.pitch =
        .72;


    utterance.volume =
        .95;


    /*
       On cherche une voix française
       si Safari en propose une.
    */

    const voices =
        window.speechSynthesis
            .getVoices();


    const frenchVoice =
        voices.find(
            voice =>
                voice.lang
                    .toLowerCase()
                    .startsWith("fr")
        );


    if(frenchVoice){

        utterance.voice =
            frenchVoice;
    }


    utterance.onstart =
        () => {

            coreState.textContent =
                "SPEAKING";

            speakButton.classList.add(
                "active"
            );
        };


    utterance.onend =
        () => {

            coreState.textContent =
                "READY";

            speakButton.classList.remove(
                "active"
            );
        };


    window.speechSynthesis.speak(
        utterance
    );
}
