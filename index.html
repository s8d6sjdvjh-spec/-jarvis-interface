<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<title>JARVIS — Gyrotourbillon</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#010608;
  color:#d8faff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

body{
  position:fixed;
  inset:0;
}

#app{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 50% 42%,

    #010608;
}

#app:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.13;

    linear-gradient(90deg,rgba(35,140,160,.16) 1px,transparent 1px);

}

.header{

  z-index:20;
  top:max(24px,env(safe-area-inset-top));
  left:0;
  right:0;
  height:65px;
  padding:0 6vw;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:26px;
  font-weight:300;
  letter-spacing:.38em;
}

.status{
  display:flex;
  gap:24px;
  font-size:9px;
  letter-spacing:.30em;
  color:rgba(166,214,224,.58);
}

.statusItem{
  display:flex;
  align-items:center;
  gap:8px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#00dcff;
  box-shadow:
    0 0 6px #00dcff,
    0 0 15px rgba(0,220,255,.7);
}

.subtitle{
  position:absolute;
  z-index:15;
  top:19.3vh;
  width:100%;
  text-align:center;
  font-size:8px;
  letter-spacing:.42em;
  color:rgba(92,173,190,.58);
}

#scene{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

.panels{
  position:absolute;
  z-index:30;
  left:5.5vw;
  right:5.5vw;
  bottom:max(58px,calc(env(safe-area-inset-bottom) + 42px));
  display:grid;
  grid-template-columns:1fr 1fr;

.panel{
  min-height:103px;
  padding:18px 15px 14px;

.label{

  letter-spacing:.42em;

  margin-bottom:11px;
}

.value{
  font-size:31px;
  font-weight:300;
}

  margin-top:7px;
  font-size:7px;

}

@media(max-width:600px){

  .header{

  }

    gap:12px;
    font-size:7px;
  }

  .subtitle{
    top:19.2vh;
  }

  .panels{
    gap:11px;
  }

  .panel{
    min-height:100px;
    padding:17px 14px;
  }
}
</style>
</head>

      <div class="label">ACTIVITÉ</div>

<script type="module">

import * as THREE from "three";


/* ==========================================================
   JARVIS — DENSE HOROLOGICAL GYROTOURBILLON
   ========================================================== */

const canvas=document.getElementById("scene");

const renderer=new THREE.WebGLRenderer({
  canvas,
  antialias:true,
  alpha:true,
  powerPreference:"high-performance"
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;


const scene=new THREE.Scene();

const camera=new THREE.PerspectiveCamera(
  34,
  innerWidth/innerHeight,
  .1,
  100
);

camera.position.set(0,0,10);


/* ==========================================================
   LUMIÈRES
   ========================================================== */

scene.add(
  new THREE.AmbientLight(0x162c31,1.35)
);

const cyan=new THREE.PointLight(
  0x65eaff,
  13,
  15
);

cyan.position.set(-3.5,3.8,5);
scene.add(cyan);

const white=new THREE.PointLight(
  0xffffff,
  10,
  12
);

white.position.set(3,2,4);
scene.add(white);

const warm=new THREE.PointLight(
  0xffb94d,
  5,
  9
);

warm.position.set(-2.5,-3,4);
scene.add(warm);


/* ==========================================================
   TEXTURE MÉTALLIQUE PROCÉDURALE
   ========================================================== */

function metalTexture(seed=1){

  const size=256;

  const c=document.createElement("canvas");
  c.width=size;
  c.height=size;

  const ctx=c.getContext("2d");

  const image=ctx.createImageData(size,size);

  for(let y=0;y<size;y++){

    for(let x=0;x<size;x++){

      const n=
        Math.sin(
          x*12.91+
          y*7.37+
          seed*51
        )*0.5+0.5;

      const scratches =
        Math.sin(
          y*.55+
          Math.sin(x*.12)*4
        )*.5+.5;

      const value=
        70+
        n*80+
        scratches*35;

      const i=(y*size+x)*4;

      image.data[i]=value;
      image.data[i+1]=value;
      image.data[i+2]=value;
      image.data[i+3]=255;
    }
  }

  ctx.putImageData(image,0,0);

  const texture=new THREE.CanvasTexture(c);

  texture.wrapS=THREE.RepeatWrapping;
  texture.wrapT=THREE.RepeatWrapping;

  return texture;
}


const roughMap1=metalTexture(2);
const roughMap2=metalTexture(8);
const roughMap3=metalTexture(17);


/* ==========================================================
   MATIÈRES
   ========================================================== */

function metal(
  color,
  roughness,
  texture
){

  return new THREE.MeshStandardMaterial({
    color,
    metalness:.96,
    roughness,
    roughnessMap:texture
  });
}

const steelDark=
  metal(0x11181b,.34,roughMap1);

const steel=
  metal(0x68767a,.25,roughMap2);

const steelBright=
  metal(0xc5ced0,.15,roughMap3);

const steelUsed=
  metal(0x4b5759,.48,roughMap1);

const blackMetal=
  metal(0x070c0e,.30,roughMap2);

const brass=
  metal(0x95641c,.28,roughMap3);

const brassDark=
  metal(0x573711,.42,roughMap1);


/* Rubis */

const rubyMaterial=
  new THREE.MeshPhysicalMaterial({
    color:0x540713,
    metalness:.04,
    roughness:.10,
    transmission:.78,
    thickness:.65,
    ior:1.77,
    clearcoat:1,
    clearcoatRoughness:.06
  });


/* ==========================================================
   GROUPE SYSTÈME
   ========================================================== */

const system=new THREE.Group();
scene.add(system);


/* ==========================================================
   COURONNES HOLOGRAPHIQUES
   ========================================================== */

const crownGroup=new THREE.Group();
system.add(crownGroup);


function holoRing(radius,opacity){

  const material=
    new THREE.MeshBasicMaterial({
      color:0x38d5e9,
      transparent:true,
      opacity,
      side:THREE.DoubleSide
    });

  return new THREE.Mesh(
    new THREE.RingGeometry(
      radius-.012,
      radius,
      192
    ),
    material
  );
}


crownGroup.add(
  holoRing(3.75,.20),
  holoRing(3.30,.28),
  holoRing(2.88,.20)
);


/* ==========================================================
   GRADUATIONS DENSES
   ========================================================== */

function radialTicks(
  radius,
  count,
  inner,
  outer
){

  const group=new THREE.Group();

  for(let i=0;i<count;i++){

    const a=
      i/count*Math.PI*2;

    const variation=
      .45+
      Math.abs(
        Math.sin(i*4.731)
      )*.55;

    const r1=
      radius-inner*variation;

    const r2=
      radius+outer*variation;

    const material=
      new THREE.LineBasicMaterial({
        color:
          i%11===0
            ? 0xbcecf3
            : 0x287a88,
        transparent:true,
        opacity:
          i%11===0
            ? .78
            : .46
      });

    const points=[
      new THREE.Vector3(
        Math.cos(a)*r1,
        Math.sin(a)*r1,
        .025
      ),
      new THREE.Vector3(
        Math.cos(a)*r2,
        Math.sin(a)*r2,
        .025
      )
    ];

    const geometry=
      new THREE.BufferGeometry()
        .setFromPoints(points);

    group.add(
      new THREE.Line(
        geometry,
        material
      )
    );
  }

  return group;
}


crownGroup.add(
  radialTicks(3.70,150,.065,.065),
  radialTicks(3.28,126,.052,.052),
  radialTicks(2.86,108,.045,.045)
);


/* ==========================================================
   MICRO-SYMBOLS
   ========================================================== */

function microMarkers(radius,count){

  const group=new THREE.Group();

  for(let i=0;i<count;i++){

    const a=i/count*Math.PI*2;

    const r=
      radius+
      Math.sin(i*3.71)*.018;

    const size=
      i%13===0 ? .045 :
      i%5===0 ? .028 :
      .016;

    const material=
      new THREE.MeshBasicMaterial({
        color:
          i%13===0
            ? 0xd6fbff
            : 0x168c9d,
        transparent:true,
        opacity:.68
      });

    const marker=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          size,
          size*2.4,
          .012
        ),
        material
      );

    marker.position.set(
      Math.cos(a)*r,
      Math.sin(a)*r,
      .035
    );

    marker.rotation.z=a;

    group.add(marker);
  }

  return group;
}

crownGroup.add(
  microMarkers(3.53,128)
);


/* ==========================================================
   GYROTOURBILLON
   ========================================================== */

const gyro=new THREE.Group();
system.add(gyro);


/*
   20 % environ de la largeur écran en portrait.
*/

gyro.userData.baseScale=1.22;


/* ==========================================================
   OUTILS DE CONSTRUCTION
   ========================================================== */


/* Pièce plate chanfreinée */

function bevelBox(
  width,
  height,
  depth,
  material,
  bevel=.025
){

  const geometry=
    new THREE.BoxGeometry(
      width,
      height,
      depth
    );

  geometry.translate(0,0,0);

  const mesh=
    new THREE.Mesh(
      geometry,
      material
    );

  /*
    Arête supplémentaire très fine :
    donne un reflet plus horloger.
  */

  const edge=
    new THREE.LineSegments(
      new THREE.EdgesGeometry(
        geometry,
        25
      ),
      new THREE.LineBasicMaterial({
        color:0x7d8d90,
        transparent:true,
        opacity:.22
      })
    );

  mesh.add(edge);

  return mesh;
}


/* ==========================================================
   CAGE MÉCANIQUE
   ========================================================== */

function mechanicalRing(
  radius,
  width,
  depth,
  material
){

  const group=new THREE.Group();

  const outer=radius+width/2;
  const inner=radius-width/2;

  const shape=new THREE.Shape();

  shape.absarc(
    0,0,
    outer,
    0,
    Math.PI*2,
    false
  );

  const hole=new THREE.Path();

  hole.absarc(
    0,0,
    inner,
    0,
    Math.PI*2,
    true
  );

  shape.holes.push(hole);

  const geometry=
    new THREE.ExtrudeGeometry(
      shape,
      {
        depth,
        bevelEnabled:true,
        bevelSegments:3,
        bevelSize:width*.13,
        bevelThickness:depth*.18,
        curveSegments:128
      }
    );

  geometry.center();

  const body=
    new THREE.Mesh(
      geometry,
      material
    );

  group.add(body);


  /*
    Anneau secondaire très fin :
    donne la lecture d'une vraie pièce usinée.
  */

  const secondary=
    new THREE.Mesh(
      new THREE.TorusGeometry(
        radius-width*.33,
        .010,
        6,
        160
      ),
      steelBright
    );

  group.add(secondary);


  return group;
}


/* ==========================================================
   CAGE EXTERNE
   ========================================================== */

const cageOuter=
  new THREE.Group();

gyro.add(cageOuter);

const outerRing=
  mechanicalRing(
    1.00,
    .105,
    .075,
    steelUsed
  );

cageOuter.add(outerRing);


/* ==========================================================
   MICRO-GRADUATIONS SUR CAGE
   ========================================================== */

function engravedTicks(
  parent,
  radius,
  count
){

  for(let i=0;i<count;i++){

    const a=
      i/count*Math.PI*2;

    const major=
      i%6===0;

    const tick=
      bevelBox(
        major?.075:.038,
        major?.018:.012,
        .018,
        major
          ? steelBright
          : steel,
        .004
      );

    tick.position.set(
      Math.cos(a)*radius,
      Math.sin(a)*radius,
      .065
    );

    tick.rotation.z=a;

    parent.add(tick);
  }
}

engravedTicks(
  cageOuter,
  1.0,
  72
);


/* ==========================================================
   PONTS DE CAGE
   ========================================================== */

function bridge(
  length,
  width,
  material,
  angle
){

  const b=
    bevelBox(
      length,
      width,
      .055,
      material,
      .008
    );

  b.rotation.z=angle;

  return b;
}


cageOuter.add(
  bridge(1.90,.038,steelBright,0),
  bridge(1.82,.032,steel,Math.PI/2),
  bridge(1.55,.027,steelUsed,Math.PI/4),
  bridge(1.55,.025,brassDark,-Math.PI/4)
);


/* ==========================================================
   VIS DE PRÉCISION
   ========================================================== */

function screw(
  parent,
  x,
  y,
  radius=.025,
  material=steelBright
){

  const s=
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        radius,
        radius,
        .035,
        16
      ),
      material
    );

  s.rotation.x=Math.PI/2;

  s.position.set(
    x,y,.085
  );

  parent.add(s);


  /* fente de vis */

  const slot=
    bevelBox(
      radius*1.5,
      .008,
      .006,
      blackMetal,
      .002
    );

  slot.position.z=.02;

  s.add(slot);
}


const screwPositions=[
  [0,1],
  [1,0],
  [0,-1],
  [-1,0],
  [.71,.71],
  [-.71,.71],
  [.71,-.71],
  [-.71,-.71]
];

for(const [x,y] of screwPositions){

  screw(
    cageOuter,
    x,
    y,
    .026
  );
}


/* ==========================================================
   DEUXIÈME CAGE — ROTATION X
   ========================================================== */

const cageX=new THREE.Group();
cageOuter.add(cageX);

cageX.rotation.y=Math.PI/2;

cageX.add(
  mechanicalRing(
    .76,
    .090,
    .068,
    steel
  )
);


/* Ponts asymétriques */

cageX.add(
  bridge(1.42,.034,steelBright,.13),
  bridge(1.26,.026,steelUsed,Math.PI/2+.18),
  bridge(1.10,.022,brass,-.72)
);


/* ==========================================================
   TROISIÈME CAGE — ROTATION Y
   ========================================================== */

const cageY=new THREE.Group();
cageX.add(cageY);

cageY.rotation.x=Math.PI/2;

cageY.add(
  mechanicalRing(
    .56,
    .072,
    .058,
    steelDark
  )
);

cageY.add(
  bridge(1.02,.026,steelBright,.26),
  bridge(.92,.021,brassDark,1.17),
  bridge(.84,.018,steelUsed,-.54)
);


/* ==========================================================
   STRUCTURE AJOURÉE
   ========================================================== */

function openBridge(
  parent,
  radius,
  angle,
  length,
  material
){

  const group=new THREE.Group();

  const main=
    bevelBox(
      length,
      .026,
      .045,
      material,
      .006
    );

  main.position.x=
    length/2-radius*.18;

  group.add(main);


  /*
    petit contre-pont
  */

  const secondary=
    bevelBox(
      length*.42,
      .018,
      .035,
      steelBright,
      .004
    );

  secondary.position.set(
    length*.32-radius*.18,
    .045,
    .035
  );

  secondary.rotation.z=.18;

  group.add(secondary);

  group.rotation.z=angle;

  parent.add(group);
}


for(let i=0;i<7;i++){

  openBridge(
    cageY,
    .50,
    i/7*Math.PI*2,
    .42+.06*Math.sin(i*2.1),
    i%3===0
      ? brass
      : steelUsed
  );
}


/* ==========================================================
   ROUES DENTÉES RÉALISTES
   ========================================================== */

function gear(
  radius,
  teeth,
  thickness,
  material
){

  const group=new THREE.Group();


  /* roue principale */

  const disc=
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        radius,
        radius,
        thickness,
        64
      ),
      material
    );

  disc.rotation.x=Math.PI/2;

  group.add(disc);


  /* évidement central */

  const inner=
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        radius*.48,
        radius*.48,
        thickness+.01,
        48
      ),
      blackMetal
    );

  inner.rotation.x=Math.PI/2;

  group.add(inner);


  /* dents */

  for(let i=0;i<teeth;i++){

    const a=
      i/teeth*Math.PI*2;

    const tooth=
      bevelBox(
        radius*.13,
        radius*.24,
        thickness*1.15,
        material,
        .008
      );

    const r=radius*1.08;

    tooth.position.set(
      Math.cos(a)*r,
      Math.sin(a)*r,
      0
    );

    tooth.rotation.z=a;

    group.add(tooth);
  }


  /* micro-trous */

  for(let i=0;i<teeth;i+=4){

    const a=
      i/teeth*Math.PI*2;

    const hole=
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .009,
          .009,
          thickness*1.3,
          12
        ),
        blackMetal
      );

    hole.rotation.x=Math.PI/2;

    hole.position.set(
      Math.cos(a)*radius*.70,
      Math.sin(a)*radius*.70,
      .01
    );

    group.add(hole);
  }

  return group;
}


const gear1=
  gear(.31,34,.045,steelBright);

gear1.position.z=.07;

cageY.add(gear1);


const gear2=
  gear(.205,25,.038,brass);

gear2.position.set(
  -.19,
  .09,
  .09
);

cageY.add(gear2);


const gear3=
  gear(.13,20,.032,steel);

gear3.position.set(
  .20,
  -.11,
  .11
);

cageY.add(gear3);


/* ==========================================================
   BALANCIER
   ========================================================== */

const balance=new THREE.Group();
cageY.add(balance);


/* roue du balancier */

const balanceRing=
  new THREE.Mesh(
    new THREE.TorusGeometry(
      .265,
      .024,
      8,
      96
    ),
    steelBright
  );

balance.add(balanceRing);


/* cerclage secondaire */

const balanceInner=
  new THREE.Mesh(
    new THREE.TorusGeometry(
      .19,
      .012,
      6,
      72
    ),
    brassDark
  );

balance.add(balanceInner);


/* bras */

for(let i=0;i<6;i++){

  const a=i/6*Math.PI*2;

  const arm=
    bevelBox(
      .42,
      .016,
      .025,
      i%2
        ? steel
        : brass,
      .004
    );

  arm.position.set(
    Math.cos(a)*.12,
    Math.sin(a)*.12,
    .025
  );

  arm.rotation.z=a;

  balance.add(arm);
}


/* ==========================================================
   ÉCHAPPEMENT
   ========================================================== */

const escape=new THREE.Group();
cageY.add(escape);

escape.position.set(
  .015,
  -.02,
  .11
);


for(let i=0;i<11;i++){

  const tooth=
    bevelBox(
      .075,
      .018,
      .018,
      i%3===0
        ? steelBright
        : steelUsed,
      .003
    );

  const a=
    i/11*Math.PI*2;

  tooth.position.set(
    Math.cos(a)*.13,
    Math.sin(a)*.13,
    0
  );

  tooth.rotation.z=a;

  escape.add(tooth);
}


/* ==========================================================
   RUBIS CENTRAL
   ========================================================== */

const ruby=
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .105,
      40,
      28
    ),
    rubyMaterial
  );

ruby.position.z=.16;

cageY.add(ruby);


/* petite réflexion interne */

const rubyInner=
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .045,
      24,
      18
    ),
    new THREE.MeshPhysicalMaterial({
      color:0x250008,
      roughness:.02,
      transmission:.9,
      thickness:.3,
      ior:1.8
    })
  );

ruby.add(rubyInner);


/* ==========================================================
   AXES
   ========================================================== */

function axis(length,material){

  const a=
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .012,
        .012,
        length,
        20
      ),
      material
    );

  return a;
}


const axisX=
  axis(2.08,steelBright);

axisX.rotation.z=Math.PI/2;
cageOuter.add(axisX);


const axisY=
  axis(1.82,steel);

axisY.rotation.x=Math.PI/2;
cageOuter.add(axisY);


const axisZ=
  axis(1.92,brass);

cageOuter.add(axisZ);


/* ==========================================================
   PALIERS / JEWELS
   ========================================================== */

function jewel(parent,x,y,z,scale=.028){

  const j=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        scale,
        18,
        14
      ),
      rubyMaterial
    );

  j.position.set(x,y,z);

  parent.add(j);
}


jewel(cageOuter,0,1,.09,.025);
jewel(cageOuter,0,-1,.09,.025);

jewel(cageX,.76,0,.08,.021);
jewel(cageX,-.76,0,.08,.021);

jewel(cageY,.56,0,.08,.019);
jewel(cageY,-.56,0,.08,.019);


/* ==========================================================
   MICRO GRAVURES
   ========================================================== */

function engravingRing(
  parent,
  radius,
  count
){

  for(let i=0;i<count;i++){

    const a=
      i/count*Math.PI*2;

    const major=i%9===0;

    const mark=
      bevelBox(
        major?.045:.022,
        .006,
        .006,
        major
          ? steelBright
          : steelUsed,
        .001
      );

    mark.position.set(
      Math.cos(a)*radius,
      Math.sin(a)*radius,
      .085
    );

    mark.rotation.z=a;

    parent.add(mark);
  }
}


engravingRing(
  cageOuter,
  .88,
  96
);

engravingRing(
  cageX,
  .67,
  72
);

engravingRing(
  cageY,
  .48,
  60
);


/* ==========================================================
   PATINE / PETITES IMPERFECTIONS VISUELLES
   ========================================================== */

function patinaSpots(
  parent,
  radius,
  count
){

  for(let i=0;i<count;i++){

    const a=
      Math.random()*Math.PI*2;

    const r=
      radius+
      (Math.random()-.5)*.10;

    const size=
      .008+
      Math.random()*.018;

    const material=
      new THREE.MeshStandardMaterial({
        color:
          Math.random()>.5
            ? 0x263336
            : 0x80632e,
        metalness:.7,
        roughness:.72,
        transparent:true,
        opacity:.45
      });

    const spot=
      new THREE.Mesh(
        new THREE.CircleGeometry(
          size,
          8
        ),
        material
      );

    spot.position.set(
      Math.cos(a)*r,
      Math.sin(a)*r,
      .09
    );

    parent.add(spot);
  }
}


patinaSpots(cageOuter,1,36);
patinaSpots(cageX,.76,28);
patinaSpots(cageY,.56,22);


/* ==========================================================
   ROTATIONS INDÉPENDANTES
   ========================================================== */

let previous=
  performance.now();


function animate(now){

  requestAnimationFrame(animate);

  const dt=
    Math.min(
      (now-previous)/1000,
      .05
    );

  previous=now;


  /*
    Trois axes différents.
    Ils doivent être lisibles visuellement,
    mais rester suffisamment lents pour
    conserver une sensation horlogère.
  */

  cageOuter.rotation.z+=dt*.29;

  cageX.rotation.x+=dt*.57;

  cageY.rotation.y+=dt*.91;


  /*
    Mécanique interne.
  */

  gear1.rotation.z+=dt*1.15;

  gear2.rotation.z-=dt*1.72;

  gear3.rotation.z+=dt*2.25;

  balance.rotation.z+=dt*2.75;

  escape.rotation.z-=dt*3.2;


  /*
    Très légère variation de l'ensemble.
  */

  const breathing=
    1+
    Math.sin(now*.00055)*.006;

  gyro.scale.setScalar(
    gyro.userData.baseScale*
    breathing
  );


  renderer.render(
    scene,
    camera
  );
}


/* ==========================================================
   RESPONSIVE PORTRAIT
   ========================================================== */

function layout(){

  const w=innerWidth;
  const h=innerHeight;

  const portrait=h>=w;

  camera.aspect=w/h;
  camera.updateProjectionMatrix();


  /*
    Le gyro reste volontairement petit
    dans l'interface globale.
  */

  gyro.position.set(
    0,
    portrait ? .18 : .08,
    0
  );


  gyro.userData.baseScale=
    portrait
      ? 1.20
      : 1.42;


  /*
    Couronnes très présentes,
    mais sans toucher directement
    les bords de l'écran.
  */

  crownGroup.scale.set(
    portrait ? 1 : .88,
    portrait ? 1 : .88,
    1
  );
}


window.addEventListener(
  "resize",
  ()=>{

    renderer.setSize(
      innerWidth,
      innerHeight
    );

    layout();
  },
  {passive:true}
);


layout();

animate(performance.now());


/* ==========================================================
   ROTATION MANUELLE DISCRÈTE
   ========================================================== */

let tx=0;
let ty=0;

window.addEventListener(
  "touchstart",
  e=>{

    const t=e.touches[0];

    tx=t.clientX;
    ty=t.clientY;
  },
  {passive:true}
);


window.addEventListener(
  "touchmove",
  e=>{

    const t=e.touches[0];

    const dx=t.clientX-tx;
    const dy=t.clientY-ty;

    gyro.rotation.y+=dx*.0007;
    gyro.rotation.x+=dy*.0007;

    tx=t.clientX;
    ty=t.clientY;

  },
  {passive:true}
);

</script>
