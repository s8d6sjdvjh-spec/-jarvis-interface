<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             viewport-fit=cover,
             user-scalable=no"
>

<meta name="theme-color" content="#02070a">

<title>JARVIS — Voice Core</title>

<style>

/* =========================================================
   JARVIS VOICE CORE
   SINGLE FILE / NO EXTERNAL DEPENDENCIES
   iPHONE / GITHUB PAGES
   ========================================================= */

:root{

    --bg:#02070a;

    --cyan:#11ddff;
    --cyan2:#73efff;
    --cyan3:#0b6576;

    --white:#dffaff;

    --gold:#c49a50;

    --panel:rgba(3,18,24,.88);

}


/* =========================================================
   RESET
   ========================================================= */

*{

    box-sizing:border-box;

    margin:0;

    padding:0;

    -webkit-tap-highlight-color:transparent;

}


html,
body{

    width:100%;

    height:100%;

    overflow:hidden;

    background:#02070a;

    color:var(--white);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

}


body{

    position:fixed;

    inset:0;

    overscroll-behavior:none;

}


/* =========================================================
   APPLICATION
   ========================================================= */

#app{

    position:fixed;

    inset:0;

    width:100%;

    height:100%;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 50% 25%,
            rgba(0,90,115,.12),
            transparent 25%
        ),

        #02070a;

}


/* =========================================================
   GRID
   ========================================================= */

#grid{

    position:absolute;

    inset:0;

    pointer-events:none;

    opacity:.27;

    background-image:

        linear-gradient(
            rgba(22,92,106,.18) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(22,92,106,.18) 1px,
            transparent 1px
        );

    background-size:
        36px 36px;

}


/* =========================================================
   HEADER
   ========================================================= */

#header{

    position:absolute;

    z-index:100;

    top:0;

    left:0;

    right:0;

    height:
        calc(
            82px +
            env(safe-area-inset-top)
        );

    padding:
        env(safe-area-inset-top)
        24px
        0
        24px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    pointer-events:none;

}


.logo{

    font-size:18px;

    font-weight:300;

    letter-spacing:.52em;

    white-space:nowrap;

}


.status{

    display:flex;

    gap:12px;

    align-items:center;

}


.statusItem{

    display:flex;

    align-items:center;

    gap:5px;

    color:#537d87;

    font-size:7px;

    letter-spacing:.24em;

}


.statusDot{

    width:7px;

    height:7px;

    border-radius:50%;

    background:#12ddff;

    box-shadow:

        0 0 7px #12ddff,

        0 0 17px rgba(18,221,255,.55);

}


/* =========================================================
   SUBTITLE
   ========================================================= */

#subtitle{

    position:absolute;

    z-index:80;

    top:
        calc(
            116px +
            env(safe-area-inset-top)
        );

    left:0;

    right:0;

    text-align:center;

    color:#4e7c87;

    font-size:8px;

    letter-spacing:.34em;

}


/* =========================================================
   VOICE STATE
   ========================================================= */

#voiceState{

    position:absolute;

    z-index:90;

    top:
        calc(
            139px +
            env(safe-area-inset-top)
        );

    left:0;

    right:0;

    text-align:center;

    color:#315b66;

    font-size:6px;

    letter-spacing:.32em;

    transition:

        color .25s ease,

        text-shadow .25s ease;

}


#voiceState.active{

    color:#8cf5ff;

    text-shadow:

        0 0 10px
        rgba(15,220,255,.75);

}


/* =========================================================
   CORE AREA
   IMPORTANT:
   ORB ≈ 20VH
   ========================================================= */

#coreArea{

    position:absolute;

    z-index:20;

    left:0;

    right:0;

    top:
        calc(
            158px +
            env(safe-area-inset-top)
        );

    height:42vh;

    display:flex;

    justify-content:center;

    align-items:flex-start;

}


/* =========================================================
   CORE
   ========================================================= */

#core{

    position:relative;

    width:
        min(
            20vh,
            220px
        );

    height:
        min(
            20vh,
            220px
        );

    min-width:150px;

    min-height:150px;

}


/* =========================================================
   CANVAS
   ========================================================= */

#canvas{

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

}


/* =========================================================
   FOUR HUD RINGS
   ========================================================= */

#rings{

    position:absolute;

    inset:-82%;

    width:264%;

    height:264%;

    pointer-events:none;

}


.ring{

    fill:none;

    transform-origin:50% 50%;

}


.ring1{

    stroke:
        rgba(20,209,239,.70);

    stroke-width:
        .45;

    stroke-dasharray:
        1.2 2.8;

    animation:
        ringClockwise
        48s
        linear
        infinite;

}


.ring2{

    stroke:
        rgba(65,221,243,.53);

    stroke-width:
        .6;

    stroke-dasharray:
        8 3 1 4;

    animation:
        ringCounter
        38s
        linear
        infinite;

}


.ring3{

    stroke:
        rgba(184,229,235,.39);

    stroke-width:
        .42;

    stroke-dasharray:
        2 7;

    animation:
        ringClockwise
        64s
        linear
        infinite;

}


.ring4{

    stroke:
        rgba(196,154,79,.56);

    stroke-width:
        .55;

    stroke-dasharray:
        16 7 3 8;

    animation:
        ringCounter
        72s
        linear
        infinite;

}


@keyframes ringClockwise{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}


@keyframes ringCounter{

    from{
        transform:rotate(360deg);
    }

    to{
        transform:rotate(0deg);
    }

}


/* =========================================================
   RING TICKS
   ========================================================= */

.tick{

    stroke:
        rgba(93,225,242,.64);

    stroke-width:
        .65;

}


.tickMajor{

    stroke:
        rgba(183,244,250,.88);

    stroke-width:
        1;

}


.tickGold{

    stroke:
        rgba(211,170,91,.70);

    stroke-width:
        .65;

}


/* =========================================================
   RING NUMBERS
   ========================================================= */

.ringNumber{

    fill:
        rgba(129,222,236,.62);

    font-family:
        monospace;

    font-size:
        3.1px;

    letter-spacing:
        .5px;

}


/* =========================================================
   ORB HALO
   ========================================================= */

#halo{

    position:absolute;

    z-index:2;

    left:50%;

    top:50%;

    width:100%;

    height:100%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            rgba(16,218,255,.24),
            rgba(0,89,115,.09) 44%,
            transparent 70%
        );

    filter:
        blur(12px);

    transition:
        transform .06s linear;

}


/* =========================================================
   CORE LABEL
   ========================================================= */

#coreLabel{

    position:absolute;

    z-index:30;

    left:50%;

    top:50%;

    transform:
        translate(-50%,-50%);

    text-align:center;

    pointer-events:none;

    text-shadow:
        0 0 10px
        rgba(20,220,255,.65);

}


#coreLabel strong{

    display:block;

    color:#d9fbff;

    font-size:7px;

    font-weight:300;

    letter-spacing:.42em;

}


#coreLabel span{

    display:block;

    margin-top:5px;

    color:#4f9ba9;

    font-size:5px;

    letter-spacing:.28em;

}


/* =========================================================
   VOICE TRANSCRIPTION
   ========================================================= */

#transcription{

    position:absolute;

    z-index:60;

    left:25px;

    right:25px;

    top:
        calc(
            51vh +
            env(safe-area-inset-top)
        );

    min-height:46px;

    padding:
        10px
        13px;

    border-left:
        1px solid
        rgba(22,213,241,.55);

    border-right:
        1px solid
        rgba(22,213,241,.22);

    background:
        linear-gradient(
            90deg,
            rgba(0,33,42,.55),
            rgba(0,10,14,.35)
        );

    color:#79dbe9;

    font-size:10px;

    letter-spacing:.08em;

    text-align:center;

    opacity:.88;

}


#transcription.empty{

    color:#345963;

}


/* =========================================================
   VOICE VISUALIZER
   ========================================================= */

#visualizer{

    position:absolute;

    z-index:70;

    left:50%;

    transform:
        translateX(-50%);

    top:
        calc(
            58vh +
            env(safe-area-inset-top)
        );

    width:170px;

    height:28px;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:3px;

}


.bar{

    width:2px;

    height:4px;

    background:#18dfff;

    box-shadow:
        0 0 6px
        rgba(24,223,255,.7);

    transition:
        height .05s linear;

}


/* =========================================================
   CONTROLS
   ========================================================= */

#controls{

    position:absolute;

    z-index:100;

    left:20px;

    right:20px;

    bottom:
        calc(
            25px +
            env(safe-area-inset-bottom)
        );

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:8px;

}


.control{

    min-height:44px;

    border:
        1px solid
        rgba(16,190,216,.40);

    background:
        rgba(3,18,24,.85);

    color:#6dbbc7;

    font-size:7px;

    letter-spacing:.16em;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    cursor:pointer;

    user-select:none;

    -webkit-user-select:none;

}


.control:active{

    background:
        rgba(10,61,73,.9);

    color:#cfffff;

}


.control.primary{

    border-color:
        rgba(24,221,255,.68);

    color:#9bf4ff;

}


/* =========================================================
   SPEECH OUTPUT PANEL
   ========================================================= */

#speechPanel{

    position:absolute;

    z-index:110;

    left:20px;

    right:20px;

    bottom:
        calc(
            84px +
            env(safe-area-inset-bottom)
        );

    display:none;

    padding:12px;

    border:
        1px solid
        rgba(16,202,232,.45);

    background:
        rgba(2,13,18,.95);

}


#speechPanel.visible{

    display:block;

}


#speechText{

    width:100%;

    min-height:55px;

    resize:none;

    border:none;

    outline:none;

    background:
        rgba(0,0,0,.22);

    color:#d8fbff;

    padding:9px;

    font-family:inherit;

    font-size:11px;

}


.speechButtons{

    margin-top:7px;

    display:flex;

    gap:7px;

}


.speechButtons button{

    flex:1;

    height:34px;

    border:
        1px solid
        rgba(21,207,235,.45);

    background:
        rgba(4,31,39,.9);

    color:#8feaf6;

    font-size:7px;

    letter-spacing:.12em;

}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(
    max-width:390px
){

    .logo{

        font-size:15px;

    }


    .status{

        gap:7px;

    }


    .statusItem{

        font-size:6px;

        letter-spacing:.15em;

    }


    #subtitle{

        font-size:7px;

        letter-spacing:.27em;

    }


    #core{

        width:20vh;

        height:20vh;

        min-width:140px;

        min-height:140px;

    }


    #transcription{

        left:18px;

        right:18px;

    }

}


/* =========================================================
   SMALL HEIGHT
   ========================================================= */

@media(
    max-height:720px
){

    #coreArea{

        top:
            calc(
                143px +
                env(safe-area-inset-top)
            );

    }


    #transcription{

        top:
            calc(
                48vh +
                env(safe-area-inset-top)
            );

    }


    #visualizer{

        top:
            calc(
                55vh +
                env(safe-area-inset-top)
            );

    }

}

</style>

</head>


<body>

<div id="app">

    <div id="grid"></div>


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header id="header">

        <div class="logo">
            J A R V I S
        </div>


        <div class="status">

            <div class="statusItem">

                <span class="statusDot"></span>

                ONLINE

            </div>


            <div class="statusItem">

                <span class="statusDot"></span>

                SECURE

            </div>


            <div class="statusItem">

                <span class="statusDot"></span>

                VOICE

            </div>

        </div>

    </header>


    <!-- =====================================================
         TITLE
         ===================================================== -->

    <div id="subtitle">

        VOICE CORE
        ·
        CRYSTALLINE MATRIX
        ·
        3 AXIS

    </div>


    <div id="voiceState">

        VOICE SYSTEM READY

    </div>


    <!-- =====================================================
         CORE
         ===================================================== -->

    <section id="coreArea">


        <div id="core">


            <!-- HALO -->

            <div id="halo"></div>


            <!-- =================================================
                 FOUR RINGS
                 ================================================= -->

            <svg
                id="rings"
                viewBox="0 0 100 100"
                preserveAspectRatio="xMidYMid meet"
            >


                <!-- RING 1 -->

                <circle
                    cx="50"
                    cy="50"
                    r="38"
                    class="ring ring1"
                />


                <!-- RING 2 -->

                <circle
                    cx="50"
                    cy="50"
                    r="44"
                    class="ring ring2"
                />


                <!-- RING 3 -->

                <circle
                    cx="50"
                    cy="50"
                    r="50"
                    class="ring ring3"
                />


                <!-- RING 4 -->

                <circle
                    cx="50"
                    cy="50"
                    r="56"
                    class="ring ring4"
                />


                <!-- TICKS -->

                <g
                    id="ticks"
                    class="ring2"
                ></g>


                <!-- NUMBERS -->

                <g
                    id="numbers"
                    class="ringNumber"
                ></g>


                <!-- CARDINAL -->

                <g
                    fill="#c8f8ff"
                    font-family="Arial"
                    font-size="4.5"
                    text-anchor="middle"
                >

                    <text
                        x="50"
                        y="8"
                    >
                        N
                    </text>

                    <text
                        x="92"
                        y="51.5"
                    >
                        E
                    </text>

                    <text
                        x="50"
                        y="94"
                    >
                        S
                    </text>

                    <text
                        x="8"
                        y="51.5"
                    >
                        W
                    </text>

                </g>


                <!-- SMALL DATA MARKERS -->

                <g
                    fill="#56dff0"
                    opacity=".8"
                >

                    <circle
                        cx="20"
                        cy="29"
                        r=".9"
                    />

                    <circle
                        cx="80"
                        cy="29"
                        r=".9"
                    />

                    <circle
                        cx="20"
                        cy="71"
                        r=".9"
                    />

                    <circle
                        cx="80"
                        cy="71"
                        r=".9"
                    />

                </g>


            </svg>


            <!-- =================================================
                 3D ORB CANVAS
                 ================================================= -->

            <canvas id="canvas"></canvas>


            <!-- LABEL -->

            <div id="coreLabel">

                <strong>CORE</strong>

                <span id="coreMode">
                    STANDBY
                </span>

            </div>


        </div>

    </section>


    <!-- =====================================================
         TRANSCRIPTION
         ===================================================== -->

    <div
        id="transcription"
        class="empty"
    >

        En attente de commande vocale…

    </div>


    <!-- =====================================================
         VOICE VISUALIZER
         ===================================================== -->

    <div id="visualizer">

        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>

    </div>


    <!-- =====================================================
         SPEECH PANEL
         ===================================================== -->

    <div id="speechPanel">

        <textarea
            id="speechText"
            placeholder="Texte que Jarvis doit prononcer..."
        ></textarea>


        <div class="speechButtons">

            <button id="speakButton">
                PARLER
            </button>

            <button id="stopButton">
                STOP
            </button>

        </div>

    </div>


    <!-- =====================================================
         CONTROLS
         ===================================================== -->

    <div id="controls">

        <button
            id="listenButton"
            class="control primary"
        >
            ACTIVER<br>
            MICRO

        </button>


        <button
            id="shortcutButton"
            class="control"
        >
            ENVOYER<br>
            RACCOURCIS

        </button>


        <button
            id="voiceButton"
            class="control"
        >
            VOIX<br>
            JARVIS

        </button>

    </div>

</div>


<script>

/* =========================================================
   JARVIS VOICE CORE
   PURE JAVASCRIPT
   ========================================================= */


/* =========================================================
   ELEMENTS
   ========================================================= */

const canvas =
    document.getElementById(
        "canvas"
    );


const core =
    document.getElementById(
        "core"
    );


const halo =
    document.getElementById(
        "halo"
    );


const coreLabel =
    document.getElementById(
        "coreMode"
    );


const voiceState =
    document.getElementById(
        "voiceState"
    );


const transcription =
    document.getElementById(
        "transcription"
    );


const listenButton =
    document.getElementById(
        "listenButton"
    );


const shortcutButton =
    document.getElementById(
        "shortcutButton"
    );


const voiceButton =
    document.getElementById(
        "voiceButton"
    );


const speechPanel =
    document.getElementById(
        "speechPanel"
    );


const speechText =
    document.getElementById(
        "speechText"
    );


const speakButton =
    document.getElementById(
        "speakButton"
    );


const stopButton =
    document.getElementById(
        "stopButton"
    );


const bars =
    Array.from(
        document.querySelectorAll(
            ".bar"
        )
    );


/* =========================================================
   SVG RING DATA
   ========================================================= */

const svgNS =
    "http://www.w3.org/2000/svg";


const tickGroup =
    document.getElementById(
        "ticks"
    );


const numberGroup =
    document.getElementById(
        "numbers"
    );


/* =========================================================
   GENERATE 72 TICKS
   ========================================================= */

for(
    let i=0;
    i<72;
    i++
){

    const angle =
        (
            i / 72
        ) *
        Math.PI *
        2;


    const major =
        i % 9 === 0;


    const medium =
        i % 3 === 0;


    const radiusOuter =
        54;


    const radiusInner =
        major
        ? 50.8
        : medium
        ? 51.7
        : 52.3;


    const x1 =
        50 +
        Math.cos(angle) *
        radiusOuter;


    const y1 =
        50 +
        Math.sin(angle) *
        radiusOuter;


    const x2 =
        50 +
        Math.cos(angle) *
        radiusInner;


    const y2 =
        50 +
        Math.sin(angle) *
        radiusInner;


    const line =
        document.createElementNS(
            svgNS,
            "line"
        );


    line.setAttribute(
        "x1",
        x1
    );


    line.setAttribute(
        "y1",
        y1
    );


    line.setAttribute(
        "x2",
        x2
    );


    line.setAttribute(
        "y2",
        y2
    );


    line.setAttribute(
        "class",
        major
        ? "tickMajor"
        : medium
        ? "tick"
        : "tickGold"
    );


    tickGroup.appendChild(
        line
    );

}


/* =========================================================
   NUMBERS
   ========================================================= */

const values = [

    "00",
    "15",
    "30",
    "45",
    "60",
    "75",
    "90",
    "105",
    "120",
    "135",
    "150",
    "165",
    "180",
    "195",
    "210",
    "225",
    "240",
    "255",
    "270",
    "285",
    "300",
    "315",
    "330",
    "345"

];


for(
    let i=0;
    i<values.length;
    i++
){

    const angle =
        (
            i /
            values.length
        ) *
        Math.PI *
        2;


    const radius =
        46.8;


    const x =
        50 +
        Math.cos(angle) *
        radius;


    const y =
        50 +
        Math.sin(angle) *
        radius;


    const text =
        document.createElementNS(
            svgNS,
            "text"
        );


    text.setAttribute(
        "x",
        x
    );


    text.setAttribute(
        "y",
        y
    );


    text.setAttribute(
        "text-anchor",
        "middle"
    );


    text.setAttribute(
        "dominant-baseline",
        "middle"
    );


    text.textContent =
        values[i];


    numberGroup.appendChild(
        text
    );

}


/* =========================================================
   CANVAS
   ========================================================= */

const ctx =
    canvas.getContext(
        "2d"
    );


let width = 0;

let height = 0;

let cx = 0;

let cy = 0;

let radius = 0;


/* =========================================================
   RESIZE
   ========================================================= */

function resize(){

    const rect =
        core.getBoundingClientRect();


    width =
        rect.width;


    height =
        rect.height;


    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvas.width =
        width * dpr;


    canvas.height =
        height * dpr;


    canvas.style.width =
        width + "px";


    canvas.style.height =
        height + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    cx =
        width / 2;


    cy =
        height / 2;


    radius =
        Math.min(
            width,
            height
        ) / 2;

}


window.addEventListener(
    "resize",
    resize
);


resize();


/* =========================================================
   ORB PARTICLES
   ========================================================= */

const particles = [];


for(
    let i=0;
    i<95;
    i++
){

    particles.push({

        angle:
            Math.random() *
            Math.PI *
            2,

        distance:
            .15 +
            Math.random() *
            .75,

        size:
            .5 +
            Math.random() *
            1.7,

        speed:
            (
                .0005 +
                Math.random() *
                .001
            ),

        brightness:
            .3 +
            Math.random() *
            .7

    });

}


/* =========================================================
   ORB STATE
   ========================================================= */

let audioLevel = 0;

let smoothAudio = 0;

let voiceActive = false;

let recognition = null;


/* =========================================================
   DRAW ORB
   ========================================================= */

function drawOrb(time){

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    smoothAudio +=
        (
            audioLevel -
            smoothAudio
        ) *
        .18;


    const pulse =
        smoothAudio *
        radius *
        .18;


    /* =====================================================
       OUTER ATMOSPHERE
       ===================================================== */

    const atmosphere =
        ctx.createRadialGradient(

            cx,
            cy,
            radius*.12,

            cx,
            cy,
            radius*1.02 + pulse

        );


    atmosphere.addColorStop(
        0,
        "rgba(72,238,255,.20)"
    );


    atmosphere.addColorStop(
        .42,
        "rgba(4,102,127,.13)"
    );


    atmosphere.addColorStop(
        .78,
        "rgba(0,38,51,.18)"
    );


    atmosphere.addColorStop(
        1,
        "rgba(0,10,14,0)"
    );


    ctx.fillStyle =
        atmosphere;


    ctx.beginPath();


    ctx.arc(
        cx,
        cy,
        radius*.98 + pulse,
        0,
        Math.PI*2
    );


    ctx.fill();


    /* =====================================================
       CORE BODY
       ===================================================== */

    const body =
        ctx.createRadialGradient(

            cx -
            radius*.25,

            cy -
            radius*.27,

            radius*.05,

            cx,

            cy,

            radius*.86

        );


    body.addColorStop(
        0,
        "#5cecf7"
    );


    body.addColorStop(
        .12,
        "#1b8d9e"
    );


    body.addColorStop(
        .38,
        "#063b4a"
    );


    body.addColorStop(
        .70,
        "#031b25"
    );


    body.addColorStop(
        1,
        "#01090d"
    );


    ctx.fillStyle =
        body;


    ctx.beginPath();


    ctx.arc(
        cx,
        cy,
        radius*.75 + pulse,
        0,
        Math.PI*2
    );


    ctx.fill();


    /* =====================================================
       GEODE FACETS
       ===================================================== */

    ctx.save();


    ctx.translate(
        cx,
        cy
    );


    ctx.rotate(
        time*.00015
    );


    const facetCount =
        18;


    for(
        let i=0;
        i<facetCount;
        i++
    ){

        const a1 =
            (
                i /
                facetCount
            ) *
            Math.PI *
            2;


        const a2 =
            (
                (i+1) /
                facetCount
            ) *
            Math.PI *
            2;


        const r1 =
            radius *
            (
                .32 +
                Math.sin(
                    i*2.7
                )*.12
            );


        const r2 =
            radius *
            (
                .67 +
                Math.cos(
                    i*1.9
                )*.08
            );


        const rr =
            radius *
            (
                .74 +
                Math.sin(
                    i*1.3
                )*.04
            );


        const gradient =
            ctx.createLinearGradient(
                0,
                -radius,
                radius,
                radius
            );


        if(
            i % 3 === 0
        ){

            gradient.addColorStop(
                0,
                "rgba(92,236,247,.18)"
            );

            gradient.addColorStop(
                1,
                "rgba(0,35,45,.02)"
            );

        }

        else if(
            i % 3 === 1
        ){

            gradient.addColorStop(
                0,
                "rgba(10,133,151,.13)"
            );

            gradient.addColorStop(
                1,
                "rgba(0,18,26,.03)"
            );

        }

        else{

            gradient.addColorStop(
                0,
                "rgba(255,255,255,.055)"
            );

            gradient.addColorStop(
                1,
                "rgba(0,0,0,.02)"
            );

        }


        ctx.fillStyle =
            gradient;


        ctx.beginPath();


        ctx.moveTo(
            0,
            0
        );


        ctx.lineTo(
            Math.cos(a1)*r1,
            Math.sin(a1)*r1
        );


        ctx.lineTo(
            Math.cos(
                (a1+a2)/2
            )*rr,

            Math.sin(
                (a1+a2)/2
            )*rr
        );


        ctx.lineTo(
            Math.cos(a2)*r2,
            Math.sin(a2)*r2
        );


        ctx.closePath();


        ctx.fill();


        /* FACET EDGE */

        ctx.strokeStyle =
            "rgba(112,237,246,.12)";


        ctx.lineWidth =
            .45;


        ctx.stroke();

    }


    ctx.restore();


    /* =====================================================
       CRYSTALLINE CORE
       ===================================================== */

    const crystalRadius =
        radius *
        (
            .18 +
            smoothAudio*.035
        );


    ctx.save();


    ctx.translate(
        cx,
        cy
    );


    ctx.rotate(
        time*.00045
    );


    ctx.beginPath();


    for(
        let i=0;
        i<12;
        i++
    ){

        const angle =
            (
                i /
                12
            ) *
            Math.PI *
            2;


        const r =
            i%2===0
            ? crystalRadius
            : crystalRadius*.68;


        const x =
            Math.cos(angle)*r;


        const y =
            Math.sin(angle)*r;


        if(
            i===0
        ){

            ctx.moveTo(
                x,
                y
            );

        }

        else{

            ctx.lineTo(
                x,
                y
            );

        }

    }


    ctx.closePath();


    const crystal =
        ctx.createRadialGradient(
            -crystalRadius*.25,
            -crystalRadius*.35,
            0,
            0,
            0,
            crystalRadius
        );


    crystal.addColorStop(
        0,
        "rgba(229,255,255,.95)"
    );


    crystal.addColorStop(
        .20,
        "rgba(70,231,244,.76)"
    );


    crystal.addColorStop(
        .60,
        "rgba(5,104,125,.48)"
    );


    crystal.addColorStop(
        1,
        "rgba(0,26,36,.16)"
    );


    ctx.fillStyle =
        crystal;


    ctx.fill();


    ctx.strokeStyle =
        "rgba(179,248,255,.52)";


    ctx.lineWidth =
        .8;


    ctx.stroke();


    ctx.restore();


    /* =====================================================
       INTERNAL ORBITS
       ===================================================== */

    ctx.save();


    ctx.translate(
        cx,
        cy
    );


    for(
        let i=0;
        i<3;
        i++
    ){

        ctx.save();


        ctx.rotate(
            time*.00025 *
            (
                i%2===0
                ? 1
                : -1
            )
            +
            i*.9
        );


        ctx.scale(
            1,
            .32 +
            i*.18
        );


        ctx.beginPath();


        ctx.arc(
            0,
            0,
            radius*
            (
                .27 +
                i*.11
            ),
            0,
            Math.PI*2
        );


        ctx.strokeStyle =
            i===1
            ? "rgba(200,162,83,.55)"
            : "rgba(99,232,245,.35)";


        ctx.lineWidth =
            .65;


        ctx.stroke();


        ctx.restore();

    }


    ctx.restore();


    /* =====================================================
       PARTICLES
       ===================================================== */

    for(
        const p of particles
    ){

        p.angle +=
            p.speed *
            (
                1 +
                smoothAudio*4
            );


        const px =
            cx +
            Math.cos(
                p.angle
            ) *
            radius *
            p.distance;


        const py =
            cy +
            Math.sin(
                p.angle
            ) *
            radius *
            p.distance;


        const alpha =
            p.brightness *
            (
                .35 +
                smoothAudio*.8
            );


        ctx.fillStyle =
            `rgba(175,248,255,${alpha})`;


        ctx.beginPath();


        ctx.arc(
            px,
            py,
            p.size,
            0,
            Math.PI*2
        );


        ctx.fill();

    }


    /* =====================================================
       VOICE ENERGY GLOW
       ===================================================== */

    if(
        smoothAudio > .02
    ){

        const glow =
            ctx.createRadialGradient(
                cx,
                cy,
                radius*.35,

                cx,
                cy,
                radius*
                (
                    .65 +
                    smoothAudio*.8
                )
            );


        glow.addColorStop(
            0,
            `rgba(
                25,
                232,
                255,
                ${smoothAudio*.18}
            )`
        );


        glow.addColorStop(
            1,
            "rgba(0,80,100,0)"
        );


        ctx.fillStyle =
            glow;


        ctx.beginPath();


        ctx.arc(
            cx,
            cy,
            radius,
            0,
            Math.PI*2
        );


        ctx.fill();

    }


    /* =====================================================
       CORE PULSE
       ===================================================== */

    const scale =
        1 +
        smoothAudio*.075;


    core.style.transform =
        `scale(${scale})`;


    halo.style.transform =
        `translate(-50%,-50%)
         scale(${1 + smoothAudio*.22})`;

}


/* =========================================================
   ANIMATION
   ========================================================= */

let animationStart =
    performance.now();


function animate(){

    const now =
        performance.now();


    drawOrb(
        now -
        animationStart
    );


    updateVisualizer();


    requestAnimationFrame(
        animate
    );

}


animate();


/* =========================================================
   MICROPHONE
   ========================================================= */

let audioContext = null;

let analyser = null;

let microphoneStream = null;

let microphoneSource = null;

let audioData = null;


/* =========================================================
   START AUDIO ANALYSIS
   ========================================================= */

async function startMicrophone(){

    try{

        microphoneStream =
            await navigator.mediaDevices.getUserMedia({

                audio:true

            });


        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        microphoneSource =
            audioContext.createMediaStreamSource(
                microphoneStream
            );


        analyser =
            audioContext.createAnalyser();


        analyser.fftSize =
            256;


        analyser.smoothingTimeConstant =
            .78;


        audioData =
            new Uint8Array(
                analyser.fftSize
            );


        microphoneSource.connect(
            analyser
        );


        voiceActive =
            true;


        voiceState.textContent =
            "MICROPHONE ACTIF";


        voiceState.classList.add(
            "active"
        );


        coreLabel.textContent =
            "LISTENING";


        listenButton.innerHTML =
            "MICRO<br>ACTIF";


    }

    catch(error){

        console.error(
            error
        );


        voiceState.textContent =
            "ACCÈS MICROPHONE REFUSÉ";


        transcription.textContent =
            "Autorise le microphone dans Safari pour utiliser la voix.";

    }

}


/* =========================================================
   AUDIO LEVEL
   ========================================================= */

function updateAudioLevel(){

    if(
        !analyser ||
        !audioData
    ){

        audioLevel *= .92;

        return;

    }


    analyser.getByteTimeDomainData(
        audioData
    );


    let sum = 0;


    for(
        let i=0;
        i<audioData.length;
        i++
    ){

        const value =
            (
                audioData[i] -
                128
            ) / 128;


        sum +=
            value *
            value;

    }


    const rms =
        Math.sqrt(
            sum /
            audioData.length
        );


    audioLevel =
        Math.min(
            1,
            rms * 5.5
        );

}


/* =========================================================
   VISUALIZER
   ========================================================= */

function updateVisualizer(){

    updateAudioLevel();


    bars.forEach(
        (
            bar,
            index
        ) => {

            const wave =
                Math.sin(
                    performance.now()*.006 +
                    index*.65
                );


            const height =
                4 +
                audioLevel *
                (
                    18 +
                    wave*4
                );


            bar.style.height =
                `${Math.max(
                    3,
                    height
                )}px`;

        }
    );

}


/* =========================================================
   SPEECH RECOGNITION
   ========================================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if(
    SpeechRecognition
){

    recognition =
        new SpeechRecognition();


    recognition.lang =
        "fr-FR";


    recognition.continuous =
        true;


    recognition.interimResults =
        true;


    recognition.maxAlternatives =
        1;


    recognition.onstart =
        () => {

            voiceActive =
                true;


            voiceState.textContent =
                "ÉCOUTE EN COURS";


            voiceState.classList.add(
                "active"
            );


            coreLabel.textContent =
                "LISTENING";

        };


    recognition.onresult =
        event => {

            let finalText =
                "";


            let interimText =
                "";


            for(
                let i =
                    event.resultIndex;

                i <
                    event.results.length;

                i++
            ){

                const result =
                    event.results[i];


                if(
                    result.isFinal
                ){

                    finalText +=
                        result[0].transcript;

                }

                else{

                    interimText +=
                        result[0].transcript;

                }

            }


            const text =
                (
                    finalText +
                    interimText
                ).trim();


            if(
                text
            ){

                transcription.textContent =
                    text;


                transcription.classList.remove(
                    "empty"
                );

            }

        };


    recognition.onerror =
        event => {

            console.log(
                "Speech error:",
                event.error
            );


            voiceState.textContent =
                "VOICE SYSTEM READY";

        };


    recognition.onend =
        () => {

            if(
                voiceActive
            ){

                try{

                    recognition.start();

                }

                catch(
                    error
                ){

                    console.log(
                        error
                    );

                }

            }

        };

}


/* =========================================================
   START VOICE
   ========================================================= */

async function startVoice(){

    await startMicrophone();


    if(
        !recognition
    ){

        transcription.textContent =
            "La reconnaissance vocale Web n'est pas disponible dans ce navigateur.";

        return;

    }


    try{

        recognition.start();

    }

    catch(
        error
    ){

        console.log(
            error
        );

    }

}


/* =========================================================
   STOP VOICE
   ========================================================= */

function stopVoice(){

    voiceActive =
        false;


    if(
        recognition
    ){

        try{

            recognition.stop();

        }

        catch(
            error
        ){

            console.log(
                error
            );

        }

    }


    if(
        microphoneStream
    ){

        microphoneStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

    }


    voiceState.textContent =
        "VOICE SYSTEM READY";


    voiceState.classList.remove(
        "active"
    );


    coreLabel.textContent =
        "STANDBY";


    listenButton.innerHTML =
        "ACTIVER<br>MICRO";

}


/* =========================================================
   MICROPHONE BUTTON
   ========================================================= */

listenButton.addEventListener(
    "click",
    async () => {

        if(
            voiceActive
        ){

            stopVoice();

        }

        else{

            await startVoice();

        }

    }
);


/* =========================================================
   SHORTCUT CONFIGURATION
   =========================================================

   IMPORTANT:

   Remplace cette valeur par le nom
   EXACT de ton raccourci Apple.

   Exemple:

   "Jarvis"

   ========================================================= */

const SHORTCUT_NAME =
    "Jarvis";


/* =========================================================
   SEND TO SHORTCUTS
   ========================================================= */

function sendToShortcuts(){

    const text =
        transcription.textContent.trim();


    if(
        !text ||
        text ===
        "En attente de commande vocale…"
    ){

        return;

    }


    const encoded =
        encodeURIComponent(
            text
        );


    const url =
        "shortcuts://run-shortcut" +
        "?name=" +
        encodeURIComponent(
            SHORTCUT_NAME
        ) +
        "&input=" +
        encoded;


    window.location.href =
        url;

}


/* =========================================================
   SHORTCUT BUTTON
   ========================================================= */

shortcutButton.addEventListener(
    "click",
    sendToShortcuts
);


/* =========================================================
   SPEECH PANEL
   ========================================================= */

voiceButton.addEventListener(
    "click",
    () => {

        speechPanel.classList.toggle(
            "visible"
        );


        if(
            speechPanel.classList.contains(
                "visible"
            )
        ){

            speechText.focus();

        }

    }
);


/* =========================================================
   TEXT TO SPEECH
   ========================================================= */

function speakText(){

    const text =
        speechText.value.trim();


    if(
        !text
    ){

        return;

    }


    if(
        !("speechSynthesis" in window)
    ){

        alert(
            "La synthèse vocale n'est pas disponible dans ce navigateur."
        );

        return;

    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "fr-FR";


    utterance.rate =
        .94;


    utterance.pitch =
        .92;


    utterance.volume =
        1;


    utterance.onstart =
        () => {

            voiceState.textContent =
                "JARVIS PARLE";


            voiceState.classList.add(
                "active"
            );


            coreLabel.textContent =
                "SPEAKING";

        };


    utterance.onend =
        () => {

            voiceState.textContent =
                "VOICE SYSTEM READY";


            voiceState.classList.remove(
                "active"
            );


            coreLabel.textContent =
                "STANDBY";

        };


    window.speechSynthesis.speak(
        utterance
    );

}


/* =========================================================
   SPEAK BUTTON
   ========================================================= */

speakButton.addEventListener(
    "click",
    speakText
);


/* =========================================================
   STOP SPEECH
   ========================================================= */

stopButton.addEventListener(
    "click",
    () => {

        window.speechSynthesis.cancel();


        voiceState.textContent =
            "VOICE SYSTEM READY";


        voiceState.classList.remove(
            "active"
        );


        coreLabel.textContent =
            "STANDBY";

    }
);


/* =========================================================
   AUTOMATIC KEYBOARD / DESKTOP TEST
   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.code ===
            "Space"
        ){

            event.preventDefault();


            if(
                voiceActive
            ){

                stopVoice();

            }

            else{

                startVoice();

            }

        }

    }
);


/* =========================================================
   INITIAL STATE
   ========================================================= */

transcription.textContent =
    "En attente de commande vocale…";


transcription.classList.add(
    "empty"
);

</script>
