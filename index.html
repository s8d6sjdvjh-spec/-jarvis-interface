<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>JARVIS — Precision Gyrotourbillon</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#010609;
    color:#d9f7ff;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

#app{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(0,91,112,.14),
            transparent 32%
        ),
        #010609;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

#grid{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:.28;
    background-image:
        linear-gradient(rgba(35,130,150,.13) 1px,transparent 1px),
        linear-gradient(90deg,rgba(35,130,150,.13) 1px,transparent 1px);
    background-size:44px 44px;
    mask-image:linear-gradient(
        to bottom,
        black 0%,
        rgba(0,0,0,.85) 70%,
        transparent 100%
    );
}

#header{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:88px;
    padding:30px 34px 0;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    pointer-events:none;
    z-index:5;
}

.logo{
    font-size:20px;
    letter-spacing:.48em;
    font-weight:300;
    white-space:nowrap;
}

.status{
    display:flex;
    gap:28px;
    font-size:10px;
    letter-spacing:.32em;
    color:rgba(185,226,236,.58);
}

.status span{
    display:flex;
    align-items:center;
    gap:9px;
}

.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#08d8ff;
    box-shadow:
        0 0 8px #08d8ff,
        0 0 18px rgba(8,216,255,.5);
}

#label{
    position:absolute;
    top:116px;
    left:50%;
    transform:translateX(-50%);
    z-index:5;
    white-space:nowrap;
    color:rgba(150,214,226,.48);
    font-size:10px;
    letter-spacing:.42em;
    pointer-events:none;
}

#cards{
    position:absolute;
    left:4.8%;
    right:4.8%;
    bottom:5.5%;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    z-index:6;
    pointer-events:none;
}

.card{
    min-height:112px;
    padding:20px 20px 17px;
    border:1px solid rgba(0,188,226,.42);
    background:
        linear-gradient(
            135deg,
            rgba(4,28,37,.68),
            rgba(1,11,16,.48)
        );
    box-shadow:
        inset 0 0 24px rgba(0,155,190,.04),
        0 0 20px rgba(0,100,130,.025);
    backdrop-filter:blur(3px);
}

.card-title{
    font-size:10px;
    letter-spacing:.42em;
    color:#66d2e6;
    margin-bottom:14px;
}

.card-value{
    font-size:35px;
    line-height:1;
    font-weight:300;
    letter-spacing:.03em;
}

.card-sub{
    margin-top:10px;
    font-size:10px;
    letter-spacing:.18em;
    color:rgba(168,210,220,.43);
}

@media(max-width:600px){

    #header{
        padding:28px 28px 0;
        height:75px;
    }

    .logo{
        font-size:18px;
        letter-spacing:.43em;
    }

    .status{
        gap:13px;
        font-size:8px;
        letter-spacing:.22em;
    }

    #label{
        top:100px;
        font-size:8px;
        letter-spacing:.30em;
    }

    #cards{
        bottom:4.5%;
        left:6%;
        right:6%;
        gap:12px;
    }

    .card{
        min-height:105px;
        padding:17px 15px 14px;
    }

    .card-title{
        font-size:8px;
        margin-bottom:12px;
    }

    .card-value{
        font-size:31px;
    }

    .card-sub{
        font-size:8px;
    }
}
</style>
</head>

<body>

<div id="app">

    <div id="grid"></div>

    <div id="header">
        <div class="logo">JARVIS</div>

        <div class="status">
            <span><i class="dot"></i>ONLINE</span>
            <span><i class="dot"></i>SECURE</span>
            <span><i class="dot"></i>VOICE</span>
        </div>
    </div>

    <div id="label">
        GYROTOURBILLON&nbsp;&nbsp;·&nbsp;&nbsp;PRECISION CORE&nbsp;&nbsp;·&nbsp;&nbsp;3 AXIS
    </div>

    <div id="cards">

        <div class="card">
            <div class="card-title">MAISON</div>
            <div class="card-value">03</div>
            <div class="card-sub">DISPOSITIFS ACTIFS</div>
        </div>

        <div class="card">
            <div class="card-title">MÉTÉO</div>
            <div class="card-value">18°</div>
            <div class="card-sub">CONDITIONS STABLES</div>
        </div>

        <div class="card">
            <div class="card-title">SYSTÈME</div>
            <div class="card-value">82%</div>
            <div class="card-sub">PERFORMANCE</div>
        </div>

        <div class="card">
            <div class="card-title">ACTIVITÉ</div>
            <div class="card-value">12</div>
            <div class="card-sub">ÉVÉNEMENTS RÉCENTS</div>
        </div>

    </div>

</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


/* =========================================================
   SCÈNE
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x010609);

const camera = new THREE.PerspectiveCamera(
    38,
    innerWidth / innerHeight,
    0.1,
    100
);

camera.position.set(
    0,
    0,
    8.8
);

camera.lookAt(0,0,0);


/* =========================================================
   RENDERER
========================================================= */

const renderer = new THREE.WebGLRenderer({
    antialias:true,
    alpha:true,
    powerPreference:"high-performance"
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,1.8)
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;

document
    .getElementById("app")
    .appendChild(renderer.domElement);


/* =========================================================
   LUMIÈRES
========================================================= */

const ambient = new THREE.AmbientLight(
    0x9bd7e5,
    1.15
);

scene.add(ambient);


const cyanLight = new THREE.PointLight(
    0x23dfff,
    15,
    12
);

cyanLight.position.set(
    -3.5,
    3.2,
    4.5
);

scene.add(cyanLight);


const whiteLight = new THREE.PointLight(
    0xe8fbff,
    18,
    10
);

whiteLight.position.set(
    3.5,
    2.4,
    3.8
);

scene.add(whiteLight);


const warmLight = new THREE.PointLight(
    0xffb14b,
    8,
    7
);

warmLight.position.set(
    -2,
    -2,
    2.5
);

scene.add(warmLight);


/* =========================================================
   MATÉRIAUX
========================================================= */

const metalSilver =
    new THREE.MeshPhysicalMaterial({
        color:0x9caeb2,
        metalness:0.96,
        roughness:0.18,
        clearcoat:0.72,
        clearcoatRoughness:0.13
    });


const metalDark =
    new THREE.MeshPhysicalMaterial({
        color:0x182329,
        metalness:0.98,
        roughness:0.22,
        clearcoat:0.55,
        clearcoatRoughness:0.17
    });


const steelBright =
    new THREE.MeshPhysicalMaterial({
        color:0xd6e8ea,
        metalness:1,
        roughness:0.12,
        clearcoat:0.9,
        clearcoatRoughness:0.08
    });


const brass =
    new THREE.MeshPhysicalMaterial({
        color:0xa76c24,
        metalness:0.96,
        roughness:0.22,
        clearcoat:0.72,
        clearcoatRoughness:0.12
    });


const blackSteel =
    new THREE.MeshPhysicalMaterial({
        color:0x080d10,
        metalness:1,
        roughness:0.25,
        clearcoat:0.65
    });


const ruby =
    new THREE.MeshPhysicalMaterial({
        color:0x9b001e,
        metalness:0.05,
        roughness:0.12,
        transmission:0.42,
        thickness:0.7,
        ior:1.65,
        clearcoat:1,
        clearcoatRoughness:0.06
    });


/* =========================================================
   GROUPE PRINCIPAL
========================================================= */

const instrument = new THREE.Group();

instrument.position.set(
    0,
    0.15,
    0
);

instrument.scale.setScalar(
    innerWidth < 600 ? 1.0 : 1.13
);

scene.add(instrument);


/* =========================================================
   COURONNES HOLOGRAPHIQUES
========================================================= */

const holoGroup = new THREE.Group();

instrument.add(holoGroup);


function holoCircle(radius, opacity=0.55){

    const pts = [];

    const segments = 256;

    for(let i=0;i<=segments;i++){

        const a =
            i / segments * Math.PI * 2;

        pts.push(
            new THREE.Vector3(
                Math.cos(a)*radius,
                Math.sin(a)*radius,
                -0.03
            )
        );
    }

    const geometry =
        new THREE.BufferGeometry()
        .setFromPoints(pts);

    const material =
        new THREE.LineBasicMaterial({
            color:0x3ddfff,
            transparent:true,
            opacity
        });

    const line =
        new THREE.Line(
            geometry,
            material
        );

    holoGroup.add(line);

    return line;
}


/* grands anneaux */

[
    3.02,
    2.82,
    2.62,
    2.43,
    2.24
].forEach((r,i)=>{
    holoCircle(
        r,
        i===0 ? .42 : .27
    );
});


/* =========================================================
   GRADUATIONS RADIALES
========================================================= */

function createPrecisionTicks(
    radius,
    count,
    innerLength,
    outerLength,
    width,
    opacity
){

    const group = new THREE.Group();

    for(let i=0;i<count;i++){

        const angle =
            i / count * Math.PI * 2;

        /*
          Longueurs irrégulières :
          certaines courtes,
          certaines moyennes,
          quelques longues.
        */

        const pattern =
            i % 19 === 0 ? outerLength :
            i % 7 === 0 ? outerLength * .72 :
            i % 3 === 0 ? outerLength * .48 :
            outerLength * .28;

        const rOuter = radius;
        const rInner =
            radius - innerLength - pattern;

        const mid =
            (rOuter+rInner)/2;

        const length =
            rOuter-rInner;

        const geo =
            new THREE.PlaneGeometry(
                width,
                length
            );

        const mat =
            new THREE.MeshBasicMaterial({
                color:0x50dff7,
                transparent:true,
                opacity,
                side:THREE.DoubleSide
            });

        const tick =
            new THREE.Mesh(
                geo,
                mat
            );

        /*
          Le tick est vertical au départ.
          On le positionne radialement.
        */

        tick.position.set(
            Math.cos(angle)*mid,
            Math.sin(angle)*mid,
            0
        );

        tick.rotation.z =
            angle + Math.PI/2;

        group.add(tick);
    }

    holoGroup.add(group);

    return group;
}


/*
   Les graduations sont nombreuses,
   fines et dirigées vers le centre.
*/

createPrecisionTicks(
    3.01,
    144,
    .045,
    .16,
    .011,
    .38
);

createPrecisionTicks(
    2.80,
    112,
    .05,
    .20,
    .014,
    .48
);

createPrecisionTicks(
    2.59,
    96,
    .06,
    .25,
    .012,
    .32
);

createPrecisionTicks(
    2.39,
    80,
    .05,
    .18,
    .018,
    .42
);


/* =========================================================
   PETITS SYMBOLES TECHNIQUES
========================================================= */

function addSymbol(radius, angle, type){

    const g = new THREE.Group();

    const size =
        type === 0 ? .045 :
        type === 1 ? .065 :
        .035;

    const geometry =
        type === 0
        ? new THREE.CircleGeometry(size,8)
        : new THREE.BoxGeometry(
            size,
            size*.42,
            .008
        );

    const material =
        new THREE.MeshBasicMaterial({
            color:
                type === 1
                ? 0x82ecff
                : 0x4ec8df,
            transparent:true,
            opacity:.55
        });

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.position.set(
        Math.cos(angle)*radius,
        Math.sin(angle)*radius,
        .015
    );

    mesh.rotation.z =
        angle;

    g.add(mesh);

    holoGroup.add(g);
}


for(let i=0;i<42;i++){

    const radius =
        [2.97,2.74,2.50,2.31][i%4];

    const angle =
        i / 42 * Math.PI*2 +
        (i%2)*.035;

    addSymbol(
        radius,
        angle,
        i%5===0 ? 1 :
        i%3===0 ? 2 : 0
    );
}


/* =========================================================
   COURONNES MÉTALLIQUES INTERNES
   Plus proches du gyrotourbillon.
========================================================= */

function makeBeveledRing(
    outerRadius,
    innerRadius,
    depth,
    material,
    bevel=.035
){

    const shape =
        new THREE.Shape();

    shape.absarc(
        0,
        0,
        outerRadius,
        0,
        Math.PI*2,
        false
    );

    const hole =
        new THREE.Path();

    hole.absarc(
        0,
        0,
        innerRadius,
        0,
        Math.PI*2,
        true
    );

    shape.holes.push(hole);

    const geometry =
        new THREE.ExtrudeGeometry(
            shape,
            {
                depth,
                bevelEnabled:true,
                bevelSegments:3,
                bevelSize:bevel,
                bevelThickness:bevel
            }
        );

    geometry.center();

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    return mesh;
}


const metalRings = new THREE.Group();

instrument.add(metalRings);


/*
   Ces anneaux sont volontairement proches
   du mécanisme central.
*/

const ringA =
    makeBeveledRing(
        2.10,
        1.98,
        .085,
        blackSteel,
        .025
    );

metalRings.add(ringA);


const ringB =
    makeBeveledRing(
        1.88,
        1.76,
        .10,
        metalSilver,
        .032
    );

ringB.position.z=.035;

metalRings.add(ringB);


const ringC =
    makeBeveledRing(
        1.67,
        1.57,
        .075,
        blackSteel,
        .022
    );

ringC.position.z=.07;

metalRings.add(ringC);


/* =========================================================
   GRADUATIONS MÉCANIQUES SUR LA COURONNE
========================================================= */

function mechanicalTicks(
    radius,
    count
){

    const group =
        new THREE.Group();

    for(let i=0;i<count;i++){

        const a =
            i/count*Math.PI*2;

        const major =
            i%12===0;

        const length =
            major ? .105 :
            i%4===0 ? .07 :
            .043;

        const width =
            major ? .026 :
            .014;

        const geo =
            new THREE.BoxGeometry(
                width,
                length,
                .025
            );

        const mat =
            major
            ? steelBright
            : metalDark;

        const tick =
            new THREE.Mesh(
                geo,
                mat
            );

        tick.position.set(
            Math.cos(a)*radius,
            Math.sin(a)*radius,
            .14
        );

        /*
           Toujours orienté vers le centre.
        */

        tick.rotation.z =
            a + Math.PI/2;

        group.add(tick);
    }

    metalRings.add(group);
}


mechanicalTicks(1.92,96);


/* =========================================================
   GYROTOURBILLON
========================================================= */

const gyro =
    new THREE.Group();

gyro.scale.setScalar(.72);

instrument.add(gyro);


/* =========================================================
   AXE CENTRAL
========================================================= */

const axleGeo =
    new THREE.CylinderGeometry(
        .035,
        .035,
        1.8,
        16
    );

const axle =
    new THREE.Mesh(
        axleGeo,
        steelBright
    );

axle.rotation.z =
    Math.PI/2;

gyro.add(axle);


/* =========================================================
   CRÉATION DES CAGES USINÉES
========================================================= */

function createGyroRing(
    radius,
    thickness,
    depth,
    material
){

    const shape =
        new THREE.Shape();

    shape.absarc(
        0,
        0,
        radius,
        0,
        Math.PI*2,
        false
    );

    const hole =
        new THREE.Path();

    hole.absarc(
        0,
        0,
        radius-thickness,
        0,
        Math.PI*2,
        true
    );

    shape.holes.push(hole);

    const geometry =
        new THREE.ExtrudeGeometry(
            shape,
            {
                depth,
                bevelEnabled:true,
                bevelSegments:4,
                bevelSize:.035,
                bevelThickness:.035,
                curveSegments:64
            }
        );

    geometry.center();

    return new THREE.Mesh(
        geometry,
        material
    );
}


/* =========================================================
   AXE X
========================================================= */

const axisX =
    new THREE.Group();

axisX.rotation.x =
    Math.PI/2;

gyro.add(axisX);

const xRing =
    createGyroRing(
        1.02,
        .105,
        .13,
        metalSilver
    );

axisX.add(xRing);


/* =========================================================
   AXE Y
========================================================= */

const axisY =
    new THREE.Group();

axisY.rotation.y =
    Math.PI/2;

gyro.add(axisY);

const yRing =
    createGyroRing(
        .82,
        .09,
        .115,
        steelBright
    );

axisY.add(yRing);


/* =========================================================
   AXE Z
========================================================= */

const axisZ =
    new THREE.Group();

gyro.add(axisZ);

const zRing =
    createGyroRing(
        .64,
        .075,
        .10,
        brass
    );

axisZ.add(zRing);


/* =========================================================
   PONTS MÉCANIQUES
========================================================= */

function bridge(
    length,
    width,
    material,
    rotation
){

    const geo =
        new THREE.BoxGeometry(
            length,
            width,
            .055
        );

    const mesh =
        new THREE.Mesh(
            geo,
            material
        );

    mesh.rotation.z =
        rotation;

    return mesh;
}


const bridgeX =
    bridge(
        1.62,
        .075,
        steelBright,
        0
    );

axisX.add(bridgeX);


const bridgeY =
    bridge(
        1.35,
        .065,
        metalSilver,
        Math.PI/2
    );

axisY.add(bridgeY);


const bridgeZ =
    bridge(
        1.08,
        .055,
        brass,
        Math.PI/4
    );

axisZ.add(bridgeZ);


/* =========================================================
   MICRO VIS
========================================================= */

function screw(
    radius,
    angle,
    parent,
    size=.052
){

    const geo =
        new THREE.CylinderGeometry(
            size,
            size,
            .045,
            16
        );

    const mesh =
        new THREE.Mesh(
            geo,
            steelBright
        );

    mesh.rotation.x =
        Math.PI/2;

    mesh.position.set(
        Math.cos(angle)*radius,
        Math.sin(angle)*radius,
        .10
    );

    parent.add(mesh);
}


for(let i=0;i<8;i++){

    screw(
        1.02,
        i/8*Math.PI*2,
        axisX,
        i%2 ? .045 : .06
    );
}


for(let i=0;i<6;i++){

    screw(
        .82,
        i/6*Math.PI*2+.15,
        axisY,
        .043
    );
}


/* =========================================================
   RUBIS CENTRAL
========================================================= */

const rubyGroup =
    new THREE.Group();

gyro.add(rubyGroup);


const rubyGeometry =
    new THREE.SphereGeometry(
        .18,
        48,
        32
    );

const rubyMesh =
    new THREE.Mesh(
        rubyGeometry,
        ruby
    );

rubyGroup.add(rubyMesh);


/* petit noyau lumineux */

const rubyCore =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .055,
            24,
            16
        ),
        new THREE.MeshBasicMaterial({
            color:0xff174f
        })
    );

rubyCore.position.z=.08;

rubyGroup.add(rubyCore);


/* =========================================================
   MICRO DÉTAILS SUR LES CAGES
========================================================= */

function addMicroMarkers(
    parent,
    radius,
    count
){

    for(let i=0;i<count;i++){

        const a =
            i/count*Math.PI*2;

        const marker =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .018,
                    i%4===0 ? .10 : .055,
                    .025
                ),
                i%4===0
                ? steelBright
                : metalDark
            );

        marker.position.set(
            Math.cos(a)*radius,
            Math.sin(a)*radius,
            .095
        );

        marker.rotation.z =
            a + Math.PI/2;

        parent.add(marker);
    }
}


addMicroMarkers(
    axisX,
    1.09,
    72
);

addMicroMarkers(
    axisY,
    .89,
    54
);

addMicroMarkers(
    axisZ,
    .70,
    42
);


/* =========================================================
   ROTATION INDÉPENDANTE DES TROIS AXES
========================================================= */

let clock =
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );

    const t =
        clock.getElapsedTime();

    /*
       Trois vitesses réellement différentes.
       Les mouvements ne sont donc jamais synchronisés.
    */

    axisX.rotation.z =
        t * 0.95;

    axisY.rotation.x =
        t * 1.42;

    axisZ.rotation.y =
        t * 2.05;

    /*
       Rotation lente supplémentaire
       de la structure générale.
    */

    gyro.rotation.z =
        t * .13;

    /*
       Très légère rotation des couronnes
       holographiques.
    */

    holoGroup.rotation.z =
        t * .018;

    /*
       Micro oscillation de caméra.
       Très faible : uniquement pour donner
       une impression de profondeur.
    */

    camera.position.x =
        Math.sin(t*.18)*.045;

    camera.position.y =
        Math.cos(t*.15)*.035;

    camera.lookAt(
        0,
        0,
        0
    );

    renderer.render(
        scene,
        camera
    );
}


animate();


/* =========================================================
   RESPONSIVE
========================================================= */

function resize(){

    camera.aspect =
        innerWidth / innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            1.8
        )
    );

    instrument.scale.setScalar(
        innerWidth < 600 ? 1.0 : 1.13
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();

</script>

</body>
</html>
