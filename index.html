<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>JARVIS — Voice Core</title>

<style>
:root{
    --bg:#020a0f;
    --grid:#0b2029;
    --cyan:#21e7ff;
    --cyan2:#72f4ff;
    --cyan3:#0b91ad;
    --gold:#b99445;
    --white:#d9fbff;
    --muted:#507985;
    --red:#ff536b;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
    color:var(--white);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
}

body{
    position:relative;
}

/* ---------------------------------------------------------
   BACKGROUND
--------------------------------------------------------- */

#background{
    position:fixed;
    inset:0;
    z-index:0;
    background:
        radial-gradient(
            ellipse at 50% 48%,
            rgba(0,95,115,.16),
            transparent 45%
        ),
        linear-gradient(
            rgba(3,17,23,.88),
            rgba(1,8,12,.96)
        );
}

#background::before{
    content:"";
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(
            rgba(38,125,145,.12) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(38,125,145,.12) 1px,
            transparent 1px
        );

    background-size:
        32px 32px,
        32px 32px;

    opacity:.8;
}

#background::after{
    content:"";
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(
            rgba(65,182,204,.045) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(65,182,204,.045) 1px,
            transparent 1px
        );

    background-size:
        8px 8px,
        8px 8px;
}

/* ---------------------------------------------------------
   APPLICATION
--------------------------------------------------------- */

#app{
    position:relative;
    z-index:2;

    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;

    padding:
        max(18px, env(safe-area-inset-top))
        18px
        max(14px, env(safe-area-inset-bottom));
}

/* ---------------------------------------------------------
   HEADER
--------------------------------------------------------- */

header{
    flex:0 0 auto;

    display:flex;
    align-items:center;
    justify-content:space-between;

    height:72px;
}

.brand{
    font-size:31px;
    font-weight:300;
    letter-spacing:.31em;
    white-space:nowrap;
}

.status{
    display:flex;
    align-items:center;
    gap:18px;

    font-size:10px;
    letter-spacing:.28em;
    color:#63818b;
    white-space:nowrap;
}

.status-item{
    display:flex;
    align-items:center;
    gap:7px;
}

.status-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--cyan);

    box-shadow:
        0 0 6px var(--cyan),
        0 0 16px rgba(33,231,255,.65);
}

/* ---------------------------------------------------------
   TITLES
--------------------------------------------------------- */

.heading{
    text-align:center;
    margin-top:15px;
    flex:0 0 auto;
}

.heading-main{
    font-size:12px;
    letter-spacing:.38em;
    color:#6b9aa5;
    white-space:nowrap;
}

.heading-sub{
    margin-top:15px;
    font-size:8px;
    letter-spacing:.42em;
    color:#355863;
}

/* ---------------------------------------------------------
   CORE AREA
--------------------------------------------------------- */

#coreArea{
    position:relative;

    width:100%;
    flex:1 1 auto;

    min-height:0;

    display:flex;
    align-items:center;
    justify-content:center;
}

#hud{
    position:absolute;

    width:min(100vw, 720px);
    height:min(100vw, 720px);

    max-width:720px;
    max-height:720px;

    transform-origin:center;
}

#hudCanvas{
    width:100%;
    height:100%;
    display:block;
}

/* ---------------------------------------------------------
   VOICE STATUS
--------------------------------------------------------- */

#voiceStatus{
    position:absolute;

    left:50%;
    bottom:3%;

    transform:translateX(-50%);

    width:92%;

    text-align:center;

    border-top:1px solid rgba(35,216,240,.38);
    border-bottom:1px solid rgba(35,216,240,.28);

    padding:12px 0;

    color:#6f9da8;

    font-size:9px;
    letter-spacing:.36em;

    pointer-events:none;
}

#voiceText{
    margin-top:7px;

    font-size:18px;
    letter-spacing:.12em;

    color:#c8f7fc;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* ---------------------------------------------------------
   AUDIO METER
--------------------------------------------------------- */

#audioMeter{
    position:absolute;

    left:50%;
    bottom:15%;

    transform:translateX(-50%);

    display:flex;
    align-items:flex-end;

    gap:3px;

    height:30px;
}

.audio-bar{
    width:3px;
    height:6px;

    background:var(--cyan);

    box-shadow:
        0 0 7px rgba(33,231,255,.9);

    transition:
        height .045s linear;
}

/* ---------------------------------------------------------
   CONTROLS
--------------------------------------------------------- */

.controls{
    flex:0 0 auto;

    display:grid;
    grid-template-columns:
        repeat(3,1fr);

    gap:12px;

    margin-top:8px;
}

button{
    appearance:none;
    border:1px solid rgba(33,231,255,.65);

    background:
        linear-gradient(
            180deg,
            rgba(11,43,52,.54),
            rgba(3,17,23,.82)
        );

    color:#bfeff4;

    min-height:66px;

    font-family:inherit;

    letter-spacing:.19em;
    font-size:9px;

    position:relative;

    overflow:hidden;

    transition:
        transform .15s ease,
        box-shadow .15s ease,
        border-color .15s ease;
}

button::before{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(33,231,255,.08),
            transparent
        );

    transform:translateX(-100%);
}

button:active{
    transform:scale(.97);

    border-color:var(--cyan);

    box-shadow:
        0 0 18px rgba(33,231,255,.25);
}

button:active::before{
    animation:sweep .4s ease;
}

@keyframes sweep{
    to{
        transform:translateX(100%);
    }
}

.button-icon{
    display:block;

    font-size:18px;

    margin-bottom:7px;

    color:var(--cyan);
}

#micButton.active{
    border-color:#61f5ff;

    box-shadow:
        0 0 20px rgba(33,231,255,.25),
        inset 0 0 25px rgba(33,231,255,.08);
}

/* ---------------------------------------------------------
   SMALL SCREENS
--------------------------------------------------------- */

@media(max-height:700px){

    header{
        height:58px;
    }

    .brand{
        font-size:25px;
    }

    .heading{
        margin-top:5px;
    }

    .heading-sub{
        margin-top:8px;
    }

    #voiceStatus{
        bottom:1%;
        padding:7px;
    }

    #audioMeter{
        bottom:12%;
    }

    button{
        min-height:55px;
    }
}

@media(max-width:390px){

    .status{
        gap:9px;
        font-size:8px;
    }

    .brand{
        font-size:25px;
    }

    .heading-main{
        font-size:9px;
        letter-spacing:.27em;
    }

    .heading-sub{
        font-size:6px;
    }
}
</style>
</head>

<body>

<div id="background"></div>

<div id="app">

<header>

    <div class="brand">
        JARVIS
    </div>

    <div class="status">

        <div class="status-item">
            <span class="status-dot"></span>
            ONLINE
        </div>

        <div class="status-item">
            <span class="status-dot"></span>
            SECURE
        </div>

        <div class="status-item">
            <span class="status-dot"></span>
            VOICE
        </div>

    </div>

</header>


<div class="heading">

    <div class="heading-main">
        VOICE CORE · CRYSTALLINE MATRIX · 3 AXIS
    </div>

    <div class="heading-sub">
        HOLOGRAPHIC CONCENTRIC SYSTEM · AUDIO REACTIVE
    </div>

</div>


<main id="coreArea">

    <div id="hud">
        <canvas id="hudCanvas"></canvas>
    </div>


    <div id="audioMeter"></div>


    <div id="voiceStatus">

        <div>
            VOICE SYSTEM · <span id="systemState">READY</span>
        </div>

        <div id="voiceText">
            EN ATTENTE DE COMMANDE
        </div>

    </div>

</main>


<div class="controls">

    <button id="micButton">

        <span class="button-icon">◉</span>

        MICRO ACTIF

    </button>


    <button id="shortcutButton">

        <span class="button-icon">↗</span>

        ENVOYER<br>
        RACCOURCIS

    </button>


    <button id="speakButton">

        <span class="button-icon">◌</span>

        VOIX JARVIS

    </button>

</div>

</div>


<script>

/* =========================================================
   JARVIS — CRYSTALLINE CORE
   Standalone HTML / Canvas
   No external dependency
========================================================= */

const canvas =
    document.getElementById("hudCanvas");

const ctx =
    canvas.getContext("2d");

const hud =
    document.getElementById("hud");

const coreArea =
    document.getElementById("coreArea");

const micButton =
    document.getElementById("micButton");

const shortcutButton =
    document.getElementById("shortcutButton");

const speakButton =
    document.getElementById("speakButton");

const voiceText =
    document.getElementById("voiceText");

const systemState =
    document.getElementById("systemState");

const audioMeter =
    document.getElementById("audioMeter");


/* =========================================================
   AUDIO BARS
========================================================= */

const bars = [];

for(let i=0;i<34;i++){

    const bar =
        document.createElement("div");

    bar.className =
        "audio-bar";

    audioMeter.appendChild(bar);

    bars.push(bar);
}


/* =========================================================
   CANVAS SCALE
========================================================= */

let W = 0;
let H = 0;
let DPR = 1;

function resize(){

    const rect =
        hud.getBoundingClientRect();

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W = rect.width;
    H = rect.height;

    canvas.width =
        Math.floor(W * DPR);

    canvas.height =
        Math.floor(H * DPR);

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   PARAMETERS
========================================================= */

const rings = [
    {
        radius:.205,
        width:2.1,
        speed:.055,
        direction:1
    },
    {
        radius:.295,
        width:1.8,
        speed:.034,
        direction:-1
    },
    {
        radius:.385,
        width:2.0,
        speed:.024,
        direction:1
    },
    {
        radius:.475,
        width:2.5,
        speed:.017,
        direction:-1
    }
];

let rotation = 0;

let audioLevel = 0;

let targetAudio = 0;

let simulatedAudio = 0;

let listening = false;


/* =========================================================
   UTILITIES
========================================================= */

function clamp(v,a,b){

    return Math.max(
        a,
        Math.min(b,v)
    );
}


function polar(
    cx,
    cy,
    radius,
    angle
){

    return {
        x:
            cx +
            Math.cos(angle) *
            radius,

        y:
            cy +
            Math.sin(angle) *
            radius
    };
}


function circle(
    x,
    y,
    r
){

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        r,
        0,
        Math.PI*2
    );
}


/* =========================================================
   GLOW LINE
========================================================= */

function glowingArc(
    cx,
    cy,
    radius,
    start,
    end,
    width,
    color,
    alpha = 1
){

    ctx.save();

    ctx.globalAlpha =
        alpha;

    ctx.strokeStyle =
        color;

    ctx.lineWidth =
        width;

    ctx.shadowColor =
        color;

    ctx.shadowBlur =
        width * 5;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radius,
        start,
        end
    );

    ctx.stroke();

    ctx.restore();
}


/* =========================================================
   GRID THROUGH THE ENTIRE CORE
========================================================= */

function drawCoreGrid(
    cx,
    cy,
    radius
){

    ctx.save();

    ctx.globalAlpha =
        .18;

    ctx.strokeStyle =
        "#2a7180";

    ctx.lineWidth =
        .45;

    const step =
        radius / 9;

    for(
        let x = cx-radius;
        x <= cx+radius;
        x += step
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            cy-radius
        );

        ctx.lineTo(
            x,
            cy+radius
        );

        ctx.stroke();
    }

    for(
        let y = cy-radius;
        y <= cy+radius;
        y += step
    ){

        ctx.beginPath();

        ctx.moveTo(
            cx-radius,
            y
        );

        ctx.lineTo(
            cx+radius,
            y
        );

        ctx.stroke();
    }

    ctx.restore();
}


/* =========================================================
   RING BASE
========================================================= */

function drawRingBase(
    cx,
    cy,
    radius,
    width,
    intensity
){

    ctx.save();

    ctx.strokeStyle =
        `rgba(34,229,255,${.18 + intensity*.12})`;

    ctx.lineWidth =
        width;

    ctx.shadowColor =
        "#16ddff";

    ctx.shadowBlur =
        9 + intensity*10;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radius,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.restore();
}


/* =========================================================
   MICRO GRADUATIONS
========================================================= */

function drawTicks(
    cx,
    cy,
    radius,
    count,
    rotation,
    length,
    alpha
){

    ctx.save();

    for(
        let i=0;
        i<count;
        i++
    ){

        const angle =
            rotation +
            i/count *
            Math.PI*2;

        let tickLength =
            length;

        let width =
            .7;

        if(i % 30 === 0){

            tickLength =
                length*2.7;

            width =
                1.6;

        }else if(i % 10 === 0){

            tickLength =
                length*1.9;

            width =
                1.1;

        }

        const p1 =
            polar(
                cx,
                cy,
                radius,
                angle
            );

        const p2 =
            polar(
                cx,
                cy,
                radius-tickLength,
                angle
            );

        ctx.strokeStyle =
            `rgba(182,245,252,${alpha})`;

        ctx.lineWidth =
            width;

        ctx.beginPath();

        ctx.moveTo(
            p1.x,
            p1.y
        );

        ctx.lineTo(
            p2.x,
            p2.y
        );

        ctx.stroke();
    }

    ctx.restore();
}


/* =========================================================
   NUMERICAL MARKINGS
========================================================= */

function drawNumbers(
    cx,
    cy,
    radius,
    count,
    rotation,
    size
){

    ctx.save();

    ctx.font =
        `${size}px monospace`;

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    for(
        let i=0;
        i<count;
        i++
    ){

        const angle =
            rotation +
            i/count *
            Math.PI*2;

        const p =
            polar(
                cx,
                cy,
                radius,
                angle
            );

        const value =
            String(
                Math.round(
                    i/count*360
                )
            ).padStart(3,"0");

        ctx.fillStyle =
            i%5===0
            ? "rgba(178,239,247,.75)"
            : "rgba(81,153,165,.58)";

        ctx.fillText(
            value,
            p.x,
            p.y
        );
    }

    ctx.restore();
}


/* =========================================================
   TECHNICAL SYMBOLS
========================================================= */

function drawSymbols(
    cx,
    cy,
    radius,
    rotation
){

    ctx.save();

    const symbols =
        [
            "◇",
            "□",
            "△",
            "＋",
            "×",
            "◈",
            "·",
            "⌁",
            "⊙",
            "∴",
            "∷",
            "⋄"
        ];

    ctx.font =
        "8px monospace";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    for(
        let i=0;
        i<symbols.length;
        i++
    ){

        const angle =
            rotation +
            i/symbols.length *
            Math.PI*2;

        const p =
            polar(
                cx,
                cy,
                radius,
                angle
            );

        ctx.fillStyle =
            i%3===0
            ? "rgba(205,246,249,.72)"
            : "rgba(43,175,197,.62)";

        ctx.fillText(
            symbols[i],
            p.x,
            p.y
        );
    }

    ctx.restore();
}


/* =========================================================
   COLOURED ARCS
========================================================= */

function drawTechnicalArcs(
    cx,
    cy,
    radius,
    rotation,
    intensity,
    ringIndex
){

    const offsets =
        [
            .2,
            1.7,
            3.2,
            4.5
        ];

    const offset =
        offsets[ringIndex];

    const base =
        rotation *
        (ringIndex%2===0 ? 1 : -1);

    glowingArc(
        cx,
        cy,
        radius,
        base + offset,
        base + offset + .48,
        1.5,
        "#d0a852",
        .72
    );

    glowingArc(
        cx,
        cy,
        radius,
        base + offset + 2.3,
        base + offset + 2.85,
        1.2,
        "#6754d8",
        .62
    );

    glowingArc(
        cx,
        cy,
        radius,
        base + offset + 4.1,
        base + offset + 4.55,
        1,
        "#25dff5",
        .75
    );
}


/* =========================================================
   INNER COUNTER-ROTATING ARCS
========================================================= */

function drawCounterArcs(
    cx,
    cy,
    radius,
    rotation,
    intensity
){

    const movement =
        -rotation * 1.55;

    for(
        let i=0;
        i<5;
        i++
    ){

        const start =
            movement +
            i*1.18;

        const length =
            .35 +
            (i%2)*.22;

        glowingArc(
            cx,
            cy,
            radius,
            start,
            start+length,
            1.05,
            i%2
            ? "#37d9ff"
            : "#9e803c",
            .7 + intensity*.25
        );
    }
}


/* =========================================================
   OUTER MARKERS
========================================================= */

function drawMarkers(
    cx,
    cy,
    radius,
    rotation
){

    ctx.save();

    for(
        let i=0;
        i<8;
        i++
    ){

        const angle =
            rotation +
            i/8*Math.PI*2;

        const p =
            polar(
                cx,
                cy,
                radius,
                angle
            );

        ctx.shadowColor =
            "#31eaff";

        ctx.shadowBlur =
            12;

        ctx.fillStyle =
            i===3
            ? "#e5bc65"
            : "#40e9ff";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            i===3 ? 3 : 2.2,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.restore();
}


/* =========================================================
   FACETED GEODE
========================================================= */

function drawGeode(
    cx,
    cy,
    baseRadius,
    intensity,
    time
){

    /*
       IMPORTANT:
       The centre is NOT a circle.
       It is an irregular faceted crystalline body.
    */

    const pulse =
        1 +
        intensity*.18 +
        Math.sin(time*.004)*.012;

    const R =
        baseRadius*pulse;

    const points = 42;

    const verts = [];

    for(
        let i=0;
        i<points;
        i++
    ){

        const a =
            i/points *
            Math.PI*2;

        const noise =
            1 +
            Math.sin(i*2.31)*.045 +
            Math.sin(i*5.17)*.025;

        verts.push(
            polar(
                cx,
                cy,
                R*noise,
                a
            )
        );
    }


    /* translucent body */

    const gradient =
        ctx.createRadialGradient(
            cx-R*.25,
            cy-R*.35,
            R*.05,
            cx,
            cy,
            R
        );

    gradient.addColorStop(
        0,
        "rgba(154,247,255,.27)"
    );

    gradient.addColorStop(
        .38,
        "rgba(33,192,216,.18)"
    );

    gradient.addColorStop(
        .72,
        "rgba(4,65,82,.20)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,12,20,.38)"
    );

    ctx.save();

    ctx.beginPath();

    for(
        let i=0;
        i<verts.length;
        i++
    ){

        if(i===0)
            ctx.moveTo(
                verts[i].x,
                verts[i].y
            );
        else
            ctx.lineTo(
                verts[i].x,
                verts[i].y
            );
    }

    ctx.closePath();

    ctx.fillStyle =
        gradient;

    ctx.fill();

    ctx.restore();


    /* -----------------------------------------------------
       INTERNAL FACETS
    ----------------------------------------------------- */

    const ringsInside =
        5;

    ctx.save();

    for(
        let layer=1;
        layer<=ringsInside;
        layer++
    ){

        const ratio =
            layer/(ringsInside+1);

        const localR =
            R*ratio;

        const count =
            14 + layer*3;

        for(
            let i=0;
            i<count;
            i++
        ){

            const a =
                i/count*Math.PI*2
                +
                layer*.41;

            const wobble =
                1 +
                Math.sin(
                    i*4.13 +
                    layer*2.7
                )*.08;

            const p =
                polar(
                    cx,
                    cy,
                    localR*wobble,
                    a
                );

            const nearest =
                polar(
                    cx,
                    cy,
                    localR,
                    a+.25
                );

            ctx.beginPath();

            ctx.moveTo(
                p.x,
                p.y
            );

            ctx.lineTo(
                nearest.x,
                nearest.y
            );

            ctx.strokeStyle =
                `rgba(
                    ${60 + layer*12},
                    ${210 + layer*5},
                    235,
                    ${.20 + intensity*.25}
                )`;

            ctx.lineWidth =
                .55;

            ctx.stroke();
        }
    }

    ctx.restore();


    /* -----------------------------------------------------
       CRYSTALLINE EDGES
    ----------------------------------------------------- */

    ctx.save();

    for(
        let i=0;
        i<verts.length;
        i++
    ){

        const a =
            verts[i];

        const b =
            verts[
                (i+1) %
                verts.length
            ];

        const brightness =
            .30 +
            Math.abs(
                Math.sin(i*1.71)
            )*.55 +
            intensity*.22;

        ctx.beginPath();

        ctx.moveTo(
            a.x,
            a.y
        );

        ctx.lineTo(
            b.x,
            b.y
        );

        ctx.strokeStyle =
            `rgba(
                116,
                240,
                255,
                ${brightness}
            )`;

        ctx.lineWidth =
            1.1 +
            intensity*.7;

        ctx.shadowColor =
            "#25eaff";

        ctx.shadowBlur =
            5 +
            intensity*9;

        ctx.stroke();
    }

    ctx.restore();


    /* -----------------------------------------------------
       FACET HIGHLIGHTS
    ----------------------------------------------------- */

    ctx.save();

    for(
        let i=0;
        i<verts.length;
        i+=2
    ){

        const p =
            verts[i];

        const glow =
            .5 +
            intensity*.5;

        ctx.fillStyle =
            `rgba(
                210,
                250,
                255,
                ${glow}
            )`;

        ctx.shadowColor =
            "#79f5ff";

        ctx.shadowBlur =
            10;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            1.4 +
            intensity*1.8,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.restore();


    /* -----------------------------------------------------
       REFRACTED LIGHT PATCHES
    ----------------------------------------------------- */

    const lights =
        [
            [-.35,-.34,.18],
            [.34,-.18,.11],
            [-.28,.29,.10],
            [.31,.30,.08]
        ];

    for(
        const light of lights
    ){

        const x =
            cx + light[0]*R;

        const y =
            cy + light[1]*R;

        const rr =
            light[2]*R;

        const g =
            ctx.createRadialGradient(
                x,
                y,
                0,
                x,
                y,
                rr
            );

        g.addColorStop(
            0,
            `rgba(
                210,
                255,
                255,
                ${.32+intensity*.25}
            )`
        );

        g.addColorStop(
            1,
            "rgba(40,220,255,0)"
        );

        ctx.fillStyle =
            g;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            rr,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    /* -----------------------------------------------------
       CORE
    ----------------------------------------------------- */

    ctx.save();

    ctx.fillStyle =
        "rgba(2,21,29,.42)";

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        R*.29,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();


    ctx.save();

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillStyle =
        "#d8fbff";

    ctx.font =
        "13px sans-serif";

    ctx.letterSpacing =
        "5px";

    ctx.shadowColor =
        "#42efff";

    ctx.shadowBlur =
        12;

    ctx.fillText(
        "CORE",
        cx,
        cy-3
    );

    ctx.font =
        "7px monospace";

    ctx.fillStyle =
        "#6cabb5";

    ctx.shadowBlur =
        0;

    ctx.fillText(
        listening
        ? "LISTENING"
        : "READY",
        cx,
        cy+14
    );

    ctx.restore();
}


/* =========================================================
   CENTRAL CRYSTALLINE ORBITS
========================================================= */

function drawCrystalOrbits(
    cx,
    cy,
    radius,
    rotation,
    intensity
){

    ctx.save();

    for(
        let i=0;
        i<7;
        i++
    ){

        const rx =
            radius *
            (.38 + i*.055);

        const ry =
            rx *
            (.58 + Math.sin(i)*.18);

        const angle =
            rotation *
            (i%2 ? -1 : 1);

        ctx.translate(
            cx,
            cy
        );

        ctx.rotate(angle);

        ctx.translate(
            -cx,
            -cy
        );

        ctx.beginPath();

        ctx.ellipse(
            cx,
            cy,
            rx,
            ry,
            0,
            0,
            Math.PI*2
        );

        ctx.strokeStyle =
            `rgba(
                92,
                235,
                255,
                ${.10+intensity*.15}
            )`;

        ctx.lineWidth =
            .55;

        ctx.stroke();

        ctx.setTransform(
            DPR,
            0,
            0,
            DPR,
            0,
            0
        );
    }

    ctx.restore();
}


/* =========================================================
   FOUR FIXED CONCENTRIC RINGS
========================================================= */

function drawRings(
    cx,
    cy,
    maxRadius,
    intensity,
    time
){

    const expansion =
        intensity*.095;

    for(
        let i=0;
        i<rings.length;
        i++
    ){

        const data =
            rings[i];

        /*
           Rings NEVER move away from the centre.
           Their radii expand symmetrically.
        */

        const radius =
            maxRadius *
            (
                data.radius +
                expansion *
                (
                    .72 +
                    i*.10
                )
            );

        const rotation =
            time *
            .00012 *
            data.speed *
            1000 *
            data.direction;

        drawRingBase(
            cx,
            cy,
            radius,
            data.width +
            intensity*.8,
            intensity
        );


        drawTicks(
            cx,
            cy,
            radius,
            144,
            rotation,
            5 + i,
            .52
        );


        drawTicks(
            cx,
            cy,
            radius-7,
            72,
            -rotation*1.45,
            3,
            .38
        );


        drawNumbers(
            cx,
            cy,
            radius-13,
            24,
            rotation,
            6.5
        );


        drawTechnicalArcs(
            cx,
            cy,
            radius-2,
            rotation,
            intensity,
            i
        );


        drawCounterArcs(
            cx,
            cy,
            radius-8,
            rotation,
            intensity
        );


        drawMarkers(
            cx,
            cy,
            radius+1,
            rotation
        );


        drawSymbols(
            cx,
            cy,
            radius-20,
            -rotation*.8
        );


        /* secondary parallel circle */

        ctx.save();

        ctx.strokeStyle =
            "rgba(42,213,234,.28)";

        ctx.lineWidth =
            .65;

        ctx.beginPath();

        ctx.arc(
            cx,
            cy,
            radius-10,
            0,
            Math.PI*2
        );

        ctx.stroke();

        ctx.restore();


        /* thin outer halo */

        ctx.save();

        ctx.strokeStyle =
            `rgba(
                45,
                218,
                239,
                ${.12+intensity*.12}
            )`;

        ctx.lineWidth =
            .45;

        ctx.beginPath();

        ctx.arc(
            cx,
            cy,
            radius+7,
            0,
            Math.PI*2
        );

        ctx.stroke();

        ctx.restore();
    }
}


/* =========================================================
   OUTER INFORMATION FIELD
========================================================= */

function drawOuterInformation(
    cx,
    cy,
    radius,
    rotation,
    intensity
){

    ctx.save();

    ctx.font =
        "7px monospace";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    const labels =
        [
            "VOICE",
            "SYNC",
            "CORE",
            "AUDIO",
            "AXIS",
            "DATA",
            "LINK",
            "SECURE",
            "INPUT",
            "SIGNAL",
            "VECTOR",
            "READY"
        ];

    for(
        let i=0;
        i<labels.length;
        i++
    ){

        const angle =
            rotation*.35 +
            i/labels.length *
            Math.PI*2;

        const p =
            polar(
                cx,
                cy,
                radius+17,
                angle
            );

        ctx.fillStyle =
            i%3===0
            ? "rgba(107,207,221,.58)"
            : "rgba(62,126,139,.40)";

        ctx.fillText(
            labels[i],
            p.x,
            p.y
        );
    }

    ctx.restore();
}


/* =========================================================
   CROSS AXIS
========================================================= */

function drawAxis(
    cx,
    cy,
    radius,
    intensity
){

    ctx.save();

    ctx.strokeStyle =
        `rgba(
            53,
            182,
            201,
            ${.12+intensity*.08}
        )`;

    ctx.lineWidth =
        .45;

    ctx.beginPath();

    ctx.moveTo(
        cx-radius*1.1,
        cy
    );

    ctx.lineTo(
        cx+radius*1.1,
        cy
    );

    ctx.moveTo(
        cx,
        cy-radius*1.1
    );

    ctx.lineTo(
        cx,
        cy+radius*1.1
    );

    ctx.stroke();


    ctx.font =
        "8px monospace";

    ctx.fillStyle =
        "rgba(131,213,224,.6)";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        "N",
        cx,
        cy-radius*1.08
    );

    ctx.fillText(
        "S",
        cx,
        cy+radius*1.08
    );

    ctx.fillText(
        "W",
        cx-radius*1.08,
        cy
    );

    ctx.fillText(
        "E",
        cx+radius*1.08,
        cy
    );

    ctx.restore();
}


/* =========================================================
   PARTICLES
========================================================= */

const particles =
    Array.from(
        {length:90},
        (_,i)=>({

            a:
                Math.random()*
                Math.PI*2,

            r:
                .52 +
                Math.random()*.5,

            size:
                .4 +
                Math.random()*1.4,

            speed:
                .00004 +
                Math.random()*.00008,

            phase:
                Math.random()*
                Math.PI*2
        })
    );


function drawParticles(
    cx,
    cy,
    radius,
    time,
    intensity
){

    ctx.save();

    for(
        const p of particles
    ){

        const a =
            p.a +
            time*p.speed;

        const r =
            radius *
            p.r *
            (
                1 +
                intensity*.05
            );

        const point =
            polar(
                cx,
                cy,
                r,
                a
            );

        const alpha =
            .18 +
            .25 *
            (
                .5 +
                .5*
                Math.sin(
                    time*.002+
                    p.phase
                )
            );

        ctx.fillStyle =
            `rgba(
                91,
                219,
                235,
                ${alpha}
            )`;

        ctx.beginPath();

        ctx.arc(
            point.x,
            point.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.restore();
}


/* =========================================================
   AUDIO VISUALISATION
========================================================= */

function updateAudioBars(){

    for(
        let i=0;
        i<bars.length;
        i++
    ){

        const wave =
            Math.abs(
                Math.sin(
                    performance.now()*.012 +
                    i*.72
                )
            );

        const level =
            listening
            ? audioLevel
            : 0;

        const height =
            5 +
            level*
            (
                8 +
                wave*22
            );

        bars[i].style.height =
            height + "px";
    }
}


/* =========================================================
   DRAW
========================================================= */

function draw(time){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    const cx =
        W/2;

    const cy =
        H/2;


    /*
       The visual occupies roughly
       the central 50–55% of the upper
       screen area on an iPhone.
    */

    const maxRadius =
        Math.min(
            W,
            H
        ) *
        .46;


    /* audio smoothing */

    audioLevel +=
        (
            targetAudio -
            audioLevel
        )*.18;


    /* subtle idle pulse */

    const idlePulse =
        Math.sin(
            time*.0015
        )*.008;


    const visualIntensity =
        clamp(
            audioLevel +
            .12 +
            idlePulse,
            0,
            1
        );


    /* ambient field */

    drawCoreGrid(
        cx,
        cy,
        maxRadius*1.08
    );


    drawParticles(
        cx,
        cy,
        maxRadius,
        time,
        visualIntensity
    );


    drawAxis(
        cx,
        cy,
        maxRadius,
        visualIntensity
    );


    drawOuterInformation(
        cx,
        cy,
        maxRadius,
        rotation,
        visualIntensity
    );


    /*
       FOUR FIXED RINGS
       Expansion is radial only.
    */

    drawRings(
        cx,
        cy,
        maxRadius,
        visualIntensity,
        time
    );


    /*
       Central crystalline geometry.
    */

    drawCrystalOrbits(
        cx,
        cy,
        maxRadius*.43,
        rotation,
        visualIntensity
    );


    drawGeode(
        cx,
        cy,
        maxRadius*.265,
        visualIntensity,
        time
    );


    rotation +=
        .00055 +
        visualIntensity*.0019;


    updateAudioBars();

    requestAnimationFrame(draw);
}

requestAnimationFrame(draw);


/* =========================================================
   MICROPHONE
========================================================= */

let audioContext = null;

let analyser = null;

let microphoneSource = null;

let audioData = null;


async function startMicrophone(){

    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        voiceText.textContent =
            "MICROPHONE NON DISPONIBLE";

        return;
    }

    try{

        const stream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio:true
                });


        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        analyser =
            audioContext.createAnalyser();

        analyser.fftSize =
            512;

        analyser.smoothingTimeConstant =
            .72;


        microphoneSource =
            audioContext
                .createMediaStreamSource(
                    stream
                );


        microphoneSource.connect(
            analyser
        );


        audioData =
            new Uint8Array(
                analyser.fftSize
            );


        listening = true;

        micButton.classList.add(
            "active"
        );

        systemState.textContent =
            "LISTENING";

        voiceText.textContent =
            "ÉCOUTE EN COURS";


        readMicrophone();

    }catch(error){

        console.error(error);

        voiceText.textContent =
            "AUTORISATION MICRO REQUISE";

    }
}


function readMicrophone(){

    if(
        !analyser ||
        !audioData
    ){

        return;
    }


    analyser.getByteTimeDomainData(
        audioData
    );


    let sum = 0;

    for(
        let i=0;
        i<audioData.length;
        i++
    ){

        const v =
            (
                audioData[i]-128
            )/128;

        sum +=
            v*v;
    }


    const rms =
        Math.sqrt(
            sum/
            audioData.length
        );


    /*
       Strong amplification so that
       normal speech produces a clearly
       visible geometric expansion.
    */

    targetAudio =
        clamp(
            rms*5.5,
            0,
            1
        );


    requestAnimationFrame(
        readMicrophone
    );
}


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

let recognition = null;

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if(SpeechRecognition){

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "fr-FR";

    recognition.continuous =
        true;

    recognition.interimResults =
        true;

    recognition.onresult =
        event => {

            let transcript = "";

            for(
                let i=event.resultIndex;
                i<event.results.length;
                i++
            ){

                transcript +=
                    event.results[i][0]
                        .transcript;
            }

            transcript =
                transcript.trim();

            if(transcript){

                voiceText.textContent =
                    transcript;
            }
        };


    recognition.onerror =
        error => {

            console.log(
                "Speech recognition:",
                error
            );
        };
}


/* =========================================================
   MICRO BUTTON
========================================================= */

micButton.addEventListener(
    "click",
    async () => {

        if(!listening){

            await startMicrophone();

            if(recognition){

                try{
                    recognition.start();
                }catch(e){}
            }

        }else{

            listening = false;

            targetAudio = 0;

            micButton.classList.remove(
                "active"
            );

            systemState.textContent =
                "READY";

            voiceText.textContent =
                "EN ATTENTE DE COMMANDE";

            if(recognition){

                try{
                    recognition.stop();
                }catch(e){}
            }
        }
    }
);


/* =========================================================
   SEND TO SHORTCUTS
========================================================= */

shortcutButton.addEventListener(
    "click",
    () => {

        const text =
            voiceText.textContent;

        /*
           Replace this URL with the
           iOS Shortcut URL you create.
        */

        const shortcutName =
            "JARVIS";

        const url =
            "shortcuts://run-shortcut" +
            "?name=" +
            encodeURIComponent(
                shortcutName
            ) +
            "&input=" +
            encodeURIComponent(
                text
            );

        window.location.href =
            url;
    }
);


/* =========================================================
   SYNTHETIC VOICE
========================================================= */

speakButton.addEventListener(
    "click",
    () => {

        const text =
            voiceText.textContent;

        if(
            !text ||
            text ===
            "EN ATTENTE DE COMMANDE"
        ){

            return;
        }


        if(
            !window.speechSynthesis
        ){

            return;
        }


        window.speechSynthesis.cancel();


        const utterance =
            new SpeechSynthesisUtterance(
                text
            );


        utterance.lang =
            "fr-FR";

        utterance.rate =
            .92;

        utterance.pitch =
            .72;

        utterance.volume =
            1;


        const voices =
            window.speechSynthesis
                .getVoices();


        const french =
            voices.find(
                voice =>
                    voice.lang
                        .toLowerCase()
                        .startsWith("fr")
            );


        if(french){

            utterance.voice =
                french;
        }


        /*
           Make the visual react
           while Jarvis speaks.
        */

        utterance.onstart =
            () => {

                listening = true;

                systemState.textContent =
                    "SPEAKING";

                targetAudio =
                    .35;
            };


        utterance.onend =
            () => {

                targetAudio =
                    0;

                listening = false;

                systemState.textContent =
                    "READY";
            };


        window.speechSynthesis.speak(
            utterance
        );
    }
);


/* =========================================================
   INITIAL STATE
========================================================= */

systemState.textContent =
    "READY";

voiceText.textContent =
    "EN ATTENTE DE COMMANDE";


/* =========================================================
   TOUCH INTERACTION
========================================================= */

let touchStart = null;

hud.addEventListener(
    "touchstart",
    event => {

        const touch =
            event.touches[0];

        touchStart = {
            x:touch.clientX,
            y:touch.clientY
        };
    },
    {passive:true}
);


hud.addEventListener(
    "touchmove",
    event => {

        if(!touchStart)
            return;

        const touch =
            event.touches[0];

        const dx =
            touch.clientX -
            touchStart.x;

        /*
           Very subtle manual
           rotation of the information
           field without displacing
           the rings themselves.
        */

        rotation +=
            dx*.0008;

        touchStart.x =
            touch.clientX;
    },
    {passive:true}
);


hud.addEventListener(
    "touchend",
    () => {

        touchStart = null;

    },
    {passive:true}
);


/* =========================================================
   PREVENT ACCIDENTAL PAGE SCROLL
========================================================= */

document.addEventListener(
    "touchmove",
    event => {

        if(
            event.target.closest(
                "#hud"
            )
        ){

            event.preventDefault();
        }
    },
    {passive:false}
);


/* =========================================================
   KEYBOARD TEST MODE
   Useful when testing on desktop.
========================================================= */

window.addEventListener(
    "keydown",
    event => {

        if(
            event.code ===
            "Space"
        ){

            targetAudio =
                .85;
        }
    }
);


window.addEventListener(
    "keyup",
    event => {

        if(
            event.code ===
            "Space"
        ){

            targetAudio =
                0;
        }
    }
);


/* =========================================================
   END
========================================================= */

</script>
