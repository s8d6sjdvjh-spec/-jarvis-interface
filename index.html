<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>JARVIS — Gyrotourbillon Precision Core</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#01070a;
    color:#d9faff;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
                 "Helvetica Neue",Arial,sans-serif;
}

body{
    position:fixed;
    inset:0;
}

#app{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(0,44,55,.23) 0%,
            rgba(0,12,16,.10) 28%,
            rgba(0,5,8,0) 55%
        ),
        #01070a;
}

/* ---------------------------------------------------------
   GRID
--------------------------------------------------------- */

#grid{
    position:absolute;
    inset:0;
    opacity:.42;
    pointer-events:none;

    background-image:
        linear-gradient(rgba(0,126,150,.085) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,126,150,.085) 1px,transparent 1px);

    background-size:
        58px 58px,
        58px 58px;

    mask-image:linear-gradient(
        to bottom,
        transparent 0%,
        black 12%,
        black 88%,
        transparent 100%
    );
}

/* ---------------------------------------------------------
   HEADER
--------------------------------------------------------- */

#header{
    position:absolute;
    z-index:20;
    top:0;
    left:0;
    right:0;

    height:112px;

    padding:
        42px
        clamp(24px,6vw,70px)
        0;

    display:flex;
    align-items:flex-start;
    justify-content:space-between;

    pointer-events:none;
}

.brand{
    font-size:clamp(24px,5vw,34px);
    letter-spacing:.48em;
    font-weight:300;
    white-space:nowrap;
}

.status{
    display:flex;
    gap:clamp(18px,4vw,42px);
    align-items:center;

    font-size:10px;
    letter-spacing:.34em;
    color:rgba(190,232,240,.52);
}

.statusItem{
    display:flex;
    align-items:center;
    gap:9px;
}

.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#00d8ff;
    box-shadow:
        0 0 7px #00d8ff,
        0 0 18px rgba(0,216,255,.6);
}

/* ---------------------------------------------------------
   SUBTITLE
--------------------------------------------------------- */

#subtitle{
    position:absolute;
    z-index:20;
    top:128px;
    left:0;
    right:0;

    text-align:center;

    font-size:10px;
    letter-spacing:.42em;

    color:rgba(103,174,190,.58);

    pointer-events:none;
}

/* ---------------------------------------------------------
   THREE.JS
--------------------------------------------------------- */

#scene{
    position:absolute;
    inset:0;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

/* ---------------------------------------------------------
   DATA PANELS
--------------------------------------------------------- */

#panels{
    position:absolute;
    z-index:30;

    left:5%;
    right:5%;
    bottom:6.5%;

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px 18px;

    pointer-events:none;
}

.panel{
    height:108px;

    border:1px solid rgba(0,205,239,.42);

    background:
        linear-gradient(
            135deg,
            rgba(0,36,46,.30),
            rgba(0,12,17,.18)
        );

    box-shadow:
        inset 0 0 20px rgba(0,180,220,.035);

    padding:18px 20px;

    backdrop-filter:blur(4px);
}

.panelTitle{
    font-size:10px;
    letter-spacing:.36em;
    color:#55bfd2;
    margin-bottom:12px;
}

.panelValue{
    font-size:38px;
    font-weight:300;
    line-height:.9;
    letter-spacing:.02em;
}

.panelCaption{
    margin-top:11px;
    font-size:9px;
    letter-spacing:.20em;
    color:rgba(157,208,217,.40);
}

/* ---------------------------------------------------------
   PORTRAIT
--------------------------------------------------------- */

@media (orientation:portrait){

    #header{
        height:96px;
        padding-top:40px;
    }

    .brand{
        font-size:23px;
        letter-spacing:.40em;
    }

    .status{
        gap:14px;
        font-size:8px;
        letter-spacing:.27em;
    }

    #subtitle{
        top:122px;
        font-size:8px;
        letter-spacing:.32em;
    }

    #panels{
        bottom:7%;
        gap:10px 16px;
    }

    .panel{
        height:94px;
        padding:15px 17px;
    }

    .panelValue{
        font-size:31px;
    }

    .panelCaption{
        font-size:8px;
        margin-top:8px;
    }
}

@media (max-width:420px){

    #header{
        padding-left:24px;
        padding-right:24px;
    }

    .status{
        gap:9px;
    }

    .statusItem{
        gap:6px;
    }

    .dot{
        width:6px;
        height:6px;
    }

    #panels{
        left:6%;
        right:6%;
        bottom:7%;
    }

    .panel{
        height:92px;
    }
}
</style>
</head>

<body>

<div id="app">

    <div id="grid"></div>

    <header id="header">

        <div class="brand">
            JARVIS
        </div>

        <div class="status">

            <div class="statusItem">
                <span class="dot"></span>
                <span>ONLINE</span>
            </div>

            <div class="statusItem">
                <span class="dot"></span>
                <span>SECURE</span>
            </div>

            <div class="statusItem">
                <span class="dot"></span>
                <span>VOICE</span>
            </div>

        </div>

    </header>

    <div id="subtitle">
        GYROTOURBILLON&nbsp;&nbsp;·&nbsp;&nbsp;PRECISION CORE&nbsp;&nbsp;·&nbsp;&nbsp;3 AXIS
    </div>

    <div id="scene"></div>

    <section id="panels">

        <div class="panel">
            <div class="panelTitle">MAISON</div>
            <div class="panelValue">03</div>
            <div class="panelCaption">DISPOSITIFS ACTIFS</div>
        </div>

        <div class="panel">
            <div class="panelTitle">MÉTÉO</div>
            <div class="panelValue">18°</div>
            <div class="panelCaption">CONDITIONS STABLES</div>
        </div>

        <div class="panel">
            <div class="panelTitle">SYSTÈME</div>
            <div class="panelValue">82%</div>
            <div class="panelCaption">PERFORMANCE</div>
        </div>

        <div class="panel">
            <div class="panelTitle">ACTIVITÉ</div>
            <div class="panelValue">12</div>
            <div class="panelCaption">ÉVÉNEMENTS RÉCENTS</div>
        </div>

    </section>

</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js";

/* =========================================================
   RENDERER
========================================================= */

const sceneContainer = document.getElementById("scene");

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x01070a);

const camera = new THREE.PerspectiveCamera(
    31,
    innerWidth / innerHeight,
    0.1,
    100
);

camera.position.set(0,0,13.8);


/* ---------------------------------------------------------
   RENDERER
--------------------------------------------------------- */

const renderer = new THREE.WebGLRenderer({
    antialias:true,
    alpha:false,
    powerPreference:"high-performance"
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.12;

sceneContainer.appendChild(renderer.domElement);


/* =========================================================
   LIGHTING
========================================================= */

const ambient = new THREE.AmbientLight(
    0x8eb9c5,
    0.55
);

scene.add(ambient);


const keyLight = new THREE.DirectionalLight(
    0xdffcff,
    3.0
);

keyLight.position.set(
    -4,
    6,
    7
);

scene.add(keyLight);


const rimLight = new THREE.DirectionalLight(
    0x28d8ff,
    2.1
);

rimLight.position.set(
    5,
    1,
    -3
);

scene.add(rimLight);


const warmLight = new THREE.PointLight(
    0xffc66e,
    1.8,
    8
);

warmLight.position.set(
    -2,
    -2,
    4
);

scene.add(warmLight);


/* =========================================================
   MATERIALS
========================================================= */

const polishedSteel =
    new THREE.MeshStandardMaterial({
        color:0xb8c7c9,
        metalness:.96,
        roughness:.20
    });

const darkSteel =
    new THREE.MeshStandardMaterial({
        color:0x18272b,
        metalness:.98,
        roughness:.27
    });

const blackSteel =
    new THREE.MeshStandardMaterial({
        color:0x060b0d,
        metalness:1,
        roughness:.22
    });

const satinSteel =
    new THREE.MeshStandardMaterial({
        color:0x66777b,
        metalness:.94,
        roughness:.38
    });

const brass =
    new THREE.MeshStandardMaterial({
        color:0x9d6923,
        metalness:.95,
        roughness:.28
    });

const holographic =
    new THREE.MeshBasicMaterial({
        color:0x13d8ef,
        transparent:true,
        opacity:.54
    });

const holographicSoft =
    new THREE.MeshBasicMaterial({
        color:0x087c95,
        transparent:true,
        opacity:.28
    });

const rubyMaterial =
    new THREE.MeshPhysicalMaterial({
        color:0x6d0718,
        emissive:0x190006,
        emissiveIntensity:.22,
        metalness:.08,
        roughness:.12,
        transmission:.72,
        thickness:.35,
        ior:2.0,
        clearcoat:1,
        clearcoatRoughness:.08
    });


/* =========================================================
   HELPERS
========================================================= */

function makeTorus(
    radius,
    tube,
    material,
    radial=96,
    tubular=8
){
    const geometry =
        new THREE.TorusGeometry(
            radius,
            tube,
            tubular,
            radial
        );

    return new THREE.Mesh(
        geometry,
        material
    );
}


function addRing(
    parent,
    radius,
    tube,
    material,
    rotation=null
){

    const ring =
        makeTorus(
            radius,
            tube,
            material
        );

    if(rotation)
        ring.rotation.set(
            rotation.x,
            rotation.y,
            rotation.z
        );

    parent.add(ring);

    return ring;
}


/* =========================================================
   HOLOGRAPHIC OUTER CROWNS
========================================================= */

const crownSystem =
    new THREE.Group();

scene.add(crownSystem);


/* ---------------------------------------------------------
   Main holographic rings
--------------------------------------------------------- */

const crownRadii = [
    4.55,
    4.15,
    3.78,
    3.40,
    3.05
];

crownRadii.forEach((r,i)=>{

    const ring =
        makeTorus(
            r,
            i===0 ? .008 :
            i===1 ? .012 :
            .010,
            i%2===0
                ? holographic
                : holographicSoft,
            160,
            5
        );

    crownSystem.add(ring);
});


/* =========================================================
   RADIAL PRECISION MARKS
========================================================= */

function createMark(
    radius,
    angle,
    length,
    width,
    material
){

    const geometry =
        new THREE.BoxGeometry(
            width,
            length,
            .012
        );

    const mark =
        new THREE.Mesh(
            geometry,
            material
        );

    mark.position.set(
        Math.cos(angle)*radius,
        Math.sin(angle)*radius,
        .03
    );

    mark.rotation.z =
        angle - Math.PI/2;

    return mark;
}


const markSystem =
    new THREE.Group();

crownSystem.add(markSystem);


/* beaucoup de graduations,
   mais très fines */

for(let i=0;i<144;i++){

    const angle =
        (i/144)*Math.PI*2;

    const irregular =
        .035 +
        ((i*17)%7)/1000;

    let length;

    if(i%24===0)
        length=.28;
    else if(i%8===0)
        length=.19;
    else if(i%3===0)
        length=.13;
    else
        length=.075 + irregular;

    const radius =
        i%3===0
            ? 4.24
            : i%2===0
                ? 3.84
                : 4.58;

    const mark =
        createMark(
            radius,
            angle,
            length,
            i%24===0 ? .025 : .014,
            i%24===0
                ? polishedSteel
                : holographic
        );

    markSystem.add(mark);
}


/* =========================================================
   SECONDARY MICRO SYMBOLS
========================================================= */

const symbolSystem =
    new THREE.Group();

crownSystem.add(symbolSystem);

for(let i=0;i<72;i++){

    const angle =
        (i/72)*Math.PI*2;

    const radius =
        3.56 + ((i*13)%5)*.045;

    const size =
        i%9===0 ? .055 : .028;

    const g =
        new THREE.BoxGeometry(
            size,
            size*1.8,
            .012
        );

    const m =
        new THREE.Mesh(
            g,
            holographicSoft
        );

    m.position.set(
        Math.cos(angle)*radius,
        Math.sin(angle)*radius,
        .05
    );

    m.rotation.z =
        angle + Math.PI/4;

    symbolSystem.add(m);
}


/* =========================================================
   HOROLOGICAL INNER CROWNS
========================================================= */

const innerCrowns =
    new THREE.Group();

scene.add(innerCrowns);

[
    [2.82,.020],
    [2.63,.014],
    [2.43,.010]
].forEach(([r,t])=>{

    const ring =
        makeTorus(
            r,
            t,
            darkSteel,
            128,
            6
        );

    innerCrowns.add(ring);
});


/* =========================================================
   FLAT METAL CAGE
   IMPORTANT:
   No giant tubular torus here.
========================================================= */

function makeFlatEllipseRing(
    outer,
    inner,
    depth,
    material,
    scaleY=1
){

    const shape =
        new THREE.Shape();

    shape.absarc(
        0,0,
        outer,
        0,
        Math.PI*2,
        false
    );

    const hole =
        new THREE.Path();

    hole.absarc(
        0,0,
        inner,
        0,
        Math.PI*2,
        true
    );

    shape.holes.push(hole);

    const geometry =
        new THREE.ExtrudeGeometry(
            shape,
            {
                depth,
                bevelEnabled:true,
                bevelSegments:2,
                steps:1,
                bevelSize:.025,
                bevelThickness:.018,
                curveSegments:64
            }
        );

    geometry.center();

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.scale.y = scaleY;

    return mesh;
}


/* =========================================================
   GYROTOURBILLON
========================================================= */

const gyro =
    new THREE.Group();

scene.add(gyro);


/* ---------------------------------------------------------
   GLOBAL SCALE
   ~15% of portrait screen width visually
--------------------------------------------------------- */

let gyroScale = 1.0;

if(innerWidth < innerHeight){
    gyroScale = .92;
}else{
    gyroScale = .78;
}

gyro.scale.setScalar(gyroScale);


/* ---------------------------------------------------------
   Cage 1 — Z axis
--------------------------------------------------------- */

const cageZ =
    new THREE.Group();

gyro.add(cageZ);

const ringZ =
    makeFlatEllipseRing(
        1.12,
        .93,
        .075,
        polishedSteel,
        .82
    );

ringZ.rotation.x = 0;

cageZ.add(ringZ);


/* ---------------------------------------------------------
   Cage 2 — X axis
--------------------------------------------------------- */

const cageX =
    new THREE.Group();

gyro.add(cageX);

const ringX =
    makeFlatEllipseRing(
        1.00,
        .82,
        .070,
        darkSteel,
        .88
    );

ringX.rotation.x =
    Math.PI/2;

ringX.rotation.z =
    .20;

cageX.add(ringX);


/* ---------------------------------------------------------
   Cage 3 — Y axis
--------------------------------------------------------- */

const cageY =
    new THREE.Group();

gyro.add(cageY);

const ringY =
    makeFlatEllipseRing(
        .88,
        .70,
        .065,
        satinSteel,
        .92
    );

ringY.rotation.y =
    Math.PI/2;

ringY.rotation.z =
    -.38;

cageY.add(ringY);


/* =========================================================
   PRECISION BRIDGES
========================================================= */

function bridge(
    parent,
    length,
    width,
    material,
    rotation
){

    const geometry =
        new THREE.BoxGeometry(
            width,
            length,
            .055
        );

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.rotation.set(
        rotation.x,
        rotation.y,
        rotation.z
    );

    parent.add(mesh);

    return mesh;
}


/* Z cage bridges */

bridge(
    cageZ,
    1.80,
    .055,
    polishedSteel,
    {x:0,y:0,z:Math.PI/2}
);

bridge(
    cageZ,
    1.65,
    .045,
    brass,
    {x:0,y:0,z:.18}
);


/* X cage bridges */

bridge(
    cageX,
    1.55,
    .050,
    darkSteel,
    {x:.9,y:.25,z:0}
);


/* Y cage bridges */

bridge(
    cageY,
    1.35,
    .045,
    satinSteel,
    {x:0,y:.8,z:.35}
);


/* =========================================================
   MICRO SCREWS
========================================================= */

function screw(
    parent,
    x,
    y,
    z,
    radius=.045,
    material=polishedSteel
){

    const geometry =
        new THREE.CylinderGeometry(
            radius,
            radius,
            .045,
            20
        );

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.rotation.x =
        Math.PI/2;

    mesh.position.set(
        x,y,z
    );

    parent.add(mesh);

    return mesh;
}


/* perimeter screws on cage */

[
    [0,1.03,.08],
    [1.03,0,.08],
    [0,-1.03,.08],
    [-1.03,0,.08]
].forEach(p=>{
    screw(
        cageZ,
        p[0],
        p[1],
        p[2],
        .052
    );
});


[
    [.91,.28,.10],
    [-.91,-.28,.10],
    [.28,-.91,.10],
    [-.28,.91,.10]
].forEach(p=>{
    screw(
        cageX,
        p[0],
        p[1],
        p[2],
        .038,
        darkSteel
    );
});


/* =========================================================
   CENTRAL ESCAPEMENT
========================================================= */

const escapement =
    new THREE.Group();

gyro.add(escapement);


/* central wheel */

const wheel =
    makeTorus(
        .42,
        .038,
        brass,
        64,
        8
    );

escapement.add(wheel);


/* inner wheel */

const wheel2 =
    makeTorus(
        .27,
        .025,
        polishedSteel,
        64,
        6
    );

escapement.add(wheel2);


/* micro teeth */

for(let i=0;i<28;i++){

    const a =
        i/28*Math.PI*2;

    const tooth =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .022,
                .075,
                .028
            ),
            satinSteel
        );

    tooth.position.set(
        Math.cos(a)*.46,
        Math.sin(a)*.46,
        .08
    );

    tooth.rotation.z =
        a;

    escapement.add(tooth);
}


/* =========================================================
   CENTRAL RUBY
========================================================= */

const rubyGeometry =
    new THREE.SphereGeometry(
        .145,
        40,
        24
    );

const ruby =
    new THREE.Mesh(
        rubyGeometry,
        rubyMaterial
    );

ruby.position.z =
    .17;

escapement.add(ruby);


/* tiny internal highlight */

const rubyHighlight =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .032,
            20,
            12
        ),
        new THREE.MeshPhysicalMaterial({
            color:0xffffff,
            emissive:0x331111,
            emissiveIntensity:.15,
            transmission:.3,
            roughness:.03
        })
    );

rubyHighlight.position.set(
    -.045,
    .055,
    .285
);

escapement.add(rubyHighlight);


/* =========================================================
   ESCAPEMENT ARMS
========================================================= */

const armMaterial =
    new THREE.MeshStandardMaterial({
        color:0x7d898c,
        metalness:.98,
        roughness:.31
    });

for(let i=0;i<4;i++){

    const a =
        i*Math.PI/2;

    const arm =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .035,
                .65,
                .045
            ),
            armMaterial
        );

    arm.position.set(
        Math.cos(a)*.28,
        Math.sin(a)*.28,
        .11
    );

    arm.rotation.z =
        a;

    escapement.add(arm);
}


/* =========================================================
   INNER RADIAL MICRO GRADUATIONS
========================================================= */

const microGraduations =
    new THREE.Group();

gyro.add(microGraduations);

for(let i=0;i<48;i++){

    const a =
        i/48*Math.PI*2;

    const r =
        .61 + (i%4)*.028;

    const l =
        i%8===0 ? .12 :
        i%3===0 ? .075 :
        .042;

    const mark =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .014,
                l,
                .018
            ),
            i%8===0
                ? polishedSteel
                : satinSteel
        );

    mark.position.set(
        Math.cos(a)*r,
        Math.sin(a)*r,
        .10
    );

    mark.rotation.z =
        a-Math.PI/2;

    microGraduations.add(mark);
}


/* =========================================================
   THREE INDEPENDENT AXES
========================================================= */

/*
    AXIS 1:
    rotation propre de la première cage

    AXIS 2:
    rotation propre de la seconde cage

    AXIS 3:
    rotation propre de la troisième cage

    + une précession lente de l'ensemble.
*/

let t = 0;

function animateGyro(dt){

    t += dt;

    /* rotation propre */

    cageZ.rotation.z =
        t * 0.82;

    cageZ.rotation.y =
        Math.sin(t*.31)*.10;


    cageX.rotation.x =
        t * 1.17;

    cageX.rotation.z =
        Math.sin(t*.47)*.24;


    cageY.rotation.y =
        t * 1.43;

    cageY.rotation.x =
        Math.cos(t*.37)*.19;


    /* précession globale */

    gyro.rotation.x =
        Math.sin(t*.21)*.20;

    gyro.rotation.y =
        Math.cos(t*.17)*.26;

    gyro.rotation.z =
        Math.sin(t*.13)*.12;


    /* mouvement propre de l'échappement */

    escapement.rotation.z =
        t * 2.25;
}


/* =========================================================
   SUBTLE CROWN MOTION
========================================================= */

function animateCrowns(){

    crownSystem.rotation.z =
        t * .018;

    markSystem.rotation.z =
        -t * .026;

    symbolSystem.rotation.z =
        t * .041;

    innerCrowns.rotation.z =
        -t * .032;
}


/* =========================================================
   RESPONSIVE CAMERA
========================================================= */

function resize(){

    const w =
        innerWidth;

    const h =
        innerHeight;

    camera.aspect =
        w/h;

    /*
       Portrait :
       mécanisme légèrement plus haut
       pour laisser respirer les panneaux.
    */

    if(h > w){

        camera.position.set(
            0,
            .05,
            13.9
        );

    }else{

        camera.position.set(
            0,
            .15,
            12.8
        );
    }

    camera.updateProjectionMatrix();

    renderer.setSize(
        w,
        h
    );

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   RENDER LOOP
========================================================= */

const clock =
    new THREE.Clock();

function render(){

    requestAnimationFrame(render);

    const dt =
        Math.min(
            clock.getDelta(),
            .035
        );

    animateGyro(dt);

    animateCrowns();

    renderer.render(
        scene,
        camera
    );
}

render();

</script>
