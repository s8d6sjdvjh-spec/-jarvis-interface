<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>JARVIS — Voice Core</title>

<style>
:root {
    --bg: #020a0f;
    --cyan: #19e6ff;
    --cyan2: #6ff4ff;
    --blue: #087fa4;
    --gold: #c9a45a;
    --white: #dffcff;
    --dim: #426d78;
    --grid: rgba(42, 177, 201, .075);
    --red: #ff5265;

    --safe-top: env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: var(--bg);
    color: var(--white);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    overflow: hidden;
}

body {
    position: relative;
}

#app {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(
            ellipse at 50% 45%,
            rgba(0, 108, 135, .12),
            transparent 55%
        ),
        linear-gradient(
            180deg,
            #030d13 0%,
            #020a0f 55%,
            #02080d 100%
        );
}

/* =========================================================
   GRID
   ========================================================= */

#grid {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: .95;

    background-image:
        linear-gradient(
            rgba(45, 176, 201, .055) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(45, 176, 201, .055) 1px,
            transparent 1px
        ),
        linear-gradient(
            rgba(45, 176, 201, .025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(45, 176, 201, .025) 1px,
            transparent 1px
        );

    background-size:
        52px 52px,
        52px 52px,
        13px 13px,
        13px 13px;

    mask-image:
        radial-gradient(
            ellipse at center,
            black 45%,
            transparent 100%
        );
}

/* =========================================================
   HEADER
   ========================================================= */

.header {
    position: absolute;
    z-index: 20;
    top: calc(24px + var(--safe-top));
    left: 0;
    width: 100%;
    padding: 0 28px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    pointer-events: none;
}

.logo {
    font-size: 30px;
    font-weight: 300;
    letter-spacing: .42em;
    color: #e5fbff;
    text-shadow: 0 0 18px rgba(45, 225, 255, .14);
}

.status {
    display: flex;
    gap: 20px;
    align-items: center;

    font-size: 9px;
    letter-spacing: .32em;
    color: #688e97;
}

.statusItem {
    display: flex;
    align-items: center;
    gap: 7px;
}

.statusDot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow:
        0 0 8px var(--cyan),
        0 0 20px rgba(25,230,255,.6);
}

/* =========================================================
   TITLES
   ========================================================= */

.titleBlock {
    position: absolute;
    z-index: 20;

    top: calc(105px + var(--safe-top));
    left: 0;
    width: 100%;

    text-align: center;
    pointer-events: none;
}

.title {
    font-size: 11px;
    letter-spacing: .42em;
    color: #4f8995;
    text-transform: uppercase;
}

.subtitle {
    margin-top: 12px;

    font-size: 8px;
    letter-spacing: .36em;
    color: #315763;
    text-transform: uppercase;
}

/* =========================================================
   MAIN CANVAS
   ========================================================= */

#visual {
    position: absolute;
    z-index: 5;

    left: 0;
    top: calc(150px + var(--safe-top));

    width: 100%;
    height: 66vh;

    display: block;

    touch-action: manipulation;
}

/* =========================================================
   VOICE PANEL
   ========================================================= */

.voicePanel {
    position: absolute;
    z-index: 30;

    left: 4%;
    right: 4%;
    bottom: calc(112px + var(--safe-bottom));

    height: 72px;

    border-top: 1px solid rgba(28, 206, 235, .38);
    border-bottom: 1px solid rgba(28, 206, 235, .22);

    background:
        linear-gradient(
            90deg,
            rgba(4,24,31,.20),
            rgba(5,25,31,.42),
            rgba(4,24,31,.20)
        );

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;
}

.voiceText {
    width: 90%;

    text-align: center;

    font-size: 11px;
    letter-spacing: .28em;

    color: rgba(169, 234, 242, .58);

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    text-transform: uppercase;
}

.voiceText.active {
    color: #d9fdff;
    text-shadow:
        0 0 10px rgba(25,230,255,.65),
        0 0 24px rgba(25,230,255,.25);
}

/* =========================================================
   CONTROLS
   ========================================================= */

.controls {
    position: absolute;
    z-index: 40;

    left: 5%;
    right: 5%;
    bottom: calc(28px + var(--safe-bottom));

    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

button {
    min-height: 58px;

    border: 1px solid rgba(24, 211, 238, .65);

    background:
        linear-gradient(
            180deg,
            rgba(6,31,39,.80),
            rgba(2,16,22,.88)
        );

    color: #bcecf2;

    font-size: 9px;
    letter-spacing: .25em;

    text-transform: uppercase;

    cursor: pointer;

    box-shadow:
        inset 0 0 20px rgba(25,230,255,.035),
        0 0 14px rgba(25,230,255,.04);

    transition:
        transform .15s ease,
        background .15s ease,
        box-shadow .15s ease;
}

button:active {
    transform: scale(.97);

    background:
        rgba(14,75,87,.70);

    box-shadow:
        0 0 25px rgba(25,230,255,.25);
}

button.active {
    border-color: var(--cyan);

    color: #e8feff;

    box-shadow:
        inset 0 0 22px rgba(25,230,255,.10),
        0 0 22px rgba(25,230,255,.18);
}

/* =========================================================
   SMALL STATUS MARKER
   ========================================================= */

.corner {
    position: absolute;
    z-index: 25;

    width: 22px;
    height: 22px;

    pointer-events: none;

    border-color: rgba(25,230,255,.40);
}

.corner.tl {
    left: 18px;
    top: calc(92px + var(--safe-top));

    border-left: 1px solid;
    border-top: 1px solid;
}

.corner.tr {
    right: 18px;
    top: calc(92px + var(--safe-top));

    border-right: 1px solid;
    border-top: 1px solid;
}

.corner.bl {
    left: 18px;
    bottom: calc(95px + var(--safe-bottom));

    border-left: 1px solid;
    border-bottom: 1px solid;
}

.corner.br {
    right: 18px;
    bottom: calc(95px + var(--safe-bottom));

    border-right: 1px solid;
    border-bottom: 1px solid;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 390px) {

    .header {
        padding-left: 20px;
        padding-right: 20px;
    }

    .logo {
        font-size: 25px;
        letter-spacing: .34em;
    }

    .status {
        gap: 10px;
        font-size: 7px;
        letter-spacing: .20em;
    }

    .title {
        font-size: 9px;
    }

    .voicePanel {
        height: 62px;
    }

    button {
        min-height: 54px;
        font-size: 8px;
    }
}

@media (min-width: 700px) {

    #visual {
        height: 70vh;
    }

    .controls {
        left: 15%;
        right: 15%;
    }

    .voicePanel {
        left: 15%;
        right: 15%;
    }
}
</style>
</head>

<body>

<div id="app">

    <div id="grid"></div>

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <header class="header">

        <div class="logo">
            JARVIS
        </div>

        <div class="status">

            <div class="statusItem">
                <span class="statusDot"></span>
                ONLINE
            </div>

            <div class="statusItem">
                <span class="statusDot"></span>
                SECURE
            </div>

            <div class="statusItem">
                <span class="statusDot"></span>
                VOICE
            </div>

        </div>

    </header>

    <div class="titleBlock">

        <div class="title">
            VOICE CORE · CRYSTALLINE MATRIX · 3 AXIS
        </div>

        <div class="subtitle">
            HOLOGRAPHIC CONCENTRIC SYSTEM · AUDIO REACTIVE
        </div>

    </div>

    <canvas id="visual"></canvas>

    <div class="voicePanel">

        <div
            id="voiceText"
            class="voiceText"
        >
            AUDIO LINK · TAP MICRO TO ACTIVATE
        </div>

    </div>

    <div class="controls">

        <button id="micButton">
            MICRO<br>ACTIF
        </button>

        <button id="shortcutButton">
            ENVOYER<br>RACCOURCIS
        </button>

        <button id="speakButton">
            VOIX<br>JARVIS
        </button>

    </div>

</div>

<script>
/* =========================================================
   JARVIS VOICE CORE
   Canvas-only visual engine
   No external dependency
   ========================================================= */

(() => {

    "use strict";

    /* =====================================================
       DOM
       ===================================================== */

    const canvas = document.getElementById("visual");
    const ctx = canvas.getContext("2d");

    const voiceText =
        document.getElementById("voiceText");

    const micButton =
        document.getElementById("micButton");

    const shortcutButton =
        document.getElementById("shortcutButton");

    const speakButton =
        document.getElementById("speakButton");


    /* =====================================================
       STATE
       ===================================================== */

    let width = 0;
    let height = 0;
    let cx = 0;
    let cy = 0;

    let dpr = Math.min(
        window.devicePixelRatio || 1,
        2
    );

    let time = 0;

    let audioLevel = 0;
    let targetAudio = 0;

    let voiceActive = false;

    let currentTranscript = "";

    let recognition = null;

    let recognitionSupported = false;

    let speaking = false;


    /* =====================================================
       RING CONFIGURATION
       ===================================================== */

    /*
       Les quatre couronnes sont FIXES.
       Elles ne partent jamais sur les côtés.

       Leur rayon est calculé proportionnellement
       à la largeur disponible.

       La voix agit uniquement sur :
       - épaisseur
       - luminosité
       - écartement contrôlé
       - rotation interne
       - densité
       - halo
    */

    const ringDefinitions = [

        {
            radius: .17,
            thickness: 2.0,
            speed: .075,
            direction: 1,
            color: "cyan"
        },

        {
            radius: .285,
            thickness: 2.2,
            speed: .052,
            direction: -1,
            color: "cyan"
        },

        {
            radius: .405,
            thickness: 2.0,
            speed: .038,
            direction: 1,
            color: "mixed"
        },

        {
            radius: .525,
            thickness: 2.4,
            speed: .022,
            direction: -1,
            color: "cyan"
        }

    ];


    /* =====================================================
       RESIZE
       ===================================================== */

    function resize() {

        const rect =
            canvas.getBoundingClientRect();

        width = rect.width;
        height = rect.height;

        dpr = Math.min(
            window.devicePixelRatio || 1,
            2
        );

        canvas.width =
            Math.floor(width * dpr);

        canvas.height =
            Math.floor(height * dpr);

        ctx.setTransform(
            dpr,
            0,
            0,
            dpr,
            0,
            0
        );

        /*
           La composition reste centrée dans la
           partie supérieure du téléphone.
        */

        cx = width * .5;

        cy = height * .47;
    }

    window.addEventListener(
        "resize",
        resize,
        { passive: true }
    );

    resize();


    /* =====================================================
       UTILITY
       ===================================================== */

    function lerp(a, b, amount) {

        return a + (b - a) * amount;
    }


    function clamp(value, min, max) {

        return Math.max(
            min,
            Math.min(max, value)
        );
    }


    function polar(
        centerX,
        centerY,
        radius,
        angle
    ) {

        return {

            x:
                centerX +
                Math.cos(angle) * radius,

            y:
                centerY +
                Math.sin(angle) * radius

        };
    }


    function cyanAlpha(alpha) {

        return `rgba(25,230,255,${alpha})`;
    }


    function whiteAlpha(alpha) {

        return `rgba(220,250,255,${alpha})`;
    }


    function goldAlpha(alpha) {

        return `rgba(201,164,90,${alpha})`;
    }


    /* =====================================================
       BACKGROUND ATMOSPHERE
       ===================================================== */

    function drawAtmosphere() {

        const radius =
            Math.min(width, height) * .60;

        const gradient =
            ctx.createRadialGradient(
                cx,
                cy,
                0,
                cx,
                cy,
                radius
            );

        gradient.addColorStop(
            0,
            "rgba(0,125,155,.12)"
        );

        gradient.addColorStop(
            .35,
            "rgba(0,75,100,.075)"
        );

        gradient.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );

        ctx.fillStyle = gradient;

        ctx.fillRect(
            0,
            0,
            width,
            height
        );
    }


    /* =====================================================
       CENTRAL RADIAL GRID
       IMPORTANT:
       The grid DOES NOT disappear at the centre.
       ===================================================== */

    function drawCentralGrid() {

        const maxRadius =
            Math.min(width, height) * .53;

        ctx.save();

        /*
           Radial lines.
        */

        for (
            let i = 0;
            i < 48;
            i++
        ) {

            const angle =
                (Math.PI * 2 / 48) * i;

            const p =
                polar(
                    cx,
                    cy,
                    maxRadius,
                    angle
                );

            ctx.beginPath();

            ctx.moveTo(
                cx,
                cy
            );

            ctx.lineTo(
                p.x,
                p.y
            );

            ctx.strokeStyle =
                "rgba(37,164,185,.045)";

            ctx.lineWidth = .55;

            ctx.stroke();
        }


        /*
           Concentric construction grid.
        */

        for (
            let i = 1;
            i <= 18;
            i++
        ) {

            const radius =
                maxRadius *
                (i / 18);

            ctx.beginPath();

            ctx.arc(
                cx,
                cy,
                radius,
                0,
                Math.PI * 2
            );

            ctx.strokeStyle =
                i % 3 === 0
                    ? "rgba(37,164,185,.065)"
                    : "rgba(37,164,185,.028)";

            ctx.lineWidth =
                i % 3 === 0 ? .8 : .45;

            ctx.stroke();
        }


        /*
           Cartesian engineering lines.
           Elles passent réellement derrière
           la géode.
        */

        ctx.beginPath();

        ctx.moveTo(
            cx - maxRadius,
            cy
        );

        ctx.lineTo(
            cx + maxRadius,
            cy
        );

        ctx.moveTo(
            cx,
            cy - maxRadius
        );

        ctx.lineTo(
            cx,
            cy + maxRadius
        );

        ctx.strokeStyle =
            "rgba(52,196,218,.065)";

        ctx.lineWidth = .7;

        ctx.stroke();


        ctx.restore();
    }


    /* =====================================================
       OUTER INFORMATION FIELD
       ===================================================== */

    function drawOuterInformationField() {

        const base =
            Math.min(width, height) * .525;

        ctx.save();

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const labels = [
            "N",
            "E",
            "S",
            "W"
        ];

        labels.forEach(
            (label, index) => {

                const angle =
                    -Math.PI / 2 +
                    index *
                    Math.PI / 2;

                const p =
                    polar(
                        cx,
                        cy,
                        base + 14,
                        angle
                    );

                ctx.font =
                    "13px -apple-system, sans-serif";

                ctx.fillStyle =
                    "rgba(209,250,255,.82)";

                ctx.fillText(
                    label,
                    p.x,
                    p.y
                );
            }
        );


        /*
           Grande échelle 0–360°.
        */

        for (
            let deg = 0;
            deg < 360;
            deg += 15
        ) {

            const angle =
                deg * Math.PI / 180 -
                Math.PI / 2;

            const outer =
                base + 4;

            const inner =
                deg % 45 === 0
                    ? base - 12
                    : base - 6;

            const p1 =
                polar(
                    cx,
                    cy,
                    inner,
                    angle
                );

            const p2 =
                polar(
                    cx,
                    cy,
                    outer,
                    angle
                );

            ctx.beginPath();

            ctx.moveTo(
                p1.x,
                p1.y
            );

            ctx.lineTo(
                p2.x,
                p2.y
            );

            ctx.strokeStyle =
                deg % 45 === 0
                    ? "rgba(220,250,255,.72)"
                    : "rgba(46,184,207,.45)";

            ctx.lineWidth =
                deg % 45 === 0
                    ? 1.25
                    : .7;

            ctx.stroke();


            /*
               Numéros.
            */

            if (deg % 30 === 0) {

                const textRadius =
                    base - 27;

                const tp =
                    polar(
                        cx,
                        cy,
                        textRadius,
                        angle
                    );

                ctx.font =
                    "8px monospace";

                ctx.fillStyle =
                    "rgba(128,206,219,.72)";

                ctx.fillText(
                    String(deg).padStart(3, "0"),
                    tp.x,
                    tp.y
                );
            }
        }

        ctx.restore();
    }


    /* =====================================================
       RING BASE
       ===================================================== */

    function drawRingBase(
        radius,
        thickness,
        glow
    ) {

        ctx.save();

        /*
           Halo.
        */

        ctx.shadowBlur =
            18 + glow * 30;

        ctx.shadowColor =
            `rgba(25,230,255,${.32 + glow * .45})`;

        ctx.beginPath();

        ctx.arc(
            cx,
            cy,
            radius,
            0,
            Math.PI * 2
        );

        ctx.strokeStyle =
            `rgba(25,230,255,${.42 + glow * .32})`;

        ctx.lineWidth =
            thickness +
            glow * 2.2;

        ctx.stroke();


        /*
           Corps holographique.
        */

        ctx.shadowBlur = 0;

        ctx.beginPath();

        ctx.arc(
            cx,
            cy,
            radius,
            0,
            Math.PI * 2
        );

        const gradient =
            ctx.createLinearGradient(
                cx - radius,
                cy - radius,
                cx + radius,
                cy + radius
            );

        gradient.addColorStop(
            0,
            "rgba(94,246,255,.90)"
        );

        gradient.addColorStop(
            .35,
            "rgba(18,159,187,.70)"
        );

        gradient.addColorStop(
            .65,
            "rgba(35,220,238,.88)"
        );

        gradient.addColorStop(
            1,
            "rgba(19,90,108,.55)"
        );

        ctx.strokeStyle =
            gradient;

        ctx.lineWidth =
            thickness;

        ctx.stroke();

        ctx.restore();
    }


    /* =====================================================
       RING GRADUATIONS
       ===================================================== */

    function drawRingGraduations(
        radius,
        ringIndex,
        rotation,
        glow
    ) {

        ctx.save();

        const tickCount =
            96 +
            ringIndex * 32;

        const inner =
            radius - 7;

        const outer =
            radius + 7 +
            glow * 5;

        for (
            let i = 0;
            i < tickCount;
            i++
        ) {

            const angle =
                rotation +
                i *
                Math.PI * 2 /
                tickCount;

            const major =
                i % 12 === 0;

            const medium =
                i % 4 === 0;

            const start =
                major
                    ? radius - 12
                    : medium
                        ? radius - 8
                        : inner;

            const end =
                major
                    ? radius + 10
                    : medium
                        ? radius + 6
                        : outer;

            const p1 =
                polar(
                    cx,
                    cy,
                    start,
                    angle
                );

            const p2 =
                polar(
                    cx,
                    cy,
                    end,
                    angle
                );

            ctx.beginPath();

            ctx.moveTo(
                p1.x,
                p1.y
            );

            ctx.lineTo(
                p2.x,
                p2.y
            );

            ctx.strokeStyle =
                major
                    ? `rgba(220,250,255,${.82 + glow * .15})`
                    : medium
                        ? `rgba(63,216,235,${.58 + glow * .18})`
                        : `rgba(35,153,176,${.38 + glow * .12})`;

            ctx.lineWidth =
                major
                    ? 1.15
                    : medium
                        ? .8
                        : .5;

            ctx.stroke();
        }

        ctx.restore();
    }


    /* =====================================================
       DATA BETWEEN RINGS
       ===================================================== */

    function drawRingData(
        innerRadius,
        outerRadius,
        ringIndex,
        rotation,
        glow
    ) {

        ctx.save();

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        /*
           Petits points techniques.
        */

        const dotCount =
            40 + ringIndex * 14;

        for (
            let i = 0;
            i < dotCount;
            i++
        ) {

            const angle =
                rotation +
                i *
                Math.PI * 2 /
                dotCount;

            const wave =
                Math.sin(
                    i * 1.71 +
                    ringIndex
                ) * 2.4;

            const radius =
                lerp(
                    innerRadius + 8,
                    outerRadius - 8,
                    .5 +
                    wave / 12
                );

            const p =
                polar(
                    cx,
                    cy,
                    radius,
                    angle
                );

            const size =
                i % 7 === 0
                    ? 2
                    : .8;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                size,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                i % 9 === 0
                    ? goldAlpha(.75)
                    : cyanAlpha(.48 + glow * .25);

            ctx.fill();
        }


        /*
           Informations textuelles.
        */

        const information = [
            "AX-03",
            "CORE",
            "VOICE",
            "SYNC",
            "042",
            "082",
            "117",
            "204",
            "315",
            "LOCK",
            "AUDIO",
            "SYS"
        ];

        for (
            let i = 0;
            i < information.length;
            i++
        ) {

            const angle =
                rotation +
                i *
                Math.PI * 2 /
                information.length;

            const radius =
                (innerRadius +
                outerRadius) *
                .5;

            const p =
                polar(
                    cx,
                    cy,
                    radius,
                    angle
                );

            ctx.save();

            ctx.translate(
                p.x,
                p.y
            );

            ctx.rotate(
                angle +
                Math.PI / 2
            );

            ctx.font =
                "7px monospace";

            ctx.fillStyle =
                i % 5 === 0
                    ? goldAlpha(.74)
                    : whiteAlpha(.48);

            ctx.fillText(
                information[
                    (i + ringIndex * 3)
                    % information.length
                ],
                0,
                0
            );

            ctx.restore();
        }


        /*
           Petits artefacts rectangulaires.
        */

        for (
            let i = 0;
            i < 24;
            i++
        ) {

            const angle =
                rotation +
                i *
                Math.PI * 2 / 24;

            const radius =
                innerRadius +
                (outerRadius - innerRadius) *
                (0.25 +
                 ((i * 37) % 70) / 100);

            const p =
                polar(
                    cx,
                    cy,
                    radius,
                    angle
                );

            const w =
                i % 4 === 0
                    ? 7
                    : 3;

            const h =
                i % 3 === 0
                    ? 2
                    : 4;

            ctx.fillStyle =
                i % 6 === 0
                    ? goldAlpha(.62)
                    : cyanAlpha(.44);

            ctx.fillRect(
                p.x - w / 2,
                p.y - h / 2,
                w,
                h
            );
        }

        ctx.restore();
    }


    /* =====================================================
       PARALLEL INTERNAL ARCS
       ===================================================== */

    function drawParallelArcs(
        radius,
        ringIndex,
        rotation,
        glow
    ) {

        ctx.save();

        /*
           Plusieurs arcs suivent exactement
           la géométrie circulaire des couronnes.
        */

        const arcSets = [
            {
                offset: -18,
                width: 1.1,
                alpha: .72
            },
            {
                offset: -11,
                width: .7,
                alpha: .44
            },
            {
                offset: 11,
                width: .8,
                alpha: .52
            },
            {
                offset: 18,
                width: 1.0,
                alpha: .62
            }
        ];

        arcSets.forEach(
            (arc, index) => {

                const r =
                    radius +
                    arc.offset;

                const span =
                    .35 +
                    index * .13;

                const start =
                    rotation +
                    index * 1.31;

                const end =
                    start +
                    span;

                ctx.beginPath();

                ctx.arc(
                    cx,
                    cy,
                    r,
                    start,
                    end
                );

                ctx.strokeStyle =
                    index === 3
                        ? goldAlpha(
                            arc.alpha
                        )
                        : cyanAlpha(
                            arc.alpha +
                            glow * .12
                        );

                ctx.lineWidth =
                    arc.width +
                    glow * .5;

                ctx.stroke();
            }
        );

        ctx.restore();
    }


    /* =====================================================
       SPECIAL DATA ARCS
       ===================================================== */

    function drawDataArcs(
        radius,
        rotation,
        ringIndex,
        glow
    ) {

        ctx.save();

        const segments = [
            {
                start: .20,
                length: .62,
                color: "cyan"
            },
            {
                start: 2.15,
                length: .38,
                color: "gold"
            },
            {
                start: 3.40,
                length: .48,
                color: "blue"
            },
            {
                start: 5.00,
                length: .29,
                color: "cyan"
            }
        ];

        segments.forEach(
            (segment, i) => {

                const start =
                    rotation +
                    segment.start;

                const end =
                    start +
                    segment.length;

                ctx.beginPath();

                ctx.arc(
                    cx,
                    cy,
                    radius,
                    start,
                    end
                );

                let color;

                if (
                    segment.color === "gold"
                ) {
                    color =
                        `rgba(201,164,90,${.78 + glow * .18})`;
                }
                else if (
                    segment.color === "blue"
                ) {
                    color =
                        `rgba(72,130,255,${.62 + glow * .18})`;
                }
                else {
                    color =
                        `rgba(25,230,255,${.78 + glow * .18})`;
                }

                ctx.shadowBlur =
                    8 + glow * 15;

                ctx.shadowColor =
                    color;

                ctx.strokeStyle =
                    color;

                ctx.lineWidth =
                    i === 0
                        ? 2.1 + glow * 1.2
                        : 1.2 + glow * .8;

                ctx.stroke();
            }
        );

        ctx.restore();
    }


    /* =====================================================
       CENTRAL GEO / POLYGON
       ===================================================== */

    function drawGeode() {

        /*
           La géode reste beaucoup plus petite que
           l'ensemble des couronnes.

           Elle n'est PAS une sphère parfaite.

           Elle est constituée de facettes polygonales
           irrégulières, avec plusieurs couches.
        */

        const baseRadius =
            Math.min(width, height) * .105;

        const pulse =
            audioLevel * .045;

        const radius =
            baseRadius *
            (1 + pulse);

        ctx.save();

        /*
           Halo.
        */

        const halo =
            ctx.createRadialGradient(
                cx,
                cy,
                radius * .05,
                cx,
                cy,
                radius * 2.4
            );

        halo.addColorStop(
            0,
            `rgba(25,230,255,${.30 + audioLevel * .20})`
        );

        halo.addColorStop(
            .25,
            `rgba(25,190,220,${.14 + audioLevel * .12})`
        );

        halo.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );

        ctx.fillStyle = halo;

        ctx.beginPath();

        ctx.arc(
            cx,
            cy,
            radius * 2.4,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /*
           Structure externe.
        */

        const points = 14;

        const vertices = [];

        for (
            let i = 0;
            i < points;
            i++
        ) {

            const angle =
                i *
                Math.PI * 2 /
                points -
                Math.PI / 2;

            const irregular =
                0.88 +
                .12 *
                Math.sin(
                    i * 2.73
                );

            vertices.push(
                polar(
                    cx,
                    cy,
                    radius *
                    irregular,
                    angle
                )
            );
        }


        /*
           Facettes.
        */

        for (
            let i = 0;
            i < points;
            i++
        ) {

            const next =
                (i + 1) % points;

            const a =
                vertices[i];

            const b =
                vertices[next];

            const innerAngle =
                i *
                Math.PI * 2 /
                points -
                Math.PI / 2 +
                Math.PI / points;

            const innerRadius =
                radius *
                (.35 +
                 audioLevel * .08);

            const c =
                polar(
                    cx,
                    cy,
                    innerRadius *
                    (.90 +
                     .08 *
                     Math.sin(i * 3.1)),
                    innerAngle
                );

            ctx.beginPath();

            ctx.moveTo(
                cx,
                cy
            );

            ctx.lineTo(
                a.x,
                a.y
            );

            ctx.lineTo(
                c.x,
                c.y
            );

            ctx.closePath();

            const hue =
                i % 4 === 0
                    ? `rgba(36,218,238,${.20 + audioLevel * .12})`
                    : i % 5 === 0
                        ? `rgba(201,164,90,${.16 + audioLevel * .10})`
                        : `rgba(54,139,157,${.16 + audioLevel * .08})`;

            ctx.fillStyle = hue;

            ctx.fill();

            ctx.strokeStyle =
                `rgba(86,226,240,${.30 + audioLevel * .22})`;

            ctx.lineWidth = .7;

            ctx.stroke();
        }


        /*
           Facettes internes.
        */

        for (
            let layer = 1;
            layer <= 3;
            layer++
        ) {

            const r =
                radius *
                (1 -
                 layer * .19);

            const n =
                10 + layer * 2;

            ctx.beginPath();

            for (
                let i = 0;
                i < n;
                i++
            ) {

                const angle =
                    i *
                    Math.PI * 2 /
                    n +
                    layer * .31;

                const distortion =
                    1 +
                    .07 *
                    Math.sin(
                        i * 4.3 +
                        layer
                    );

                const p =
                    polar(
                        cx,
                        cy,
                        r * distortion,
                        angle
                    );

                if (i === 0) {
                    ctx.moveTo(
                        p.x,
                        p.y
                    );
                }
                else {
                    ctx.lineTo(
                        p.x,
                        p.y
                    );
                }
            }

            ctx.closePath();

            ctx.strokeStyle =
                `rgba(94,240,255,${.24 + audioLevel * .18})`;

            ctx.lineWidth =
                .55 + layer * .18;

            ctx.stroke();
        }


        /*
           Noyau central.
        */

        const core =
            ctx.createRadialGradient(
                cx - radius * .20,
                cy - radius * .25,
                1,
                cx,
                cy,
                radius * .65
            );

        core.addColorStop(
            0,
            "rgba(222,255,255,.88)"
        );

        core.addColorStop(
            .08,
            "rgba(42,221,239,.62)"
        );

        core.addColorStop(
            .32,
            "rgba(8,92,111,.44)"
        );

        core.addColorStop(
            1,
            "rgba(0,13,20,.90)"
        );

        ctx.fillStyle = core;

        ctx.beginPath();

        ctx.arc(
            cx,
            cy,
            radius * .48,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /*
           Texte central.
        */

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.font =
            "11px -apple-system, sans-serif";

        ctx.fillStyle =
            "rgba(221,252,255,.88)";

        ctx.letterSpacing = "3px";

        ctx.fillText(
            "CORE",
            cx,
            cy - 3
        );

        ctx.font =
            "6px monospace";

        ctx.fillStyle =
            "rgba(87,168,181,.80)";

        ctx.fillText(
            voiceActive
                ? "LISTENING"
                : "READY",
            cx,
            cy + 11
        );

        ctx.restore();
    }


    /* =====================================================
       CENTRAL MICRO DATA
       ===================================================== */

    function drawCentralArtifacts() {

        const r =
            Math.min(width, height) * .13;

        ctx.save();

        for (
            let i = 0;
            i < 28;
            i++
        ) {

            const angle =
                i *
                Math.PI * 2 /
                28;

            const radius =
                r *
                (.92 +
                 .09 *
                 Math.sin(i * 2.4));

            const p =
                polar(
                    cx,
                    cy,
                    radius,
                    angle
                );

            const size =
                i % 5 === 0
                    ? 2.4
                    : 1;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                size,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                i % 7 === 0
                    ? goldAlpha(.72)
                    : cyanAlpha(.50);

            ctx.fill();
        }

        ctx.restore();
    }


    /* =====================================================
       VOICE WAVE
       ===================================================== */

    function drawVoiceWave() {

        const radius =
            Math.min(width, height) * .14;

        ctx.save();

        ctx.beginPath();

        const samples = 72;

        for (
            let i = 0;
            i <= samples;
            i++
        ) {

            const angle =
                i /
                samples *
                Math.PI * 2;

            const wave =
                Math.sin(
                    i * 1.9 +
                    time * 7
                ) *
                audioLevel *
                4;

            const r =
                radius +
                wave;

            const p =
                polar(
                    cx,
                    cy,
                    r,
                    angle
                );

            if (i === 0) {
                ctx.moveTo(
                    p.x,
                    p.y
                );
            }
            else {
                ctx.lineTo(
                    p.x,
                    p.y
                );
            }
        }

        ctx.closePath();

        ctx.strokeStyle =
            `rgba(90,240,255,${.16 + audioLevel * .38})`;

        ctx.lineWidth =
            .7 + audioLevel * 1.4;

        ctx.shadowBlur =
            10 + audioLevel * 15;

        ctx.shadowColor =
            "rgba(25,230,255,.45)";

        ctx.stroke();

        ctx.restore();
    }


    /* =====================================================
       MAIN RENDER
       ===================================================== */

    function render() {

        time += .016;

        /*
           Smooth audio response.
        */

        audioLevel =
            lerp(
                audioLevel,
                targetAudio,
                .13
            );

        /*
           Decay target when not speaking.
        */

        if (!voiceActive) {

            targetAudio =
                lerp(
                    targetAudio,
                    0,
                    .045
                );
        }


        ctx.clearRect(
            0,
            0,
            width,
            height
        );


        drawAtmosphere();

        drawCentralGrid();

        drawOuterInformationField();


        /*
           Four fixed concentric rings.
        */

        ringDefinitions.forEach(
            (ring, index) => {

                const radius =
                    Math.min(width, height) *
                    ring.radius;

                /*
                   La voix ouvre légèrement les
                   espaces sans casser la composition.
                */

                const voiceExpansion =
                    audioLevel *
                    7;

                const actualRadius =
                    radius +
                    voiceExpansion *
                    (index / 3);


                const rotation =
                    time *
                    ring.speed *
                    ring.direction;


                const glow =
                    audioLevel;


                drawRingBase(
                    actualRadius,
                    ring.thickness,
                    glow
                );


                /*
                   Arcs parallèles.
                */

                drawParallelArcs(
                    actualRadius,
                    index,
                    rotation,
                    glow
                );


                /*
                   Graduation.
                */

                drawRingGraduations(
                    actualRadius,
                    index,
                    rotation,
                    glow
                );


                /*
                   Informations entre les anneaux.
                */

                const innerRadius =
                    actualRadius -
                    17;

                const outerRadius =
                    actualRadius +
                    17;

                drawRingData(
                    innerRadius,
                    outerRadius,
                    index,
                    rotation,
                    glow
                );


                /*
                   Arcs de données.
                */

                drawDataArcs(
                    actualRadius,
                    rotation,
                    index,
                    glow
                );
            }
        );


        /*
           Artefacts centraux.
        */

        drawCentralArtifacts();

        drawVoiceWave();

        drawGeode();


        /*
           Animation suivante.
        */

        requestAnimationFrame(
            render
        );
    }


    render();


    /* =====================================================
       AUDIO INPUT
       ===================================================== */

    function setupRecognition() {

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        if (!SpeechRecognition) {

            recognitionSupported = false;

            voiceText.textContent =
                "RECONNAISSANCE VOCALE NON DISPONIBLE";

            return;
        }

        recognitionSupported = true;

        recognition =
            new SpeechRecognition();

        recognition.lang =
            "fr-FR";

        recognition.continuous =
            true;

        recognition.interimResults =
            true;

        recognition.maxAlternatives =
            1;


        recognition.onstart = () => {

            voiceActive = true;

            micButton.classList.add(
                "active"
            );

            voiceText.classList.add(
                "active"
            );

            voiceText.textContent =
                "ÉCOUTE EN COURS · PARLEZ";
        };


        recognition.onresult =
            (event) => {

                let finalText = "";

                let interimText = "";

                for (
                    let i =
                        event.resultIndex;
                    i < event.results.length;
                    i++
                ) {

                    const result =
                        event.results[i];

                    const transcript =
                        result[0].transcript;

                    if (result.isFinal) {

                        finalText +=
                            transcript + " ";

                    }
                    else {

                        interimText +=
                            transcript;
                    }
                }


                const combined =
                    (
                        finalText +
                        interimText
                    ).trim();


                if (combined) {

                    currentTranscript =
                        combined;

                    voiceText.textContent =
                        combined;

                    voiceText.classList.add(
                        "active"
                    );
                }


                /*
                   L'amplitude visuelle suit
                   l'activité vocale.
                */

                targetAudio =
                    clamp(
                        .35 +
                        combined.length / 120,
                        .30,
                        1
                    );
            };


        recognition.onerror =
            (event) => {

                console.log(
                    "Speech recognition:",
                    event.error
                );

                if (
                    event.error ===
                    "not-allowed"
                ) {

                    voiceText.textContent =
                        "ACCÈS MICRO REFUSÉ";
                }
            };


        recognition.onend = () => {

            voiceActive = false;

            micButton.classList.remove(
                "active"
            );

            /*
               Redémarre si le bouton est
               toujours considéré actif.
            */

            if (
                micButton.dataset.listening ===
                "true"
            ) {

                try {

                    recognition.start();

                }
                catch (_) {}

            }
            else {

                targetAudio = 0;
            }
        };
    }

    setupRecognition();


    /* =====================================================
       MICRO BUTTON
       ===================================================== */

    micButton.addEventListener(
        "click",
        () => {

            if (!recognitionSupported) {

                voiceText.textContent =
                    "RECONNAISSANCE VOCALE NON DISPONIBLE";

                return;
            }


            if (
                micButton.dataset.listening ===
                "true"
            ) {

                micButton.dataset.listening =
                    "false";

                voiceActive = false;

                try {

                    recognition.stop();

                }
                catch (_) {}

                voiceText.textContent =
                    "AUDIO LINK · TAP MICRO TO ACTIVATE";

                voiceText.classList.remove(
                    "active"
                );

                targetAudio = 0;

            }
            else {

                micButton.dataset.listening =
                    "true";

                try {

                    recognition.start();

                }
                catch (_) {

                    /*
                       Sur certains navigateurs,
                       start() peut être appelé
                       pendant une session existante.
                    */
                }
            }
        }
    );


    /* =====================================================
       SEND TO SHORTCUTS
       ===================================================== */

    shortcutButton.addEventListener(
        "click",
        () => {

            if (!currentTranscript) {

                voiceText.textContent =
                    "AUCUNE COMMANDE À ENVOYER";

                return;
            }


            /*
               URL Scheme iOS.

               Le raccourci peut être nommé :
               JARVIS

               Le texte reconnu est passé
               comme paramètre input.
            */

            const encoded =
                encodeURIComponent(
                    currentTranscript
                );


            const shortcutURL =
                "shortcuts://run-shortcut" +
                "?name=JARVIS" +
                "&input=" +
                encoded;


            window.location.href =
                shortcutURL;


            voiceText.textContent =
                "COMMANDE TRANSMISE À RACCOURCIS";
        }
    );


    /* =====================================================
       SYNTHESIS VOICE
       ===================================================== */

    function speakJarvis() {

        if (
            !("speechSynthesis" in window)
        ) {

            voiceText.textContent =
                "SYNTHÈSE VOCALE NON DISPONIBLE";

            return;
        }


        const text =
            currentTranscript ||
            "Bonjour. JARVIS est opérationnel.";


        window.speechSynthesis.cancel();


        const utterance =
            new SpeechSynthesisUtterance(
                text
            );

        utterance.lang =
            "fr-FR";

        utterance.rate =
            .92;

        utterance.pitch =
            .82;

        utterance.volume =
            1;


        utterance.onstart = () => {

            speaking = true;

            speakButton.classList.add(
                "active"
            );

            targetAudio = .55;
        };


        utterance.onend = () => {

            speaking = false;

            speakButton.classList.remove(
                "active"
            );

            targetAudio = 0;
        };


        window.speechSynthesis.speak(
            utterance
        );
    }


    speakButton.addEventListener(
        "click",
        speakJarvis
    );


    /* =====================================================
       TOUCH / TAP ON CORE
       ===================================================== */

    canvas.addEventListener(
        "click",
        () => {

            targetAudio =
                Math.max(
                    targetAudio,
                    .28
                );

            setTimeout(
                () => {

                    targetAudio =
                        Math.min(
                            targetAudio,
                            .08
                        );

                },
                350
            );
        }
    );


    /* =====================================================
       KEYBOARD SUPPORT
       ===================================================== */

    window.addEventListener(
        "keydown",
        (event) => {

            if (
                event.code ===
                "Space"
            ) {

                event.preventDefault();

                micButton.click();
            }

            if (
                event.key === "Enter"
            ) {

                speakButton.click();
            }
        }
    );


    /* =====================================================
       VISUAL VOICE PULSE
       ===================================================== */

    setInterval(
        () => {

            if (voiceActive) {

                /*
                   Variation permanente pendant
                   la parole afin d'éviter une
                   animation mécanique trop parfaite.
                */

                targetAudio =
                    clamp(
                        targetAudio +
                        (
                            Math.random() -
                            .5
                        ) *
                        .20,
                        .25,
                        1
                    );
            }

        },
        90
    );


    /* =====================================================
       INITIAL STATE
       ===================================================== */

    voiceText.textContent =
        "AUDIO LINK · TAP MICRO TO ACTIVATE";

})();
</script>

</body>
