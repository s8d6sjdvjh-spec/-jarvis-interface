<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>JARVIS — Gyrotourbillon</title>

<style>
:root {
    --bg: #02080b;
    --cyan: #00d9ff;
    --cyan-soft: #3e8797;
    --cyan-dim: #16434e;
    --white: #d9f5fa;
    --muted: #426b75;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--white);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}

body {
    min-height: 100svh;
}

#app {
    position: relative;
    width: 100%;
    height: 100svh;
    overflow: hidden;
    background:
        radial-gradient(
            ellipse at 50% 46%,
            rgba(0, 42, 52, .28),
            transparent 42%
        ),
        #02080b;
}

/* --------------------------------------------------
   GRID
-------------------------------------------------- */

#grid {
    position: absolute;
    inset: 0;
    opacity: .24;
    background-image:
        linear-gradient(
            rgba(0, 126, 147, .18) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0, 126, 147, .18) 1px,
            transparent 1px
        );
    background-size: 44px 44px;
    pointer-events: none;
}

/* --------------------------------------------------
   HEADER
-------------------------------------------------- */

header {
    position: absolute;
    z-index: 10;
    top: max(28px, env(safe-area-inset-top));
    left: 0;
    width: 100%;
    padding: 0 7%;
}

.header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: clamp(22px, 7vw, 31px);
    letter-spacing: .43em;
    font-weight: 300;
    white-space: nowrap;
}

.status {
    display: flex;
    align-items: center;
    gap: clamp(13px, 3vw, 25px);
}

.status-item {
    display: flex;
    align-items: center;
    gap: 7px;
    color: #6d929b;
    font-size: clamp(8px, 2.4vw, 11px);
    letter-spacing: .28em;
    white-space: nowrap;
}

.status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow:
        0 0 5px rgba(0,217,255,.9),
        0 0 13px rgba(0,217,255,.4);
}

.subtitle {
    margin-top: 43px;
    text-align: center;
    color: #416873;
    font-size: clamp(8px, 2.7vw, 12px);
    letter-spacing: .43em;
    white-space: nowrap;
}

/* --------------------------------------------------
   MAIN CANVAS
-------------------------------------------------- */

#scene {
    position: absolute;
    z-index: 2;
    left: 0;
    width: 100%;
    top: 17%;
    height: 59%;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

/* --------------------------------------------------
   DATA CARDS
-------------------------------------------------- */

.cards {
    position: absolute;
    z-index: 8;
    left: 5.5%;
    right: 5.5%;
    bottom: max(48px, env(safe-area-inset-bottom));
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 16px;
}

.card {
    position: relative;
    height: 112px;
    padding: 19px 19px 14px;
    border: 1px solid rgba(0, 199, 229, .58);
    background:
        linear-gradient(
            135deg,
            rgba(0, 35, 43, .46),
            rgba(0, 10, 14, .68)
        );
    overflow: hidden;
}

.card::before,
.card::after {
    content: "";
    position: absolute;
    width: 8px;
    height: 8px;
    border-color: var(--cyan);
}

.card::before {
    top: -1px;
    left: -1px;
    border-top: 1px solid;
    border-left: 1px solid;
}

.card::after {
    right: -1px;
    bottom: -1px;
    border-right: 1px solid;
    border-bottom: 1px solid;
}

.card-title {
    color: #52b4c6;
    font-size: 10px;
    letter-spacing: .36em;
}

.card-value {
    margin-top: 12px;
    font-size: 36px;
    font-weight: 300;
    letter-spacing: .02em;
    color: #d4f4f8;
}

.card-description {
    margin-top: 7px;
    color: #4c737c;
    font-size: 9px;
    letter-spacing: .22em;
}

.card-scale {
    position: absolute;
    right: 13px;
    top: 21px;
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.card-scale i {
    display: block;
    width: 5px;
    height: 5px;
    border: 1px solid rgba(0, 217, 255, .65);
    border-radius: 50%;
}

/* --------------------------------------------------
   SMALL SCREENS
-------------------------------------------------- */

@media (max-width: 380px) {

    .status {
        gap: 9px;
    }

    .status-item {
        letter-spacing: .18em;
        gap: 4px;
    }

    .subtitle {
        letter-spacing: .29em;
    }

    .card {
        height: 102px;
        padding: 15px;
    }

    .card-value {
        font-size: 32px;
    }
}

@media (orientation: landscape) {

    #scene {
        top: 12%;
        height: 67%;
    }

    .cards {
        bottom: 20px;
    }

    .card {
        height: 82px;
    }
}
</style>
</head>

<body>

<div id="app">

    <div id="grid"></div>

    <header>

        <div class="header-row">

            <div class="logo">JARVIS</div>

            <div class="status">

                <div class="status-item">
                    <span class="status-dot"></span>
                    ONLINE
                </div>

                <div class="status-item">
                    <span class="status-dot"></span>
                    SECURE
                </div>

                <div class="status-item">
                    <span class="status-dot"></span>
                    VOICE
                </div>

            </div>

        </div>

        <div class="subtitle">
            GYROTOURBILLON · PRECISION CORE · 3 AXIS
        </div>

    </header>

    <main id="scene">
        <canvas id="canvas"></canvas>
    </main>

    <section class="cards">

        <div class="card">
            <div class="card-title">MAISON</div>
            <div class="card-value">03</div>
            <div class="card-description">
                DISPOSITIFS ACTIFS
            </div>
            <div class="card-scale">
                <i></i><i></i><i></i><i></i><i></i>
                <i></i><i></i>
            </div>
        </div>

        <div class="card">
            <div class="card-title">MÉTÉO</div>
            <div class="card-value">18°</div>
            <div class="card-description">
                CONDITIONS STABLES
            </div>
            <div class="card-scale">
                <i></i><i></i><i></i><i></i><i></i>
                <i></i><i></i>
            </div>
        </div>

        <div class="card">
            <div class="card-title">SYSTÈME</div>
            <div class="card-value">82%</div>
            <div class="card-description">
                PERFORMANCE
            </div>
            <div class="card-scale">
                <i></i><i></i><i></i><i></i><i></i>
                <i></i><i></i>
            </div>
        </div>

        <div class="card">
            <div class="card-title">ACTIVITÉ</div>
            <div class="card-value">12</div>
            <div class="card-description">
                ÉVÉNEMENTS RÉCENTS
            </div>
            <div class="card-scale">
                <i></i><i></i><i></i><i></i><i></i>
                <i></i><i></i>
            </div>
        </div>

    </section>

</div>

<script>
/* ==================================================
   JARVIS GYROTOURBILLON
   Canvas 2D / pseudo-3D horloger
   ================================================== */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {
    alpha: true
});

let W = 0;
let H = 0;
let DPR = 1;

function resize() {

    const rect = canvas.getBoundingClientRect();

    DPR = Math.min(window.devicePixelRatio || 1, 2);

    W = rect.width;
    H = rect.height;

    canvas.width = W * DPR;
    canvas.height = H * DPR;

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );
}

window.addEventListener("resize", resize);
resize();

/* --------------------------------------------------
   CONFIGURATION VISUELLE
-------------------------------------------------- */

/*
   Le gyrotourbillon représente environ 20 %
   de la largeur de l'écran.

   Les couronnes occupent la majorité de la zone
   supérieure mais gardent une marge nette avec
   les bords.
*/

const CONFIG = {

    gyroWidthRatio: 0.20,

    /* marge entre écran et couronne externe */
    edgeMarginRatio: 0.115,

    /* espace entre gyro et première couronne */
    gyroGapRatio: 0.055,

    /* nombre de couronnes */
    rings: 5,

    /* épaisseur visuelle des couronnes */
    ringThickness: 0.55,

    /* densité des graduations */
    tickDensity: 72,

    /* vitesses des trois axes */
    axisXSpeed: 0.00073,
    axisYSpeed: -0.00107,
    axisZSpeed: 0.00163
};

/* --------------------------------------------------
   MATHS
-------------------------------------------------- */

function clamp(v, a, b) {
    return Math.max(a, Math.min(b, v));
}

function lerp(a, b, t) {
    return a + (b - a) * t;
}

/*
   Projection pseudo-3D.
   x / y = position dans le plan
   z     = profondeur
*/

function project(x, y, z, cx, cy, scale) {

    const perspective = 1 / (1 + z * 0.72);

    return {
        x: cx + x * scale * perspective,
        y: cy + y * scale * perspective,
        p: perspective
    };
}

/* --------------------------------------------------
   COULEURS MÉTALLIQUES
-------------------------------------------------- */

function metallicStroke(angle, alpha = 1) {

    const grad = ctx.createLinearGradient(
        -1,
        -1,
        1,
        1
    );

    grad.addColorStop(
        0,
        `rgba(22,31,34,${alpha})`
    );

    grad.addColorStop(
        .18,
        `rgba(220,235,236,${alpha})`
    );

    grad.addColorStop(
        .32,
        `rgba(70,84,87,${alpha})`
    );

    grad.addColorStop(
        .52,
        `rgba(7,12,14,${alpha})`
    );

    grad.addColorStop(
        .70,
        `rgba(190,205,207,${alpha})`
    );

    grad.addColorStop(
        .84,
        `rgba(35,42,44,${alpha})`
    );

    grad.addColorStop(
        1,
        `rgba(4,8,9,${alpha})`
    );

    return grad;
}

/* --------------------------------------------------
   GLOW CYAN
-------------------------------------------------- */

function glowRing(cx, cy, radius, alpha) {

    ctx.save();

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radius,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle =
        `rgba(0,190,220,${alpha})`;

    ctx.lineWidth = 1;

    ctx.shadowColor =
        `rgba(0,220,255,${alpha})`;

    ctx.shadowBlur = 7;

    ctx.stroke();

    ctx.restore();
}

/* --------------------------------------------------
   COURONNE DE PRÉCISION
-------------------------------------------------- */

function precisionRing(
    cx,
    cy,
    radius,
    index,
    time
) {

    const rotation =
        time *
        (0.000035 + index * 0.000009) *
        (index % 2 ? -1 : 1);

    ctx.save();

    ctx.translate(cx, cy);
    ctx.rotate(rotation);

    /* cercle principal extrêmement fin */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        radius,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle =
        "rgba(18,104,119,.75)";

    ctx.lineWidth =
        index === 0 ? 1.1 : .65;

    ctx.stroke();

    /* second fil mécanique */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        radius - 5,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle =
        "rgba(0,189,219,.30)";

    ctx.lineWidth = .55;

    ctx.stroke();

    /* graduations */

    const count =
        CONFIG.tickDensity +
        index * 24;

    for (let i = 0; i < count; i++) {

        const a =
            (i / count) *
            Math.PI * 2;

        /*
          variation irrégulière :
          les graduations ne sont pas toutes
          de la même longueur
        */

        const wave =
            Math.sin(i * 2.31 + index * 1.8);

        const major =
            i % 12 === 0;

        const medium =
            i % 4 === 0;

        let length;

        if (major) {
            length = 10 + wave * 2;
        }
        else if (medium) {
            length = 6 + wave * 1.5;
        }
        else {
            length = 3.2 + wave * 1.2;
        }

        /*
          orientation vers le centre
        */

        const r1 = radius - 1;
        const r2 = r1 - length;

        const x1 = Math.cos(a) * r1;
        const y1 = Math.sin(a) * r1;

        const x2 = Math.cos(a) * r2;
        const y2 = Math.sin(a) * r2;

        ctx.beginPath();

        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);

        if (major) {

            ctx.strokeStyle =
                "rgba(210,239,242,.80)";

            ctx.lineWidth = 1.35;

        }
        else if (medium) {

            ctx.strokeStyle =
                "rgba(40,153,171,.75)";

            ctx.lineWidth = .9;

        }
        else {

            ctx.strokeStyle =
                "rgba(24,108,123,.62)";

            ctx.lineWidth = .55;
        }

        ctx.stroke();

        /*
          petits symboles techniques
        */

        if (
            major &&
            index === 0
        ) {

            const sx =
                Math.cos(a) *
                (radius - 18);

            const sy =
                Math.sin(a) *
                (radius - 18);

            ctx.fillStyle =
                "rgba(0,205,230,.72)";

            ctx.beginPath();

            ctx.arc(
                sx,
                sy,
                1.4,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }
    }

    /*
      petits points radiaux
    */

    for (let i = 0; i < 18; i++) {

        const a =
            (i / 18) *
            Math.PI * 2 +
            .11 * index;

        const rr =
            radius - 15;

        ctx.fillStyle =
            "rgba(0,205,230,.65)";

        ctx.beginPath();

        ctx.arc(
            Math.cos(a) * rr,
            Math.sin(a) * rr,
            1,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.restore();
}

/* --------------------------------------------------
   AXE 3D
-------------------------------------------------- */

function drawAxis(
    cx,
    cy,
    length,
    angleX,
    angleY,
    angleZ,
    alpha = 1
) {

    /*
      Projection simple d'un axe 3D.
    */

    const sx =
        Math.cos(angleY) *
        Math.cos(angleZ);

    const sy =
        Math.sin(angleX) *
        .42 +
        Math.sin(angleZ) *
        .58;

    const ex =
        sx * length;

    const ey =
        sy * length;

    ctx.save();

    ctx.translate(cx, cy);

    /* ombre */

    ctx.beginPath();

    ctx.moveTo(-ex, -ey);
    ctx.lineTo(ex, ey);

    ctx.strokeStyle =
        `rgba(0,0,0,.72)`;

    ctx.lineWidth = 5;

    ctx.stroke();

    /* métal */

    const gradient =
        ctx.createLinearGradient(
            -ex,
            -ey,
            ex,
            ey
        );

    gradient.addColorStop(
        0,
        `rgba(15,22,24,${alpha})`
    );

    gradient.addColorStop(
        .22,
        `rgba(200,214,215,${alpha})`
    );

    gradient.addColorStop(
        .32,
        `rgba(65,75,77,${alpha})`
    );

    gradient.addColorStop(
        .5,
        `rgba(8,12,13,${alpha})`
    );

    gradient.addColorStop(
        .68,
        `rgba(205,220,221,${alpha})`
    );

    gradient.addColorStop(
        1,
        `rgba(20,26,27,${alpha})`
    );

    ctx.beginPath();

    ctx.moveTo(-ex, -ey);
    ctx.lineTo(ex, ey);

    ctx.strokeStyle = gradient;

    ctx.lineWidth = 2.1;

    ctx.stroke();

    /* extrémités */

    for (const s of [-1, 1]) {

        ctx.beginPath();

        ctx.arc(
            ex * s,
            ey * s,
            2.8,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "rgba(165,190,192,.85)";

        ctx.fill();
    }

    ctx.restore();
}

/* --------------------------------------------------
   ANNEAU MÉCANIQUE DU GYRO
-------------------------------------------------- */

function mechanicalRing(
    cx,
    cy,
    radius,
    rotation,
    tilt,
    brass = false
) {

    ctx.save();

    ctx.translate(cx, cy);
    ctx.rotate(rotation);

    /*
      ellipse = anneau vu avec une inclinaison
    */

    ctx.scale(
        1,
        clamp(Math.cos(tilt), .18, 1)
    );

    /* ombre extérieure */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        radius,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle =
        "rgba(0,0,0,.92)";

    ctx.lineWidth = 7;

    ctx.stroke();

    /* métal */

    const metal =
        brass
        ? (() => {

            const g =
                ctx.createLinearGradient(
                    -radius,
                    0,
                    radius,
                    0
                );

            g.addColorStop(
                0,
                "#241b08"
            );

            g.addColorStop(
                .25,
                "#a77a25"
            );

            g.addColorStop(
                .42,
                "#e1bd62"
            );

            g.addColorStop(
                .55,
                "#5b4316"
            );

            g.addColorStop(
                .78,
                "#c29437"
            );

            g.addColorStop(
                1,
                "#211806"
            );

            return g;

        })()
        : metallicStroke(rotation, 1);

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        radius,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle = metal;

    ctx.lineWidth = 2.8;

    ctx.stroke();

    /*
      arête secondaire
    */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        radius - 4,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle =
        brass
        ? "rgba(231,187,77,.55)"
        : "rgba(144,170,173,.42)";

    ctx.lineWidth = .75;

    ctx.stroke();

    /*
      micro-ciselures
    */

    const teeth = 32;

    for (let i = 0; i < teeth; i++) {

        const a =
            i / teeth *
            Math.PI * 2;

        const r1 = radius - 1;
        const r2 =
            radius -
            (i % 4 === 0 ? 7 : 4);

        ctx.beginPath();

        ctx.moveTo(
            Math.cos(a) * r1,
            Math.sin(a) * r1
        );

        ctx.lineTo(
            Math.cos(a) * r2,
            Math.sin(a) * r2
        );

        ctx.strokeStyle =
            brass
            ? "rgba(236,195,92,.55)"
            : "rgba(175,198,200,.45)";

        ctx.lineWidth =
            i % 4 === 0 ? 1 : .55;

        ctx.stroke();
    }

    ctx.restore();
}

/* --------------------------------------------------
   PETITS ENGRENAGES
-------------------------------------------------- */

function gear(
    cx,
    cy,
    radius,
    teeth,
    rotation,
    brass = false
) {

    ctx.save();

    ctx.translate(cx, cy);
    ctx.rotate(rotation);

    ctx.beginPath();

    for (let i = 0; i < teeth; i++) {

        const a =
            i / teeth *
            Math.PI * 2;

        const r =
            radius +
            (i % 2 === 0 ? 2.2 : 0);

        const x =
            Math.cos(a) * r;

        const y =
            Math.sin(a) * r;

        if (i === 0) {
            ctx.moveTo(x, y);
        }
        else {
            ctx.lineTo(x, y);
        }
    }

    ctx.closePath();

    ctx.fillStyle =
        brass
        ? "#7c5c1c"
        : "#242e30";

    ctx.fill();

    ctx.strokeStyle =
        brass
        ? "rgba(230,188,75,.7)"
        : "rgba(155,179,181,.48)";

    ctx.lineWidth = .7;

    ctx.stroke();

    /*
      centre
    */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        radius * .34,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#080d0f";

    ctx.fill();

    ctx.strokeStyle =
        brass
        ? "rgba(219,176,64,.8)"
        : "rgba(129,157,160,.65)";

    ctx.stroke();

    ctx.restore();
}

/* --------------------------------------------------
   RUBIS CENTRAL
-------------------------------------------------- */

function ruby(cx, cy, r) {

    /*
      beaucoup moins rouge que les versions
      précédentes.
    */

    const glow =
        ctx.createRadialGradient(
            cx - r * .25,
            cy - r * .3,
            0,
            cx,
            cy,
            r * 2.5
        );

    glow.addColorStop(
        0,
        "rgba(255,65,92,.18)"
    );

    glow.addColorStop(
        .4,
        "rgba(125,15,30,.10)"
    );

    glow.addColorStop(
        1,
        "rgba(80,0,10,0)"
    );

    ctx.fillStyle = glow;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        r * 2.5,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /*
      pierre
    */

    const stone =
        ctx.createRadialGradient(
            cx - r * .35,
            cy - r * .4,
            r * .08,
            cx,
            cy,
            r
        );

    stone.addColorStop(
        0,
        "#ffdce1"
    );

    stone.addColorStop(
        .16,
        "#b9344a"
    );

    stone.addColorStop(
        .48,
        "#641624"
    );

    stone.addColorStop(
        .78,
        "#210912"
    );

    stone.addColorStop(
        1,
        "#070307"
    );

    ctx.fillStyle = stone;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        r,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.strokeStyle =
        "rgba(206,84,103,.65)";

    ctx.lineWidth = .65;

    ctx.stroke();

    /*
      reflet interne
    */

    ctx.fillStyle =
        "rgba(255,255,255,.65)";

    ctx.beginPath();

    ctx.arc(
        cx - r * .34,
        cy - r * .38,
        r * .18,
        0,
        Math.PI * 2
    );

    ctx.fill();
}

/* --------------------------------------------------
   GYROTOURBILLON
-------------------------------------------------- */

function drawGyro(
    cx,
    cy,
    baseRadius,
    time
) {

    /*
      Trois rotations réellement indépendantes.
    */

    const ax =
        time * CONFIG.axisXSpeed;

    const ay =
        time * CONFIG.axisYSpeed;

    const az =
        time * CONFIG.axisZSpeed;

    /*
      légère rotation globale
    */

    const global =
        time * .000055;

    /*
      halo discret
    */

    ctx.save();

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        baseRadius * 1.08,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle =
        "rgba(0,130,150,.17)";

    ctx.lineWidth = 1;

    ctx.stroke();

    ctx.restore();

    /*
      premier anneau vertical
    */

    mechanicalRing(
        cx,
        cy,
        baseRadius,
        global + ax,
        ay,
        false
    );

    /*
      deuxième axe
    */

    mechanicalRing(
        cx,
        cy,
        baseRadius * .82,
        -global * 1.7 + ay,
        ax + .55,
        false
    );

    /*
      cage interne en laiton
    */

    mechanicalRing(
        cx,
        cy,
        baseRadius * .61,
        global * 1.4 + az,
        ay + .95,
        true
    );

    /*
      engrenages internes
    */

    gear(
        cx - baseRadius * .22,
        cy + baseRadius * .08,
        baseRadius * .19,
        24,
        az * 2.0,
        true
    );

    gear(
        cx + baseRadius * .19,
        cy - baseRadius * .15,
        baseRadius * .15,
        20,
        -ay * 2.2,
        false
    );

    /*
      axe X
    */

    drawAxis(
        cx,
        cy,
        baseRadius * 1.02,
        ax,
        ay,
        az,
        .9
    );

    /*
      axe Y — orientation différente
    */

    ctx.save();

    ctx.translate(cx, cy);
    ctx.rotate(Math.PI / 2);

    drawAxis(
        0,
        0,
        baseRadius * .88,
        ay,
        az,
        ax,
        .78
    );

    ctx.restore();

    /*
      petits ponts mécaniques
    */

    ctx.save();

    ctx.translate(cx, cy);
    ctx.rotate(az);

    ctx.strokeStyle =
        "rgba(175,191,191,.75)";

    ctx.lineWidth = 1.3;

    ctx.beginPath();

    ctx.moveTo(
        -baseRadius * .53,
        0
    );

    ctx.lineTo(
        baseRadius * .53,
        0
    );

    ctx.stroke();

    ctx.restore();

    /*
      vis de fixation
    */

    const screwPositions = [
        [-.72, -.08],
        [.72, .08],
        [-.08, .72],
        [.08, -.72]
    ];

    for (const p of screwPositions) {

        const x =
            cx + p[0] * baseRadius;

        const y =
            cy + p[1] * baseRadius;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            2.4,
            0,
            Math.PI * 2
        );

        const screw =
            ctx.createRadialGradient(
                x - 1,
                y - 1,
                0,
                x,
                y,
                3
            );

        screw.addColorStop(
            0,
            "#eef5f5"
        );

        screw.addColorStop(
            .35,
            "#738386"
        );

        screw.addColorStop(
            1,
            "#111718"
        );

        ctx.fillStyle = screw;

        ctx.fill();
    }

    /*
      rubis central
    */

    ruby(
        cx,
        cy,
        baseRadius * .115
    );
}

/* --------------------------------------------------
   REPÈRES CARDINAUX
-------------------------------------------------- */

function cardinal(
    cx,
    cy,
    radius,
    angle,
    text
) {

    const x =
        cx + Math.cos(angle) * radius;

    const y =
        cy + Math.sin(angle) * radius;

    ctx.save();

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.font =
        "9px -apple-system, BlinkMacSystemFont, sans-serif";

    ctx.fillStyle =
        "rgba(77,172,190,.82)";

    ctx.fillText(
        text,
        x,
        y
    );

    ctx.restore();
}

/* --------------------------------------------------
   RENDU PRINCIPAL
-------------------------------------------------- */

let start =
    performance.now();

function render(now) {

    const time =
        now - start;

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    const cx =
        W * .5;

    /*
      centre légèrement au-dessus
      du centre de la zone.
    */

    const cy =
        H * .47;

    /*
      diamètre des couronnes :
      marge d'environ 11.5 %
      de chaque côté.
    */

    const outerRadius =
        Math.min(
            W * (0.5 - CONFIG.edgeMarginRatio),
            H * .48
        );

    /*
      couronnes très rapprochées.
    */

    const ringSpacing =
        Math.min(
            W * .047,
            31
        );

    /*
      gyrotourbillon = ~20 % largeur écran.
    */

    const gyroRadius =
        W *
        CONFIG.gyroWidthRatio *
        .5;

    /*
      fond radial très discret
    */

    const ambient =
        ctx.createRadialGradient(
            cx,
            cy,
            gyroRadius * .2,
            cx,
            cy,
            outerRadius
        );

    ambient.addColorStop(
        0,
        "rgba(0,47,57,.20)"
    );

    ambient.addColorStop(
        .45,
        "rgba(0,23,29,.08)"
    );

    ambient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle = ambient;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        outerRadius,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /*
      couronnes.
      La plus grande n'est PAS collée au bord.
    */

    for (
        let i = 0;
        i < CONFIG.rings;
        i++
    ) {

        const radius =
            outerRadius -
            i * ringSpacing;

        precisionRing(
            cx,
            cy,
            radius,
            i,
            time
        );
    }

    /*
      cercle discret juste autour
      du gyrotourbillon
    */

    const innerRadius =
        gyroRadius +
        W * CONFIG.gyroGapRatio;

    glowRing(
        cx,
        cy,
        innerRadius,
        .23
    );

    /*
      cardinales de précision
    */

    cardinal(
        cx,
        cy,
        outerRadius + 1,
        -Math.PI / 2,
        "00"
    );

    cardinal(
        cx,
        cy,
        outerRadius + 1,
        0,
        "270"
    );

    cardinal(
        cx,
        cy,
        outerRadius + 1,
        Math.PI / 2,
        "180"
    );

    cardinal(
        cx,
        cy,
        outerRadius + 1,
        Math.PI,
        "90"
    );

    /*
      gyrotourbillon
    */

    drawGyro(
        cx,
        cy,
        gyroRadius,
        time
    );

    requestAnimationFrame(render);
}

requestAnimationFrame(render);

/* --------------------------------------------------
   REDUCTION DU MOUVEMENT
-------------------------------------------------- */

if (
    window.matchMedia(
        "(prefers-reduced-motion: reduce)"
    ).matches
) {

    /*
      Le rendu reste fonctionnel,
      mais l'animation sera plus lente.
    */

    CONFIG.axisXSpeed *= .25;
    CONFIG.axisYSpeed *= .25;
    CONFIG.axisZSpeed *= .25;
}
</script>

</body>
