<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>J.A.R.V.I.S — Interface Vocale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#03070a;
    --cyan:#3ff2ff;
    --cyan-dim:#0f6b78;
    --cyan-glow:rgba(63,242,255,.55);
    --amber:#ffb454;
    --white:#e8fbff;
    --panel:rgba(4,18,22,.72);
    --border:rgba(63,242,255,.35);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    background:var(--bg);
    overflow:hidden;
    font-family:'Share Tech Mono',monospace;
    color:var(--white);
    -webkit-tap-highlight-color:transparent;
  }
  #scene{position:fixed;inset:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}

  .vignette{
    position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.55) 100%);
  }
  .scanlines{
    position:fixed;inset:0;pointer-events:none;z-index:6;opacity:.08;
    background:repeating-linear-gradient(0deg, #fff 0px, transparent 1px, transparent 3px);
    mix-blend-mode:overlay;
  }

  .frame{position:fixed;inset:0;pointer-events:none;z-index:7;}
  .bracket{position:absolute;width:34px;height:34px;border:2px solid var(--cyan);opacity:.75;filter:drop-shadow(0 0 4px var(--cyan-glow));}
  .bracket.tl{top:16px;left:16px;border-right:none;border-bottom:none;}
  .bracket.tr{top:16px;right:16px;border-left:none;border-bottom:none;}
  .bracket.bl{bottom:16px;left:16px;border-right:none;border-top:none;}
  .bracket.br{bottom:16px;right:16px;border-left:none;border-top:none;}

  header{
    position:fixed;top:0;left:0;right:0;z-index:8;
    display:flex;flex-direction:column;align-items:center;
    padding:22px 12px 0;pointer-events:none;
  }
  header h1{
    margin:0;font-family:'Orbitron',sans-serif;font-weight:900;
    font-size:clamp(18px,4.2vw,26px);letter-spacing:.35em;
    color:var(--white);text-shadow:0 0 12px var(--cyan-glow),0 0 2px #fff;
  }
  header .sub{
    margin-top:4px;font-size:11px;letter-spacing:.3em;color:var(--cyan);
    opacity:.85;
  }

  .telemetry{
    position:fixed;top:70px;z-index:8;font-size:10px;line-height:1.7;
    color:var(--cyan-dim);letter-spacing:.05em;pointer-events:none;
    text-shadow:0 0 6px rgba(63,242,255,.25);
    display:none;
  }
  .telemetry.left{left:18px;text-align:left;}
  .telemetry.right{right:18px;text-align:right;}
  @media(min-width:640px){ .telemetry{display:block;} }
  .telemetry span{display:block;color:var(--cyan);opacity:.7;}

  #panel{
    position:fixed;left:0;right:0;bottom:0;z-index:9;
    display:flex;flex-direction:column;align-items:center;gap:10px;
    padding:14px 14px calc(16px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, transparent, rgba(2,10,13,.85) 30%, rgba(2,10,13,.96));
    backdrop-filter:blur(2px);
  }
  #status{
    font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:.28em;
    color:var(--cyan);text-shadow:0 0 8px var(--cyan-glow);
    min-height:16px;transition:color .2s;
  }
  #status.hot{color:var(--amber);text-shadow:0 0 10px rgba(255,180,84,.6);}

  #transcriptBox{
    width:100%;max-width:560px;min-height:46px;max-height:96px;overflow-y:auto;
    border:1px solid var(--border);border-radius:6px;background:var(--panel);
    padding:8px 12px;font-size:14px;line-height:1.4;color:var(--white);
  }
  #transcriptBox .interim{color:var(--cyan-dim);}
  #transcriptBox .placeholder{color:var(--cyan-dim);font-style:italic;}

  .controls{
    width:100%;max-width:560px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    justify-content:center;
  }
  .field{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--cyan-dim);letter-spacing:.05em;}
  .field input[type=text]{
    background:var(--panel);border:1px solid var(--border);border-radius:4px;
    color:var(--white);padding:6px 8px;font-family:'Share Tech Mono',monospace;font-size:12px;width:120px;
  }
  .field input[type=checkbox]{accent-color:var(--cyan);}

  #micBtn{
    width:60px;height:60px;border-radius:50%;flex:0 0 auto;
    border:2px solid var(--cyan);background:radial-gradient(circle,rgba(63,242,255,.15),transparent 70%);
    color:var(--cyan);display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 16px rgba(63,242,255,.35);cursor:pointer;transition:.15s;
  }
  #micBtn.active{
    background:radial-gradient(circle,rgba(255,180,84,.28),transparent 70%);
    border-color:var(--amber);color:var(--amber);
    box-shadow:0 0 22px rgba(255,180,84,.55);
  }
  #micBtn svg{width:26px;height:26px;}

  button.ghost{
    border:1px solid var(--border);background:var(--panel);color:var(--cyan);
    padding:8px 14px;border-radius:5px;font-family:'Orbitron',sans-serif;font-size:11px;
    letter-spacing:.15em;cursor:pointer;
  }
  button.ghost:disabled{opacity:.35;cursor:not-allowed;}
  button.ghost:active{background:rgba(63,242,255,.18);}

  #note{font-size:10px;color:var(--cyan-dim);text-align:center;max-width:560px;letter-spacing:.03em;}

  @media (prefers-reduced-motion: reduce){
    * { animation:none !important; }
  }
</style>
</head>
<body>

<div id="scene"><canvas id="hud"></canvas></div>
<div class="vignette"></div>
<div class="scanlines"></div>

<div class="frame">
  <div class="bracket tl"></div><div class="bracket tr"></div>
  <div class="bracket bl"></div><div class="bracket br"></div>
</div>

<header>
  <h1>J . A . R . V . I . S</h1>
  <div class="sub">INTERFACE VOCALE — RACCOURCIS iOS</div>
</header>

<div class="telemetry left" id="telLeft"></div>
<div class="telemetry right" id="telRight"></div>

<div id="panel">
  <div id="status">EN VEILLE</div>
  <div id="transcriptBox"><span class="placeholder">Appuyez sur le micro et parlez…</span></div>

  <div class="controls">
    <div class="field">
      <label for="shortcutName">Raccourci</label>
      <input type="text" id="shortcutName" value="Assistant" spellcheck="false">
    </div>

    <button id="micBtn" title="Activer le micro">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
        <path d="M19 11a7 7 0 0 1-14 0"/>
        <path d="M12 18v3"/>
      </svg>
    </button>

    <button id="sendBtn" class="ghost" disabled>ENVOYER →</button>
  </div>

  <div class="field">
    <input type="checkbox" id="autoSend">
    <label for="autoSend">Envoi automatique dès qu'une phrase est reconnue</label>
  </div>

  <div id="note">Fonctionne dans Safari sur iPhone. Le raccourci indiqué doit exister dans l'app Raccourcis et accepter un texte en entrée.</div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- CANVAS / HUD RINGS ---------- */
  const canvas = document.getElementById('hud');
  const ctx = canvas.getContext('2d');
  let W, H, cx, cy, dpr;

  function resize(){
    dpr = Math.min(window.devicePixelRatio||1, 2);
    W = canvas.clientWidth = window.innerWidth;
    H = canvas.clientHeight = window.innerHeight;
    canvas.width = W*dpr; canvas.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    cx = W/2; cy = H/2;
    buildRings();
  }

  const CYAN = '#3ff2ff', AMBER = '#ffb454', WHITE='#eafcff';
  const SYMBOLS = ['Σ','Δ','Ω','λ','Φ','Ψ','Θ','Ξ','π','∞','µ','∇'];
  function hex4(){ return '0x'+Math.floor(Math.random()*0xFFFF).toString(16).toUpperCase().padStart(4,'0'); }
  function code(){
    const p = ['SYS','NAV','PWR','AUX','COM','ARC','NET','GYR'];
    return p[Math.floor(Math.random()*p.length)]+'-'+Math.floor(Math.random()*90+10);
  }
  function bin(){
    let s=''; for(let i=0;i<8;i++) s+= Math.random()<0.5?'0':'1'; return s;
  }
  function randomLabel(i){
    const r = Math.random();
    if(r<0.34) return hex4();
    if(r<0.62) return code();
    if(r<0.8) return bin();
    return SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)];
  }

  let rings = [];
  function buildRings(){
    rings = [];
    const base = Math.min(W,H) * 0.09;
    const count = 6;
    for(let i=0;i<count;i++){
      const radius = base + i * (Math.min(W,H)*0.052);
      const tickCount = 20 + i*10;
      const majorEvery = Math.max(3, Math.round(tickCount/12));
      const ticks = [];
      for(let t=0;t<tickCount;t++){
        const major = t % majorEvery === 0;
        ticks.push({
          a: (t/tickCount)*Math.PI*2,
          major,
          label: (i>=1 && major && Math.random()<0.55) ? randomLabel(i) : null
        });
      }
      rings.push({
        radius, ticks,
        speed: (i%2===0?1:-1) * (0.045 + i*0.012),
        rot: Math.random()*Math.PI*2,
        color: (i===2||i===4) ? AMBER : CYAN,
        dashed: i%3===1
      });
    }
  }
  window.addEventListener('resize', resize);

  /* ---------- AUDIO REACTIVITY ---------- */
  let audioCtx=null, analyser=null, dataArray=null;
  let audioLevel=0, eventPulse=0;

  async function startAudioMeter(){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const src = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      src.connect(analyser);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
    }catch(e){
      console.warn('Analyseur audio indisponible, on retombe sur les événements de reconnaissance.', e);
    }
  }
  function stopAudioMeter(){
    if(audioCtx){ audioCtx.close(); audioCtx=null; analyser=null; }
  }
  function pulse(v){ eventPulse = Math.min(1, eventPulse + v); }

  /* ---------- DRAW LOOP ---------- */
  let t0 = performance.now();
  function draw(now){
    const dt = Math.min(0.05, (now - t0)/1000); t0 = now;

    if(analyser){
      analyser.getByteFrequencyData(dataArray);
      let sum=0; for(let i=0;i<dataArray.length;i++) sum+=dataArray[i];
      const target = (sum/dataArray.length)/255;
      audioLevel += (target - audioLevel) * 0.25;
    } else {
      audioLevel *= 0.9;
    }
    eventPulse *= 0.92;
    const level = Math.min(1, audioLevel*1.4 + eventPulse);

    ctx.clearRect(0,0,W,H);

    // ambient glow
    const g = ctx.createRadialGradient(cx,cy,0,cx,cy,Math.min(W,H)*0.5);
    g.addColorStop(0, `rgba(63,242,255,${0.10+level*0.10})`);
    g.addColorStop(1, 'rgba(3,7,10,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    ctx.save();
    ctx.translate(cx,cy);

    // rings
    rings.forEach((ring, idx) => {
      ring.rot += ring.speed*dt*(1+level*1.8);
      const jitter = level * 2.2 * Math.sin(now*0.02 + idx*1.7);
      const r = ring.radius + jitter;

      ctx.save();
      ctx.rotate(ring.rot);
      ctx.strokeStyle = ring.color;
      ctx.globalAlpha = 0.28 + level*0.25;
      ctx.lineWidth = 1;
      if(ring.dashed) ctx.setLineDash([2,6]); else ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);

      ring.ticks.forEach(tick=>{
        const a = tick.a;
        const len = tick.major ? 9+level*4 : 4;
        const x1 = Math.cos(a)*(r-len), y1 = Math.sin(a)*(r-len);
        const x2 = Math.cos(a)*r, y2 = Math.sin(a)*r;
        ctx.globalAlpha = tick.major ? 0.75+level*0.25 : 0.35;
        ctx.strokeStyle = ring.color;
        ctx.lineWidth = tick.major ? 1.4 : 0.8;
        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();

        if(tick.label){
          ctx.save();
          ctx.translate(Math.cos(a)*(r+13), Math.sin(a)*(r+13));
          ctx.rotate(a + Math.PI/2);
          ctx.fillStyle = ring.color;
          ctx.globalAlpha = 0.55+level*0.3;
          ctx.font = '9px "Share Tech Mono", monospace';
          ctx.textAlign = 'center'; ctx.textBaseline='middle';
          ctx.fillText(tick.label, 0, 0);
          ctx.restore();
        }
      });
      ctx.restore();
    });

    // crosshair
    ctx.globalAlpha = 0.18+level*0.2;
    ctx.strokeStyle = CYAN; ctx.lineWidth=1;
    const crossR = rings[rings.length-1].radius + 26;
    [0,Math.PI/2,Math.PI,Math.PI*1.5].forEach(a=>{
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*(crossR-10), Math.sin(a)*(crossR-10));
      ctx.lineTo(Math.cos(a)*(crossR+10), Math.sin(a)*(crossR+10));
      ctx.stroke();
    });

    // core orb
    const baseR = Math.min(W,H)*0.052;
    const orbR = baseR * (1 + level*0.55);
    const og = ctx.createRadialGradient(0,0,0,0,0,orbR*2.2);
    og.addColorStop(0, 'rgba(255,255,255,0.95)');
    og.addColorStop(0.25, `rgba(120,245,255,${0.85})`);
    og.addColorStop(0.6, `rgba(20,140,160,${0.35+level*0.3})`);
    og.addColorStop(1, 'rgba(3,7,10,0)');
    ctx.globalAlpha = 1;
    ctx.fillStyle = og;
    ctx.beginPath(); ctx.arc(0,0,orbR*2.2,0,Math.PI*2); ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.arc(0,0,orbR*0.55,0,Math.PI*2); ctx.fill();

    // inner iris arcs
    for(let i=0;i<3;i++){
      ctx.save();
      ctx.rotate(now*0.0006*(i%2===0?1:-1) + i);
      ctx.strokeStyle = i%2===0?AMBER:CYAN;
      ctx.globalAlpha = 0.5+level*0.3;
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.arc(0,0, orbR*(1.15+i*0.28), 0.3, 2.1);
      ctx.stroke();
      ctx.restore();
    }

    ctx.restore();
    requestAnimationFrame(draw);
  }

  /* ---------- TELEMETRY TEXT (decorative) ---------- */
  const telLeft = document.getElementById('telLeft');
  const telRight = document.getElementById('telRight');
  function refreshTelemetry(){
    const lines = [];
    for(let i=0;i<6;i++) lines.push('<span>'+code()+'</span>'+hex4());
    telLeft.innerHTML = lines.join('<br>');
    const lines2 = [];
    for(let i=0;i<6;i++) lines2.push('<span>'+bin()+'</span>'+hex4());
    telRight.innerHTML = lines2.join('<br>');
  }
  setInterval(refreshTelemetry, 1800);

  /* ---------- SPEECH RECOGNITION ---------- */
  const statusEl = document.getElementById('status');
  const boxEl = document.getElementById('transcriptBox');
  const micBtn = document.getElementById('micBtn');
  const sendBtn = document.getElementById('sendBtn');
  const shortcutNameInput = document.getElementById('shortcutName');
  const autoSendCk = document.getElementById('autoSend');

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let listening = false;
  let lastFinal = '';

  function setStatus(text, hot){
    statusEl.textContent = text;
    statusEl.classList.toggle('hot', !!hot);
  }

  function renderTranscript(final, interim){
    if(!final && !interim){
      boxEl.innerHTML = '<span class="placeholder">Appuyez sur le micro et parlez…</span>';
      return;
    }
    boxEl.innerHTML = (final?('<span>'+final+'</span> '):'') + (interim?('<span class="interim">'+interim+'</span>'):'');
    boxEl.scrollTop = boxEl.scrollHeight;
  }

  function sendToShortcuts(text){
    const name = (shortcutNameInput.value||'Assistant').trim();
    if(!name || !text) return;
    const url = 'shortcuts://run-shortcut?name=' + encodeURIComponent(name)
              + '&input=text&text=' + encodeURIComponent(text);
    setStatus('ENVOI → ' + name.toUpperCase(), true);
    window.location.href = url;
  }

  sendBtn.addEventListener('click', ()=>{
    if(lastFinal) sendToShortcuts(lastFinal);
  });

  if(!SR){
    setStatus('RECONNAISSANCE INDISPONIBLE');
    micBtn.disabled = true;
    micBtn.style.opacity = 0.35;
    renderTranscript('', '');
    boxEl.innerHTML = '<span class="placeholder">Ce navigateur ne supporte pas la reconnaissance vocale. Ouvrez cette page dans Safari sur iPhone / iPad.</span>';
  } else {
    recognition = new SR();
    recognition.lang = 'fr-FR';
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = (e)=>{
      let interim = '', final = '';
      for(let i=e.resultIndex; i<e.results.length; i++){
        const t = e.results[i][0].transcript;
        if(e.results[i].isFinal) final += t;
        else interim += t;
      }
      pulse(1);
      renderTranscript(final, interim);
      if(final.trim()){
        lastFinal = final.trim();
        sendBtn.disabled = false;
        setStatus('COMMANDE DÉTECTÉE', true);
        if(autoSendCk.checked) sendToShortcuts(lastFinal);
      } else if(interim.trim()){
        setStatus('ÉCOUTE EN COURS…');
      }
    };

    recognition.onerror = (e)=>{
      console.warn('Erreur reconnaissance vocale', e.error);
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        setStatus('MICRO REFUSÉ');
        listening = false;
        micBtn.classList.remove('active');
      }
    };

    recognition.onend = ()=>{
      if(listening){
        try{ recognition.start(); }catch(e){}
      } else {
        setStatus('EN VEILLE');
      }
    };
  }

  micBtn.addEventListener('click', async ()=>{
    if(!recognition) return;
    listening = !listening;
    micBtn.classList.toggle('active', listening);
    if(listening){
      setStatus('ÉCOUTE EN COURS…');
      try{ recognition.start(); }catch(e){}
      startAudioMeter();
    } else {
      setStatus('EN VEILLE');
      try{ recognition.stop(); }catch(e){}
      stopAudioMeter();
    }
  });

  /* ---------- INIT ---------- */
  resize();
  refreshTelemetry();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
