<!DOCTYPE html>
<html lang="fr">

content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>JARVIS — Visual Core</title>

<style>

/* ==================================================
   BASE
================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #020609;
    color: #d9faff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        Arial,
        sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}


/* ==================================================
   SCÈNE
================================================== */

.scene {
    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(0, 205, 255, .10),
            transparent 27%
        ),
        radial-gradient(
            circle at 50% 35%,
            rgba(0, 120, 180, .055),
            transparent 48%
        ),
        #020609;
}


/* grille technique */

.scene::before {
    content: "";

    position: absolute;
    inset: 0;

    background-image:
        linear-gradient(
            rgba(50, 210, 240, .026) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(50, 210, 240, .026) 1px,
            transparent 1px
        );

    background-size: 27px 27px;

    mask-image:
        radial-gradient(
            circle at 50% 35%,
            black 0%,
            transparent 73%
        );
}


/* ==================================================
   ENTÊTE
================================================== */

.header {
    position: absolute;

    top: 18px;
    left: 22px;
    right: 22px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    z-index: 20;
}

.brand {
    font-size: 13px;
    letter-spacing: 6px;

    color: #c8f8ff;

    text-shadow:
        0 0 9px rgba(0,220,255,.45);
}

.status {
    display: flex;
    gap: 13px;

    font-size: 8px;
    letter-spacing: 3px;

    color: rgba(160,235,250,.65);
}

.status span::before {
    content: "●";

    margin-right: 5px;

    color: #00e4ff;

    text-shadow:
        0 0 7px #00e4ff;
}


/* ==================================================
   ZONE CENTRALE
================================================== */

.core-area {

    position: absolute;

    left: 50%;
    top: 35%;

    width: min(96vw, 570px);
    aspect-ratio: 1;

    transform:
        translate(-50%, -50%);

    transition:
        transform .7s cubic-bezier(.2,.8,.2,1);

    z-index: 5;
}


/* halo principal */

.halo {

    position: absolute;

    inset: 9%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0,225,255,.17),
            rgba(0,130,180,.06) 38%,
            transparent 70%
        );

    filter: blur(18px);

    animation:
        haloPulse 4s ease-in-out infinite;
}

@keyframes haloPulse {

    0%,100% {
        transform: scale(.95);
        opacity: .55;
    }

    50% {
        transform: scale(1.05);
        opacity: .95;
    }
}


/* ==================================================
   SVG PRINCIPAL
================================================== */

.core-svg {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    overflow: visible;
}


/* ==================================================
   ROTATIONS DES COURONNES
================================================== */

.ring-slow {

    transform-origin: 250px 250px;

    animation:
        rotateClockwise 55s linear infinite;
}

.ring-slow-reverse {

    transform-origin: 250px 250px;

    animation:
        rotateCounter 72s linear infinite;
}

.ring-medium {

    transform-origin: 250px 250px;

    animation:
        rotateClockwise 30s linear infinite;
}

.ring-medium-reverse {

    transform-origin: 250px 250px;

    animation:
        rotateCounter 37s linear infinite;
}

.ring-fast {

    transform-origin: 250px 250px;

    animation:
        rotateClockwise 13s linear infinite;
}

@keyframes rotateClockwise {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes rotateCounter {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}


/* ==================================================
   GYROTURBILLON
================================================== */

.gyro-main {

    transform-origin: 250px 250px;

    animation:
        gyroSpin 9s linear infinite;
}

.gyro-secondary {

    transform-origin: 250px 250px;

    animation:
        gyroSpinReverse 6.5s linear infinite;
}

.gyro-core {

    transform-origin: 250px 250px;

    animation:
        gyroPulse 2.8s ease-in-out infinite;
}

@keyframes gyroSpin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes gyroSpinReverse {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}

@keyframes gyroPulse {

    0%,100% {
        transform: scale(.94);
        opacity: .82;
    }

    50% {
        transform: scale(1.07);
        opacity: 1;
    }
}


/* ==================================================
   LUEURS
================================================== */

.glow {

    filter:
        drop-shadow(
            0 0 4px rgba(0,225,255,.85)
        );
}

.glow-strong {

    filter:
        drop-shadow(
            0 0 8px rgba(0,225,255,1)
        );
}


/* ==================================================
   LABEL CENTRAL
================================================== */

.core-label {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%,-50%);

    z-index: 8;

    text-align: center;

    pointer-events: none;

    text-shadow:
        0 0 7px rgba(0,225,255,.7);
}

.core-label .main {

    font-size: 10px;
    letter-spacing: 4px;

    color: #dffcff;
}

.core-label .sub {

    margin-top: 7px;

    font-size: 6px;
    letter-spacing: 3px;

    color: rgba(140,225,240,.55);
}


/* ==================================================
   PANNEAUX
================================================== */

.panel {

    position: absolute;

    width: 145px;

    min-height: 90px;

    padding: 12px 13px;

    border:
        1px solid rgba(0,210,245,.22);

    background:
        linear-gradient(
            135deg,
            rgba(0,80,110,.11),
            rgba(0,15,25,.38)
        );

    box-shadow:
        inset 0 0 18px rgba(0,190,240,.035);

    color: rgba(190,245,255,.75);

    z-index: 10;
}

.panel-title {

    font-size: 8px;
    letter-spacing: 4px;

    color: #66e9ff;
}

.panel-value {

    margin-top: 8px;

    font-size: 21px;

    color: #d9fbff;

    text-shadow:
        0 0 6px rgba(0,210,255,.3);
}

.panel-small {

    margin-top: 4px;

    font-size: 7px;
    letter-spacing: 1px;

    color: rgba(145,220,235,.5);
}

.panel-house {
    left: 18px;
    bottom: 145px;

.panel-weather {

    bottom: 145px;

.panel-system {

    bottom: 55px;

.panel-activity {

/* ==================================================
   BOUTON
================================================== */

.microphone {

    bottom: 42px;

    height: 70px;

    transform:

/* ==================================================
   MODE ACTIF
================================================== */

body.active .core-area {

<script>

/* ==================================================
   ACTIVATION
================================================== */

const button =
document.getElementById("activate");

let active = false;

button.addEventListener(
    "click",
    () => {

        active = !active;

        document.body.classList.toggle(
            "active",
            active
        );

    }
);


/* ==================================================
   BATTEMENT DU NOYAU
================================================== */

const core =
document.getElementById("core");

function impulseVertical() {

    core.animate(

        [
            {
                transform:
                "translate(-50%,-50%) translateY(0px)"
            },

            {
                transform:
                "translate(-50%,-50%) translateY(-14px)",

                offset: .28
            },

            {
                transform:
                "translate(-50%,-50%) translateY(5px)",

                offset: .58
            },

            {
                transform:
                "translate(-50%,-50%) translateY(-2px)",

                offset: .80
            },

            {
                transform:
                "translate(-50%,-50%) translateY(0px)"
            }

        ],

        {
            duration: 1050,

            easing:
            "cubic-bezier(.18,.82,.25,1)"
        }
    );
}


/* ==================================================
   BATTEMENT EN MODE ACTIF
================================================== */

setInterval(

    () => {

        if (active) {
            impulseVertical();
        }

    },

    3000

);

</script>
