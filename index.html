<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>JARVIS — Voice Core</title>

<style>
:root{
  --bg:#020b10;
  --cyan:#38eaff;
  --cyan2:#9af8ff;
  --blue:#58aaff;
  --violet:#a77cff;
  --gold:#e4b45a;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:#e5fbff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

body{
  background:
    linear-gradient(rgba(35,150,175,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(35,150,175,.07) 1px,transparent 1px),
    radial-gradient(circle at 50% 48%,#073442 0%,#03141c 32%,#02090e 72%);
  background-size:26px 26px,26px 26px,100% 100%;
}

body:after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(rgba(60,220,240,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(60,220,240,.025) 1px,transparent 1px);
  background-size:130px 130px;
}

header{
  position:absolute;
  z-index:20;
  top:calc(env(safe-area-inset-top) + 25px);
  left:30px;
  right:25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:31px;
  font-weight:300;
  letter-spacing:.28em;
}

.status{
  display:flex;
  gap:20px;
  font-size:10px;
  letter-spacing:.27em;
  color:#6d9da7;
}

.status span{
  display:flex;
  align-items:center;
  gap:8px;
}

.status i{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--cyan);
  box-shadow:0 0 14px var(--cyan);
}

.title{
  position:absolute;
  top:calc(env(safe-area-inset-top) + 105px);
  width:100%;
  text-align:center;
  font-size:13px;
  letter-spacing:.32em;
  color:#76aab4;
}

.subtitle{
  position:absolute;
  top:calc(env(safe-area-inset-top) + 137px);
  width:100%;
  text-align:center;
  font-size:9px;
  letter-spacing:.3em;
  color:#466d76;
}

#stage{
  position:absolute;
  top:calc(env(safe-area-inset-top) + 175px);
  left:50%;
  width:min(96vw,520px);
  height:min(96vw,520px);
  transform:translateX(-50%);
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

.coreText{
  position:absolute;
  z-index:5;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  pointer-events:none;
  text-shadow:0 0 15px rgba(100,240,255,.7);
}

.coreText b{
  display:block;
  font-size:15px;
  font-weight:300;
  letter-spacing:.48em;
  padding-left:.48em;
}

.coreText small{
  display:block;
  margin-top:8px;
  font-size:8px;
  letter-spacing:.35em;
  color:#76aab3;
}

#voicePanel{
  position:absolute;
  left:7%;
  right:7%;
  top:calc(env(safe-area-inset-top) + 710px);
  height:76px;
  border-top:1px solid rgba(53,226,249,.35);
  border-bottom:1px solid rgba(53,226,249,.35);
  text-align:center;
  padding-top:12px;
}

#voiceState{
  font-size:9px;
  letter-spacing:.32em;
  color:#668e97;
  margin-bottom:8px;
}

#transcript{
  font-size:17px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.controls{
  position:absolute;
  z-index:30;
  left:6%;
  right:6%;
  bottom:calc(env(safe-area-inset-bottom) + 25px);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

button{
  height:76px;
  background:rgba(5,39,48,.38);
  border:1px solid rgba(55,228,255,.6);
  color:#d9fbff;
  font:inherit;
  font-size:10px;
  letter-spacing:.18em;
}

button.active{
  box-shadow:
    0 0 20px rgba(45,230,255,.35),
    inset 0 0 25px rgba(45,230,255,.12);
}

@media(max-height:760px){
  #stage{
    top:calc(env(safe-area-inset-top) + 145px);
    width:88vw;
    height:88vw;
  }

  #voicePanel{
    top:calc(env(safe-area-inset-top) + 590px);
  }

  .controls{
    bottom:calc(env(safe-area-inset-bottom) + 12px);
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">JARVIS</div>
  <div class="status">
    <span><i></i>ONLINE</span>
    <span><i></i>SECURE</span>
    <span><i></i>VOICE</span>
  </div>
</header>

<div class="title">
  VOICE CORE · CRYSTALLINE MATRIX · 3 AXIS
</div>

<div class="subtitle">
  HOLOGRAPHIC CONCENTRIC SYSTEM · AUDIO REACTIVE
</div>

<div id="stage">
  <canvas id="visual"></canvas>

  <div class="coreText">
    <b>CORE</b>
    <small id="coreStatus">READY</small>
  </div>
</div>

<div id="voicePanel">
  <div id="voiceState">VOICE SYSTEM · READY</div>
  <div id="transcript">EN ATTENTE DE COMMANDE</div>
</div>

<div class="controls">
  <button id="micButton">●<br>MICRO ACTIF</button>
  <button id="shortcutButton">↗<br>ENVOYER RACCOURCIS</button>
  <button id="speakButton">◌<br>VOIX JARVIS</button>
</div>

<script>

const canvas=document.getElementById("visual");
const ctx=canvas.getContext("2d");

const stage=document.getElementById("stage");
const micButton=document.getElementById("micButton");
const shortcutButton=document.getElementById("shortcutButton");
const speakButton=document.getElementById("speakButton");

const voiceState=document.getElementById("voiceState");
const transcript=document.getElementById("transcript");
const coreStatus=document.getElementById("coreStatus");

let W,H,DPR;
let t=0;

let audioContext=null;
let analyser=null;
let microphone=null;
let audioData=null;

let listening=false;
let level=0;
let targetLevel=0;

let recognition=null;
let lastTranscript="";

/* =========================================================
   RESIZE
========================================================= */

function resize(){

  DPR=Math.min(window.devicePixelRatio||1,2);

  W=stage.clientWidth;
  H=stage.clientHeight;

  canvas.width=W*DPR;
  canvas.height=H*DPR;

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

window.addEventListener("resize",resize);
resize();

/* =========================================================
   AUDIO
========================================================= */

async function startAudio(){

  try{

    audioContext=
      new(window.AudioContext||
      window.webkitAudioContext)();

    const stream=
      await navigator.mediaDevices.getUserMedia({
        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true
        }
      });

    microphone=
      audioContext.createMediaStreamSource(stream);

    analyser=
      audioContext.createAnalyser();

    analyser.fftSize=512;
    analyser.smoothingTimeConstant=.55;

    audioData=
      new Uint8Array(analyser.fftSize);

    microphone.connect(analyser);

    listening=true;

    micButton.classList.add("active");

    voiceState.textContent=
      "VOICE SYSTEM · LISTENING";

    coreStatus.textContent="LISTENING";

    startRecognition();

  }catch(e){

    voiceState.textContent=
      "MICROPHONE · PERMISSION REQUIRED";
  }
}

/* =========================================================
   RECOGNITION
========================================================= */

function startRecognition(){

  const SpeechRecognition=
    window.SpeechRecognition||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition)return;

  recognition=new SpeechRecognition();

  recognition.lang="fr-FR";
  recognition.continuous=true;
  recognition.interimResults=true;

  recognition.onresult=e=>{

    let text="";

    for(
      let i=e.resultIndex;
      i<e.results.length;
      i++
    ){
      text+=e.results[i][0].transcript;
    }

    text=text.trim();

    if(text){

      lastTranscript=text;
      transcript.textContent=text;

      voiceState.textContent=
        "VOICE SYSTEM · COMMAND RECEIVED";
    }
  };

  recognition.onend=()=>{

    if(listening){

      try{
        recognition.start();
      }catch(e){}
    }
  };

  try{
    recognition.start();
  }catch(e){}
}

/* =========================================================
   AUDIO LEVEL
========================================================= */

function updateAudio(){

  if(!analyser){

    targetLevel=listening?.05:0;

  }else{

    analyser.getByteTimeDomainData(audioData);

    let sum=0;

    for(let i=0;i<audioData.length;i++){

      const v=(audioData[i]-128)/128;
      sum+=v*v;
    }

    const rms=Math.sqrt(sum/audioData.length);

    targetLevel=Math.min(1,rms*6);
  }

  /*
    Très important :
    attaque rapide pour la voix,
    relâchement progressif.
  */

  if(targetLevel>level){

    level+=(targetLevel-level)*.42;

  }else{

    level+=(targetLevel-level)*.095;
  }
}

/* =========================================================
   HELPERS
========================================================= */

function polar(cx,cy,r,a){
  return{
    x:cx+Math.cos(a)*r,
    y:cy+Math.sin(a)*r
  };
}

/* =========================================================
   PARTICULES DE FOND
========================================================= */

const particles=[];

for(let i=0;i<70;i++){

  particles.push({
    x:Math.random(),
    y:Math.random(),
    r:.4+Math.random()*1.1,
    a:.12+Math.random()*.28
  });
}

function drawParticles(){

  for(const p of particles){

    ctx.beginPath();

    ctx.fillStyle=
      `rgba(80,215,235,${p.a})`;

    ctx.arc(
      p.x*W,
      p.y*H,
      p.r,
      0,
      Math.PI*2
    );

    ctx.fill();
  }
}

/* =========================================================
   GÉODE LIQUIDE
   IMPORTANT :
   AUCUNE ROTATION INTERNE.
   Seulement un battement volumétrique.
========================================================= */

function drawGeode(cx,cy){

  /*
    Battement très discret au repos.
    La voix augmente uniquement l'échelle
    et l'intensité lumineuse.
  */

  const heartbeat=
    1+
    Math.sin(t*.004)*.006+
    level*.055;

  const r=W*.105*heartbeat;

  /* halo liquide */

  const halo=
    ctx.createRadialGradient(
      cx,cy,0,
      cx,cy,r*1.65
    );

  halo.addColorStop(
    0,
    `rgba(65,235,255,${.20+level*.16})`
  );

  halo.addColorStop(
    .42,
    `rgba(35,170,210,${.08+level*.08})`
  );

  halo.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );

  ctx.fillStyle=halo;

  ctx.beginPath();
  ctx.arc(cx,cy,r*1.65,0,Math.PI*2);
  ctx.fill();

  /*
    Géode irrégulière.
    Beaucoup de facettes MAIS aucune ligne
    interne.
  */

  const sides=18;
  const vertices=[];

  for(let i=0;i<sides;i++){

    const a=i/sides*Math.PI*2;

    const deformation=
      1+
      Math.sin(i*2.31)*.045+
      Math.sin(i*4.71)*.018;

    vertices.push(
      polar(cx,cy,r*deformation,a)
    );
  }

  const glass=
    ctx.createRadialGradient(
      cx-r*.35,
      cy-r*.4,
      0,
      cx,
      cy,
      r*1.1
    );

  glass.addColorStop(
    0,
    `rgba(205,252,255,${.25+level*.12})`
  );

  glass.addColorStop(
    .22,
    `rgba(73,220,245,${.15+level*.08})`
  );

  glass.addColorStop(
    .60,
    "rgba(20,125,160,.08)"
  );

  glass.addColorStop(
    1,
    "rgba(0,30,45,.025)"
  );

  ctx.beginPath();

  vertices.forEach((p,i)=>{

    if(i===0)ctx.moveTo(p.x,p.y);
    else ctx.lineTo(p.x,p.y);

  });

  ctx.closePath();

  ctx.fillStyle=glass;

  ctx.shadowColor="rgba(50,235,255,.8)";
  ctx.shadowBlur=18+level*20;

  ctx.fill();

  ctx.shadowBlur=0;

  /*
    Facettes translucides :
    surfaces uniquement, pas de traits.
  */

  for(let i=0;i<22;i++){

    const a=i*.91;

    const a2=a+.28+.18*Math.sin(i);

    const r1=r*(.20+.025*(i%4));
    const r2=r*(.62+.20*((i*7)%5)/5);

    const p1=polar(cx,cy,r1,a);
    const p2=polar(cx,cy,r2,a+.05);
    const p3=polar(cx,cy,r2,a2);
    const p4=polar(cx,cy,r1,a2);

    ctx.beginPath();

    ctx.moveTo(p1.x,p1.y);
    ctx.lineTo(p2.x,p2.y);
    ctx.lineTo(p3.x,p3.y);
    ctx.lineTo(p4.x,p4.y);

    ctx.closePath();

    const alpha=
      .018+
      level*.025;

    ctx.fillStyle=
      i%3===0
      ? `rgba(90,240,255,${alpha})`
      : i%3===1
      ? `rgba(120,160,255,${alpha})`
      : `rgba(170,125,255,${alpha*.7})`;

    ctx.fill();
  }

  /* contour seulement */

  ctx.beginPath();

  vertices.forEach((p,i)=>{

    if(i===0)ctx.moveTo(p.x,p.y);
    else ctx.lineTo(p.x,p.y);

  });

  ctx.closePath();

  ctx.strokeStyle=
    `rgba(145,248,255,${.55+level*.25})`;

  ctx.lineWidth=1.1+level*1.2;

  ctx.shadowColor="#4deeff";
  ctx.shadowBlur=12+level*18;

  ctx.stroke();

  ctx.shadowBlur=0;

  /*
    Reflet fixe.
    Il ne tourne PAS.
  */

  const reflection=
    ctx.createRadialGradient(
      cx-r*.35,
      cy-r*.42,
      0,
      cx-r*.35,
      cy-r*.42,
      r*.42
    );

  reflection.addColorStop(
    0,
    `rgba(240,255,255,${.55+level*.12})`
  );

  reflection.addColorStop(
    .12,
    `rgba(130,245,255,${.18+level*.08})`
  );

  reflection.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );

  ctx.fillStyle=reflection;

  ctx.beginPath();

  ctx.arc(
    cx-r*.35,
    cy-r*.42,
    r*.42,
    0,
    Math.PI*2
  );

  ctx.fill();
}

/* =========================================================
   4 DISQUES CONCENTRIQUES
========================================================= */

/*
   Au lieu d'avoir 4 anneaux avec de grands
   espaces vides :

   DISQUE 1 = proche géode
   DISQUE 2 = précision
   DISQUE 3 = données
   DISQUE 4 = instrumentation

   Chaque disque possède ses propres informations.
*/

const disks=[
  {
    radius:.17,
    color:"#38eaff",
    speed:.00016,
    phase:0
  },
  {
    radius:.29,
    color:"#50cfff",
    speed:-.00012,
    phase:1.7
  },
  {
    radius:.41,
    color:"#8b80ff",
    speed:.00009,
    phase:3.2
  },
  {
    radius:.53,
    color:"#e4b45a",
    speed:-.000075,
    phase:4.8
  }
];

const dataSets=[
  [
    "12","24","36","48","60","72",
    "84","96","108","120","132","144"
  ],
  [
    "ISO 100","ISO 200","ISO 400",
    "1/60","1/125","1/250",
    "EV +1","EV 0","EV -1"
  ],
  [
    "24mm","35mm","50mm","85mm",
    "AF","MF","∞","1:2.8",
    "f/2","f/4"
  ],
  [
    "000","030","060","090","120","150",
    "180","210","240","270","300","330"
  ]
];

function drawDisk(cx,cy,d,index){

  /*
    Dilatation massive.
    Le rayon peut augmenter jusqu'à environ
    20% de sa valeur lors d'une voix forte.
  */

  const expansion=
    level*(.055+index*.018);

  const r=
    W*(d.radius+expansion);

  const rotation=
    t*d.speed+d.phase;

  ctx.save();
  ctx.translate(cx,cy);

  /*
    Rotation très lente permanente.
    Elle devient légèrement plus vive avec
    le volume mais reste centrée.
  */

  ctx.rotate(
    rotation*(1+level*.75)
  );

  /* disque principal */

  ctx.beginPath();

  ctx.arc(0,0,r,0,Math.PI*2);

  ctx.strokeStyle=d.color;
  ctx.globalAlpha=.55+level*.25;
  ctx.lineWidth=
    1.15+level*2.2;

  ctx.shadowColor=d.color;
  ctx.shadowBlur=
    8+level*18;

  ctx.stroke();

  ctx.shadowBlur=0;

  /* deuxième bord */

  ctx.beginPath();

  ctx.arc(
    0,0,
    r-7,
    0,
    Math.PI*2
  );

  ctx.strokeStyle=
    "rgba(116,231,242,.45)";

  ctx.lineWidth=.6;

  ctx.stroke();

  /*
    TICKS : moins "radar",
    davantage montre / objectif.
  */

  const ticks=60;

  for(let i=0;i<ticks;i++){

    const a=
      i/ticks*Math.PI*2;

    const major=i%5===0;

    const r1=
      r-(major?17:11);

    const r2=
      r-2;

    const p1=polar(0,0,r1,a);
    const p2=polar(0,0,r2,a);

    ctx.beginPath();

    ctx.moveTo(p1.x,p1.y);
    ctx.lineTo(p2.x,p2.y);

    ctx.strokeStyle=
      major
      ? "rgba(230,250,255,.78)"
      : "rgba(85,210,230,.40)";

    ctx.lineWidth=
      major?1.05:.45;

    ctx.stroke();
  }

  /*
    Informations réparties DANS le disque,
    et non dans les espaces entre les couronnes.
  */

  const labels=dataSets[index];

  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.font=
    `${Math.max(6,W*.014)}px monospace`;

  labels.forEach((label,i)=>{

    const a=
      i/labels.length*Math.PI*2+
      .12;

    const rr=
      r-(index===0?27:
         index===1?30:
         index===2?32:35);

    const p=polar(0,0,rr,a);

    ctx.save();

    ctx.translate(p.x,p.y);
    ctx.rotate(a+Math.PI/2);

    ctx.fillStyle=
      i%4===0
      ? "rgba(228,180,90,.72)"
      : "rgba(173,231,239,.54)";

    ctx.fillText(label,0,0);

    ctx.restore();
  });

  /*
    Petits symboles techniques.
  */

  for(let i=0;i<12;i++){

    const a=
      i/12*Math.PI*2+
      .35;

    const rr=r-13;

    const p=polar(0,0,rr,a);

    ctx.fillStyle=
      i%3===0
      ? d.color
      : "rgba(190,245,250,.55)";

    ctx.fillRect(
      p.x-1.5,
      p.y-1.5,
      3,
      3
    );
  }

  /*
    Arcs parallèles au disque.
    Ils tournent en sens opposé.
  */

  for(let j=0;j<2;j++){

    const rr=
      r-8-j*8;

    const start=
      -t*d.speed*2.0+
      index+
      j*1.8;

    ctx.beginPath();

    ctx.arc(
      0,0,
      rr,
      start,
      start+.72+j*.20
    );

    ctx.strokeStyle=
      j===0
      ? d.color
      : "rgba(228,180,90,.7)";

    ctx.globalAlpha=
      .70+level*.2;

    ctx.lineWidth=
      j===0
      ? 1.8+level*2
      : .75;

    ctx.stroke();
  }

  /*
    Points de données.
    Leur déplacement est orbital,
    mais le disque reste centré.
  */

  for(let j=0;j<4;j++){

    const a=
      t*d.speed*.8+
      d.phase+
      j*Math.PI/2;

    const p=
      polar(
        0,
        0,
        r-3,
        a
      );

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      2+level*2.8,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
      j===1
      ? "#e5b65c"
      : d.color;

    ctx.shadowColor=ctx.fillStyle;
    ctx.shadowBlur=
      7+level*14;

    ctx.fill();
  }

  ctx.restore();
}

/* =========================================================
   RENDER
========================================================= */

function render(){

  t++;

  updateAudio();

  ctx.clearRect(0,0,W,H);

  drawParticles();

  const cx=W/2;
  const cy=H/2;

  /*
    LES 4 DISQUES RESTENT TOUJOURS
    CONCENTRIQUES ET CENTRÉS.
  */

  for(let i=3;i>=0;i--){

    drawDisk(
      cx,
      cy,
      disks[i],
      i
    );
  }

  /*
    Géode au-dessus.
    Aucun mouvement de rotation interne.
    Uniquement son battement volumétrique.
  */

  drawGeode(cx,cy);

  requestAnimationFrame(render);
}

render();

/* =========================================================
   MICRO
========================================================= */

micButton.onclick=async()=>{

  if(!listening){

    await startAudio();

  }else{

    listening=false;

    micButton.classList.remove("active");

    voiceState.textContent=
      "VOICE SYSTEM · READY";

    coreStatus.textContent="READY";

    if(recognition){

      try{
        recognition.stop();
      }catch(e){}
    }
  }
};

/* =========================================================
   VOIX JARVIS
========================================================= */

speakButton.onclick=()=>{

  if(!("speechSynthesis" in window))return;

  const text=
    lastTranscript||
    "Je vous écoute.";

  speechSynthesis.cancel();

  const u=
    new SpeechSynthesisUtterance(text);

  u.lang="fr-FR";
  u.rate=.90;
  u.pitch=.78;
  u.volume=1;

  voiceState.textContent=
    "JARVIS · SPEAKING";

  u.onend=()=>{
    voiceState.textContent=
      listening
      ? "VOICE SYSTEM · LISTENING"
      : "VOICE SYSTEM · READY";
  };

  speechSynthesis.speak(u);
};

/* =========================================================
   RACCOURCIS
========================================================= */

shortcutButton.onclick=()=>{

  const text=
    lastTranscript||
    transcript.textContent||
    "";

  if(!text)return;

  const shortcut="JARVIS";

  window.location.href=
    "shortcuts://run-shortcut"+
    "?name="+encodeURIComponent(shortcut)+
    "&input="+encodeURIComponent(text);
};

</script>
