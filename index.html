<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>JARVIS — Gyrotourbillon</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02070a;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    color:#d7faff;
}

#app{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(
            ellipse at 50% 42%,
            rgba(0,110,135,.16),
            transparent 34%
        ),
        #02070a;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

header{
    position:absolute;
    z-index:10;
    top:0;
    left:0;
    right:0;
    height:105px;

    padding:
        calc(env(safe-area-inset-top) + 27px)
        34px
        0;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    pointer-events:none;
}

.brand{
    font-size:19px;
    font-weight:300;
    letter-spacing:.47em;
}

.status{
    display:flex;
    gap:25px;

    color:#63808a;
    font-size:10px;
    letter-spacing:.30em;
}

.status span{
    display:flex;
    align-items:center;
    gap:8px;
}

.status i{
    display:block;
    width:7px;
    height:7px;
    border-radius:50%;

    background:#08d8ff;
    box-shadow:
        0 0 6px #08d8ff,
        0 0 16px rgba(8,216,255,.6);
}

.subtitle{
    position:absolute;
    top:112px;
    left:0;
    right:0;

    text-align:center;

    color:#4d727d;
    font-size:8px;
    letter-spacing:.42em;
}

.panels{
    position:absolute;
    z-index:10;

    left:29px;
    right:29px;
    bottom:30px;

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:11px;
}

.panel{
    height:91px;

    padding:15px 18px;

    border:1px solid rgba(0,183,220,.43);

    background:
        linear-gradient(
            135deg,
            rgba(7,28,35,.82),
            rgba(2,13,18,.72)
        );

    box-shadow:
        inset 0 0 20px rgba(0,180,220,.035);
}

.label{
    color:#58b8c8;

    font-size:9px;
    letter-spacing:.37em;
}

.value{
    margin-top:7px;

    color:#d8faff;

    font-size:28px;
    font-weight:300;
}

.detail{
    margin-top:4px;

    color:#506f78;

    font-size:9px;
    letter-spacing:.15em;
}

.vignette{
    position:absolute;
    z-index:8;
    inset:0;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 42%,
            rgba(0,0,0,.18) 70%,
            rgba(0,0,0,.55) 100%
        );
}

</style>
</head>

<body>

<div id="app">

<canvas id="scene"></canvas>

<header>

    <div class="brand">
        JARVIS
    </div>

    <div class="status">
        <span><i></i>ONLINE</span>
        <span><i></i>SECURE</span>
        <span><i></i>VOICE</span>
    </div>

    <div class="subtitle">
        GYROTOURBILLON · PRECISION CORE · 3 AXIS
    </div>

</header>


<div class="panels">

    <div class="panel">
        <div class="label">MAISON</div>
        <div class="value">03</div>
        <div class="detail">DISPOSITIFS ACTIFS</div>
    </div>

    <div class="panel">
        <div class="label">MÉTÉO</div>
        <div class="value">18°</div>
        <div class="detail">CONDITIONS STABLES</div>
    </div>

    <div class="panel">
        <div class="label">SYSTÈME</div>
        <div class="value">82%</div>
        <div class="detail">PERFORMANCE</div>
    </div>

    <div class="panel">
        <div class="label">ACTIVITÉ</div>
        <div class="value">12</div>
        <div class="detail">ÉVÉNEMENTS RÉCENTS</div>
    </div>

</div>

<div class="vignette"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>

(() => {

"use strict";


/* =========================================================
   RENDERER
   ========================================================= */

const canvas = document.getElementById("scene");

const renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    antialias: true,
    alpha: true,
    powerPreference: "high-performance"
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio || 1, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight,
    false
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.18;


/* =========================================================
   SCÈNE
   ========================================================= */

const scene = new THREE.Scene();


/* =========================================================
   CAMÉRA
   ========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        34,
        window.innerWidth / window.innerHeight,
        .1,
        100
    );

camera.position.set(
    0,
    0.05,
    8.8
);

camera.lookAt(
    0,
    0.25,
    0
);


/* =========================================================
   LUMIÈRES
   ========================================================= */

scene.add(
    new THREE.AmbientLight(
        0x6d858a,
        1.15
    )
);

const keyLight =
    new THREE.DirectionalLight(
        0xe9ffff,
        4.8
    );

keyLight.position.set(
    -3,
    4,
    6
);

scene.add(keyLight);


const rimLight =
    new THREE.DirectionalLight(
        0x35dfff,
        3.2
    );

rimLight.position.set(
    4,
    1,
    3
);

scene.add(rimLight);


const warmLight =
    new THREE.DirectionalLight(
        0xb67b35,
        1.15
    );

warmLight.position.set(
    -2,
    -3,
    4
);

scene.add(warmLight);


/* =========================================================
   MATÉRIAUX HORLOGERS
   ========================================================= */

const chrome =
    new THREE.MeshPhysicalMaterial({

        color:0xcbd9dc,

        metalness:1,

        roughness:.14,

        clearcoat:1,

        clearcoatRoughness:.08

    });


const brushedSteel =
    new THREE.MeshPhysicalMaterial({

        color:0x7f9296,

        metalness:.98,

        roughness:.28,

        clearcoat:.7,

        clearcoatRoughness:.14

    });


const darkSteel =
    new THREE.MeshPhysicalMaterial({

        color:0x172125,

        metalness:1,

        roughness:.24,

        clearcoat:1

    });


const blackSteel =
    new THREE.MeshPhysicalMaterial({

        color:0x060b0e,

        metalness:.98,

        roughness:.30

    });


const subtleGold =
    new THREE.MeshPhysicalMaterial({

        color:0x9b702d,

        metalness:1,

        roughness:.20,

        clearcoat:1

    });


const ruby =
    new THREE.MeshPhysicalMaterial({

        color:0x8b0024,

        metalness:.15,

        roughness:.08,

        clearcoat:1,

        emissive:0x250006,

        emissiveIntensity:.8

    });


/* =========================================================
   GROUPE PRINCIPAL
   ========================================================= */

const gyro =
    new THREE.Group();

gyro.position.y = .38;

gyro.scale.setScalar(
    window.innerWidth < 600
        ? .69
        : .82
);

scene.add(gyro);


/* =========================================================
   OUTIL : ANNEAU
   ========================================================= */

function ring(
    radius,
    tube,
    material,
    segments=128
){

    return new THREE.Mesh(
        new THREE.TorusGeometry(
            radius,
            tube,
            12,
            segments
        ),
        material
    );
}


/* =========================================================
   BOÎTIER MÉTALLIQUE
   ========================================================= */

gyro.add(
    ring(
        1.18,
        .075,
        darkSteel
    )
);

gyro.add(
    ring(
        1.11,
        .045,
        chrome
    )
);

gyro.add(
    ring(
        .98,
        .027,
        brushedSteel
    )
);


/* =========================================================
   BAGUE NOIRE INTERNE
   ========================================================= */

gyro.add(
    ring(
        .89,
        .052,
        blackSteel
    )
);


/* =========================================================
   GRADUATIONS HORLOGÈRES
   ========================================================= */

const graduations =
    new THREE.Group();

const graduationMaterial =
    new THREE.MeshStandardMaterial({

        color:0x89999c,

        metalness:.95,

        roughness:.30

    });


for(let i=0;i<72;i++){

    const angle =
        i / 72 * Math.PI * 2;

    const major =
        i % 6 === 0;

    const length =
        major ? .095 : .047;

    const tick =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .018,
                length,
                .014
            ),
            graduationMaterial
        );

    tick.position.set(
        Math.cos(angle) * .94,
        Math.sin(angle) * .94,
        .04
    );

    tick.rotation.z = angle;

    graduations.add(tick);
}

gyro.add(graduations);


/* =========================================================
   VIS DE FIXATION
   ========================================================= */

function screw(x,y,z=.075){

    const s =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .038,
                .038,
                .025,
                16
            ),
            chrome
        );

    s.rotation.x =
        Math.PI / 2;

    s.position.set(
        x,y,z
    );

    return s;
}


for(let i=0;i<8;i++){

    const a =
        i / 8 * Math.PI * 2;

    gyro.add(
        screw(
            Math.cos(a)*1.06,
            Math.sin(a)*1.06
        )
    );
}


/* =========================================================
   CAGE MÉCANIQUE
   ========================================================= */

function cage(radius,material){

    const g =
        new THREE.Group();


    /* anneau très fin */
    g.add(
        ring(
            radius,
            .034,
            material,
            160
        )
    );


    /* second anneau */
    g.add(
        ring(
            radius*.78,
            .022,
            material,
            144
        )
    );


    /* pont supérieur / inférieur */
    const bridge =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .034,
                radius*1.58,
                .032
            ),
            material
        );

    g.add(bridge);


    /* deux petites pièces de fixation */
    const top =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .035,
                .035,
                .10,
                18
            ),
            chrome
        );

    top.rotation.z =
        Math.PI/2;

    top.position.y =
        radius*.78;

    g.add(top);


    const bottom =
        top.clone();

    bottom.position.y =
        -radius*.78;

    g.add(bottom);


    return g;
}


/* =========================================================
   AXE 1
   ========================================================= */

const axis1 =
    new THREE.Group();

axis1.rotation.z =
    .16;

axis1.rotation.y =
    -.24;

axis1.rotation.x =
    .10;

axis1.add(
    cage(
        .72,
        chrome
    )
);

gyro.add(axis1);


/* =========================================================
   AXE 2
   ========================================================= */

const axis2 =
    new THREE.Group();

axis2.rotation.x =
    THREE.MathUtils.degToRad(48);

axis2.rotation.y =
    THREE.MathUtils.degToRad(-18);

axis2.add(
    cage(
        .58,
        brushedSteel
    )
);

gyro.add(axis2);


/* =========================================================
   AXE 3
   ========================================================= */

const axis3 =
    new THREE.Group();

axis3.rotation.x =
    THREE.MathUtils.degToRad(-34);

axis3.rotation.y =
    THREE.MathUtils.degToRad(43);

axis3.add(
    cage(
        .43,
        subtleGold
    )
);

gyro.add(axis3);


/* =========================================================
   AXE CENTRAL
   ========================================================= */

const centralAxis =
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            .018,
            .018,
            1.05,
            24
        ),
        brushedSteel
    );

centralAxis.rotation.z =
    Math.PI / 2;

gyro.add(centralAxis);


/* =========================================================
   PETITE ROUE DE TRANSMISSION
   ========================================================= */

function wheel(
    radius,
    teeth,
    material
){

    const g =
        new THREE.Group();


    g.add(
        ring(
            radius,
            .022,
            material,
            120
        )
    );


    for(let i=0;i<teeth;i++){

        const a =
            i / teeth *
            Math.PI * 2;

        const tooth =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .025,
                    .065,
                    .018
                ),
                material
            );

        tooth.position.set(
            Math.cos(a)*radius,
            Math.sin(a)*radius,
            .04
        );

        tooth.rotation.z =
            a;

        g.add(tooth);
    }

    return g;
}


const wheel1 =
    wheel(
        .34,
        30,
        brushedSteel
    );

const wheel2 =
    wheel(
        .25,
        22,
        subtleGold
    );

axis3.add(wheel1);
axis3.add(wheel2);


/* =========================================================
   RUBIS CENTRAL
   ========================================================= */

const jewel =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .105,
            32,
            24
        ),
        ruby
    );

jewel.position.z =
    .16;

gyro.add(jewel);


/* =========================================================
   REFLET DU RUBIS
   ========================================================= */

const rubyLight =
    new THREE.PointLight(
        0xff174f,
        .9,
        .75
    );

rubyLight.position.z =
    .28;

gyro.add(rubyLight);


/* =========================================================
   COURONNES HOLOGRAPHIQUES
   ========================================================= */

const holographic =
    new THREE.Group();

holographic.position.y =
    .38;

scene.add(holographic);


function holoRing(
    radius,
    opacity,
    width
){

    const material =
        new THREE.MeshBasicMaterial({

            color:0x19dfff,

            transparent:true,

            opacity:opacity,

            blending:
                THREE.AdditiveBlending,

            depthWrite:false

        });

    holographic.add(
        ring(
            radius,
            width,
            material,
            160
        )
    );
}


holoRing(
    1.55,
    .48,
    .007
);

holoRing(
    1.82,
    .34,
    .006
);

holoRing(
    2.08,
    .24,
    .005
);

holoRing(
    2.35,
    .16,
    .004
);

holoRing(
    2.62,
    .11,
    .003
);


/* =========================================================
   SEGMENTS HUD
   ========================================================= */

const hud =
    new THREE.Group();

hud.position.y =
    .38;

scene.add(hud);


const hudMaterial =
    new THREE.MeshBasicMaterial({

        color:0x22dcff,

        transparent:true,

        opacity:.48,

        blending:
            THREE.AdditiveBlending,

        depthWrite:false

    });


for(
    const radius of
    [1.68,1.96,2.22,2.48]
){

    for(
        let i=0;
        i<48;
        i++
    ){

        if(i%3===1) continue;

        const a =
            i/48*Math.PI*2;

        const long =
            i%8===0;

        const segment =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    long ? .13 : .065,
                    .007,
                    .007
                ),
                hudMaterial
            );

        segment.position.set(
            Math.cos(a)*radius,
            Math.sin(a)*radius,
            0
        );

        segment.rotation.z =
            a;

        hud.add(segment);
    }
}


/* =========================================================
   POINTS CARDINAUX
   ========================================================= */

const pointMaterial =
    new THREE.MeshBasicMaterial({
        color:0xd9fbff
    });


for(let i=0;i<4;i++){

    const a =
        i*Math.PI/2;

    const point =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .032,
                16,
                16
            ),
            pointMaterial
        );

    point.position.set(
        Math.cos(a)*2.65,
        .38 + Math.sin(a)*2.65,
        0
    );

    scene.add(point);
}


/* =========================================================
   ANIMATION
   ========================================================= */

const clock =
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );

    const t =
        clock.getElapsedTime();


    /*
       Les trois vitesses sont maintenant
       volontairement différentes mais
       beaucoup moins brutales.
    */

    axis1.rotation.z =
        t * .52;

    axis2.rotation.z =
        -t * .83;

    axis3.rotation.z =
        t * 1.17;


    /*
       Les cages ne tournent donc pas
       ensemble comme de simples cercles.
    */

    axis1.rotation.x =
        .10 +
        Math.sin(t*.37)*.018;

    axis2.rotation.y =
        THREE.MathUtils.degToRad(-18) +
        Math.sin(t*.31)*.025;

    axis3.rotation.x =
        THREE.MathUtils.degToRad(-34) +
        Math.cos(t*.43)*.035;


    /*
       Petites roues internes.
    */

    wheel1.rotation.z =
        -t * 1.75;

    wheel2.rotation.z =
        t * 2.65;


    /*
       Rotation très lente des couronnes
       holographiques.
    */

    holographic.rotation.z =
        t*.025;

    hud.rotation.z =
        -t*.045;


    /*
       Léger mouvement de respiration
       de l'ensemble.
    */

    gyro.rotation.y =
        Math.sin(t*.16)*.035;

    gyro.rotation.x =
        Math.cos(t*.13)*.018;


    renderer.render(
        scene,
        camera
    );
}


animate();


/* =========================================================
   RESPONSIVE
   ========================================================= */

function resize(){

    const w =
        window.innerWidth;

    const h =
        window.innerHeight;


    renderer.setSize(
        w,
        h,
        false
    );


    camera.aspect =
        w/h;

    camera.updateProjectionMatrix();


    const scale =
        w < 600
            ? .69
            : .82;

    gyro.scale.setScalar(
        scale
    );
}


window.addEventListener(
    "resize",
    resize
);

resize();

})();

</script>

</body>
</html>
