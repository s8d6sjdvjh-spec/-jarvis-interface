<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JARVIS — Gyrotourbillon 3 Axes</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#010609;
  color:#d5faff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

#app{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 42%,rgba(0,105,130,.13),transparent 30%),
    #010609;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

header{
  position:absolute;
  z-index:5;
  top:0;
  left:0;
  right:0;
  height:100px;
  padding:calc(env(safe-area-inset-top) + 24px) 30px 0;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  pointer-events:none;
}

.brand{
  font-size:19px;
  font-weight:300;
  letter-spacing:.48em;
}

.status{
  display:flex;
  gap:22px;
  font-size:10px;
  letter-spacing:.3em;
  color:#65848c;
}

.status span{
  display:flex;
  align-items:center;
  gap:7px;
}

.status i{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#09d9ff;
  box-shadow:0 0 10px #09d9ff;
}

.subtitle{
  position:absolute;
  top:103px;
  left:0;
  right:0;
  text-align:center;
  font-size:8px;
  letter-spacing:.43em;
  color:#426872;
}

.panels{
  position:absolute;
  z-index:5;
  left:28px;
  right:28px;
  bottom:27px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
}

.panel{
  min-height:88px;
  padding:15px 17px;
  border:1px solid rgba(0,190,225,.45);
  background:rgba(3,20,27,.72);
  box-shadow:inset 0 0 20px rgba(0,180,220,.035);
}

.label{
  font-size:9px;
  letter-spacing:.38em;
  color:#58b8c8;
}

.value{
  margin-top:7px;
  font-size:29px;
  font-weight:300;
}

.detail{
  margin-top:4px;
  font-size:9px;
  letter-spacing:.16em;
  color:#53727a;
}

.vignette{
  position:absolute;
  inset:0;
  z-index:4;
  pointer-events:none;
  background:radial-gradient(
    circle at 50% 40%,
    transparent 25%,
    rgba(0,0,0,.08) 58%,
    rgba(0,0,0,.58) 100%
  );
}
</style>
</head>

<body>

<div id="app">

<canvas id="scene"></canvas>

<header>
  <div class="brand">JARVIS</div>

  <div class="status">
    <span><i></i>ONLINE</span>
    <span><i></i>SECURE</span>
    <span><i></i>VOICE</span>
  </div>

  <div class="subtitle">
    GYROTOURBILLON · PRECISION CORE · 3 AXIS
  </div>
</header>

<div class="panels">

  <div class="panel">
    <div class="label">MAISON</div>
    <div class="value">03</div>
    <div class="detail">DISPOSITIFS ACTIFS</div>
  </div>

  <div class="panel">
    <div class="label">MÉTÉO</div>
    <div class="value">18°</div>
    <div class="detail">CONDITIONS STABLES</div>
  </div>

  <div class="panel">
    <div class="label">SYSTÈME</div>
    <div class="value">82%</div>
    <div class="detail">PERFORMANCE</div>
  </div>

  <div class="panel">
    <div class="label">ACTIVITÉ</div>
    <div class="value">12</div>
    <div class="detail">ÉVÉNEMENTS RÉCENTS</div>
  </div>

</div>

<div class="vignette"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

(() => {

"use strict";


/* =========================================================
   RENDERER
   ========================================================= */

const canvas=document.getElementById("scene");

const renderer=new THREE.WebGLRenderer({
  canvas,
  antialias:true,
  alpha:true,
  powerPreference:"high-performance"
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio || 1,2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight,
  false
);

renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;


/* =========================================================
   SCÈNE
   ========================================================= */

const scene=new THREE.Scene();


/* =========================================================
   CAMÉRA
   ========================================================= */

const camera=new THREE.PerspectiveCamera(
  31,
  window.innerWidth/window.innerHeight,
  .1,
  100
);

camera.position.set(0,.12,9.8);
camera.lookAt(0,0,0);


/* =========================================================
   LUMIÈRES
   ========================================================= */

scene.add(
  new THREE.AmbientLight(0x40565d,1.25)
);

const cyan=new THREE.PointLight(
  0x20dfff,
  15,
  10
);

cyan.position.set(-2.8,2.7,4);
scene.add(cyan);

const white=new THREE.PointLight(
  0xeaffff,
  20,
  9
);

white.position.set(3,2.1,4.5);
scene.add(white);

const warm=new THREE.PointLight(
  0xffa02b,
  8,
  7
);

warm.position.set(1.5,-2.2,3);
scene.add(warm);


/* =========================================================
   MATÉRIAUX
   ========================================================= */

const silver=new THREE.MeshPhysicalMaterial({
  color:0xc5d4d7,
  metalness:.96,
  roughness:.17,
  clearcoat:1,
  clearcoatRoughness:.1
});

const darkSteel=new THREE.MeshPhysicalMaterial({
  color:0x18252a,
  metalness:.98,
  roughness:.21,
  clearcoat:1
});

const blackMetal=new THREE.MeshPhysicalMaterial({
  color:0x071014,
  metalness:1,
  roughness:.25
});

const steel=new THREE.MeshPhysicalMaterial({
  color:0x70868b,
  metalness:.98,
  roughness:.24
});

const gold=new THREE.MeshPhysicalMaterial({
  color:0xa87427,
  metalness:.97,
  roughness:.18,
  clearcoat:1
});

const ruby=new THREE.MeshPhysicalMaterial({
  color:0x98001f,
  metalness:.2,
  roughness:.1,
  clearcoat:1,
  emissive:0x360008,
  emissiveIntensity:1.6
});


/* =========================================================
   MÉCANISME CENTRAL
   ========================================================= */

const machine=new THREE.Group();

/*
   IMPORTANT :
   le mécanisme est volontairement beaucoup plus petit
   que les couronnes holographiques.
*/

machine.scale.setScalar(.70);

scene.add(machine);


/* =========================================================
   ANNEAU MÉTALLIQUE
   ========================================================= */

function torus(radius,tube,material){

  return new THREE.Mesh(
    new THREE.TorusGeometry(
      radius,
      tube,
      12,
      128
    ),
    material
  );
}


/* =========================================================
   BOÎTIER MÉCANIQUE
   ========================================================= */

machine.add(
  torus(1.55,.075,darkSteel)
);

machine.add(
  torus(1.42,.035,silver)
);

machine.add(
  torus(1.25,.045,blackMetal)
);


/* =========================================================
   GRADUATIONS
   ========================================================= */

const marks=new THREE.Group();

const markMaterial=new THREE.MeshStandardMaterial({
  color:0x8ca4a8,
  metalness:.9,
  roughness:.28
});

for(let i=0;i<60;i++){

  const angle=i/60*Math.PI*2;

  const major=i%5===0;

  const geo=new THREE.BoxGeometry(
    major?.025:.014,
    major?.105:.052,
    .025
  );

  const tick=new THREE.Mesh(
    geo,
    markMaterial
  );

  const radius=1.29;

  tick.position.set(
    Math.cos(angle)*radius,
    Math.sin(angle)*radius,
    .05
  );

  tick.rotation.z=angle;

  marks.add(tick);
}

machine.add(marks);


/* =========================================================
   CRÉATION D'UNE CAGE
   ========================================================= */

function createCage(radius,material){

  const cage=new THREE.Group();


  /* anneau principal */
  cage.add(
    torus(radius,.042,material)
  );


  /* anneau intérieur */
  cage.add(
    torus(radius*.68,.025,material)
  );


  /* pont horizontal */
  const bridge=new THREE.Mesh(
    new THREE.BoxGeometry(
      radius*1.62,
      .035,
      .035
    ),
    material
  );

  cage.add(bridge);


  /* axe */
  const shaft=new THREE.Mesh(
    new THREE.CylinderGeometry(
      .025,
      .025,
      radius*1.7,
      24
    ),
    steel
  );

  shaft.rotation.z=Math.PI/2;

  cage.add(shaft);


  /* quatre vis */
  for(let i=0;i<4;i++){

    const a=i*Math.PI/2+Math.PI/4;

    const screw=new THREE.Mesh(
      new THREE.SphereGeometry(
        .048,
        18,
        18
      ),
      silver
    );

    screw.position.set(
      Math.cos(a)*radius,
      Math.sin(a)*radius,
      .055
    );

    cage.add(screw);
  }

  return cage;
}


/* =========================================================
   TROIS AXES — ORIENTATIONS TRÈS DIFFÉRENTES
   ========================================================= */

const cageA=createCage(1.02,silver);

cageA.rotation.x=.18;
cageA.rotation.y=-.30;

machine.add(cageA);


const cageB=createCage(.86,steel);

cageB.rotation.x=Math.PI*.34;
cageB.rotation.y=Math.PI*.20;

machine.add(cageB);


const cageC=createCage(.68,gold);

cageC.rotation.x=-Math.PI*.30;
cageC.rotation.y=Math.PI*.43;

machine.add(cageC);


/* =========================================================
   ROUES DENTÉES
   ========================================================= */

function gear(radius,teeth,material){

  const g=new THREE.Group();

  g.add(
    torus(radius,.035,material)
  );

  for(let i=0;i<teeth;i++){

    const a=i/teeth*Math.PI*2;

    const tooth=new THREE.Mesh(
      new THREE.BoxGeometry(
        .045,
        .085,
        .028
      ),
      material
    );

    tooth.position.set(
      Math.cos(a)*radius,
      Math.sin(a)*radius,
      .025
    );

    tooth.rotation.z=a;

    g.add(tooth);
  }

  return g;
}

const gear1=gear(.49,28,steel);
machine.add(gear1);

const gear2=gear(.32,20,gold);
machine.add(gear2);


/* =========================================================
   AXE CENTRAL + RUBIS
   ========================================================= */

const centerShaft=new THREE.Mesh(
  new THREE.CylinderGeometry(
    .055,.055,.38,32
  ),
  blackMetal
);

centerShaft.rotation.x=Math.PI/2;

machine.add(centerShaft);


const jewel=new THREE.Mesh(
  new THREE.SphereGeometry(
    .13,
    40,
    28
  ),
  ruby
);

jewel.position.z=.18;

machine.add(jewel);


const rubyLight=new THREE.PointLight(
  0xff174f,
  1.8,
  1
);

rubyLight.position.z=.25;

machine.add(rubyLight);


/* =========================================================
   PIVOTS
   ========================================================= */

for(let i=0;i<8;i++){

  const a=i/8*Math.PI*2;

  const p=new THREE.Mesh(
    new THREE.SphereGeometry(
      .035,
      16,
      16
    ),
    silver
  );

  p.position.set(
    Math.cos(a)*1.06,
    Math.sin(a)*1.06,
    .08
  );

  machine.add(p);
}


/* =========================================================
   COURONNES HOLOGRAPHIQUES
   ========================================================= */

const hologram=new THREE.Group();

scene.add(hologram);

function holo(radius,opacity){

  const material=new THREE.MeshBasicMaterial({
    color:0x05dfff,
    transparent:true,
    opacity,
    blending:THREE.AdditiveBlending,
    depthWrite:false
  });

  hologram.add(
    torus(radius,.008,material)
  );
}

holo(2.05,.52);
holo(2.32,.36);
holo(2.60,.26);
holo(2.88,.18);
holo(3.15,.12);


/* =========================================================
   SEGMENTS HOLOGRAPHIQUES
   ========================================================= */

const hud=new THREE.Group();

scene.add(hud);

const hudMaterial=new THREE.MeshBasicMaterial({
  color:0x19ddff,
  transparent:true,
  opacity:.58,
  blending:THREE.AdditiveBlending
});

for(const radius of [2.18,2.48,2.78,3.08]){

  for(let i=0;i<36;i++){

    if(i%3===1)continue;

    const a=i/36*Math.PI*2;

    const length=i%6===0?.17:.085;

    const segment=new THREE.Mesh(
      new THREE.BoxGeometry(
        length,.009,.009
      ),
      hudMaterial
    );

    segment.position.set(
      Math.cos(a)*radius,
      Math.sin(a)*radius,
      0
    );

    segment.rotation.z=a;

    hud.add(segment);
  }
}


/* =========================================================
   POINTS CARDINAUX
   ========================================================= */

for(let i=0;i<4;i++){

  const a=i*Math.PI/2;

  const p=new THREE.Mesh(
    new THREE.SphereGeometry(
      .04,16,16
    ),
    new THREE.MeshBasicMaterial({
      color:0xd7fbff
    })
  );

  p.position.set(
    Math.cos(a)*3.17,
    Math.sin(a)*3.17,
    0
  );

  scene.add(p);
}


/* =========================================================
   ANIMATION — MODE DIAGNOSTIC 3 AXES
   ========================================================= */

/*
   Les vitesses sont volontairement élevées
   pour que les trois axes soient clairement visibles
   dans l'aperçu.

   Une fois validé :
   cage A ≈ 0.34
   cage B ≈ 0.51
   cage C ≈ 0.78
*/

const clock=new THREE.Clock();

function animate(){

  requestAnimationFrame(animate);

  const t=clock.getElapsedTime();


  /* AXE 1 */
  cageA.rotation.z=t*.85;


  /* AXE 2 */
  cageB.rotation.z=-t*1.35;


  /* AXE 3 */
  cageC.rotation.z=t*1.90;


  /* mouvements secondaires */
  cageA.rotation.x=
    .18+Math.sin(t*.7)*.035;

  cageB.rotation.y=
    Math.PI*.20+
    Math.sin(t*.53)*.055;

  cageC.rotation.x=
    -Math.PI*.30+
    Math.cos(t*.61)*.065;


  /* roues */
  gear1.rotation.z=-t*1.45;
  gear2.rotation.z=t*2.15;


  /* légère respiration de la mécanique */
  machine.rotation.y=
    Math.sin(t*.22)*.035;

  machine.rotation.x=
    Math.cos(t*.19)*.025;


  /* hologrammes */
  hologram.rotation.z=t*.035;
  hud.rotation.z=-t*.065;


  /* lumière */
  cyan.intensity=
    14+Math.sin(t*1.6)*2.5;

  rubyLight.intensity=
    1.7+Math.sin(t*2.8)*.35;


  renderer.render(
    scene,
    camera
  );
}

animate();


/* =========================================================
   RESPONSIVE
   ========================================================= */

function resize(){

  const w=window.innerWidth;
  const h=window.innerHeight;

  renderer.setSize(w,h,false);

  camera.aspect=w/h;
  camera.updateProjectionMatrix();

  machine.scale.setScalar(
    w<600?.70:.86
  );
}

window.addEventListener(
  "resize",
  resize
);

resize();

})();

</script>

</body>
</html>
