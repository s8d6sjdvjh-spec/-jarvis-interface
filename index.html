<script type="module">

import * as THREE from "three";


/* ============================================================
   SCÈNE
   ============================================================ */

const canvas =
    document.getElementById("scene");

const renderer =
    new THREE.WebGLRenderer({

        canvas,

        antialias:true,

        alpha:true,

        powerPreference:
            "high-performance"
    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        2
    )
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    1.05;


const scene =
    new THREE.Scene();


const camera =
    new THREE.PerspectiveCamera(
        27,
        1,
        .01,
        100
    );

camera.position.z =
    6;

camera.lookAt(
    0,
    0,
    0
);


/* ============================================================
   LUMIÈRE
   ============================================================ */

/*
   IMPORTANT :

   Aucun éclairage rouge.

   Le rouge du rubis vient uniquement de son matériau.
*/


const ambient =
    new THREE.HemisphereLight(
        0x193038,
        0x010304,
        1.5
    );

scene.add(
    ambient
);


const key =
    new THREE.DirectionalLight(
        0xd8f5fa,
        4.2
    );

key.position.set(
    -3,
    4,
    5
);

scene.add(
    key
);


const cyan =
    new THREE.PointLight(
        0x20d9f4,
        10,
        8
    );

cyan.position.set(
    -2.5,
    1.5,
    3
);

scene.add(
    cyan
);


const neutral =
    new THREE.PointLight(
        0xffffff,
        4,
        6
    );

neutral.position.set(
    2,
    -2,
    4
);

scene.add(
    neutral
);


/* ============================================================
   MATÉRIAUX
   ============================================================ */

const blackSteel =
    new THREE.MeshStandardMaterial({

        color:0x101719,

        metalness:.98,

        roughness:.30
    });


const steel =
    new THREE.MeshStandardMaterial({

        color:0x7c898c,

        metalness:.97,

        roughness:.23
    });


const brightSteel =
    new THREE.MeshStandardMaterial({

        color:0xc7d2d3,

        metalness:1,

        roughness:.12
    });


const darkSteel =
    new THREE.MeshStandardMaterial({

        color:0x30393b,

        metalness:.95,

        roughness:.36
    });


const brass =
    new THREE.MeshStandardMaterial({

        color:0x806029,

        metalness:.95,

        roughness:.25
    });


const brassDark =
    new THREE.MeshStandardMaterial({

        color:0x3d2b12,

        metalness:.94,

        roughness:.35
    });


/*
   RUBIS :

   sombre,
   translucide,
   sans halo rouge.
*/

const ruby =
    new THREE.MeshPhysicalMaterial({

        color:0x650015,

        metalness:.05,

        roughness:.10,

        transmission:.82,

        thickness:.38,

        ior:1.72,

        clearcoat:1,

        clearcoatRoughness:.07,

        attenuationColor:
            new THREE.Color(
                0x43000c
            ),

        attenuationDistance:1.8
    });


/* ============================================================
   OUTER HOLOGRAPHIC CROWNS
   ============================================================ */

const hologram =
    new THREE.Group();

scene.add(
    hologram
);


const holoMaterial =
    new THREE.LineBasicMaterial({

        color:0x32d9ef,

        transparent:true,

        opacity:.34,

        depthWrite:false,

        blending:
            THREE.AdditiveBlending
    });


const holoDim =
    new THREE.LineBasicMaterial({

        color:0x126272,

        transparent:true,

        opacity:.40,

        depthWrite:false
    });


function circleLine(
    radius,
    material
){

    const points=[];

    const segments=256;

    for(
        let i=0;
        i<=segments;
        i++
    ){

        const a =
            i/segments *
            Math.PI*2;

        points.push(
            new THREE.Vector3(
                Math.cos(a)*radius,
                Math.sin(a)*radius,
                0
            )
        );
    }

    const geometry =
        new THREE.BufferGeometry()
            .setFromPoints(points);

    return new THREE.Line(
        geometry,
        material
    );
}


/*
   Les couronnes occupent environ
   les 3/4 de la zone supérieure.

   Mais elles restent fines.
*/

const crownRadii=[
    1.18,
    1.30,
    1.42,
    1.55,
    1.69,
    1.83,
    1.96,
    2.09
];


for(
    let i=0;
    i<crownRadii.length;
    i++
){

    hologram.add(
        circleLine(
            crownRadii[i],
            i%3===0
                ? holoMaterial
                : holoDim
        )
    );
}


/* ============================================================
   GRADUATIONS HOLOGRAPHIQUES
   ============================================================ */

/*
   Petites.
   Nombreuses.
   Irrégulières.
   Radiales.
   Orientées vers le centre.
*/


function createTicks(
    radius,
    count,
    innerMin,
    innerMax
){

    const group =
        new THREE.Group();

    const material =
        new THREE.LineBasicMaterial({

            color:0x58dbea,

            transparent:true,

            opacity:.46,

            depthWrite:false
        });


    for(
        let i=0;
        i<count;
        i++
    ){

        const angle =
            i/count *
            Math.PI*2;


        /*
           variation déterministe
           pour éviter un bruit totalement aléatoire.
        */

        const wave =
            (
                Math.sin(i*3.71)+1
            )*.5;


        const length =
            innerMin +
            wave *
            (innerMax-innerMin);


        const outer =
            radius;

        const inner =
            radius-length;


        const x1 =
            Math.cos(angle)*outer;

        const y1 =
            Math.sin(angle)*outer;


        const x2 =
            Math.cos(angle)*inner;

        const y2 =
            Math.sin(angle)*inner;


        const geometry =
            new THREE.BufferGeometry()
                .setFromPoints([

                    new THREE.Vector3(
                        x1,
                        y1,
                        .01
                    ),

                    new THREE.Vector3(
                        x2,
                        y2,
                        .01
                    )
                ]);


        group.add(
            new THREE.Line(
                geometry,
                material
            )
        );
    }

    return group;
}


hologram.add(
    createTicks(
        1.30,
        96,
        .025,
        .075
    )
);


hologram.add(
    createTicks(
        1.43,
        120,
        .018,
        .060
    )
);


hologram.add(
    createTicks(
        1.57,
        144,
        .022,
        .082
    )
);


hologram.add(
    createTicks(
        1.71,
        168,
        .015,
        .070
    )
);


hologram.add(
    createTicks(
        1.85,
        192,
        .018,
        .065
    )
);


hologram.add(
    createTicks(
        2.00,
        216,
        .014,
        .055
    )
);


/* ============================================================
   PETITS SYMBOLES HOLOGRAPHIQUES
   ============================================================ */

function symbol(
    radius,
    angle,
    size
){

    const geometry =
        new THREE.OctahedronGeometry(
            size,
            0
        );

    const material =
        new THREE.MeshBasicMaterial({

            color:0x6eeaf5,

            transparent:true,

            opacity:.65
        });


    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );


    mesh.position.set(
        Math.cos(angle)*radius,
        Math.sin(angle)*radius,
        .02
    );


    hologram.add(
        mesh
    );
}


for(
    let i=0;
    i<32;
    i++
){

    symbol(
        1.98,
        i/32*Math.PI*2,
        i%4===0 ? .022 : .012
    );
}


/* ============================================================
   GYROTOURBILLON
   ============================================================ */

const gyro =
    new THREE.Group();

scene.add(
    gyro
);


/*
   Le gyrotourbillon n'est PAS constitué
   de trois gros tubes.

   Chaque cage est une pièce métallique
   plate avec :
   - section
   - évidement
   - chanfrein
   - pont
   - vis
*/


function machinedRing(
    radius,
    thickness,
    depth,
    material
){

    const shape =
        new THREE.Shape();


    const outer =
        radius + thickness/2;

    const inner =
        radius - thickness/2;


    shape.absarc(
        0,
        0,
        outer,
        0,
        Math.PI*2,
        false
    );


    const hole =
        new THREE.Path();


    hole.absarc(
        0,
        0,
        inner,
        0,
        Math.PI*2,
        true
    );


    shape.holes.push(
        hole
    );


    const geometry =
        new THREE.ExtrudeGeometry(
            shape,
            {

                depth,

                curveSegments:64,

                bevelEnabled:true,

                bevelThickness:
                    Math.min(
                        .008,
                        depth*.25
                    ),

                bevelSize:
                    Math.min(
                        .012,
                        thickness*.28
                    ),

                bevelSegments:2
            }
        );


    geometry.center();


    return new THREE.Mesh(
        geometry,
        material
    );
}


/* ============================================================
   CAGE 1
   ============================================================ */

const cageX =
    new THREE.Group();

gyro.add(
    cageX
);


const ringX =
    machinedRing(
        .40,
        .028,
        .035,
        brightSteel
    );

cageX.add(
    ringX
);


/* ============================================================
   CAGE 2
   ============================================================ */

const cageY =
    new THREE.Group();

cageX.add(
    cageY
);


const ringY =
    machinedRing(
        .31,
        .024,
        .032,
        steel
    );

cageY.add(
    ringY
);


/* ============================================================
   CAGE 3
   ============================================================ */

const cageZ =
    new THREE.Group();

cageY.add(
    cageZ
);


const ringZ =
    machinedRing(
        .225,
        .020,
        .029,
        darkSteel
    );

cageZ.add(
    ringZ
);


/* ============================================================
   SECTIONS / PONTS
   ============================================================ */

function plate(
    width,
    height,
    depth,
    material
){

    const geometry =
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );


    return new THREE.Mesh(
        geometry,
        material
    );
}


/*
   Les ponts sont très fins.
*/


const bridgeX =
    plate(
        .72,
        .018,
        .025,
        brightSteel
    );

bridgeX.rotation.z =
    Math.PI/2;

cageX.add(
    bridgeX
);


const bridgeY =
    plate(
        .55,
        .016,
        .022,
        steel
    );

bridgeY.rotation.y =
    Math.PI/2;

cageY.add(
    bridgeY
);


const bridgeZ =
    plate(
        .39,
        .014,
        .020,
        brass
    );

bridgeZ.rotation.x =
    Math.PI/2;

cageZ.add(
    bridgeZ
);


/* ============================================================
   MICRO PONTS DIAGONAUX
   ============================================================ */

function diagonalBridge(
    length,
    material,
    angle
){

    const b =
        plate(
            length,
            .012,
            .018,
            material
        );

    b.rotation.z =
        angle;

    return b;
}


cageX.add(
    diagonalBridge(
        .46,
        darkSteel,
        .63
    )
);


cageY.add(
    diagonalBridge(
        .36,
        brassDark,
        -.72
    )
);


cageZ.add(
    diagonalBridge(
        .27,
        brightSteel,
        .55
    )
);


/* ============================================================
   VIS
   ============================================================ */

function screw(
    radius=.018,
    material=brightSteel
){

    const geometry =
        new THREE.CylinderGeometry(
            radius,
            radius,
            .012,
            16
        );

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.rotation.x =
        Math.PI/2;

    return mesh;
}


function placeScrews(
    parent,
    radius,
    count
){

    for(
        let i=0;
        i<count;
        i++
    ){

        const a =
            i/count *
            Math.PI*2;


        const s =
            screw(
                i%3===0
                    ? .024
                    : .016
            );


        s.position.set(
            Math.cos(a)*radius,
            Math.sin(a)*radius,
            .035
        );


        parent.add(
            s
        );
    }
}


placeScrews(
    cageX,
    .385,
    8
);


placeScrews(
    cageY,
    .295,
    6
);


placeScrews(
    cageZ,
    .212,
    5
);


/* ============================================================
   GRAVURES MÉCANIQUES
   ============================================================ */

function engravingMarks(
    parent,
    radius,
    count
){

    const material =
        new THREE.MeshStandardMaterial({

            color:0x161e20,

            metalness:.9,

            roughness:.38
        });


    for(
        let i=0;
        i<count;
        i++
    ){

        const a =
            i/count*Math.PI*2;


        const mark =
            plate(
                .007,
                i%5===0
                    ? .025
                    : .014,
                .004,
                material
            );


        mark.position.set(
            Math.cos(a)*radius,
            Math.sin(a)*radius,
            .021
        );


        mark.rotation.z =
            a + Math.PI/2;


        parent.add(
            mark
        );
    }
}


engravingMarks(
    cageX,
    .365,
    40
);


engravingMarks(
    cageY,
    .278,
    32
);


engravingMarks(
    cageZ,
    .196,
    28
);


/* ============================================================
   AXES
   ============================================================ */

function axle(
    length,
    material
){

    const geometry =
        new THREE.CylinderGeometry(
            .012,
            .012,
            length,
            18
        );


    return new THREE.Mesh(
        geometry,
        material
    );
}


const axleX =
    axle(
        .84,
        darkSteel
    );

axleX.rotation.z =
    Math.PI/2;

cageX.add(
    axleX
);


const axleY =
    axle(
        .66,
        steel
    );

axleY.rotation.x =
    Math.PI/2;

cageY.add(
    axleY
);


const axleZ =
    axle(
        .50,
        brass
    );

axleZ.rotation.z =
    Math.PI/2;

cageZ.add(
    axleZ
);


/* ============================================================
   CENTRE
   ============================================================ */


/* roue centrale */

const wheel =
    machinedRing(
        .095,
        .015,
        .020,
        brass
    );

cageZ.add(
    wheel
);


/* axe central */

const centralAxle =
    axle(
        .20,
        brightSteel
    );

cageZ.add(
    centralAxle
);


/* rubis */

const rubyGeometry =
    new THREE.IcosahedronGeometry(
        .052,
        3
    );


const rubyMesh =
    new THREE.Mesh(
        rubyGeometry,
        ruby
    );


cageZ.add(
    rubyMesh
);


/* petit sertissage */

const setting =
    new THREE.TorusGeometry(
        .066,
        .008,
        12,
        32
    );


const settingMesh =
    new THREE.Mesh(
        setting,
        brass
    );


cageZ.add(
    settingMesh
);


/* ============================================================
   PIVOTS
   ============================================================ */

function pivot(
    radius,
    material
){

    const g =
        new THREE.SphereGeometry(
            radius,
            16,
            16
        );

    return new THREE.Mesh(
        g,
        material
    );
}


const pA =
    pivot(
        .022,
        brightSteel
    );

pA.position.set(
    .40,
    0,
    .04
);

cageX.add(
    pA
);


const pB =
    pivot(
        .018,
        steel
    );

pB.position.set(
    0,
    .31,
    .04
);

cageY.add(
    pB
);


const pC =
    pivot(
        .015,
        brass
    );

pC.position.set(
    .225,
    0,
    .04
);

cageZ.add(
    pC
);


/* ============================================================
   ORIENTATION INITIALE
   ============================================================ */

gyro.rotation.x =
    THREE.MathUtils.degToRad(17);

gyro.rotation.y =
    THREE.MathUtils.degToRad(-13);

gyro.rotation.z =
    THREE.MathUtils.degToRad(8);


/* ============================================================
   POSITIONNEMENT PORTRAIT
   ============================================================ */

function layout(){

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;


    renderer.setSize(
        width,
        height,
        false
    );


    camera.aspect =
        width/height;

    camera.updateProjectionMatrix();


    /*
       Gyrotourbillon :
       15% de la largeur de l'écran.

       Important :
       ce calcul concerne uniquement
       le mécanisme métallique central.
    */


    const verticalVisible =
        2 *
        Math.tan(
            THREE.MathUtils.degToRad(
                camera.fov/2
            )
        ) *
        camera.position.z;


    const horizontalVisible =
        verticalVisible *
        camera.aspect;


    const targetDiameter =
        horizontalVisible *
        .15;


    const naturalDiameter =
        .82;


    const scale =
        targetDiameter /
        naturalDiameter;


    gyro.scale.setScalar(
        scale
    );


    /*
       Le centre se trouve dans
       la moitié supérieure.
    */

    const centerY =
        verticalVisible*.12;


    gyro.position.set(
        0,
        centerY,
        0
    );


    hologram.scale.setScalar(
        horizontalVisible /
        4.15
    );


    hologram.position.set(
        0,
        centerY,
        -.06
    );

}


layout();


window.addEventListener(
    "resize",
    layout
);


/* ============================================================
   ANIMATION
   ============================================================ */

const clock =
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );


    const t =
        clock.getElapsedTime();


    /*
       AXE X

       Rotation lente :
       cage extérieure.
    */

    cageX.rotation.x =
        t*.72;


    /*
       AXE Y

       Plus rapide.
    */

    cageY.rotation.y =
        t*1.17;


    /*
       AXE Z

       Rapide.

       On veut clairement voir
       une dynamique sphérique.
    */

    cageZ.rotation.z =
        t*1.82;


    /*
       Petites précessions indépendantes.

       Elles évitent que les trois
       axes paraissent mécaniquement
       synchronisés.
    */

    cageX.rotation.z =
        Math.sin(t*.43)*.075;


    cageY.rotation.x =
        Math.sin(t*.67)*.11;


    cageZ.rotation.y =
        Math.cos(t*.91)*.14;


    /*
       Couronnes holographiques :

       mouvement extrêmement subtil,
       contrairement au mécanisme.
    */

    hologram.rotation.z =
        t*.010;


    hologram.rotation.x =
        Math.sin(t*.10)*.008;


    /*
       Très légère variation de position
       de certaines couronnes.
    */

    hologram.children.forEach(
        (child,index)=>{

            if(
                index<8
            ){

                child.rotation.z =
                    Math.sin(
                        t*.12 +
                        index
                    )*.002;
            }
        }
    );


    /*
       Rubis :

       seulement une variation
       microscopique de lumière.

       AUCUN halo rouge.
    */

    rubyMesh.scale.setScalar(
        1 +
        Math.sin(t*2.0)*.025
    );


    renderer.render(
        scene,
        camera
    );
}


animate();

</script>
