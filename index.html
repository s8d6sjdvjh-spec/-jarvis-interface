<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#02090d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>JARVIS — Geode Core</title>

<style>
:root{
    --bg:#02080c;
    --grid:rgba(33,130,153,.15);
    --cyan:#1fe5ff;
    --cyan2:#72f4ff;
    --blue:#238dff;
    --gold:#c99b45;
    --violet:#806cff;
    --white:#dffcff;
    --muted:#48717c;
    --panel:rgba(2,16,22,.72);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--white);
    font-family:
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
}

body{
    position:relative;
}

#app{
    position:relative;
    width:100vw;
    height:100dvh;
    min-height:100vh;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 48%,
            rgba(0,105,130,.12),
            transparent 37%
        ),
        linear-gradient(
            180deg,
            #030b10 0%,
            #02080c 100%
        );
}

#hud{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

.top{
    position:absolute;
    top:calc(env(safe-area-inset-top) + 18px);
    left:0;
    width:100%;
    padding:0 7vw;
    display:flex;
    align-items:center;
    justify-content:space-between;
    z-index:10;
    pointer-events:none;
}

.logo{
    font-size:clamp(25px,7vw,38px);
    letter-spacing:.30em;
    font-weight:300;
    white-space:nowrap;
}

.status{
    display:flex;
    gap:clamp(12px,3vw,24px);
    align-items:center;
}

.statusItem{
    display:flex;
    align-items:center;
    gap:7px;
    color:#71939d;
    font-size:9px;
    letter-spacing:.28em;
    white-space:nowrap;
}

.statusDot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--cyan);
    box-shadow:
        0 0 5px var(--cyan),
        0 0 15px rgba(31,229,255,.75);
}

.heading{
    position:absolute;
    top:calc(env(safe-area-inset-top) + 104px);
    width:100%;
    text-align:center;
    z-index:8;
    pointer-events:none;
}

.headingMain{
    font-size:11px;
    letter-spacing:.38em;
    color:#5b8994;
}

.headingSub{
    margin-top:15px;
    font-size:8px;
    letter-spacing:.34em;
    color:#315c67;
}

.voiceText{
    position:absolute;
    left:8%;
    right:8%;
    top:calc(100% - 215px);
    height:42px;
    border-top:1px solid rgba(31,229,255,.32);
    border-bottom:1px solid rgba(31,229,255,.18);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10;
    color:#4f8793;
    font-size:9px;
    letter-spacing:.25em;
    text-align:center;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    background:rgba(0,15,21,.35);
}

.voiceText.active{
    color:#a5faff;
    text-shadow:
        0 0 8px rgba(31,229,255,.7);
}

.controls{
    position:absolute;
    left:4.5%;
    right:4.5%;
    bottom:calc(env(safe-area-inset-bottom) + 58px);
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    z-index:20;
}

.control{
    min-height:62px;
    border:1px solid rgba(31,229,255,.65);
    background:
        linear-gradient(
            180deg,
            rgba(8,31,39,.68),
            rgba(1,13,18,.82)
        );
    color:#9bdce4;
    font-size:9px;
    letter-spacing:.22em;
    text-transform:uppercase;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    cursor:pointer;
    box-shadow:
        inset 0 0 20px rgba(0,180,220,.035),
        0 0 10px rgba(0,190,220,.03);
    transition:
        transform .12s ease,
        background .2s ease,
        box-shadow .2s ease;
}

.control:active{
    transform:scale(.97);
}

.control.active{
    border-color:#71f6ff;
    color:#d9ffff;
    box-shadow:
        0 0 15px rgba(31,229,255,.28),
        inset 0 0 20px rgba(31,229,255,.10);
}

.micIcon{
    width:10px;
    height:16px;
    border:1px solid currentColor;
    border-radius:7px;
    margin-right:9px;
    position:relative;
}

.micIcon::after{
    content:"";
    position:absolute;
    width:16px;
    height:9px;
    left:50%;
    bottom:-7px;
    transform:translateX(-50%);
    border:
        1px solid currentColor;
    border-top:0;
    border-radius:0 0 9px 9px;
}

.transcript{
    position:absolute;
    left:7%;
    right:7%;
    bottom:calc(env(safe-area-inset-bottom) + 138px);
    min-height:24px;
    z-index:15;
    text-align:center;
    font-size:10px;
    line-height:1.5;
    color:#7fb9c3;
    letter-spacing:.08em;
    opacity:.85;
    pointer-events:none;
}

@media(max-width:390px){

    .top{
        padding-left:6vw;
        padding-right:6vw;
    }

    .status{
        gap:9px;
    }

    .statusItem{
        font-size:7px;
        letter-spacing:.20em;
    }

    .statusDot{
        width:6px;
        height:6px;
    }

    .heading{
        top:calc(env(safe-area-inset-top) + 98px);
    }

    .headingMain{
        font-size:9px;
    }

    .headingSub{
        font-size:7px;
    }

    .control{
        font-size:7px;
        letter-spacing:.16em;
    }
}

@media(min-width:700px){

    .top{
        padding-left:9vw;
        padding-right:9vw;
    }

    .controls{
        left:12%;
        right:12%;
    }

    .voiceText{
        left:12%;
        right:12%;
    }
}
</style>
</head>

<body>

<div id="app">

    <canvas id="hud"></canvas>

    <div class="top">
        <div class="logo">JARVIS</div>

        <div class="status">

            <div class="statusItem">
                <span class="statusDot"></span>
                ONLINE
            </div>

            <div class="statusItem">
                <span class="statusDot"></span>
                SECURE
            </div>

            <div class="statusItem">
                <span class="statusDot"></span>
                VOICE
            </div>

        </div>
    </div>

    <div class="heading">

        <div class="headingMain">
            VOICE CORE · CRYSTALLINE MATRIX · 3 AXIS
        </div>

        <div class="headingSub">
            HOLOGRAPHIC CONCENTRIC SYSTEM · AUDIO REACTIVE
        </div>

    </div>

    <div id="voiceText" class="voiceText">
        SYSTEM READY · TAP MICRO TO LISTEN
    </div>

    <div id="transcript" class="transcript"></div>

    <div class="controls">

        <button
            id="micButton"
            class="control"
            type="button">

            <span class="micIcon"></span>

            MICRO<br>ACTIF

        </button>

        <button
            id="shortcutButton"
            class="control"
            type="button">

            ENVOYER<br>RACCOURCIS

        </button>

        <button
            id="voiceButton"
            class="control"
            type="button">

            VOIX<br>JARVIS

        </button>

    </div>

</div>

<script>

/* ============================================================
   JARVIS — GEODE CORE
   Pure Canvas / HTML / CSS / JavaScript
   No external 3D library.
   ============================================================ */

const canvas =
    document.getElementById("hud");

const ctx =
    canvas.getContext("2d");

const app =
    document.getElementById("app");

const voiceText =
    document.getElementById("voiceText");

const transcript =
    document.getElementById("transcript");

const micButton =
    document.getElementById("micButton");

const voiceButton =
    document.getElementById("voiceButton");

const shortcutButton =
    document.getElementById("shortcutButton");

let W = 0;
let H = 0;
let DPR = 1;

let cx = 0;
let cy = 0;

let baseRadius = 0;

let audioContext = null;
let analyser = null;
let microphone = null;
let audioData = null;

let listening = false;
let speechRecognition = null;

let smoothAudio = 0;
let peakAudio = 0;

let lastTime = performance.now();

let globalTime = 0;

const TAU = Math.PI * 2;


/* ============================================================
   RESIZE
   ============================================================ */

function resize(){

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width =
        Math.floor(W * DPR);

    canvas.height =
        Math.floor(H * DPR);

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );

    cx = W / 2;

    /*
       The visual occupies roughly the upper
       56% of the iPhone screen.
       Four rings remain safely inside
       the lateral edges.
    */

    const available =
        Math.min(
            W * .94,
            H * .58
        );

    baseRadius =
        available * .435;

    cy =
        Math.min(
            H * .48,
            H * .44
        );
}

window.addEventListener(
    "resize",
    resize,
    {passive:true}
);

resize();


/* ============================================================
   UTILITIES
   ============================================================ */

function clamp(v,min,max){
    return Math.max(
        min,
        Math.min(max,v)
    );
}

function lerp(a,b,t){
    return a + (b-a)*t;
}

function polar(
    radius,
    angle
){

    return {
        x:cx + Math.cos(angle)*radius,
        y:cy + Math.sin(angle)*radius
    };

}

function rgba(
    r,
    g,
    b,
    a
){

    return `rgba(${r},${g},${b},${a})`;

}


/* ============================================================
   BACKGROUND GRID
   ============================================================ */

function drawBackground(){

    ctx.fillStyle =
        "#02080c";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    const small = 28;
    const large = 140;

    ctx.lineWidth = 1;

    /*
       Fine grid
    */

    ctx.strokeStyle =
        "rgba(31,125,145,.10)";

    ctx.beginPath();

    for(
        let x=0;
        x<=W;
        x+=small
    ){

        ctx.moveTo(x,0);
        ctx.lineTo(x,H);

    }

    for(
        let y=0;
        y<=H;
        y+=small
    ){

        ctx.moveTo(0,y);
        ctx.lineTo(W,y);

    }

    ctx.stroke();

    /*
       Major grid
    */

    ctx.strokeStyle =
        "rgba(46,159,181,.09)";

    ctx.beginPath();

    for(
        let x=0;
        x<=W;
        x+=large
    ){

        ctx.moveTo(x,0);
        ctx.lineTo(x,H);

    }

    for(
        let y=0;
        y<=H;
        y+=large
    ){

        ctx.moveTo(0,y);
        ctx.lineTo(W,y);

    }

    ctx.stroke();

    /*
       Center glow
    */

    const glow =
        ctx.createRadialGradient(
            cx,
            cy,
            0,
            cx,
            cy,
            baseRadius * 1.3
        );

    glow.addColorStop(
        0,
        `rgba(0,175,215,${.10 + smoothAudio*.10})`
    );

    glow.addColorStop(
        .45,
        "rgba(0,100,135,.035)"
    );

    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle = glow;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        baseRadius*1.3,
        0,
        TAU
    );

    ctx.fill();

}


/* ============================================================
   RING GLOW
   ============================================================ */

function ringGlow(
    radius,
    width,
    alpha
){

    ctx.save();

    ctx.shadowBlur =
        14 + smoothAudio*30;

    ctx.shadowColor =
        `rgba(31,229,255,${alpha})`;

    ctx.strokeStyle =
        `rgba(31,229,255,${alpha})`;

    ctx.lineWidth =
        width;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radius,
        0,
        TAU
    );

    ctx.stroke();

    ctx.restore();

}


/* ============================================================
   FIXED CONCENTRIC RINGS
   Four primary rings.
   They NEVER move away from the centre.
   Audio changes only their radius.
   ============================================================ */

const rings = [

    {
        base:.29,
        thickness:2.2,
        phase:0,
        speed:.09,
        direction:1,
        cyan:true
    },

    {
        base:.43,
        thickness:2.0,
        phase:1.8,
        speed:.055,
        direction:-1,
        cyan:true
    },

    {
        base:.58,
        thickness:2.2,
        phase:.6,
        speed:.035,
        direction:1,
        cyan:true
    },

    {
        base:.73,
        thickness:2.5,
        phase:2.4,
        speed:.022,
        direction:-1,
        cyan:true
    }

];


/* ============================================================
   DRAW PRIMARY RINGS
   ============================================================ */

function drawPrimaryRings(){

    rings.forEach(
        (ring,index)=>{

            /*
               Audio expansion.
               All four rings expand concentrically.
            */

            const audioExpansion =
                smoothAudio *
                (
                    9 +
                    index*7
                );

            const radius =
                baseRadius *
                ring.base +
                audioExpansion;

            /*
               Outer holographic halo
            */

            ctx.save();

            ctx.strokeStyle =
                `rgba(31,229,255,${
                    .16 +
                    smoothAudio*.20
                })`;

            ctx.lineWidth =
                ring.thickness + 5;

            ctx.shadowBlur =
                18 + smoothAudio*28;

            ctx.shadowColor =
                "rgba(31,229,255,.42)";

            ctx.beginPath();

            ctx.arc(
                cx,
                cy,
                radius,
                0,
                TAU
            );

            ctx.stroke();

            ctx.restore();

            /*
               Main ring
            */

            ctx.strokeStyle =
                `rgba(83,239,255,${
                    .65 +
                    smoothAudio*.30
                })`;

            ctx.lineWidth =
                ring.thickness;

            ctx.beginPath();

            ctx.arc(
                cx,
                cy,
                radius,
                0,
                TAU
            );

            ctx.stroke();

            /*
               Inner fine ring
            */

            ctx.strokeStyle =
                "rgba(47,170,193,.36)";

            ctx.lineWidth =
                .7;

            ctx.beginPath();

            ctx.arc(
                cx,
                cy,
                radius-6,
                0,
                TAU
            );

            ctx.stroke();

            /*
               Outer fine ring
            */

            ctx.beginPath();

            ctx.arc(
                cx,
                cy,
                radius+7,
                0,
                TAU
            );

            ctx.stroke();

        }
    );

}


/* ============================================================
   TICKS
   ============================================================ */

function drawTicks(){

    rings.forEach(
        (ring,index)=>{

            const audioExpansion =
                smoothAudio *
                (
                    9 +
                    index*7
                );

            const radius =
                baseRadius *
                ring.base +
                audioExpansion;

            const majorEvery = 12;
            const total = 120;

            for(
                let i=0;
                i<total;
                i++
            ){

                const angle =
                    (
                        i / total
                    ) * TAU -
                    Math.PI/2;

                const major =
                    i % majorEvery === 0;

                const medium =
                    i % 6 === 0;

                const inner =
                    radius -
                    (
                        major
                        ? 11
                        : medium
                        ? 7
                        : 4
                    );

                const outer =
                    radius +
                    (
                        major
                        ? 8
                        : medium
                        ? 5
                        : 2
                    );

                const p1 =
                    polar(
                        inner,
                        angle
                    );

                const p2 =
                    polar(
                        outer,
                        angle
                    );

                ctx.strokeStyle =
                    major
                    ? "rgba(224,252,255,.86)"
                    : medium
                    ? "rgba(105,222,235,.62)"
                    : "rgba(42,143,159,.45)";

                ctx.lineWidth =
                    major
                    ? 1.45
                    : medium
                    ? .9
                    : .55;

                ctx.beginPath();

                ctx.moveTo(
                    p1.x,
                    p1.y
                );

                ctx.lineTo(
                    p2.x,
                    p2.y
                );

                ctx.stroke();

            }

        }
    );

}


/* ============================================================
   NUMBERS
   ============================================================ */

function drawNumbers(){

    const sets = [
        [
            "000","030","060",
            "090","120","150",
            "180","210","240",
            "270","300","330"
        ],

        [
            "A17","B04","C82",
            "D31","E09","F64",
            "G12","H55","J03",
            "K71","M20","N88"
        ],

        [
            "02","05","08","11",
            "14","17","20","23"
        ]
    ];

    rings.forEach(
        (ring,index)=>{

            const radius =
                baseRadius *
                ring.base +
                smoothAudio *
                (9+index*7);

            const set =
                sets[index % sets.length];

            const count =
                set.length;

            set.forEach(
                (label,i)=>{

                    const angle =
                        (
                            i/count
                        )*TAU -
                        Math.PI/2 +
                        globalTime *
                        ring.speed *
                        ring.direction;

                    const p =
                        polar(
                            radius+15+index*2,
                            angle
                        );

                    ctx.save();

                    ctx.translate(
                        p.x,
                        p.y
                    );

                    /*
                       Tangential orientation
                    */

                    ctx.rotate(
                        angle +
                        Math.PI/2
                    );

                    ctx.fillStyle =
                        index===1
                        ? "rgba(91,205,221,.62)"
                        : "rgba(186,236,241,.72)";

                    ctx.font =
                        index===0
                        ? "8px monospace"
                        : "7px monospace";

                    ctx.textAlign =
                        "center";

                    ctx.textBaseline =
                        "middle";

                    ctx.fillText(
                        label,
                        0,
                        0
                    );

                    ctx.restore();

                }
            );

        }
    );

}


/* ============================================================
   SECONDARY ARCS
   These rotate opposite to the primary ring system.
   ============================================================ */

function drawSecondaryArcs(){

    rings.forEach(
        (ring,index)=>{

            const radius =
                baseRadius *
                ring.base +
                smoothAudio *
                (9+index*7);

            const arcCount =
                3 + index;

            for(
                let j=0;
                j<arcCount;
                j++
            ){

                const offset =
                    j *
                    (
                        TAU/
                        arcCount
                    );

                const start =
                    offset +
                    globalTime *
                    (
                        -.055 -
                        index*.012
                    );

                const span =
                    .32 +
                    (
                        .20 *
                        Math.sin(
                            globalTime*.7+j
                        )
                    );

                ctx.save();

                ctx.strokeStyle =
                    j%3===0
                    ? "rgba(221,162,67,.78)"
                    : j%3===1
                    ? "rgba(111,89,255,.70)"
                    : "rgba(37,225,247,.70)";

                ctx.lineWidth =
                    j%3===0
                    ? 1.2
                    : .85;

                ctx.shadowBlur =
                    smoothAudio*10;

                ctx.shadowColor =
                    ctx.strokeStyle;

                ctx.beginPath();

                ctx.arc(
                    cx,
                    cy,
                    radius-12,
                    start,
                    start+span
                );

                ctx.stroke();

                ctx.restore();

            }

        }
    );

}


/* ============================================================
   INFORMATION BANDS BETWEEN RINGS
   ============================================================ */

function drawInformationBands(){

    rings.forEach(
        (ring,index)=>{

            const r =
                baseRadius *
                ring.base +
                smoothAudio *
                (9+index*7);

            const inner =
                r-23;

            const outer =
                r+23;

            /*
               dotted information orbit
            */

            ctx.fillStyle =
                "rgba(77,193,207,.48)";

            for(
                let i=0;
                i<72;
                i++
            ){

                const a =
                    i/72*TAU;

                const p =
                    polar(
                        inner,
                        a
                    );

                const size =
                    i%9===0
                    ? 2.1
                    : .8;

                ctx.beginPath();

                ctx.arc(
                    p.x,
                    p.y,
                    size,
                    0,
                    TAU
                );

                ctx.fill();

            }

            /*
               Small geometric artefacts
            */

            for(
                let i=0;
                i<18;
                i++
            ){

                const a =
                    i/18*TAU +
                    globalTime *
                    .015 *
                    (index%2===0?1:-1);

                const radius =
                    inner +
                    (
                        outer-inner
                    ) *
                    (
                        .25 +
                        (
                            i%5
                        )*.12
                    );

                const p =
                    polar(
                        radius,
                        a
                    );

                ctx.save();

                ctx.translate(
                    p.x,
                    p.y
                );

                ctx.rotate(a);

                ctx.strokeStyle =
                    i%4===0
                    ? "rgba(205,157,68,.65)"
                    : "rgba(72,201,218,.52)";

                ctx.lineWidth =
                    .7;

                ctx.strokeRect(
                    -2,
                    -2,
                    4,
                    4
                );

                ctx.restore();

            }

        }
    );

}


/* ============================================================
   CENTER CROSS GRID
   The grid crosses the complete geode.
   ============================================================ */

function drawCenterGrid(){

    const size =
        baseRadius *
        .34;

    ctx.save();

    ctx.strokeStyle =
        `rgba(52,210,231,${
            .13 +
            smoothAudio*.13
        })`;

    ctx.lineWidth = .55;

    /*
       radial spokes
    */

    const spokes = 24;

    for(
        let i=0;
        i<spokes;
        i++
    ){

        const a =
            i/spokes*TAU;

        const p =
            polar(
                size,
                a
            );

        ctx.beginPath();

        ctx.moveTo(
            cx,
            cy
        );

        ctx.lineTo(
            p.x,
            p.y
        );

        ctx.stroke();

    }

    /*
       horizontal / vertical
    */

    ctx.beginPath();

    ctx.moveTo(
        cx-size,
        cy
    );

    ctx.lineTo(
        cx+size,
        cy
    );

    ctx.moveTo(
        cx,
        cy-size
    );

    ctx.lineTo(
        cx,
        cy+size
    );

    ctx.stroke();

    /*
       latitude-like circles
    */

    for(
        let i=1;
        i<=5;
        i++
    ){

        const r =
            size *
            (i/5);

        ctx.beginPath();

        ctx.arc(
            cx,
            cy,
            r,
            0,
            TAU
        );

        ctx.stroke();

    }

    ctx.restore();

}


/* ============================================================
   GEODE CORE
   ============================================================ */

function createGeodeVertices(
    radius,
    ringsCount
){

    const vertices=[];

    for(
        let layer=0;
        layer<ringsCount;
        layer++
    ){

        const layerRadius =
            radius *
            (
                1 -
                layer/
                (ringsCount*1.45)
            );

        const count =
            18 +
            layer*3;

        const layerOffset =
            layer%2
            ? Math.PI/count
            : 0;

        const points=[];

        for(
            let i=0;
            i<count;
            i++
        ){

            const angle =
                i/count*TAU +
                layerOffset;

            const wobble =
                1 +
                Math.sin(
                    i*3.71+
                    layer*2.14
                )*.045;

            points.push({
                x:
                    cx +
                    Math.cos(angle)*
                    layerRadius*
                    wobble,

                y:
                    cy +
                    Math.sin(angle)*
                    layerRadius*
                    wobble,

                angle
            });

        }

        vertices.push(points);

    }

    return vertices;

}


/* ============================================================
   GEODE DRAW
   ============================================================ */

function drawGeode(){

    const audioPulse =
        smoothAudio *
        baseRadius *
        .075;

    const radius =
        baseRadius*.155 +
        audioPulse;

    /*
       Outer crystalline halo
    */

    const halo =
        ctx.createRadialGradient(
            cx,
            cy,
            radius*.2,
            cx,
            cy,
            radius*1.8
        );

    halo.addColorStop(
        0,
        "rgba(92,240,255,.28)"
    );

    halo.addColorStop(
        .35,
        "rgba(0,150,190,.11)"
    );

    halo.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle =
        halo;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radius*1.8,
        0,
        TAU
    );

    ctx.fill();

    /*
       Geode polygon
    */

    const sides = 22;

    const points=[];

    for(
        let i=0;
        i<sides;
        i++
    ){

        const angle =
            i/sides*TAU -
            Math.PI/2;

        const irregular =
            1 +
            Math.sin(i*4.37)*.075 +
            Math.sin(i*1.91)*.035;

        const pulse =
            1 +
            smoothAudio*
            .11*
            Math.sin(i*2.3);

        points.push({

            x:
                cx+
                Math.cos(angle)*
                radius*
                irregular*
                pulse,

            y:
                cy+
                Math.sin(angle)*
                radius*
                irregular*
                pulse

        });

    }

    /*
       Dark translucent body
    */

    const body =
        ctx.createRadialGradient(
            cx-radius*.3,
            cy-radius*.35,
            radius*.05,
            cx,
            cy,
            radius
        );

    body.addColorStop(
        0,
        "rgba(113,241,255,.38)"
    );

    body.addColorStop(
        .25,
        "rgba(18,102,125,.35)"
    );

    body.addColorStop(
        .62,
        "rgba(3,32,42,.80)"
    );

    body.addColorStop(
        1,
        "rgba(1,11,16,.96)"
    );

    ctx.fillStyle =
        body;

    ctx.beginPath();

    points.forEach(
        (p,i)=>{

            if(i===0){
                ctx.moveTo(
                    p.x,
                    p.y
                );
            }else{
                ctx.lineTo(
                    p.x,
                    p.y
                );
            }

        }
    );

    ctx.closePath();

    ctx.fill();

    /*
       Crystal triangular facets
    */

    const innerRadius =
        radius*.80;

    const inner=[];

    for(
        let i=0;
        i<sides;
        i++
    ){

        const a =
            i/sides*TAU -
            Math.PI/2;

        const irregular =
            1+
            Math.sin(
                i*2.73
            )*.055;

        inner.push({

            x:
                cx+
                Math.cos(a)*
                innerRadius*
                irregular,

            y:
                cy+
                Math.sin(a)*
                innerRadius*
                irregular

        });

    }

    for(
        let i=0;
        i<sides;
        i++
    ){

        const p1 =
            points[i];

        const p2 =
            points[(i+1)%sides];

        const p3 =
            inner[
                (i+2)%sides
            ];

        const hue =
            i%4===0
            ? "rgba(72,222,245,.18)"
            : i%4===1
            ? "rgba(86,119,255,.13)"
            : i%4===2
            ? "rgba(31,203,220,.10)"
            : "rgba(208,164,73,.09)";

        ctx.fillStyle =
            hue;

        ctx.beginPath();

        ctx.moveTo(
            p1.x,
            p1.y
        );

        ctx.lineTo(
            p2.x,
            p2.y
        );

        ctx.lineTo(
            p3.x,
            p3.y
        );

        ctx.closePath();

        ctx.fill();

        ctx.strokeStyle =
            "rgba(83,230,247,.26)";

        ctx.lineWidth =
            .55;

        ctx.stroke();

    }

    /*
       Inner crystalline network
    */

    ctx.save();

    ctx.strokeStyle =
        `rgba(104,239,255,${
            .34+
            smoothAudio*.25
        })`;

    ctx.lineWidth=.65;

    for(
        let i=0;
        i<sides;
        i++
    ){

        const p =
            inner[i];

        ctx.beginPath();

        ctx.moveTo(
            cx,
            cy
        );

        ctx.lineTo(
            p.x,
            p.y
        );

        ctx.stroke();

    }

    /*
       central crystal facets
    */

    const coreR =
        radius*.34;

    for(
        let i=0;
        i<12;
        i++
    ){

        const a =
            i/12*TAU +
            globalTime*.035;

        const r1 =
            coreR*.25;

        const r2 =
            coreR*
            (
                .75+
                .15*Math.sin(i*2)
            );

        const p1 =
            polar(r1,a);

        const p2 =
            polar(
                r2,
                a+
                .16
            );

        const p3 =
            polar(
                r2,
                a-
                .16
            );

        ctx.beginPath();

        ctx.moveTo(
            p1.x,
            p1.y
        );

        ctx.lineTo(
            p2.x,
            p2.y
        );

        ctx.lineTo(
            p3.x,
            p3.y
        );

        ctx.closePath();

        ctx.stroke();

    }

    ctx.restore();

    /*
       Crystal vertices
    */

    inner.forEach(
        (p,i)=>{

            if(
                i%2===0
            ){

                ctx.fillStyle =
                    "rgba(163,248,255,.82)";

                ctx.shadowBlur =
                    7;

                ctx.shadowColor =
                    "#25e5ff";

                ctx.beginPath();

                ctx.arc(
                    p.x,
                    p.y,
                    1.7+
                    smoothAudio*2,
                    0,
                    TAU
                );

                ctx.fill();

            }

        }
    );

    /*
       Outer edge
    */

    ctx.save();

    ctx.strokeStyle =
        "rgba(143,248,255,.80)";

    ctx.lineWidth =
        1.5;

    ctx.shadowBlur =
        14;

    ctx.shadowColor =
        "rgba(31,229,255,.60)";

    ctx.beginPath();

    points.forEach(
        (p,i)=>{

            if(i===0){
                ctx.moveTo(
                    p.x,
                    p.y
                );
            }else{
                ctx.lineTo(
                    p.x,
                    p.y
                );
            }

        }
    );

    ctx.closePath();

    ctx.stroke();

    ctx.restore();

    /*
       Core label
    */

    ctx.fillStyle =
        "#d9fbff";

    ctx.font =
        "11px monospace";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.letterSpacing =
        "5px";

    ctx.fillText(
        "C O R E",
        cx,
        cy-3
    );

    ctx.fillStyle =
        "rgba(118,204,216,.65)";

    ctx.font =
        "7px monospace";

    ctx.fillText(
        listening
        ? "LISTENING"
        : "READY",
        cx,
        cy+13
    );

}


/* ============================================================
   CORE PARTICLES
   ============================================================ */

function drawCoreParticles(){

    const radius =
        baseRadius*.23;

    const count =
        65;

    for(
        let i=0;
        i<count;
        i++
    ){

        const seed =
            i*17.731;

        const angle =
            seed+
            globalTime*
            (
                .03+
                (i%3)*.01
            );

        const distance =
            radius*
            (
                .15+
                (
                    (i*37)%100
                )/100*.85
            );

        const p =
            polar(
                distance,
                angle
            );

        const s =
            .5+
            (
                (i%5)/5
            )*
            1.3;

        ctx.fillStyle =
            i%9===0
            ? "rgba(211,247,255,.9)"
            : "rgba(57,191,213,.46)";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            s+
            smoothAudio*1.4,
            0,
            TAU
        );

        ctx.fill();

    }

}


/* ============================================================
   AUDIO WAVEFORM
   ============================================================ */

function drawWaveform(){

    const y =
        H-250;

    const width =
        Math.min(
            W*.60,
            310
        );

    const bars =
        42;

    ctx.save();

    ctx.translate(
        cx-width/2,
        y
    );

    for(
        let i=0;
        i<bars;
        i++
    ){

        let amp;

        if(
            audioData
        ){

            const index =
                Math.floor(
                    i/
                    bars*
                    audioData.length
                );

            amp =
                audioData[index]/255;

        }else{

            amp =
                .08+
                Math.sin(
                    i*.65+
                    globalTime*2
                )*.04;

        }

        amp =
            .08+
            amp*
            (
                .35+
                smoothAudio*.8
            );

        const height =
            4+
            amp*30;

        ctx.fillStyle =
            listening
            ? "rgba(54,239,255,.85)"
            : "rgba(54,160,177,.45)";

        ctx.fillRect(
            i*(width/bars),
            -height/2,
            2,
            height
        );

    }

    ctx.restore();

}


/* ============================================================
   AUDIO
   ============================================================ */

async function startAudio(){

    try{

        const stream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio:true
                });

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        analyser =
            audioContext.createAnalyser();

        analyser.fftSize =
            256;

        analyser.smoothingTimeConstant =
            .78;

        microphone =
            audioContext.createMediaStreamSource(
                stream
            );

        microphone.connect(
            analyser
        );

        audioData =
            new Uint8Array(
                analyser.frequencyBinCount
            );

        listening = true;

        micButton.classList.add(
            "active"
        );

        voiceText.textContent =
            "VOICE CHANNEL · LISTENING";

        voiceText.classList.add(
            "active"
        );

        startSpeechRecognition();

    }catch(error){

        voiceText.textContent =
            "MICROPHONE · PERMISSION REQUIRED";

        console.error(error);

    }

}


/* ============================================================
   AUDIO ANALYSIS
   ============================================================ */

function updateAudio(){

    let target=0;

    if(
        analyser &&
        audioData
    ){

        analyser.getByteFrequencyData(
            audioData
        );

        let sum=0;

        for(
            let i=0;
            i<audioData.length;
            i++
        ){

            sum +=
                audioData[i];

        }

        target =
            sum/
            audioData.length/
            255;

    }

    /*
       Idle breathing when microphone inactive.
       Actual microphone signal dominates when active.
    */

    if(
        !analyser
    ){

        target =
            .035+
            Math.sin(
                globalTime*1.7
            )*.012;

    }

    /*
       Smooth attack / release.
    */

    const attack =
        target >
        smoothAudio
        ? .24
        : .075;

    smoothAudio =
        lerp(
            smoothAudio,
            target,
            attack
        );

    peakAudio =
        Math.max(
            peakAudio*.94,
            smoothAudio
        );

}


/* ============================================================
   SPEECH RECOGNITION
   ============================================================ */

function startSpeechRecognition(){

    const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(
        !Recognition
    ){

        transcript.textContent =
            "TRANSCRIPTION NON DISPONIBLE SUR CE NAVIGATEUR";

        return;

    }

    speechRecognition =
        new Recognition();

    speechRecognition.lang =
        "fr-FR";

    speechRecognition.continuous =
        true;

    speechRecognition.interimResults =
        true;

    speechRecognition.onresult =
        function(event){

            let finalText="";
            let interimText="";

            for(
                let i=event.resultIndex;
                i<event.results.length;
                i++
            ){

                const text =
                    event.results[i][0]
                        .transcript;

                if(
                    event.results[i].isFinal
                ){

                    finalText +=
                        text;

                }else{

                    interimText +=
                        text;

                }

            }

            const output =
                (
                    finalText+
                    interimText
                ).trim();

            if(output){

                transcript.textContent =
                    output;

                voiceText.textContent =
                    "VOICE INPUT · " +
                    output.toUpperCase();

            }

        };

    speechRecognition.onerror =
        function(event){

            console.log(
                "Speech recognition:",
                event.error
            );

        };

    speechRecognition.onend =
        function(){

            if(
                listening
            ){

                try{

                    speechRecognition.start();

                }catch(e){}

            }

        };

    try{

        speechRecognition.start();

    }catch(e){}

}


/* ============================================================
   STOP AUDIO
   ============================================================ */

function stopAudio(){

    listening=false;

    if(
        speechRecognition
    ){

        try{

            speechRecognition.stop();

        }catch(e){}

    }

    if(
        microphone
    ){

        microphone.mediaStream
            ?.getTracks()
            .forEach(
                track=>track.stop()
            );

    }

    if(
        audioContext
    ){

        try{
            audioContext.close();
        }catch(e){}

    }

    audioContext=null;
    analyser=null;
    microphone=null;
    audioData=null;

    micButton.classList.remove(
        "active"
    );

    voiceText.textContent =
        "SYSTEM READY · TAP MICRO TO LISTEN";

    voiceText.classList.remove(
        "active"
    );

}


/* ============================================================
   MICROPHONE BUTTON
   ============================================================ */

micButton.addEventListener(
    "click",
    async ()=>{

        if(
            listening
        ){

            stopAudio();

        }else{

            await startAudio();

        }

    }
);


/* ============================================================
   SYNTHETIC VOICE
   ============================================================ */

voiceButton.addEventListener(
    "click",
    ()=>{

        const text =
            transcript.textContent.trim();

        const message =
            text &&
            !text.includes(
                "TRANSCRIPTION"
            )
            ? "Commande reçue : "+text
            : "Je suis prêt à vous écouter.";

        if(
            "speechSynthesis"
            in window
        ){

            window.speechSynthesis.cancel();

            const utterance =
                new SpeechSynthesisUtterance(
                    message
                );

            utterance.lang =
                "fr-FR";

            utterance.rate =
                .92;

            utterance.pitch =
                .82;

            utterance.volume =
                1;

            window.speechSynthesis.speak(
                utterance
            );

        }

        voiceText.textContent =
            "JARVIS · VOICE OUTPUT";

        voiceText.classList.add(
            "active"
        );

        setTimeout(
            ()=>{
                if(!listening){
                    voiceText.textContent =
                        "SYSTEM READY · TAP MICRO TO LISTEN";
                    voiceText.classList.remove(
                        "active"
                    );
                }
            },
            3000
        );

    }
);


/* ============================================================
   SHORTCUT BUTTON
   ============================================================ */

shortcutButton.addEventListener(
    "click",
    async ()=>{

        const text =
            transcript.textContent.trim();

        if(
            !text
        ){

            voiceText.textContent =
                "NO COMMAND · MICRO INPUT REQUIRED";

            return;

        }

        /*
           The browser cannot directly execute
           an arbitrary Apple Shortcut.
           We therefore copy the command so it can
           be received by the chosen workflow.
        */

        try{

            await navigator.clipboard.writeText(
                text
            );

            voiceText.textContent =
                "COMMAND COPIED · READY FOR RACCOURCIS";

        }catch(error){

            voiceText.textContent =
                "COMMAND · " +
                text.toUpperCase();

        }

    }
);


/* ============================================================
   MAIN RENDER LOOP
   ============================================================ */

function render(now){

    const dt =
        Math.min(
            (now-lastTime)/1000,
            .05
        );

    lastTime =
        now;

    globalTime +=
        dt;

    updateAudio();

    drawBackground();

    /*
       The order matters:
       background
       information
       rings
       arcs
       grid
       core
       waveform
    */

    drawInformationBands();

    drawPrimaryRings();

    drawTicks();

    drawNumbers();

    drawSecondaryArcs();

    drawCenterGrid();

    drawCoreParticles();

    drawGeode();

    drawWaveform();

    requestAnimationFrame(
        render
    );

}

requestAnimationFrame(
    render
);

   PREVENT MOBILE BROWSER GESTURES

document.addEventListener(

    e=>e.preventDefault(),
    {passive:false}
);

document.addEventListener(

    e=>e.preventDefault(),
    {passive:false}
);

document.addEventListener(
    "gestureend",
    e=>e.preventDefault(),
    {passive:false}
);
