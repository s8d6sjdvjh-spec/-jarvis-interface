<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>JARVIS — Voice Core</title>

<style>
:root{
  --bg:#020b10;
  --cyan:#18eaff;
  --cyan2:#76f7ff;
  --blue:#3a8dff;
  --violet:#8b63ff;
  --gold:#d9a94b;
  --white:#dffcff;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--white);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  position:relative;
}

#app{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 47%,rgba(0,105,125,.13),transparent 30%),
    linear-gradient(#031016,#02090d 72%,#02080c);
}

/* -------------------------------------------------
   BACKGROUND
------------------------------------------------- */

#background{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:.72;
}

.header{
  position:absolute;
  top:5.2vh;
  left:6%;
  right:5%;
  display:flex;
  align-items:center;
  z-index:20;
}

.logo{
  font-size:clamp(28px,7vw,44px);
  letter-spacing:.28em;
  font-weight:300;
  white-space:nowrap;
}

.status{
  margin-left:auto;
  display:flex;
  gap:clamp(13px,3vw,28px);
  font-size:10px;
  letter-spacing:.28em;
  color:#7197a1;
  white-space:nowrap;
}

.status span{
  display:flex;
  align-items:center;
  gap:7px;
}

.status i{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--cyan);
  box-shadow:0 0 10px var(--cyan),0 0 20px rgba(24,234,255,.65);
}

.subtitle{
  position:absolute;
  top:13.8vh;
  left:0;
  width:100%;
  text-align:center;
  z-index:20;
  font-size:clamp(10px,2.5vw,15px);
  letter-spacing:.42em;
  color:#6e9da8;
  white-space:nowrap;
}

.subsubtitle{
  position:absolute;
  top:16.7vh;
  left:0;
  width:100%;
  text-align:center;
  z-index:20;
  font-size:8px;
  letter-spacing:.38em;
  color:#315b64;
}

/* -------------------------------------------------
   CORE AREA
------------------------------------------------- */

#coreArea{
  position:absolute;
  top:20vh;
  left:0;
  width:100%;
  height:58vh;
}

#visual{
  position:absolute;
  left:50%;
  top:50%;
  width:min(94vw,620px);
  aspect-ratio:1;
  transform:translate(-50%,-50%);
}

#rings{
  position:absolute;
  inset:0;
  overflow:visible;
  transform-origin:center;
}

.ring{
  position:absolute;
  left:50%;
  top:50%;
  border-radius:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

.r1{
  width:44%;
  height:44%;
  border:1.5px solid rgba(24,234,255,.8);
  box-shadow:
    0 0 7px rgba(24,234,255,.35),
    inset 0 0 12px rgba(24,234,255,.12);
}

.r2{
  width:59%;
  height:59%;
  border:2px solid rgba(24,234,255,.82);
  box-shadow:
    0 0 9px rgba(24,234,255,.38),
    inset 0 0 13px rgba(24,234,255,.10);
}

.r3{
  width:74%;
  height:74%;
  border:2px solid rgba(69,153,255,.75);
  box-shadow:
    0 0 11px rgba(69,153,255,.32),
    inset 0 0 13px rgba(69,153,255,.08);
}

.r4{
  width:89%;
  height:89%;
  border:2px solid rgba(217,169,75,.58);
  box-shadow:
    0 0 12px rgba(217,169,75,.20),
    inset 0 0 15px rgba(217,169,75,.05);
}

/* The information discs stay locked concentrically
   to their ring — they never fly away from the core. */

.disc{
  position:absolute;
  left:50%;
  top:50%;
  width:100%;
  height:100%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  pointer-events:none;
}

#disc1{width:48%;height:48%}
#disc2{width:63%;height:63%}
#disc3{width:78%;height:78%}
#disc4{width:93%;height:93%}

svg{
  width:100%;
  height:100%;
  overflow:visible;
}

.infoText{
  fill:#83b7c1;
  font-size:8px;
  letter-spacing:2px;
}

.smallText{
  fill:#527984;
  font-size:5.5px;
  letter-spacing:1.2px;
}

.major{
  stroke:#dffcff;
  stroke-width:1.3;
  opacity:.85;
}

.minor{
  stroke:#65d9e8;
  stroke-width:.45;
  opacity:.55;
}

.arcCyan{
  fill:none;
  stroke:#18eaff;
  stroke-width:1.5;
  opacity:.85;
}

.arcBlue{
  fill:none;
  stroke:#4f8dff;
  stroke-width:1.3;
  opacity:.65;
}

.arcGold{
  fill:none;
  stroke:#d9a94b;
  stroke-width:1.2;
  opacity:.8;
}

.arcViolet{
  fill:none;
  stroke:#8b63ff;
  stroke-width:1.2;
  opacity:.65;
}

/* -------------------------------------------------
   CENTRAL LIQUID / ICE SPHERE
------------------------------------------------- */

#core{
  position:absolute;
  left:50%;
  top:50%;
  width:27%;
  height:27%;
  transform:translate(-50%,-50%) scale(var(--coreScale,1));
  border-radius:50%;
  z-index:12;
  transition:transform .06s linear;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 32% 25%,
      rgba(255,255,255,.95) 0%,
      rgba(192,250,255,.62) 3%,
      rgba(55,210,238,.25) 11%,
      transparent 27%
    ),
    radial-gradient(
      circle at 68% 67%,
      rgba(30,175,220,.34),
      transparent 42%
    ),
    radial-gradient(
      circle at 50% 48%,
      rgba(92,229,255,.22),
      rgba(3,39,55,.18) 48%,
      rgba(0,10,17,.82) 82%
    );

  border:1px solid rgba(170,250,255,.55);

  box-shadow:
    inset 10px 8px 22px rgba(255,255,255,.12),
    inset -15px -18px 30px rgba(0,5,10,.68),
    0 0 12px rgba(24,234,255,.42),
    0 0 38px rgba(24,234,255,.18);
}

/* crystalline edge reflections — no grid crossing the core */

#core::before{
  content:"";
  position:absolute;
  inset:2%;
  border-radius:50%;
  background:
    linear-gradient(
      122deg,
      transparent 25%,
      rgba(220,255,255,.30) 28%,
      transparent 31%
    ),
    linear-gradient(
      72deg,
      transparent 59%,
      rgba(110,240,255,.18) 62%,
      transparent 65%
    );
  filter:blur(1px);
  opacity:.8;
  transform:rotate(-18deg);
}

#core::after{
  content:"";
  position:absolute;
  width:35%;
  height:35%;
  left:18%;
  top:15%;
  border-radius:50%;
  background:rgba(255,255,255,.45);
  filter:blur(12px);
  opacity:.55;
}

/* internal liquid highlights */

.liquid{
  position:absolute;
  border-radius:50%;
  filter:blur(4px);
  opacity:.6;
  mix-blend-mode:screen;
}

.liquid.a{
  width:35%;
  height:14%;
  left:37%;
  top:55%;
  background:rgba(90,240,255,.42);
  transform:rotate(-20deg);
}

.liquid.b{
  width:25%;
  height:11%;
  left:48%;
  top:33%;
  background:rgba(180,250,255,.36);
  transform:rotate(30deg);
}

.liquid.c{
  width:22%;
  height:8%;
  left:18%;
  top:66%;
  background:rgba(30,180,255,.30);
  transform:rotate(-35deg);
}

.coreLabel{
  position:absolute;
  inset:0;
  z-index:4;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  text-shadow:0 0 10px rgba(140,250,255,.45);
}

.coreLabel strong{
  font-size:clamp(13px,4vw,22px);
  font-weight:300;
  letter-spacing:.35em;
  margin-left:.35em;
}

.coreLabel small{
  margin-top:7px;
  font-size:7px;
  letter-spacing:.42em;
  color:#79aeb8;
}

/* -------------------------------------------------
   VOICE VISUALIZER
------------------------------------------------- */

#voiceBar{
  position:absolute;
  top:79vh;
  left:50%;
  transform:translateX(-50%);
  width:50%;
  height:16px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:3px;
  z-index:20;
}

.voiceDot{
  width:3px;
  height:6px;
  background:var(--cyan);
  box-shadow:0 0 8px var(--cyan);
  transition:height .06s linear;
}

#transcript{
  position:absolute;
  top:81.8vh;
  left:8%;
  right:8%;
  text-align:center;
  height:28px;
  color:#86b4bd;
  font-size:12px;
  letter-spacing:.15em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* -------------------------------------------------
   CONTROLS
------------------------------------------------- */

.controls{
  position:absolute;
  left:4%;
  right:4%;
  bottom:6.5vh;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  z-index:30;
}

button{
  height:68px;
  border:1px solid rgba(24,234,255,.68);
  background:rgba(2,23,31,.72);
  color:#bdeaf0;
  font-family:inherit;
  letter-spacing:.18em;
  font-size:10px;
  cursor:pointer;
  box-shadow:
    inset 0 0 20px rgba(24,234,255,.04),
    0 0 10px rgba(24,234,255,.04);
  transition:.15s;
}

button:active{
  transform:scale(.97);
  background:rgba(20,100,120,.25);
  box-shadow:0 0 20px rgba(24,234,255,.22);
}

button.active{
  border-color:#9cffff;
  box-shadow:
    0 0 18px rgba(24,234,255,.28),
    inset 0 0 22px rgba(24,234,255,.09);
}

@media(max-height:720px){
  .header{top:4vh}
  .subtitle{top:12vh}
  .subsubtitle{top:15vh}
  #coreArea{top:17vh;height:59vh}
  #voiceBar{top:77vh}
  #transcript{top:80vh}
  .controls{bottom:4vh}
}

@media(max-width:380px){
  .status{gap:8px;font-size:8px}
  .logo{font-size:26px}
  .subtitle{font-size:9px}
}
</style>
</head>

<body>

<div id="app">

  <canvas id="background"></canvas>

  <header class="header">
    <div class="logo">JARVIS</div>

    <div class="status">
      <span><i></i>ONLINE</span>
      <span><i></i>SECURE</span>
      <span><i></i>VOICE</span>
    </div>
  </header>

  <div class="subtitle">
    VOICE CORE · CRYSTALLINE MATRIX · 3 AXIS
  </div>

  <div class="subsubtitle">
    HOLOGRAPHIC CONCENTRIC SYSTEM · AUDIO REACTIVE
  </div>


  <main id="coreArea">

    <div id="visual">

      <!-- Four fixed concentric information discs -->
      <div id="rings">

        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
        <div class="ring r4"></div>

        <div class="disc" id="disc1">
          <svg viewBox="0 0 100 100">
            <g id="ticks1"></g>
            <path class="arcCyan"
                  d="M16 50 A34 34 0 0 1 43 17"/>
            <path class="arcGold"
                  d="M68 21 A34 34 0 0 1 84 43"/>
            <text class="infoText">
              <textPath href="#txt1" startOffset="4%">
                1/125   1/250   1/500   ISO 100   ISO 400
              </textPath>
            </text>
            <path id="txt1" fill="none" d="M12 50 A38 38 0 0 1 88 50"/>
          </svg>
        </div>

        <div class="disc" id="disc2">
          <svg viewBox="0 0 100 100">
            <g id="ticks2"></g>
            <path class="arcViolet"
                  d="M18 50 A32 32 0 0 1 46 18"/>
            <path class="arcCyan"
                  d="M53 18 A32 32 0 0 1 82 47"/>
            <path class="arcGold"
                  d="M18 59 A32 32 0 0 0 39 81"/>
            <text class="infoText">
              <textPath href="#txt2" startOffset="2%">
                030   060   090   120   150   180   210   240
              </textPath>
            </text>
            <path id="txt2" fill="none" d="M10 50 A40 40 0 0 1 90 50"/>
          </svg>
        </div>

        <div class="disc" id="disc3">
          <svg viewBox="0 0 100 100">
            <g id="ticks3"></g>
            <path class="arcBlue"
                  d="M16 48 A39 39 0 0 1 39 17"/>
            <path class="arcGold"
                  d="M62 16 A39 39 0 0 1 84 39"/>
            <path class="arcViolet"
                  d="M84 60 A39 39 0 0 1 60 84"/>
            <text class="infoText">
              <textPath href="#txt3" startOffset="5%">
                0.8   1.2   2.0   2.8   4.0   5.6   8.0
              </textPath>
            </text>
            <path id="txt3" fill="none" d="M7 50 A43 43 0 0 1 93 50"/>
          </svg>
        </div>

        <div class="disc" id="disc4">
          <svg viewBox="0 0 100 100">
            <g id="ticks4"></g>
            <path class="arcGold"
                  d="M10 42 A45 45 0 0 1 38 10"/>
            <path class="arcCyan"
                  d="M55 8 A45 45 0 0 1 88 39"/>
            <path class="arcViolet"
                  d="M90 57 A45 45 0 0 1 61 90"/>
            <text class="infoText">
              <textPath href="#txt4" startOffset="3%">
                AF · VECTOR · SIGNAL · 000 · 045 · 090 · 135 · 180
              </textPath>
            </text>
            <path id="txt4" fill="none" d="M5 50 A45 45 0 0 1 95 50"/>
          </svg>
        </div>

      </div>


      <!-- CENTRAL TRANSLUCENT LIQUID-ICE CORE -->
      <div id="core">
        <div class="liquid a"></div>
        <div class="liquid b"></div>
        <div class="liquid c"></div>

        <div class="coreLabel">
          <strong>CORE</strong>
          <small id="coreState">READY</small>
        </div>
      </div>

    </div>
  </main>


  <div id="voiceBar"></div>

  <div id="transcript">
    EN ATTENTE DE COMMANDE
  </div>


  <div class="controls">
    <button id="micBtn">◉<br><br>MICRO ACTIF</button>
    <button id="shortcutBtn">↗<br><br>ENVOYER<br>RACCOURCIS</button>
    <button id="voiceBtn">◌<br><br>VOIX JARVIS</button>
  </div>

</div>


<script>
/* =========================================================
   JARVIS CORE
   - fixed concentric architecture
   - voice amplitude drives expansion
   - central translucent liquid/ice core
   - speech recognition
   - speech synthesis
========================================================= */

const canvas = document.getElementById("background");
const ctx = canvas.getContext("2d");

const visual = document.getElementById("visual");
const core = document.getElementById("core");
const coreState = document.getElementById("coreState");
const transcript = document.getElementById("transcript");
const voiceBar = document.getElementById("voiceBar");

const rings = [
  document.querySelector(".r1"),
  document.querySelector(".r2"),
  document.querySelector(".r3"),
  document.querySelector(".r4")
];

let W,H,DPR;

function resize(){
  W=innerWidth;
  H=innerHeight;
  DPR=Math.min(devicePixelRatio||1,2);

  canvas.width=W*DPR;
  canvas.height=H*DPR;
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize",resize);
resize();


/* ---------------------------------------------------------
   BACKGROUND GRID
--------------------------------------------------------- */

function drawBackground(){

  ctx.clearRect(0,0,W,H);

  const minor=24;
  const major=120;

  ctx.lineWidth=1;

  for(let x=0;x<W;x+=minor){
    ctx.strokeStyle="rgba(31,110,126,.085)";
    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,H);
    ctx.stroke();
  }

  for(let y=0;y<H;y+=minor){
    ctx.strokeStyle="rgba(31,110,126,.085)";
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();
  }

  for(let x=0;x<W;x+=major){
    ctx.strokeStyle="rgba(42,142,158,.11)";
    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,H);
    ctx.stroke();
  }

  for(let y=0;y<H;y+=major){
    ctx.strokeStyle="rgba(42,142,158,.11)";
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();
  }

  requestAnimationFrame(drawBackground);
}

drawBackground();


/* ---------------------------------------------------------
   TICKS
--------------------------------------------------------- */

function buildTicks(id,count){

  const g=document.getElementById(id);

  for(let i=0;i<count;i++){

    const angle=(i/count)*Math.PI*2;
    const major=i%10===0;

    const r1=47;
    const r2=major ? 42 : 44;

    const x1=50+Math.cos(angle)*r1;
    const y1=50+Math.sin(angle)*r1;

    const x2=50+Math.cos(angle)*r2;
    const y2=50+Math.sin(angle)*r2;

    const line=document.createElementNS(
      "http://www.w3.org/2000/svg","line"
    );

    line.setAttribute("x1",x1);
    line.setAttribute("y1",y1);
    line.setAttribute("x2",x2);
    line.setAttribute("y2",y2);

    line.setAttribute(
      "class",
      major ? "major" : "minor"
    );

    g.appendChild(line);
  }
}

buildTicks("ticks1",72);
buildTicks("ticks2",96);
buildTicks("ticks3",120);
buildTicks("ticks4",144);


/* ---------------------------------------------------------
   VOICE ENGINE
--------------------------------------------------------- */

let audioContext=null;
let analyser=null;
let microphone=null;
let dataArray=null;

let audioLevel=0;
let targetLevel=0;
let listening=false;

function startAudio(){

  if(audioContext) return;

  navigator.mediaDevices.getUserMedia({audio:true})
  .then(stream=>{

    audioContext=
      new (window.AudioContext||window.webkitAudioContext)();

    analyser=audioContext.createAnalyser();

    analyser.fftSize=512;
    analyser.smoothingTimeConstant=.72;

    microphone=
      audioContext.createMediaStreamSource(stream);

    microphone.connect(analyser);

    dataArray=
      new Uint8Array(analyser.fftSize);

    listening=true;

    coreState.textContent="LISTENING";
    document.getElementById("micBtn").classList.add("active");

  })
  .catch(err=>{

    console.log(err);

    transcript.textContent=
      "ACCÈS MICRO REFUSÉ — AUTORISER LE MICRO";

  });
}


function readAudio(){

  if(analyser){

    analyser.getByteTimeDomainData(dataArray);

    let sum=0;

    for(let i=0;i<dataArray.length;i++){

      const v=(dataArray[i]-128)/128;
      sum+=v*v;

    }

    const rms=Math.sqrt(sum/dataArray.length);

    targetLevel=Math.min(1,rms*5.5);

  }else{

    targetLevel=0;

  }

  audioLevel +=
    (targetLevel-audioLevel)*.22;

  updateVisual(audioLevel);

  requestAnimationFrame(readAudio);
}

readAudio();


/* ---------------------------------------------------------
   VISUAL AUDIO REACTION
--------------------------------------------------------- */

let rotation=[0,0,0,0];

function updateVisual(level){

  /*
    IMPORTANT:
    The rings NEVER translate sideways.
    They remain perfectly concentric.
    Voice changes only:
      - diameter
      - glow
      - internal rotation
    */

  const idle=.025;

  const expansion=
    idle + Math.pow(level,0.62)*.23;

  const scales=[
    1 + expansion*.90,
    1 + expansion*.72,
    1 + expansion*.55,
    1 + expansion*.40
  ];

  rings.forEach((ring,i)=>{

    rotation[i]+=
      (.10 + level*(i%2 ? -.75 : .62));

    ring.style.transform=
      `translate(-50%,-50%) scale(${scales[i]}) rotate(${rotation[i]}deg)`;

    ring.style.filter=
      `drop-shadow(0 0 ${4+level*18}px rgba(24,234,255,.55))`;

  });


  /* information discs rotate counter-directionally */

  const discs=[
    document.getElementById("disc1"),
    document.getElementById("disc2"),
    document.getElementById("disc3"),
    document.getElementById("disc4")
  ];

  discs.forEach((disc,i)=>{

    const direction=i%2===0 ? -1 : 1;

    disc.style.transform=
      `translate(-50%,-50%) rotate(${rotation[i]*direction}deg)`;

  });


  /*
    Core:
    subtle heartbeat, never spinning.
    Voice increases the amplitude of the pulse.
  */

  const pulse=
    1 +
    Math.sin(performance.now()*.0025)*
    (.012 + level*.035);

  const voiceScale=
    1 + level*.055;

  core.style.setProperty(
    "--coreScale",
    pulse*voiceScale
  );

  core.style.boxShadow=`
    inset 10px 8px 22px rgba(255,255,255,.12),
    inset -15px -18px 30px rgba(0,5,10,.68),
    0 0 ${12+level*30}px rgba(24,234,255,.42),
    0 0 ${38+level*75}px rgba(24,234,255,.18)
  `;


  /* Voice level visualiser */

  if(voiceBar.children.length===0){

    for(let i=0;i<30;i++){

      const d=document.createElement("div");

      d.className="voiceDot";

      voiceBar.appendChild(d);

    }

  }

  [...voiceBar.children].forEach((d,i)=>{

    const center=
      1-Math.abs(i-14.5)/14.5;

    const variation=
      Math.abs(Math.sin(
        performance.now()*.012+i*.73
      ));

    const h=
      4+
      level*25*center*variation;

    d.style.height=h+"px";

  });
}


/* ---------------------------------------------------------
   MICRO BUTTON
--------------------------------------------------------- */

document.getElementById("micBtn").onclick=()=>{

  if(audioContext && audioContext.state==="suspended"){
    audioContext.resume();
  }

  startAudio();

};


/* ---------------------------------------------------------
   SPEECH RECOGNITION
--------------------------------------------------------- */

const SpeechRecognition=
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition=null;

if(SpeechRecognition){

  recognition=new SpeechRecognition();

  recognition.lang="fr-FR";
  recognition.continuous=true;
  recognition.interimResults=true;

  recognition.onstart=()=>{

    listening=true;
    coreState.textContent="LISTENING";
    transcript.textContent="ÉCOUTE EN COURS…";

  };

  recognition.onresult=e=>{

    let text="";

    for(
      let i=e.resultIndex;
      i<e.results.length;
      i++
    ){

      text+=e.results[i][0].transcript;

    }

    transcript.textContent=text || "…";

    /*
      The recognized text is also exposed globally.
      A Shortcut / native bridge can use this value.
    */

    window.JARVIS_COMMAND=text;

    document.dispatchEvent(
      new CustomEvent(
        "jarvis-command",
        {detail:{text}}
      )
    );

  };

  recognition.onerror=e=>{

    transcript.textContent=
      "VOICE ERROR · "+e.error;

  };

  recognition.onend=()=>{

    if(listening){

      try{
        recognition.start();
      }catch(e){}

    }

  };

}else{

  transcript.textContent=
    "RECONNAISSANCE VOCALE NON DISPONIBLE";

}


/* ---------------------------------------------------------
   MICRO + SPEECH
--------------------------------------------------------- */

document.getElementById("micBtn").addEventListener(
  "click",
  ()=>{

    startAudio();

    if(!recognition){

      return;

    }

    try{

      listening=true;
      recognition.start();

    }catch(e){}

  }
);


/* ---------------------------------------------------------
   SEND TO SHORTCUTS
--------------------------------------------------------- */

document.getElementById("shortcutBtn").onclick=()=>{

  const command=
    window.JARVIS_COMMAND ||
    transcript.textContent;

  /*
    URL Scheme compatible with a Shortcut named JARVIS.
    If the Shortcut is named differently, change the name below.
  */

  const url=
    "shortcuts://run-shortcut?name="+
    encodeURIComponent("JARVIS")+
    "&input="+
    encodeURIComponent(command);

  window.location.href=url;

};


/* ---------------------------------------------------------
   JARVIS SYNTHETIC VOICE
--------------------------------------------------------- */

document.getElementById("voiceBtn").onclick=()=>{

  const text=
    window.JARVIS_COMMAND ||
    "Système JARVIS opérationnel.";

  if(!("speechSynthesis" in window)){

    transcript.textContent=
      "SYNTHÈSE VOCALE NON DISPONIBLE";

    return;

  }

  speechSynthesis.cancel();

  const utterance=
    new SpeechSynthesisUtterance(text);

  utterance.lang="fr-FR";
  utterance.rate=.92;
  utterance.pitch=.82;
  utterance.volume=1;

  speechSynthesis.speak(utterance);

  coreState.textContent="SPEAKING";

  utterance.onend=()=>{
    coreState.textContent=
      listening ? "LISTENING" : "READY";
  };

};


/* ---------------------------------------------------------
   INITIAL STATE
--------------------------------------------------------- */

setTimeout(()=>{

  if(voiceBar.children.length===0){

    for(let i=0;i<30;i++){

      const d=document.createElement("div");
      d.className="voiceDot";
      d.style.height="4px";
      voiceBar.appendChild(d);

    }

  }

},100);

</script>
