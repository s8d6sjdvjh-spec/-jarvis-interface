<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<title>JARVIS — Gyrotourbillon Portrait</title>

<style>
:root{
    --bg:#01070a;
    --cyan:#39e8ff;
    --cyan2:#79f4ff;
    --dim:#1a6876;
    --white:#d9faff;
    --gold:#b78a45;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#010609;
    color:var(--white);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
}

#app{
    position:relative;
    width:100%;
    height:100%;
    min-height:100dvh;
    overflow:hidden;
    background:
        radial-gradient(
            ellipse at 50% 45%,
            rgba(0,110,130,.13) 0%,
            rgba(0,35,45,.07) 28%,
            rgba(0,0,0,0) 55%
        ),
        #010609;
}

/* -------------------------------------------------------
   GRILLE HOLOGRAPHIQUE
------------------------------------------------------- */

#app::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:.25;

    background-image:
        linear-gradient(
            rgba(37,151,168,.13) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(37,151,168,.13) 1px,
            transparent 1px
        );

    background-size:
        38px 38px,
        38px 38px;

    mask-image:
        radial-gradient(
            ellipse at center,
            black 0%,
            rgba(0,0,0,.7) 55%,
            transparent 90%
        );
}

/* -------------------------------------------------------
   HEADER
------------------------------------------------------- */

.header{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:20;

    height:78px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:
        env(safe-area-inset-top)
        22px
        0 22px;
}

.logo{
    font-size:21px;
    letter-spacing:.43em;
    font-weight:300;
    white-space:nowrap;
}

.status{
    display:flex;
    gap:18px;
    align-items:center;

    font-size:9px;
    letter-spacing:.34em;
    color:#60808a;
}

.statusItem{
    display:flex;
    align-items:center;
    gap:7px;
}

.statusDot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#16dfff;

    box-shadow:
        0 0 7px #16dfff,
        0 0 18px rgba(22,223,255,.45);
}

/* -------------------------------------------------------
   SOUS-TITRE
------------------------------------------------------- */

.subtitle{
    position:absolute;
    z-index:20;

    top:102px;
    left:0;
    right:0;

    text-align:center;

    font-size:8px;
    letter-spacing:.38em;

    color:#46727d;
}

/* -------------------------------------------------------
   ZONE 3D
------------------------------------------------------- */

#scene{
    position:absolute;
    z-index:5;

    left:0;
    right:0;

    /*
      On réserve volontairement une grande zone verticale
      au mécanisme sans le faire devenir gigantesque.
    */
    top:132px;
    bottom:305px;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

/* -------------------------------------------------------
   PANNEAUX
------------------------------------------------------- */

.panels{
    position:absolute;
    z-index:20;

    left:22px;
    right:22px;
    bottom:
        calc(18px + env(safe-area-inset-bottom));

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.panel{
    height:94px;

    border:1px solid rgba(20,205,233,.40);

    background:
        linear-gradient(
            135deg,
            rgba(3,25,31,.72),
            rgba(1,10,14,.48)
        );

    box-shadow:
        inset 0 0 25px rgba(0,180,210,.035);

    padding:17px 18px;

    position:relative;
    overflow:hidden;
}

.panel::before,
.panel::after{
    content:"";
    position:absolute;
    width:7px;
    height:7px;
}

.panel::before{
    top:-1px;
    left:-1px;
    border-top:1px solid #55edff;
    border-left:1px solid #55edff;
}

.panel::after{
    right:-1px;
    bottom:-1px;
    border-right:1px solid #55edff;
    border-bottom:1px solid #55edff;
}

.panelTitle{
    font-size:8px;
    letter-spacing:.38em;
    color:#55c8da;
    margin-bottom:9px;
}

.panelValue{
    font-size:29px;
    line-height:1;
    font-weight:300;
    letter-spacing:.03em;
    color:#d8faff;
}

.panelDesc{
    margin-top:8px;
    font-size:7px;
    letter-spacing:.22em;
    color:#55757e;
}

/* -------------------------------------------------------
   PETITS INDICATEURS LATÉRAUX
------------------------------------------------------- */

.sideMarker{
    position:absolute;
    z-index:15;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#d8fbff;

    box-shadow:
        0 0 8px #8defff;
}

.markerTop{
    top:36%;
    left:14px;
}

.markerBottom{
    top:58%;
    right:14px;
}

/* -------------------------------------------------------
   PAYSAGE
------------------------------------------------------- */

@media (orientation:landscape){

    .header{
        height:64px;
        padding-left:34px;
        padding-right:34px;
    }

    .subtitle{
        top:78px;
    }

    #scene{
        top:92px;
        bottom:150px;
    }

    .panels{
        left:34px;
        right:34px;
        bottom:20px;

        grid-template-columns:
            repeat(4,1fr);
    }

    .panel{
        height:80px;
        padding:12px 15px;
    }

    .panelValue{
        font-size:23px;
    }

    .panelDesc{
        margin-top:5px;
    }
}

/* -------------------------------------------------------
   TRÈS PETITS ÉCRANS
------------------------------------------------------- */

@media (max-height:700px) and (orientation:portrait){

    .header{
        height:68px;
    }

    .subtitle{
        top:88px;
    }

    #scene{
        top:115px;
        bottom:245px;
    }

    .panel{
        height:78px;
        padding:12px 14px;
    }

    .panelTitle{
        margin-bottom:6px;
    }

    .panelValue{
        font-size:24px;
    }

    .panelDesc{
        margin-top:5px;
    }
}
</style>
</head>

<body>

<div id="app">

    <header class="header">

        <div class="logo">
            JARVIS
        </div>

        <div class="status">

            <div class="statusItem">
                <span class="statusDot"></span>
                ONLINE
            </div>

            <div class="statusItem">
                <span class="statusDot"></span>
                SECURE
            </div>

            <div class="statusItem">
                <span class="statusDot"></span>
                VOICE
            </div>

        </div>

    </header>

    <div class="subtitle">
        GYROTOURBILLON&nbsp;&nbsp;·&nbsp;&nbsp;
        PRECISION CORE&nbsp;&nbsp;·&nbsp;&nbsp;
        3 AXIS
    </div>

    <div id="scene"></div>

    <div class="sideMarker markerTop"></div>
    <div class="sideMarker markerBottom"></div>

    <section class="panels">

        <div class="panel">
            <div class="panelTitle">MAISON</div>
            <div class="panelValue">03</div>
            <div class="panelDesc">DISPOSITIFS ACTIFS</div>
        </div>

        <div class="panel">
            <div class="panelTitle">MÉTÉO</div>
            <div class="panelValue">18°</div>
            <div class="panelDesc">CONDITIONS STABLES</div>
        </div>

        <div class="panel">
            <div class="panelTitle">SYSTÈME</div>
            <div class="panelValue">82%</div>
            <div class="panelDesc">PERFORMANCE</div>
        </div>

        <div class="panel">
            <div class="panelTitle">ACTIVITÉ</div>
            <div class="panelValue">12</div>
            <div class="panelDesc">ÉVÉNEMENTS RÉCENTS</div>
        </div>

    </section>

</div>


<script type="importmap">
{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
}
</script>


<script type="module">

import * as THREE from "three";

/* =========================================================
   INITIALISATION
========================================================= */

const container =
    document.getElementById("scene");

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x010609);


/* ---------------------------------------------------------
   CAMERA
--------------------------------------------------------- */

const camera =
    new THREE.PerspectiveCamera(
        31,
        container.clientWidth /
        container.clientHeight,
        .1,
        100
    );

/*
  IMPORTANT :
  caméra volontairement assez proche,
  mais pas assez pour transformer les couronnes
  en énormes anneaux qui sortent de l'écran.
*/
camera.position.set(
    0,
    0,
    9.2
);


/* ---------------------------------------------------------
   RENDERER
--------------------------------------------------------- */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        alpha:true,
        powerPreference:"high-performance"
    });

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,1.8)
);

renderer.setSize(
    container.clientWidth,
    container.clientHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    1.18;

container.appendChild(renderer.domElement);


/* =========================================================
   LUMIÈRES
========================================================= */

scene.add(
    new THREE.AmbientLight(
        0x182c31,
        1.15
    )
);

const cyanLight =
    new THREE.PointLight(
        0x46eaff,
        18,
        12
    );

cyanLight.position.set(
    -3,
    3,
    4
);

scene.add(cyanLight);


const whiteLight =
    new THREE.PointLight(
        0xdffcff,
        12,
        10
    );

whiteLight.position.set(
    3,
    2,
    4
);

scene.add(whiteLight);


const warmLight =
    new THREE.PointLight(
        0xffa83d,
        7,
        7
    );

warmLight.position.set(
    1,
    -2,
    2
);

scene.add(warmLight);


/* =========================================================
   GROUPE PRINCIPAL
========================================================= */

const master =
    new THREE.Group();

scene.add(master);


/* =========================================================
   MATÉRIAUX
========================================================= */

const metal =
    new THREE.MeshStandardMaterial({
        color:0x9da9ac,
        metalness:0.96,
        roughness:0.19
    });

const darkMetal =
    new THREE.MeshStandardMaterial({
        color:0x11191b,
        metalness:0.98,
        roughness:0.22
    });

const blackSteel =
    new THREE.MeshStandardMaterial({
        color:0x05090a,
        metalness:0.98,
        roughness:0.28
    });

const gold =
    new THREE.MeshStandardMaterial({
        color:0x9a6b2d,
        metalness:0.97,
        roughness:0.21
    });

const cyanMetal =
    new THREE.MeshStandardMaterial({
        color:0x157a89,
        metalness:0.92,
        roughness:0.18,
        emissive:0x06242a,
        emissiveIntensity:.7
    });

const ruby =
    new THREE.MeshPhysicalMaterial({
        color:0xb90038,
        metalness:0.08,
        roughness:.12,
        transmission:.58,
        thickness:.55,
        ior:1.65,
        clearcoat:1,
        clearcoatRoughness:.08,
        emissive:0x42000f,
        emissiveIntensity:.35
    });


/* =========================================================
   OUTER HOLOGRAPHIC COURONNES
   ---------------------------------------------------------
   PAS DE GROS TORUS.
   Elles sont essentiellement composées de lignes,
   graduations et petits éléments techniques.
========================================================= */

const hologram =
    new THREE.Group();

master.add(hologram);


/* anneau fin */

function addRing(radius, color, opacity=1){

    const geometry =
        new THREE.RingGeometry(
            radius-.004,
            radius+.004,
            256
        );

    const material =
        new THREE.MeshBasicMaterial({
            color,
            transparent:true,
            opacity,
            side:THREE.DoubleSide
        });

    const ring =
        new THREE.Mesh(
            geometry,
            material
        );

    hologram.add(ring);

    return ring;
}


/*
  Les couronnes sont rapprochées du centre.
  Leur diamètre total représente environ 3/4
  de la composition.
*/

const ringData = [

    [3.25,0x36dff4,.40],
    [3.05,0x1c8fa4,.48],
    [2.86,0x46eaff,.56],
    [2.67,0x1d7481,.43],
    [2.48,0x4cecff,.58],
    [2.28,0x216e7c,.45],
    [2.08,0x55eaff,.62],
    [1.89,0x1c6875,.42]

];

for(const r of ringData){
    addRing(...r);
}


/* =========================================================
   GRADUATIONS ORIENTÉES VERS LE CENTRE
========================================================= */

function addTicks(
    radius,
    count,
    inner,
    outer,
    color,
    opacity,
    irregularity=1
){

    const group =
        new THREE.Group();

    hologram.add(group);

    const material =
        new THREE.LineBasicMaterial({
            color,
            transparent:true,
            opacity
        });

    for(let i=0;i<count;i++){

        const a =
            (i/count)*Math.PI*2;

        /*
          Irrégularité volontaire.
          Certaines graduations sont courtes,
          d'autres longues.
        */

        const major =
            i % 17 === 0;

        const medium =
            i % 7 === 0;

        let length =
            major
            ? (outer-inner)*1.55
            : medium
            ? (outer-inner)*1.12
            : (outer-inner)*(
                .62 +
                Math.random()*.35
            );

        length *= irregularity;

        const r1 =
            radius;

        const r2 =
            radius - length;

        const x1 =
            Math.cos(a)*r1;

        const y1 =
            Math.sin(a)*r1;

        const x2 =
            Math.cos(a)*r2;

        const y2 =
            Math.sin(a)*r2;

        const geometry =
            new THREE.BufferGeometry()
                .setFromPoints([
                    new THREE.Vector3(
                        x1,y1,.01
                    ),
                    new THREE.Vector3(
                        x2,y2,.01
                    )
                ]);

        const line =
            new THREE.Line(
                geometry,
                material
            );

        group.add(line);
    }

    return group;
}


/* Couronne externe */

addTicks(
    3.25,
    180,
    .04,
    .10,
    0x6cf3ff,
    .72,
    .75
);


/* deuxième couche */

addTicks(
    3.02,
    144,
    .035,
    .085,
    0x46dceb,
    .56,
    1.0
);


/* troisième couche */

addTicks(
    2.80,
    120,
    .03,
    .075,
    0x8af7ff,
    .68,
    .65
);


/* quatrième couche */

addTicks(
    2.56,
    108,
    .025,
    .068,
    0x42bfd0,
    .52,
    .9
);


/* cinquième */

addTicks(
    2.33,
    96,
    .025,
    .062,
    0x7cefff,
    .70,
    .70
);


/* =========================================================
   PETITS SYMBOLS / INDEX TECHNIQUES
========================================================= */

function addIndexMarkers(
    radius,
    count
){

    const group =
        new THREE.Group();

    hologram.add(group);

    for(let i=0;i<count;i++){

        const a =
            i/count*Math.PI*2;

        if(i%3!==0) continue;

        const r =
            radius;

        const x =
            Math.cos(a)*r;

        const y =
            Math.sin(a)*r;

        const size =
            i%9===0 ? .045 : .025;

        const geometry =
            new THREE.CircleGeometry(
                size,
                5
            );

        const material =
            new THREE.MeshBasicMaterial({
                color:
                    i%9===0
                    ? 0x7cf6ff
                    : 0x2f9baa,
                transparent:true,
                opacity:
                    i%9===0 ? .9 : .55
            });

        const marker =
            new THREE.Mesh(
                geometry,
                material
            );

        marker.position.set(
            x,y,.03
        );

        group.add(marker);
    }
}

addIndexMarkers(3.12,72);
addIndexMarkers(2.71,64);
addIndexMarkers(2.40,56);


/* =========================================================
   COURONNE INTERMÉDIAIRE TECHNIQUE
========================================================= */

const intermediate =
    new THREE.Group();

master.add(intermediate);

for(let i=0;i<48;i++){

    const a =
        i/48*Math.PI*2;

    const r =
        1.72;

    const geometry =
        new THREE.BoxGeometry(
            .035,
            i%4===0 ? .13 : .07,
            .018
        );

    const material =
        new THREE.MeshBasicMaterial({
            color:
                i%4===0
                ? 0x70efff
                : 0x287f8d,
            transparent:true,
            opacity:
                i%4===0 ? .75 : .48
        });

    const tick =
        new THREE.Mesh(
            geometry,
            material
        );

    tick.position.set(
        Math.cos(a)*r,
        Math.sin(a)*r,
        .05
    );

    tick.rotation.z =
        a + Math.PI/2;

    intermediate.add(tick);
}


/* =========================================================
   GYROTOURBILLON
   ---------------------------------------------------------
   Beaucoup plus petit.
   Vraies géométries 3D.
   Trois axes indépendants.
========================================================= */

const gyro =
    new THREE.Group();

master.add(gyro);


/*
  taille centrale volontairement réduite :
  elle représente environ 1/4 du diamètre holographique.
*/

const G =
    1.02;


/* =========================================================
   SUPPORT CENTRAL
========================================================= */

const baseRing =
    new THREE.Mesh(
        new THREE.TorusGeometry(
            G*.72,
            .055,
            10,
            96
        ),
        darkMetal
    );

gyro.add(baseRing);


/* =========================================================
   AXE 1
========================================================= */

const axisX =
    new THREE.Group();

gyro.add(axisX);

const ringX =
    new THREE.Mesh(
        new THREE.TorusGeometry(
            G*.62,
            .075,
            12,
            96
        ),
        metal
    );

ringX.rotation.y =
    Math.PI/2;

axisX.add(ringX);


/* chanfrein intérieur */

const bevelX =
    new THREE.Mesh(
        new THREE.TorusGeometry(
            G*.54,
            .026,
            8,
            96
        ),
        blackSteel
    );

bevelX.rotation.y =
    Math.PI/2;

axisX.add(bevelX);


/* =========================================================
   AXE 2
========================================================= */

const axisY =
    new THREE.Group();

gyro.add(axisY);

const ringY =
    new THREE.Mesh(
        new THREE.TorusGeometry(
            G*.52,
            .070,
            12,
            96
        ),
        metal
    );

axisY.add(ringY);


/* =========================================================
   AXE 3
========================================================= */

const axisZ =
    new THREE.Group();

gyro.add(axisZ);

const ringZ =
    new THREE.Mesh(
        new THREE.TorusGeometry(
            G*.40,
            .062,
            12,
            96
        ),
        gold
    );

ringZ.rotation.x =
    Math.PI/2;

axisZ.add(ringZ);


/* =========================================================
   ARÊTES / BRIDGES
========================================================= */

function makeBeam(
    length,
    radius,
    material
){

    return new THREE.Mesh(
        new THREE.CylinderGeometry(
            radius,
            radius*.88,
            length,
            10,
            1
        ),
        material
    );
}


/* pont horizontal */

const bridge1 =
    makeBeam(
        G*1.45,
        .025,
        metal
    );

bridge1.rotation.z =
    Math.PI/2;

axisX.add(bridge1);


/* pont vertical */

const bridge2 =
    makeBeam(
        G*1.32,
        .022,
        darkMetal
    );

axisY.add(bridge2);


/* pont diagonal */

const bridge3 =
    makeBeam(
        G*1.05,
        .018,
        gold
    );

bridge3.rotation.z =
    Math.PI/4;

axisZ.add(bridge3);


/* =========================================================
   PETITES VIS HORLOGÈRES
========================================================= */

function addScrew(
    parent,
    angle,
    radius,
    size=.035
){

    const screw =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                size,
                size,
                .025,
                12
            ),
            metal
        );

    screw.rotation.x =
        Math.PI/2;

    screw.position.set(
        Math.cos(angle)*radius,
        Math.sin(angle)*radius,
        .07
    );

    parent.add(screw);
}


for(let i=0;i<8;i++){

    addScrew(
        axisY,
        i/8*Math.PI*2,
        G*.48,
        i%2===0 ? .032 : .025
    );
}


/* =========================================================
   RUBIS CENTRAL
========================================================= */

const jewel =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .105,
            32,
            20
        ),
        ruby
    );

jewel.position.z =
    .16;

gyro.add(jewel);


/* reflet du rubis */

const jewelLight =
    new THREE.PointLight(
        0xff174e,
        2.5,
        1.6
    );

jewelLight.position.set(
    0,
    0,
    .35
);

gyro.add(jewelLight);


/* =========================================================
   MICRO GRADUATIONS SUR LE GYRO
========================================================= */

const microDial =
    new THREE.Group();

gyro.add(microDial);

for(let i=0;i<36;i++){

    const a =
        i/36*Math.PI*2;

    const r =
        G*.29;

    const geometry =
        new THREE.BoxGeometry(
            i%3===0 ? .016 : .010,
            i%3===0 ? .060 : .035,
            .012
        );

    const material =
        new THREE.MeshStandardMaterial({
            color:
                i%3===0
                ? 0xbfd5d8
                : 0x62787b,
            metalness:.9,
            roughness:.25
        });

    const tick =
        new THREE.Mesh(
            geometry,
            material
        );

    tick.position.set(
        Math.cos(a)*r,
        Math.sin(a)*r,
        .10
    );

    tick.rotation.z =
        a + Math.PI/2;

    microDial.add(tick);
}


/* =========================================================
   ROTATION
   ---------------------------------------------------------
   Chaque axe possède sa propre vitesse.
   Cela permet de voir immédiatement l'effet sphérique.
========================================================= */

let clock =
    new THREE.Clock();

function animate(){

    requestAnimationFrame(animate);

    const t =
        clock.getElapsedTime();

    /*
      Couronnes holographiques :
      lentes et élégantes.
    */

    hologram.rotation.z =
        t*.018;

    intermediate.rotation.z =
        -t*.055;


    /*
      Les trois axes sont indépendants.
    */

    axisX.rotation.x =
        t*.72;

    axisX.rotation.z =
        t*.21;

    axisY.rotation.y =
        t*-.96;

    axisY.rotation.z =
        t*.17;

    axisZ.rotation.z =
        t*1.35;

    axisZ.rotation.x =
        t*.34;


    /*
      Mouvement global très léger :
      le gyrotourbillon reste vivant sans
      devenir un spinner.
    */

    gyro.rotation.x =
        Math.sin(t*.21)*.035;

    gyro.rotation.y =
        Math.cos(t*.17)*.045;


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   RESPONSIVE
========================================================= */

function resize(){

    const w =
        container.clientWidth;

    const h =
        container.clientHeight;

    camera.aspect =
        w/h;

    /*
      En portrait :
      caméra légèrement plus éloignée
      pour conserver l'intégralité des couronnes.

      En paysage :
      on resserre légèrement.
    */

    if(h >= w){

        camera.position.z =
            8.55;

    }else{

        camera.position.z =
            7.15;
    }

    camera.updateProjectionMatrix();

    renderer.setSize(
        w,
        h,
        false
    );
}

window.addEventListener(
    "resize",
    resize
);

window.addEventListener(
    "orientationchange",
    ()=>{
        setTimeout(resize,150);
    }
);

resize();
animate();

</script>
