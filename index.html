<!DOCTYPE html>
<html lang="fr">
<head>

<title>JARVIS — Gyrotourbillon Precision Core</title>

<style>
:root {
    --bg: #02080b;
    --cyan: #00d9ff;
    --cyan-soft: #5eeaff;
    --cyan-dark: #0b5364;
    --white: #d9f8ff;
    --panel: rgba(2, 14, 19, 0.78);
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    position: relative;
    color: var(--white);
}

#app {
    position: relative;
    width: 100vw;
    height: 100dvh;
    min-height: 650px;
    overflow: hidden;
    background:
        radial-gradient(
            ellipse at 50% 38%,
            rgba(3, 30, 38, 0.48),
            transparent 46%
        ),
        #02080b;
}

/* ---------------------------------------------------------
   GRID
--------------------------------------------------------- */

.grid {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.22;
    background-image:
        linear-gradient(
            rgba(32, 121, 139, 0.14) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(32, 121, 139, 0.14) 1px,
            transparent 1px
        );
    background-size: 74px 74px;
}

.grid::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(
            circle at 50% 45%,
            transparent 0%,
            transparent 38%,
            rgba(0, 0, 0, 0.3) 76%,
            rgba(0, 0, 0, 0.7) 100%
        );
}

/* ---------------------------------------------------------
   HEADER
--------------------------------------------------------- */

header {
    position: absolute;
    z-index: 20;
    top: max(28px, env(safe-area-inset-top));
    left: 0;
    width: 100%;
    padding: 0 42px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.brand {
    font-size: clamp(25px, 7vw, 39px);
    letter-spacing: 0.32em;
    font-weight: 300;
    color: #d8f9ff;
    text-shadow:
        0 0 12px rgba(120, 235, 255, 0.08);
}

.status {
    display: flex;
    align-items: center;
    gap: clamp(15px, 4vw, 28px);
}

.statusItem {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 9px;
    letter-spacing: 0.34em;
    color: #60828b;
    white-space: nowrap;
}

.statusDot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #00d9ff;
    box-shadow:
        0 0 7px #00d9ff,
        0 0 16px rgba(0, 217, 255, 0.55);
}

/* ---------------------------------------------------------
   SUBTITLE
--------------------------------------------------------- */

.subtitle {
    position: absolute;
    z-index: 20;
    top: 24.5%;
    width: 100%;
    text-align: center;
    color: #42717c;
    font-size: 10px;
    letter-spacing: 0.48em;
    font-weight: 400;
}

/* ---------------------------------------------------------
   MAIN VISUAL
--------------------------------------------------------- */

.visual {
    position: absolute;
    z-index: 5;
    top: 16.5%;
    left: 50%;
    width: min(96vw, 620px);
    height: min(61vw, 620px);
    transform: translateX(-50%);
}

#scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}

/* ---------------------------------------------------------
   PANELS
--------------------------------------------------------- */

.panels {
    position: absolute;
    z-index: 30;
    left: 5.5%;
    right: 5.5%;
    bottom: max(95px, env(safe-area-inset-bottom) + 90px);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 18px;
}

.panel {
    min-height: 118px;
    padding: 20px 20px 17px;
    border: 1px solid rgba(0, 211, 244, 0.65);
    background:
        linear-gradient(
            135deg,
            rgba(5, 28, 35, 0.73),
            rgba(1, 11, 15, 0.82)
        );
    box-shadow:
        inset 0 0 25px rgba(0, 170, 210, 0.035),
        0 0 18px rgba(0, 80, 100, 0.035);
}

.panelLabel {
    color: #65b5c4;
    font-size: 9px;
    letter-spacing: 0.42em;
    margin-bottom: 15px;
}

.panelValue {
    color: #d9faff;
    font-size: clamp(31px, 8vw, 45px);
    font-weight: 300;
    line-height: 0.9;
    margin-bottom: 13px;
}

.panelInfo {
    color: #456c75;
    font-size: 9px;
    letter-spacing: 0.25em;
}

/* ---------------------------------------------------------
   CANVAS MOBILE ADJUSTMENTS
--------------------------------------------------------- */

@media (max-width: 430px) {

    header {
        padding-left: 38px;
        padding-right: 28px;
    }

    .brand {
        font-size: 26px;
    }

    .status {
        gap: 13px;
    }

    .statusItem {
        font-size: 7px;

    }

    .statusDot {
        width: 7px;
        height: 7px;
    }

    .subtitle {
        top: 25.1%;
        font-size: 8px;

    }

    .visual {

    }

    .panels {
        bottom: max(86px, env(safe-area-inset-bottom) + 78px);
        gap: 10px 18px;
        left: 5.5%;
        right: 5.5%;
    }

    .panel {
        min-height: 104px;

    }

    .panelLabel {

    }

}

@media (max-height: 750px) {

    .visual {
        top: 16%;
    }

    }

    .panel {
        min-height: 92px;
        padding: 14px 17px;
    }

    .panelValue {
        margin-bottom: 8px;
    }
}
</style>

<body>

<div id="app">

    <div class="grid"></div>

    <header>
        <div class="brand">JARVIS</div>

        <div class="status">

            <div class="statusItem">

            </div>

                <span class="statusDot"></span>
                VOICE
            </div>

        </div>
    </header>

    <div class="subtitle">
        GYROTOURBILLON&nbsp;&nbsp;·&nbsp;&nbsp;PRECISION CORE&nbsp;&nbsp;·&nbsp;&nbsp;3 AXIS
    </div>

    <main class="visual">
        <canvas id="scene"></canvas>
    </main>

    <section class="panels">

        <div class="panel">
            <div class="panelLabel">MAISON</div>

            <div class="panelInfo">DISPOSITIFS ACTIFS</div>
        </div>

        <div class="panel">
            <div class="panelLabel">MÉTÉO</div>
            <div class="panelValue">18°</div>
            <div class="panelInfo">CONDITIONS STABLES</div>
        </div>

        <div class="panel">
            <div class="panelLabel">SYSTÈME</div>
            <div class="panelValue">82%</div>
            <div class="panelInfo">PERFORMANCE</div>
        </div>

        <div class="panel">
            <div class="panelLabel">ACTIVITÉ</div>
            <div class="panelValue">12</div>
            <div class="panelInfo">ÉVÉNEMENTS RÉCENTS</div>
        </div>

    </section>

</div>

<script>
"use strict";

/* =========================================================
   JARVIS GYROTOURBILLON
   ---------------------------------------------------------
   Rendu autonome Canvas 2D.
   Aucun modèle externe.
   Aucun CDN.
   Trois axes indépendants.
   Matériaux procéduraux.
   ========================================================= */

const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d", {
    alpha: true
});

let W = 0;
let H = 0;
let CX = 0;
let CY = 0;
let SCALE = 1;

const TAU = Math.PI * 2;

/* ---------------------------------------------------------
   ÉTAT DU MOUVEMENT
--------------------------------------------------------- */

let t = 0;

const axis = {
    x: 0.25,
    y: -0.48,
    z: 0.0
};

const speed = {
    x: 0.00072,
    y: -0.00047,
    z: 0.00031
};

/* ---------------------------------------------------------
   RESIZE
--------------------------------------------------------- */

function resize() {

    const rect = canvas.getBoundingClientRect();

    const dpr = Math.min(
        window.devicePixelRatio || 1,
        2
    );

    W = rect.width;
    H = rect.height;

    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    CX = W / 2;
    CY = H / 2;

    SCALE = Math.min(W, H) / 620;
}

window.addEventListener(
    "resize",
    resize,
    {
        passive: true
    }
);

resize();

/* =========================================================
   UTILITAIRES
========================================================= */

function clamp(v, a, b) {
    return Math.max(a, Math.min(b, v));
}

function lerp(a, b, p) {
    return a + (b - a) * p;
}

function hash(n) {

    const x =
        Math.sin(n * 12.9898) *
        43758.5453;

    return x -
        Math.floor(x);
}

function noise(n) {

    const i = Math.floor(n);
    const f = n - i;

    const a = hash(i);
    const b = hash(i + 1);

    const u =
        f * f *
        (3 - 2 * f);

    return lerp(a, b, u);
}

function rotX(p, a) {

    const c = Math.cos(a);
    const s = Math.sin(a);

    return {
        x: p.x,
        y: p.y * c - p.z * s,
        z: p.y * s + p.z * c
    };
}

function rotY(p, a) {

    const c = Math.cos(a);
    const s = Math.sin(a);

    return {
        x: p.x * c + p.z * s,
        y: p.y,
        z: -p.x * s + p.z * c
    };
}

function rotZ(p, a) {

    const c = Math.cos(a);
    const s = Math.sin(a);

    return {
        x: p.x * c - p.y * s,
        y: p.x * s + p.y * c,
        z: p.z
    };
}

function project(p) {

    const camera = 950;

    const depth =
        camera /
        (camera - p.z);

    return {
        x: CX + p.x * depth * SCALE,
        y: CY + p.y * depth * SCALE,
        z: p.z,
        scale: depth
    };
}

/* =========================================================
   TRANSFORMATION 3 AXES
========================================================= */

function transformCore(p) {

    let q = p;

    q = rotX(
        q,
        axis.x
    );

    q = rotY(
        q,
        axis.y
    );

    q = rotZ(
        q,
        axis.z
    );

    return q;
}

/* =========================================================
   MATERIALS
========================================================= */

function steelGradient(
    x1,
    y1,
    x2,
    y2,
    phase = 0
) {

    const g =
        ctx.createLinearGradient(
            x1,
            y1,
            x2,
            y2
        );

    const shimmer =
        0.5 +
        0.5 *
        Math.sin(
            phase
        );

    g.addColorStop(
        0,
        "#11171a"
    );

    g.addColorStop(
        0.14,
        "#465157"
    );

    g.addColorStop(
        0.22,
        "#aab7bb"
    );

    g.addColorStop(
        0.27,
        "#30383c"
    );

    g.addColorStop(
        0.43,
        "#080d0f"
    );

    g.addColorStop(
        0.61,
        "#7c898d"
    );

    g.addColorStop(
        0.68,
        "#171d20"
    );

    g.addColorStop(
        0.86,
        "#020607"
    );

    g.addColorStop(
        1,
        shimmer > 0.5
            ? "#68757a"
            : "#222b2e"
    );

    return g;
}

function bronzeGradient(
    x1,
    y1,
    x2,
    y2
) {

    const g =
        ctx.createLinearGradient(
            x1,
            y1,
            x2,
            y2
        );

    g.addColorStop(
        0,
        "#24140a"
    );

    g.addColorStop(
        0.18,
        "#8d5b20"
    );

    g.addColorStop(
        0.31,
        "#e2b75e"
    );

    g.addColorStop(
        0.39,
        "#6e4214"
    );

    g.addColorStop(
        0.58,
        "#1f1208"
    );

    g.addColorStop(
        0.73,
        "#a8732a"
    );

    g.addColorStop(
        0.84,
        "#493015"
    );

    g.addColorStop(
        1,
        "#100b07"
    );

    return g;
}

function darkSteelGradient(
    x1,
    y1,
    x2,
    y2
) {

    const g =
        ctx.createLinearGradient(
            x1,
            y1,
            x2,
            y2
        );

    g.addColorStop(
        0,
        "#020405"
    );

    g.addColorStop(
        0.23,
        "#263034"
    );

    g.addColorStop(
        0.31,
        "#0a1013"
    );

    g.addColorStop(
        0.53,
        "#4b565b"
    );

    g.addColorStop(
        0.58,
        "#0b1114"
    );

    g.addColorStop(
        0.86,
        "#020405"
    );

    return g;
}

/* =========================================================
   TORUS / COURONNE 3D
========================================================= */

function drawTorus({
    radius,
    tube,
    rx,
    ry,
    rz,
    material,
    alpha = 1,
    detail = 110,
    phase = 0
}) {

    const points = [];

    for (
        let i = 0;
        i <= detail;
        i++
    ) {

        const u =
            (i / detail) *
            TAU;

        const radial =
            radius +
            tube *
            Math.cos(
                u
            );

        const z =
            tube *
            Math.sin(
                u
            );

        let p = {
            x:
                radial *
                Math.cos(u),

            y:
                radial *
                Math.sin(u),

            z
        };

        p = rotX(
            p,
            rx
        );

        p = rotY(
            p,
            ry
        );

        p = rotZ(
            p,
            rz
        );

        points.push(
            project(p)
        );
    }

    ctx.save();

    ctx.globalAlpha =
        alpha;

    ctx.lineCap =
        "round";

    for (
        let i = 0;
        i < points.length - 1;
        i++
    ) {

        const a =
            points[i];

        const b =
            points[i + 1];

        const light =
            0.5 +
            0.5 *
            Math.sin(
                i * 0.19 +
                phase
            );

        ctx.lineWidth =
            Math.max(
                1,
                tube *
                SCALE *
                (
                    0.7 +
                    light * 0.75
                )
            );

        if (
            material === "steel"
        ) {

            ctx.strokeStyle =
                steelGradient(
                    a.x,
                    a.y,
                    b.x,
                    b.y,
                    phase +
                    i * 0.05
                );

        } else if (
            material === "bronze"
        ) {

            ctx.strokeStyle =
                bronzeGradient(
                    a.x,
                    a.y,
                    b.x,
                    b.y
                );

        } else {

            ctx.strokeStyle =
                darkSteelGradient(
                    a.x,
                    a.y,
                    b.x,
                    b.y
                );
        }

        ctx.beginPath();

        ctx.moveTo(
            a.x,
            a.y
        );

        ctx.lineTo(
            b.x,
            b.y
        );

        ctx.stroke();
    }

    ctx.restore();
}

/* =========================================================
   COURONNES INTERNES
========================================================= */

function drawMechanicalRing(
    radius,
    thickness,
    colorMode,
    rotation,
    segmented = false
) {

    ctx.save();

    ctx.translate(
        CX,
        CY
    );

    ctx.rotate(
        rotation
    );

    const segments =
        segmented
            ? 160
            : 240;

    for (
        let i = 0;
        i < segments;
        i++
    ) {

        const a0 =
            (i / segments) *
            TAU;

        const a1 =
            (
                (i + 0.72) /
                segments
            ) *
            TAU;

        const irregular =
            0.65 +
            noise(
                i * 0.83 +
                radius
            ) *
            0.75;

        const inner =
            radius -
            thickness *
            0.5;

        const outer =
            radius +
            thickness *
            0.5;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            radius,
            a0,
            a1
        );

        if (
            colorMode === "bronze"
        ) {

            ctx.strokeStyle =
                i % 13 === 0
                    ? "#d7a64e"
                    : "#664219";

        } else {

            ctx.strokeStyle =
                i % 17 === 0
                    ? "#a9c4c8"
                    : "#263d42";
        }

        ctx.lineWidth =
            Math.max(
                0.7,
                thickness *
                irregular *
                0.45
            );

        ctx.stroke();

        if (
            i % 5 === 0
        ) {

            const len =
                thickness *
                (
                    0.8 +
                    noise(
                        i * 2.3
                    ) *
                    2.0
                );

            ctx.beginPath();

            ctx.moveTo(
                Math.cos(a0) *
                inner,

                Math.sin(a0) *
                inner
            );

            ctx.lineTo(
                Math.cos(a0) *
                (
                    inner -
                    len
                ),

                Math.sin(a0) *
                (
                    inner -
                    len
                )
            );

            ctx.strokeStyle =
                i % 17 === 0
                    ? "#9bb8bd"
                    : "#285761";

            ctx.lineWidth =
                i % 19 === 0
                    ? 2.1
                    : 0.85;

            ctx.stroke();
        }
    }

    ctx.restore();
}

/* =========================================================
   GRADUATIONS ORIENTÉES VERS LE CENTRE
========================================================= */

function drawPrecisionTicks(
    radius,
    count,
    rotation,
    alpha = 1
) {

    ctx.save();

    ctx.translate(
        CX,
        CY
    );

    ctx.rotate(
        rotation
    );

    ctx.globalAlpha =
        alpha;

    for (
        let i = 0;
        i < count;
        i++
    ) {

        const a =
            i / count *
            TAU;

        const major =
            i % 11 === 0;

        const medium =
            i % 5 === 0;

        const irregular =
            0.55 +
            noise(
                i * 7.17
            ) *
            0.9;

        const length =
            major
                ? 16 * irregular
                : medium
                    ? 10 * irregular
                    : 5 * irregular;

        const width =
            major
                ? 1.5
                : medium
                    ? 1.0
                    : 0.65;

        const r0 =
            radius;

        const r1 =
            radius -
            length;

        /*
          Les graduations pointent
          réellement vers le centre.
        */

        ctx.beginPath();

        ctx.moveTo(
            Math.cos(a) *
            r0,

            Math.sin(a) *
            r0
        );

        ctx.lineTo(
            Math.cos(a) *
            r1,

            Math.sin(a) *
            r1
        );

        ctx.strokeStyle =
            major
                ? "#b5d5da"
                : "#36717b";

        ctx.lineWidth =
            width;

        ctx.stroke();

        if (
            major
        ) {

            const rr =
                r1 -
                7;

            ctx.beginPath();

            ctx.arc(
                Math.cos(a) *
                rr,

                Math.sin(a) *
                rr,

                1.15,

                0,
                TAU
            );

            ctx.fillStyle =
                "#7fc6d0";

            ctx.fill();
        }
    }

    ctx.restore();
}

/* =========================================================
   MICRO MARQUES SUR LES COURONNES
========================================================= */

function drawMicroEngraving(
    radius,
    count,
    rotation
) {

    ctx.save();

    ctx.translate(
        CX,
        CY
    );

    ctx.rotate(
        rotation
    );

    for (
        let i = 0;
        i < count;
        i++
    ) {

        const a =
            i / count *
            TAU;

        const r =
            radius +
            (
                noise(i * 4.11) -
                0.5
            ) *
            7;

        const len =
            1.5 +
            noise(
                i * 9.2
            ) *
            4;

        ctx.save();

        ctx.rotate(a);

        ctx.fillStyle =
            i % 17 === 0
                ? "rgba(196,225,228,.62)"
                : "rgba(33,94,104,.7)";

        ctx.fillRect(
            r,
            -0.55,
            len,
            1.1
        );

        ctx.restore();
    }

    ctx.restore();
}

/* =========================================================
   PETITS SYMBOLS TECHNIQUES
========================================================= */

function drawSymbols(
    radius,
    count,
    rotation
) {

    ctx.save();

    ctx.translate(
        CX,
        CY
    );

    ctx.rotate(
        rotation
    );

    ctx.font =
        "7px monospace";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    const symbols =
        [
            "·",
            "+",
            "□",
            "×",
            "•",
            "—"
        ];

    for (
        let i = 0;
        i < count;
        i++
    ) {

        if (
            i % 3 !== 0
        ) continue;

        const a =
            i / count *
            TAU;

        const rr =
            radius +
            8;

        ctx.save();

        ctx.rotate(a);

        ctx.fillStyle =
            i % 13 === 0
                ? "#8edce7"
                : "#376e78";

        ctx.fillText(
            symbols[
                i %
                symbols.length
            ],
            rr,
            0
        );

        ctx.restore();
    }

    ctx.restore();
}

/* =========================================================
   AXES DU GYROTOURBILLON
========================================================= */

function drawAxisBar(
    length,
    width,
    rotation,
    material,
    phase
) {

    ctx.save();

    ctx.translate(
        CX,
        CY
    );

    ctx.rotate(
        rotation
    );

    const grad =
        material === "bronze"
            ? bronzeGradient(
                -length,
                -width,
                length,
                width
            )
            : steelGradient(
                -length,
                -width,
                length,
                width,
                phase
            );

    ctx.shadowBlur =
        0;

    ctx.fillStyle =
        grad;

    ctx.beginPath();

    ctx.roundRect(
        -length,
        -width / 2,
        length * 2,
        width,
        width * 0.28
    );

    ctx.fill();

    /*
      Chanfreins.
    */

    ctx.strokeStyle =
        "rgba(220,240,242,.65)";

    ctx.lineWidth =
        Math.max(
            0.5,
            width * 0.06
        );

    ctx.beginPath();

    ctx.moveTo(
        -length + 5,
        -width * 0.25
    );

    ctx.lineTo(
        length - 5,
        -width * 0.25
    );

    ctx.stroke();

    /*
      Marques d'usinage.
    */

    for (
        let i = 0;
        i < 11;
        i++
    ) {

        const x =
            -length +
            12 +
            i *
            (
                (length * 2 - 24) /
                10
            );

        ctx.strokeStyle =
            "rgba(0,0,0,.28)";

        ctx.lineWidth =
            0.6;

        ctx.beginPath();

        ctx.moveTo(
            x,
            -width * 0.34
        );

        ctx.lineTo(
            x + 3,
            width * 0.34
        );

        ctx.stroke();
    }

    ctx.restore();
}

/* =========================================================
   ROUAGE CENTRAL
========================================================= */

function drawGear(
    radius,
    teeth,
    toothDepth,
    rotation
) {

    ctx.save();

    ctx.translate(
        CX,
        CY
    );

    ctx.rotate(
        rotation
    );

    const outer =
        radius +
        toothDepth;

    const inner =
        radius -
        2;

    const step =
        TAU /
        teeth;

    ctx.beginPath();

    for (
        let i = 0;
        i < teeth;
        i++
    ) {

        const a =
            i * step;

        const a0 =
            a;

        const a1 =
            a +
            step * 0.18;

        const a2 =
            a +
            step * 0.31;

        const a3 =
            a +
            step * 0.69;

        const a4 =
            a +
            step * 0.82;

        const a5 =
            a +
            step;

        const pts =
            [
                [
                    inner *
                    Math.cos(a0),
                    inner *
                    Math.sin(a0)
                ],
                [
                    outer *
                    Math.cos(a1),
                    outer *
                    Math.sin(a1)
                ],
                [
                    outer *
                    Math.cos(a2),
                    outer *
                    Math.sin(a2)
                ],
                [
                    inner *
                    Math.cos(a3),
                    inner *
                    Math.sin(a3)
                ],
                [
                    outer *
                    Math.cos(a4),
                    outer *
                    Math.sin(a4)
                ],
                [
                    outer *
                    Math.cos(a5),
                    outer *
                    Math.sin(a5)
                ]
            ];

        for (
            const p of pts
        ) {

            if (
                i === 0 &&
                p === pts[0]
            ) {

                ctx.moveTo(
                    p[0],
                    p[1]
                );

            } else {

                ctx.lineTo(
                    p[0],
                    p[1]
                );
            }
        }
    }

    ctx.closePath();

    ctx.fillStyle =
        steelGradient(
            -radius,
            -radius,
            radius,
            radius,
            rotation
        );

    ctx.fill();

    ctx.strokeStyle =
        "#a3b2b5";

    ctx.lineWidth =
        0.8;

    ctx.stroke();

    /*
      Perçages.
    */

    for (
        let i = 0;
        i < 8;
        i++
    ) {

        const a =
            i / 8 *
            TAU;

        const rr =
            radius *
            0.65;

        ctx.beginPath();

        ctx.arc(
            Math.cos(a) * rr,
            Math.sin(a) * rr,
            2.2,
            0,
            TAU
        );

        ctx.fillStyle =
            "#020506";

        ctx.fill();

        ctx.strokeStyle =
            "#6f8589";

        ctx.lineWidth =
            0.5;

        ctx.stroke();
    }

    ctx.restore();
}

/* =========================================================
   PONTS MÉCANIQUES
========================================================= */

function drawBridge(
    length,
    width,
    rotation,
    material
) {

    ctx.save();

    ctx.translate(
        CX,
        CY
    );

    ctx.rotate(
        rotation
    );

    const g =
        material === "bronze"
            ? bronzeGradient(
                -length,
                0,
                length,
                0
            )
            : darkSteelGradient(
                -length,
                0,
                length,
                0
            );

    ctx.fillStyle =
        g;

    ctx.beginPath();

    ctx.moveTo(
        -length,
        -width * 0.42
    );

    ctx.lineTo(
        -length * 0.38,
        -width
    );

    ctx.lineTo(
        length * 0.44,
        -width * 0.62
    );

    ctx.lineTo(
        length,
        0
    );

    ctx.lineTo(
        length * 0.44,
        width * 0.62
    );

    ctx.lineTo(
        -length * 0.38,
        width
    );

    ctx.closePath();

    ctx.fill();

    ctx.strokeStyle =
        "rgba(190,205,208,.68)";

    ctx.lineWidth =
        0.75;

    ctx.stroke();

    /*
      Fraisage interne.
    */

    ctx.beginPath();

    ctx.moveTo(
        -length * 0.63,
        -width * 0.25
    );

    ctx.lineTo(
        length * 0.43,
        -width * 0.25
    );

    ctx.strokeStyle =
        "rgba(0,0,0,.58)";

    ctx.lineWidth =
        1.2;

    ctx.stroke();

    /*
      Micro-vis.
    */

    for (
        let i = 0;
        i < 3;
        i++
    ) {

        const x =
            -length * 0.52 +
            i *
            length * 0.48;

        ctx.beginPath();

        ctx.arc(
            x,
            0,
            2.5,
            0,
            TAU
        );

        ctx.fillStyle =
            "#111719";

        ctx.fill();

        ctx.strokeStyle =
            "#88999d";

        ctx.lineWidth =
            0.55;

        ctx.stroke();

        ctx.beginPath();

        ctx.moveTo(
            x - 1.2,
            -1.2
        );

        ctx.lineTo(
            x + 1.2,
            1.2
        );

        ctx.strokeStyle =
            "#536367";

        ctx.lineWidth =
            0.55;

        ctx.stroke();
    }

    ctx.restore();
}

/* =========================================================
   RESSORT / DÉTAIL CENTRAL
========================================================= */

function drawSpring(
    radius,
    turns,
    rotation
) {

    ctx.save();

    ctx.translate(
        CX,
        CY
    );

    ctx.rotate(
        rotation
    );

    ctx.beginPath();

    const total =
        turns *
        TAU;

    const points =
        220;

    for (
        let i = 0;
        i <= points;
        i++
    ) {

        const p =
            i / points;

        const a =
            p *
            total;

        const r =
            radius *
            (
                0.15 +
                p * 0.85
            );

        const x =
            Math.cos(a) *
            r;

        const y =
            Math.sin(a) *
            r;

        if (
            i === 0
        ) {

            ctx.moveTo(
                x,
                y
            );

        } else {

            ctx.lineTo(
                x,
                y
            );
        }
    }

    ctx.strokeStyle =
        "#a27632";

    ctx.lineWidth =
        1.05;

    ctx.stroke();

    ctx.restore();
}

/* =========================================================
   PATINE ET IMPERFECTIONS
========================================================= */

function drawPatina(
    radius,
    count,
    rotation
) {

    ctx.save();

    ctx.translate(
        CX,
        CY
    );

    ctx.rotate(
        rotation
    );

    for (
        let i = 0;
        i < count;
        i++
    ) {

        const a =
            hash(i * 5.3) *
            TAU;

        const rr =
            radius *
            (
                0.68 +
                hash(i * 3.8) *
                0.28
            );

        const size =
            0.4 +
            hash(i * 8.1) *
            1.6;

        ctx.beginPath();

        ctx.arc(
            Math.cos(a) * rr,
            Math.sin(a) * rr,
            size,
            0,
            TAU
        );

        const r =
            hash(i * 1.2);

        if (
            r < 0.34
        ) {

            ctx.fillStyle =
                "rgba(91,65,31,.40)";

        } else if (
            r < 0.68
        ) {

            ctx.fillStyle =
                "rgba(103,132,119,.20)";

        } else {

            ctx.fillStyle =
                "rgba(183,190,177,.18)";
        }

        ctx.fill();
    }

    ctx.restore();
}

/* =========================================================
   PARTICULES MÉCANIQUES DISCRÈTES
========================================================= */

function drawDust(
    radius,
    count,
    rotation
) {

    ctx.save();

    ctx.translate(
        CX,
        CY
    );

    ctx.rotate(
        rotation
    );

    for (
        let i = 0;
        i < count;
        i++
    ) {

        const a =
            hash(i * 2.7) *
            TAU;

        const rr =
            radius *
            (
                0.25 +
                hash(i * 9.1) *
                0.7
            );

        const x =
            Math.cos(a) *
            rr;

        const y =
            Math.sin(a) *
            rr;

        const s =
            0.25 +
            hash(i * 4.2) *
            1.0;

        ctx.fillStyle =
            `rgba(161,185,187,${
                0.08 +
                hash(i) * 0.17
            })`;

        ctx.fillRect(
            x,
            y,
            s,
            s
        );
    }

    ctx.restore();
}

    });

    );
}

/* =========================================================
   COURONNES EXTÉRIEURES
========================================================= */

function drawOuterArchitecture() {

    const base =
        Math.min(W, H);

    /*
      Les couronnes restent dans la zone
      prévue par la dernière version.

      Elles ne touchent jamais les bords.
    */

    const radii = [
        base * 0.255,
        base * 0.292,
        base * 0.329,
        base * 0.366,
        base * 0.403
    ];

    for (
        let i = 0;
        i < radii.length;
        i++
    ) {

        const r =
            radii[i];

        const thickness =
            i === 4
                ? 1.2
                : 0.85;

        drawMechanicalRing(
            r,
            thickness,
            i === 1 ||
            i === 3
                ? "bronze"
                : "steel",
            t *
            (
                i % 2 === 0
                    ? 0.000025
                    : -0.000017
            ),
            true
        );

        drawPrecisionTicks(
            r,
            i === 4
                ? 96
                : 84,
            -t *
            (
                0.000012 +
                i * 0.000004
            ),
            0.82
        );

        drawMicroEngraving(
            r,
            130,
            t *
            0.00001
        );

        if (
            i === 0 ||
            i === 2 ||
            i === 4
        ) {

            drawSymbols(
                r,
                72,
                -t *
                0.000008
            );
        }
    }

    /*
      Couronnes intermédiaires très fines.
      Elles évitent l'effet "Saturne".
    */

    const fine =
        [
            base * 0.273,
            base * 0.310,
            base * 0.347,
            base * 0.384
        ];

    for (
        let i = 0;
        i < fine.length;
        i++
    ) {

        ctx.save();

        ctx.translate(
            CX,
            CY
        );

        ctx.rotate(
            t *
            (
                i % 2
                    ? -0.000011
                    : 0.000015
            )
        );

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            fine[i],
            0,
            TAU
        );

        ctx.strokeStyle =
            i % 2
                ? "rgba(32,103,114,.75)"
                : "rgba(76,139,148,.55)";

        ctx.lineWidth =
            0.7;

        ctx.stroke();

        ctx.restore();
    }
}

/* =========================================================

function drawOuterScrews() {

    const r =

    ctx.save();

    ctx.translate(

    for (
        let i = 0;

        const x =

        const radius =

/* =========================================================
   ANIMATION
========================================================= */

function animate() {

    t += 16.67;

    /*
      Trois rotations réellement indépendantes.

      X = oscillation / rotation lente
      Y = rotation secondaire
      Z = rotation plus lente
    */

    axis.x +=
        speed.x;

    axis.y +=
        speed.y;

    axis.z +=
        speed.z;

    /*
      Oscillation très légère pour éviter
      une rotation artificiellement parfaite.
    */

    const wobbleX =
        Math.sin(
            t * 0.00019
        ) *
        0.08;

    const wobbleY =
        Math.cos(
            t * 0.00023
        ) *
        0.065;

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    drawSceneLight();

    drawOuterArchitecture();

    drawOuterScrews();

    /*
      Gyrotourbillon par-dessus
      les structures arrière.
    */

    ctx.save();

    /*
      Micro déplacement orbital
      quasiment imperceptible.
    */

    const orbitalX =
        Math.sin(
            t * 0.00017
        ) *
        1.2;

    const orbitalY =
        Math.cos(
            t * 0.00021
        ) *
        1.0;

    CX += orbitalX * 0;
    CY += orbitalY * 0;

    drawGyrotourbillon();

    ctx.restore();

    requestAnimationFrame(
        animate
    );
}

/* =========================================================
   DÉMARRAGE
========================================================= */

animate();

/* =========================================================
   INTERACTION TACTILE
   ---------------------------------------------------------
   Une légère interaction permet de révéler
   les volumes sans transformer l'interface
   en jeu vidéo.
========================================================= */

let touchX = 0;
let touchY = 0;

window.addEventListener(
    "touchmove",
    function(e) {

        if (
            !e.touches ||
            !e.touches.length
        ) return;

        const touch =
            e.touches[0];

        const nx =
            touch.clientX /
            window.innerWidth -
            0.5;

        const ny =
            touch.clientY /
            window.innerHeight -
            0.5;

        touchX =
            clamp(
                nx,
                -0.5,
                0.5
            );

        touchY =
            clamp(
                ny,
                -0.5,
                0.5
            );

    },
    {
        passive: true
    }
);

/* =========================================================
   FIN
========================================================= */
</script>
