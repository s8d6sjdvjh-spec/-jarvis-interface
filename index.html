<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               viewport-fit=cover,
               user-scalable=no">

<meta name="theme-color" content="#02090d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>JARVIS — Voice Core</title>

<style>
:root {
    --bg: #02080c;
    --grid: rgba(38, 142, 164, 0.11);
    --grid-strong: rgba(54, 173, 194, 0.18);

    --cyan: #28e6ff;
    --cyan-soft: #7defff;
    --cyan-dark: #08758a;

    --blue: #319cff;
    --violet: #8b73ff;
    --gold: #c7a34d;
    --white: #e8fbff;

    --panel: rgba(2, 15, 21, 0.78);
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--white);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    position: relative;
}

/* =========================================================
   BACKGROUND
   ========================================================= */

#background {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(
            circle at 50% 43%,
            rgba(0, 133, 165, 0.16),
            transparent 34%
        ),
        radial-gradient(
            circle at 50% 43%,
            rgba(0, 62, 91, 0.20),
            transparent 57%
        ),
        linear-gradient(
            180deg,
            #02080c 0%,
            #031017 55%,
            #02080c 100%
        );
}

#grid {
    position: absolute;
    inset: 0;

    background-image:
        linear-gradient(
            rgba(41, 148, 169, 0.10) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(41, 148, 169, 0.10) 1px,
            transparent 1px
        );

    background-size: 27px 27px;

    opacity: 0.75;
}

#grid::after {
    content: "";
    position: absolute;
    inset: 0;

    background-image:
        linear-gradient(
            rgba(61, 190, 212, 0.08) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(61, 190, 212, 0.08) 1px,
            transparent 1px
        );

    background-size: 135px 135px;
}

/* =========================================================
   MAIN
   ========================================================= */

.app {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

/* =========================================================
   HEADER
   ========================================================= */

.header {
    position: absolute;

    top: calc(
        env(safe-area-inset-top) + 32px
    );

    left: 0;
    right: 0;

    height: 72px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 38px;

    z-index: 20;
}

.brand {
    font-size: 31px;
    font-weight: 300;

    letter-spacing: 0.31em;

    white-space: nowrap;
}

.status {
    display: flex;
    gap: 20px;
    align-items: center;

    font-size: 10px;

    letter-spacing: 0.31em;

    color: rgba(196, 239, 247, 0.62);

    white-space: nowrap;
}

.status-item {
    display: flex;
    align-items: center;
    gap: 8px;
}

.status-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--cyan);

    box-shadow:
        0 0 7px var(--cyan),
        0 0 18px rgba(40, 230, 255, 0.7);

    animation:
        statusPulse 2.2s ease-in-out infinite;
}

.status-item:nth-child(2) .status-dot {
    animation-delay: .4s;
}

.status-item:nth-child(3) .status-dot {
    animation-delay: .8s;
}

@keyframes statusPulse {
    0%,
    100% {
        opacity: .65;
        transform: scale(.8);
    }

    50% {
        opacity: 1;
        transform: scale(1.15);
    }
}

/* =========================================================
   TITLES
   ========================================================= */

.subtitle {
    position: absolute;

    top: calc(
        env(safe-area-inset-top) + 137px
    );

    left: 0;
    right: 0;

    text-align: center;

    font-size: 12px;

    letter-spacing: 0.42em;

    color: rgba(107, 210, 226, 0.63);

    z-index: 15;
}

.subsubtitle {
    position: absolute;

    top: calc(
        env(safe-area-inset-top) + 170px
    );

    left: 0;
    right: 0;

    text-align: center;

    font-size: 8px;

    letter-spacing: 0.42em;

    color: rgba(104, 184, 198, 0.38);

    z-index: 15;
}

/* =========================================================
   CORE AREA
   ========================================================= */

.core-area {
    position: absolute;

    left: 50%;

    top: 43%;

    width: min(94vw, 650px);
    height: min(94vw, 650px);

    transform:
        translate(-50%, -50%);

    z-index: 5;
}

/* =========================================================
   CANVAS
   ========================================================= */

#visual {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;
}

/* =========================================================
   CORE LABEL
   ========================================================= */

.core-label {
    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    pointer-events: none;

    text-align: center;

    z-index: 10;

    text-shadow:
        0 0 10px rgba(62, 238, 255, .55);
}

.core-title {
    font-size: 13px;

    letter-spacing: 0.44em;

    margin-left: .44em;

    color: rgba(225, 250, 255, .88);
}

.core-state {
    margin-top: 9px;

    font-size: 7px;

    letter-spacing: 0.38em;

    color: rgba(106, 213, 228, .55);
}

/* =========================================================
   VOICE PANEL
   ========================================================= */

.voice-panel {
    position: absolute;

    left: 50%;

    top: calc(43% + min(47vw, 325px) + 38px);

    transform: translateX(-50%);

    width: min(88vw, 590px);

    z-index: 15;

    text-align: center;
}

.voice-wave {
    height: 27px;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 4px;

    opacity: .8;
}

.wave-bar {
    width: 2px;

    height: 8px;

    background:
        linear-gradient(
            to bottom,
            #8ff8ff,
            #04b7d1
        );

    box-shadow:
        0 0 7px rgba(37, 226, 255, .55);

    transform-origin: center;

    transition:
        height .055s linear;
}

.voice-text {
    margin-top: 13px;

    min-height: 25px;

    padding: 7px 18px;

    border-top:
        1px solid rgba(46, 199, 221, .32);

    border-bottom:
        1px solid rgba(46, 199, 221, .32);

    font-size: 11px;

    letter-spacing: .25em;

    color: rgba(206, 245, 251, .68);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

/* =========================================================
   BUTTONS
   ========================================================= */

.controls {
    position: absolute;

    bottom:
        calc(
            env(safe-area-inset-bottom) + 44px
        );

    left: 50%;

    transform: translateX(-50%);

    width: min(92vw, 650px);

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;

    z-index: 20;
}

.control {
    height: 63px;

    border:
        1px solid
        rgba(33, 210, 239, .58);

    background:
        linear-gradient(
            180deg,
            rgba(4, 27, 36, .88),
            rgba(1, 14, 20, .88)
        );

    color:
        rgba(216, 249, 255, .84);

    font-size: 10px;

    letter-spacing: .28em;

    cursor: pointer;

    transition:
        background .2s ease,
        border-color .2s ease,
        box-shadow .2s ease,
        transform .2s ease;
}

.control:active {
    transform: scale(.97);
}

.control:hover {
    border-color: var(--cyan);

    box-shadow:
        0 0 20px rgba(25, 220, 246, .15);

    background:
        rgba(5, 39, 49, .95);
}

.control.active {
    border-color: #7af5ff;

    box-shadow:
        inset 0 0 22px rgba(25, 226, 250, .12),
        0 0 24px rgba(22, 215, 240, .16);

    color: #dffcff;
}

/* =========================================================
   SMALL STATUS CORNERS
   ========================================================= */

.corner {
    position: absolute;

    width: 26px;
    height: 26px;

    border-color:
        rgba(73, 218, 238, .55);

    z-index: 10;

    pointer-events: none;
}

.corner.tl {
    top: 18%;
    left: 4%;

    border-top: 1px solid;
    border-left: 1px solid;
}

.corner.tr {
    top: 18%;
    right: 4%;

    border-top: 1px solid;
    border-right: 1px solid;
}

.corner.bl {
    bottom: 18%;
    left: 4%;

    border-bottom: 1px solid;
    border-left: 1px solid;
}

.corner.br {
    bottom: 18%;
    right: 4%;

    border-bottom: 1px solid;
    border-right: 1px solid;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    .header {
        padding:
            0 26px;
    }

    .brand {
        font-size: 27px;
    }

    .status {
        gap: 11px;
        font-size: 8px;
        letter-spacing: .25em;
    }

    .subtitle {
        font-size: 10px;
        letter-spacing: .34em;
    }

    .subsubtitle {
        font-size: 7px;
        letter-spacing: .30em;
    }

    .core-area {
        width: 96vw;
        height: 96vw;

        top: 42%;
    }

    .voice-panel {
        top:
            calc(
                42% + 48vw + 30px
            );
    }

    .controls {
        bottom:
            calc(
                env(safe-area-inset-bottom) + 28px
            );

        width: calc(100vw - 36px);

        gap: 8px;
    }

    .control {
        height: 61px;

        font-size: 8px;

        letter-spacing: .22em;
    }

    .corner {
        display: none;
    }
}

@media (max-height: 720px) {

    .core-area {
        top: 39%;
    }

    .voice-panel {
        top:
            calc(
                39% + 47vw + 25px
            );
    }

    .controls {
        bottom:
            calc(
                env(safe-area-inset-bottom) + 14px
            );
    }
}
</style>
</head>

<body>

<div id="background">
    <div id="grid"></div>
</div>

<div class="app">

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <header class="header">

        <div class="brand">
            JARVIS
        </div>

        <div class="status">

            <div class="status-item">
                <span class="status-dot"></span>
                <span>ONLINE</span>
            </div>

            <div class="status-item">
                <span class="status-dot"></span>
                <span>SECURE</span>
            </div>

            <div class="status-item">
                <span class="status-dot"></span>
                <span>VOICE</span>
            </div>

        </div>

    </header>

    <div class="subtitle">
        VOICE CORE · CRYSTALLINE MATRIX · 3 AXIS
    </div>

    <div class="subsubtitle">
        HOLOGRAPHIC CONCENTRIC SYSTEM · AUDIO REACTIVE
    </div>

            <div class="core-title">

        </div>

    <section class="voice-panel">

        <div
            class="voice-wave"
            id="voiceWave">
        </div>

        <div
            class="voice-text"
            id="voiceText">
            VOICE INPUT · READY
        </div>

    </section>

    <div class="controls">

        <button
            class="control"
            id="microButton">
            MICRO<br>ACTIF
        </button>

        <button
            class="control"
            id="shortcutButton">
            ENVOYER<br>RACCOURCIS
        </button>

        <button
            class="control"
            id="speakButton">
            VOIX<br>JARVIS
        </button>

    </div>

</div>

<script>
/* =========================================================
   JARVIS VISUAL ENGINE
   ========================================================= */

(() => {

"use strict";

/* =========================================================
   CANVAS
   ========================================================= */

const canvas =
    document.getElementById("visual");

const ctx =
    canvas.getContext("2d");

const coreArea =
    document.querySelector(".core-area");

let W = 0;
let H = 0;
let CX = 0;
let CY = 0;
let DPR = 1;

function resizeCanvas() {

    const rect =
        coreArea.getBoundingClientRect();

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W = rect.width;
    H = rect.height;

    canvas.width =
        Math.floor(W * DPR);

    canvas.height =
        Math.floor(H * DPR);

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );

    CX = W / 2;
    CY = H / 2;
}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas,
    { passive: true }
);

/* =========================================================
   AUDIO
   ========================================================= */

let audioContext = null;
let analyser = null;
let microphone = null;

let audioData = null;

let audioLevel = 0;
let smoothAudio = 0;

let listening = false;

async function startAudio() {

    if (audioContext) {
        return;
    }

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                }
            });

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        analyser =
            audioContext.createAnalyser();

        analyser.fftSize = 1024;

        analyser.smoothingTimeConstant =
            0.72;

        microphone =
            audioContext.createMediaStreamSource(
                stream
            );

        microphone.connect(
            analyser
        );

        audioData =
            new Uint8Array(
                analyser.fftSize
            );

    } catch (error) {

        console.warn(
            "Microphone unavailable:",
            error
        );
    }
}

function readAudio() {

    if (!analyser) {

        smoothAudio *= .94;

        return;
    }

    analyser.getByteTimeDomainData(
        audioData
    );

    let sum = 0;

    for (
        let i = 0;
        i < audioData.length;
        i++
    ) {

        const value =
            (audioData[i] - 128) / 128;

        sum += value * value;
    }

    const rms =
        Math.sqrt(
            sum / audioData.length
        );

    audioLevel =
        Math.min(
            1,
            rms * 5.5
        );

    smoothAudio +=
        (
            audioLevel -
            smoothAudio
        ) * .22;
}

/* =========================================================
   VOICE RECOGNITION
   ========================================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "fr-FR";

    recognition.continuous =
        true;

    recognition.interimResults =
        true;

    recognition.onstart =
        () => {

            listening = true;

            microButton.classList.add(
                "active"
            );

            coreState.textContent =
                "LISTENING";
        };

    recognition.onend =
        () => {

            listening = false;

            microButton.classList.remove(
                "active"
            );

            coreState.textContent =
                "READY";
        };

    recognition.onerror =
        event => {

            console.warn(
                "Speech recognition:",
                event.error
            );

            listening = false;

            microButton.classList.remove(
                "active"
            );

            coreState.textContent =
                "READY";
        };

    recognition.onresult =
        event => {

            let transcript = "";

            for (
                let i =
                    event.resultIndex;
                i < event.results.length;
                i++
            ) {

                transcript +=
                    event.results[i][0].transcript;
            }

            transcript =
                transcript.trim();

            if (transcript) {

                voiceText.textContent =
                    transcript;

                lastTranscript =
                    transcript;
            }
        };
}

/* =========================================================
   SYNTHESIS
   ========================================================= */

function speakJarvis(
    text = "Oui, monsieur."
) {

    if (!("speechSynthesis" in window)) {
        return;
    }

    window.speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(
            text
        );

    utterance.lang =
        "fr-FR";

    utterance.rate =
        0.92;

    utterance.pitch =
        0.82;

    utterance.volume =
        1;

    window.speechSynthesis.speak(
        utterance
    );
}

/* =========================================================
   UI
   ========================================================= */

const microButton =
    document.getElementById(
        "microButton"
    );

const shortcutButton =
    document.getElementById(
        "shortcutButton"
    );

const speakButton =
    document.getElementById(
        "speakButton"
    );

const voiceText =
    document.getElementById(
        "voiceText"
    );

const coreState =
    document.getElementById(
        "coreState"
    );

const voiceWave =
    document.getElementById(
        "voiceWave"
    );

let lastTranscript = "";

for (
    let i = 0;
    i < 31;
    i++
) {

    const bar =
        document.createElement(
            "span"
        );

    bar.className =
        "wave-bar";

    voiceWave.appendChild(
        bar
    );
}

const waveBars =
    [...document.querySelectorAll(
        ".wave-bar"
    )];

microButton.addEventListener(
    "click",
    async () => {

        await startAudio();

        if (!recognition) {

            coreState.textContent =
                "VOICE API N/A";

            voiceText.textContent =
                "RECONNAISSANCE VOCALE NON DISPONIBLE";

            return;
        }

        if (listening) {

            recognition.stop();

        } else {

            try {

                recognition.start();

            } catch (error) {

                console.warn(error);
            }
        }
    }
);

shortcutButton.addEventListener(
    "click",
    () => {

        if (!lastTranscript) {

            voiceText.textContent =
                "AUCUNE COMMANDE";

            return;
        }

        /*
         * POINT D'INTÉGRATION
         *
         * Ici tu pourras plus tard connecter
         * l'interface à un raccourci iOS,
         * une URL, une API ou ton backend.
         */

        const payload = {
            command:
                lastTranscript,
            timestamp:
                Date.now()
        };

        console.log(
            "JARVIS → Raccourcis:",
            payload
        );

        voiceText.textContent =
            "COMMANDE PRÊTE · " +
            lastTranscript;
    }
);

speakButton.addEventListener(
    "click",
    () => {

        if (lastTranscript) {

            speakJarvis(
                lastTranscript
            );

        } else {

            speakJarvis(
                "Oui, monsieur."
            );
        }

        coreState.textContent =
            "SPEAKING";

        setTimeout(
            () => {

                coreState.textContent =
                    listening
                    ? "LISTENING"
                    : "READY";

            },
            1800
        );
    }
);

/* =========================================================
   RANDOM DATA
   ========================================================= */

const symbols = [
    "◈",
    "◇",
    "△",
    "▽",
    "□",
    "○",
    "×",
    "·",
    "⌁",
    "⌖",
    "⌬",
    "∴",
    "∵",
    "⊙",
    "⊕",
    "⊗",
    "∆",
    "Σ",
    "λ",
    "Ω"
];

const digits = [
    "000",
    "015",
    "030",
    "045",
    "060",
    "075",
    "090",
    "105",
    "120",
    "135",
    "150",
    "165",
    "180",
    "195",
    "210",
    "225",
    "240",
    "255",
    "270",
    "285",
    "300",
    "315",
    "330",
    "345"
];

function seededValue(
    index,
    salt = 0
) {

    const x =
        Math.sin(
            index * 91.731 +
            salt * 17.193
        ) * 43758.5453;

    return (
        x -
        Math.floor(x)
    );
}

/* =========================================================
   GEOMETRY HELPERS
   ========================================================= */

function polar(
    radius,
    angle
) {

    return {
        x:
            CX +
            Math.cos(angle) *
            radius,

        y:
            CY +
            Math.sin(angle) *
            radius
    };
}

function ringPath(
    radius,
    start,
    end
) {

    ctx.beginPath();

    ctx.arc(
        CX,
        CY,
        radius,
        start,
        end
    );
}

/* =========================================================
   GLOW CIRCLE
   ========================================================= */

function glowCircle(
    x,
    y,
    radius,
    color,
    intensity
) {

    const gradient =
        ctx.createRadialGradient(
            x,
            y,
            0,
            x,
            y,
            radius
        );

    gradient.addColorStop(
        0,
        color
    );

    gradient.addColorStop(
        .22,
        color.replace(
            ")",
            ", .55)"
        )
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.globalAlpha =
        intensity;

    ctx.fillStyle =
        gradient;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.globalAlpha =
        1;
}

/* =========================================================
   MAIN VISUAL STATE
   ========================================================= */

let time = 0;

const ringBases = [
    .22,
    .34,
    .46,
    .58
];

const ringThickness = [
    2.0,
    2.2,
    2.5,
    2.8
];

const ringColors = [
    "#62efff",
    "#2bd9f3",
    "#38c9ff",
    "#75e9f7"
];

const ringRotations = [
    .00019,
    -.00013,
    .000085,
    -.000052
];

/* =========================================================
   DRAW BACK HALO
   ========================================================= */

function drawHalo() {

    const maxR =
        Math.min(W, H) * .62;

    const gradient =
        ctx.createRadialGradient(
            CX,
            CY,
            0,
            CX,
            CY,
            maxR
        );

    gradient.addColorStop(
        0,
        `rgba(
            21,
            218,
            246,
            ${.12 + smoothAudio * .20}
        )`
    );

    gradient.addColorStop(
        .35,
        "rgba(0,100,140,.07)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle =
        gradient;

    ctx.beginPath();

    ctx.arc(
        CX,
        CY,
        maxR,
        0,
        Math.PI * 2
    );

    ctx.fill();
}

/* =========================================================
   OUTER STRUCTURE
   ========================================================= */

function drawOuterArchitecture() {

    const maxR =
        Math.min(W, H) * .59;

    ctx.save();

    ctx.strokeStyle =
        "rgba(45,215,240,.24)";

    ctx.lineWidth =
        .7;

    for (
        let i = 0;
        i < 3;
        i++
    ) {

        const r =
            maxR -
            i * 10;

        ctx.beginPath();

        ctx.arc(
            CX,
            CY,
            r,
            0,
            Math.PI * 2
        );

        ctx.stroke();
    }

    /*
     * Very fine orbital fragments.
     */

    for (
        let i = 0;
        i < 80;
        i++
    ) {

        const angle =
            seededValue(i, 10) *
            Math.PI *
            2;

        const r =
            maxR -
            4 +
            seededValue(i, 11) *
            9;

        const length =
            3 +
            seededValue(i, 12) *
            9;

        const p1 =
            polar(r, angle);

        const p2 =
            polar(
                r + length,
                angle
            );

        ctx.strokeStyle =
            i % 7 === 0
            ? "rgba(226,250,255,.68)"
            : "rgba(50,201,225,.40)";

        ctx.beginPath();

        ctx.moveTo(
            p1.x,
            p1.y
        );

        ctx.lineTo(
            p2.x,
            p2.y
        );

        ctx.stroke();
    }

    ctx.restore();
}

/* =========================================================
   ONE RING
   ========================================================= */

function drawRing(
    index,
    baseRadius,
    audio
) {

    const minSide =
        Math.min(W, H);

    /*
     * The ring expands around the SAME CENTER.
     * No lateral translation.
     */

    const idleRadius =
        minSide * baseRadius;

    const expansion =
        idleRadius *
        audio *
        .085;

    const radius =
        idleRadius +
        expansion;

    const rotation =
        time *
        ringRotations[index];

    ctx.save();

    /*
     * Outer holographic body
     */

    ctx.shadowBlur =
        18 +
        audio * 28;

    ctx.shadowColor =
        ringColors[index];

    ctx.strokeStyle =
        ringColors[index];

    ctx.globalAlpha =
        .76 +
        audio * .22;

    ctx.lineWidth =
        ringThickness[index];

    ctx.beginPath();

    ctx.arc(
        CX,
        CY,
        radius,
        0,
        Math.PI * 2
    );

    ctx.stroke();

    ctx.shadowBlur = 0;

    /*
     * Parallel secondary arcs
     */

    for (
        let layer = 1;
        layer <= 3;
        layer++
    ) {

        const rr =
            radius -
            layer * (
                6 +
                index * 2
            );

        ctx.strokeStyle =
            `rgba(
                54,
                208,
                232,
                ${.22 - layer * .035}
            )`;

        ctx.lineWidth =
            layer === 1
            ? .9
            : .55;

        ctx.beginPath();

        ctx.arc(
            CX,
            CY,
            rr,
            0,
            Math.PI * 2
        );

        ctx.stroke();
    }

    /*
     * Dashed information orbit
     */

    ctx.setLineDash([
        2 + index,
        7 + index * 2
    ]);

    ctx.lineWidth =
        .8;

    ctx.strokeStyle =
        "rgba(102,231,247,.58)";

    ctx.beginPath();

    ctx.arc(
        CX,
        CY,
        radius + 4,
        rotation,
        rotation +
        Math.PI * 2
    );

    ctx.stroke();

    ctx.setLineDash([]);

    /*
     * Gold information arc
     */

    const goldStart =
        rotation +
        Math.PI *
        (
            .18 +
            index * .11
        );

    const goldLength =
        Math.PI *
        (
            .24 +
            audio * .12
        );

    ctx.strokeStyle =
        "rgba(205,169,79,.82)";

    ctx.lineWidth =
        1.2 +
        audio * 1.4;

    ctx.beginPath();

    ctx.arc(
        CX,
        CY,
        radius - 3,
        goldStart,
        goldStart +
        goldLength
    );

    ctx.stroke();

    /*
     * Violet secondary arc
     */

    const violetStart =
        rotation -
        Math.PI *
        (
            .65 +
            index * .15
        );

    ctx.strokeStyle =
        "rgba(133,111,255,.72)";

    ctx.lineWidth =
        .9;

    ctx.beginPath();

    ctx.arc(
        CX,
        CY,
        radius - 8,
        violetStart,
        violetStart +
        Math.PI * .19
    );

    ctx.stroke();

    /*
     * Major graduation marks
     */

    const majorCount =
        24;

    for (
        let i = 0;
        i < majorCount;
        i++
    ) {

        const angle =
            rotation +
            (
                i /
                majorCount
            ) *
            Math.PI *
            2;

        const outer =
            radius +
            1;

        const inner =
            radius -
            (
                i % 6 === 0
                ? 14
                : 8
            );

        const p1 =
            polar(
                inner,
                angle
            );

        const p2 =
            polar(
                outer,
                angle
            );

        ctx.strokeStyle =
            i % 6 === 0
            ? "rgba(232,250,255,.88)"
            : "rgba(101,224,239,.55)";

        ctx.lineWidth =
            i % 6 === 0
            ? 1.35
            : .7;

        ctx.beginPath();

        ctx.moveTo(
            p1.x,
            p1.y
        );

        ctx.lineTo(
            p2.x,
            p2.y
        );

        ctx.stroke();
    }

    /*
     * Saturated micro graduations
     */

    const microCount =
        144;

    for (
        let i = 0;
        i < microCount;
        i++
    ) {

        const angle =
            rotation +
            (
                i /
                microCount
            ) *
            Math.PI *
            2;

        const length =
            i % 12 === 0
            ? 8
            : i % 4 === 0
            ? 5
            : 2.5;

        const r1 =
            radius -
            2;

        const r2 =
            r1 -
            length;

        const p1 =
            polar(
                r1,
                angle
            );

        const p2 =
            polar(
                r2,
                angle
            );

        ctx.strokeStyle =
            i % 19 === 0
            ? "rgba(221,245,249,.78)"
            : i % 7 === 0
            ? "rgba(62,221,241,.72)"
            : "rgba(61,181,202,.40)";

        ctx.lineWidth =
            i % 12 === 0
            ? 1
            : .45;

        ctx.beginPath();

        ctx.moveTo(
            p1.x,
            p1.y
        );

        ctx.lineTo(
            p2.x,
            p2.y
        );

        ctx.stroke();
    }

    /*
     * Data numbers
     */

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    for (
        let i = 0;
        i < 24;
        i++
    ) {

        const angle =
            rotation +
            (
                i /
                24
            ) *
            Math.PI *
            2;

        const textRadius =
            radius -
            22;

        const p =
            polar(
                textRadius,
                angle
            );

        ctx.save();

        ctx.translate(
            p.x,
            p.y
        );

        /*
         * Tangential orientation.
         */

        ctx.rotate(
            angle +
            Math.PI / 2
        );

        ctx.font =
            index === 3
            ? "8px monospace"
            : "7px monospace";

        ctx.fillStyle =
            i % 5 === 0
            ? "rgba(221,248,252,.78)"
            : "rgba(83,198,218,.55)";

        ctx.fillText(
            digits[i],
            0,
            0
        );

        ctx.restore();
    }

    /*
     * Technical symbols between graduations
     */

    for (
        let i = 0;
        i < 32;
        i++
    ) {

        const angle =
            rotation +
            seededValue(
                i,
                index + 40
            ) *
            Math.PI *
            2;

        const r =
            radius -
            31 -
            seededValue(
                i,
                index + 50
            ) *
            11;

        const p =
            polar(
                r,
                angle
            );

        ctx.font =
            "8px monospace";

        ctx.fillStyle =
            i % 4 === 0
            ? "rgba(207,178,88,.72)"
            : "rgba(89,215,235,.48)";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            symbols[
                i %
                symbols.length
            ],
            p.x,
            p.y
        );
    }

    /*
     * Moving information nodes
     */

    const nodeCount =
        5 + index;

    for (
        let i = 0;
        i < nodeCount;
        i++
    ) {

        const angle =
            rotation * (
                1 +
                index * .25
            ) +
            seededValue(
                i,
                index + 90
            ) *
            Math.PI *
            2;

        const p =
            polar(
                radius,
                angle
            );

        const nodeR =
            i % 3 === 0
            ? 2.2
            : 1.2;

        glowCircle(
            p.x,
            p.y,
            12 +
            audio * 18,
            "rgba(45,228,255,.30)",
            .35
        );

        ctx.fillStyle =
            i % 4 === 0
            ? "#d9faff"
            : "#39dff7";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            nodeR +
            audio * 1.5,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.restore();
}

/* =========================================================
   BETWEEN-RING INFORMATION
   ========================================================= */

function drawInterRingInformation(
    audio
) {

    const minSide =
        Math.min(W, H);

    ctx.save();

    /*
     * These elements deliberately occupy
     * the EMPTY spaces between rings.
     */

    for (
        let layer = 0;
        layer < 3;
        layer++
    ) {

        const radius =
            minSide *
            (
                .285 +
                layer * .105
            );

        const rotation =
            -time *
            (
                .00011 +
                layer * .000045
            );

        const count =
            42 +
            layer * 16;

        for (
            let i = 0;
            i < count;
            i++
        ) {

            const angle =
                rotation +
                (
                    i /
                    count
                ) *
                Math.PI *
                2;

            const p =
                polar(
                    radius,
                    angle
                );

            const size =
                i % 9 === 0
                ? 3
                : i % 3 === 0
                ? 1.8
                : 1;

            ctx.fillStyle =
                i % 13 === 0
                ? "rgba(202,168,77,.74)"
                : "rgba(70,207,226,.48)";

            ctx.fillRect(
                p.x - size / 2,
                p.y - size / 2,
                size,
                size
            );
        }
    }

    /*
     * Opposing arc system.
     */

    const arcs = [
        {
            r: .275,
            start: .25,
            len: .33,
            color: "rgba(74,225,242,.72)"
        },
        {
            r: .39,
            start: 2.4,
            len: .21,
            color: "rgba(190,158,67,.72)"
        },
        {
            r: .50,
            start: 4.0,
            len: .28,
            color: "rgba(122,103,255,.72)"
        },
        {
            r: .56,
            start: 5.1,
            len: .18,
            color: "rgba(76,226,243,.74)"
        }
    ];

    arcs.forEach(
        (arc, index) => {

            const r =
                minSide *
                arc.r;

            const direction =
                index % 2 === 0
                ? 1
                : -1;

            const rotation =
                time *
                .00013 *
                direction;

            ctx.strokeStyle =
                arc.color;

            ctx.lineWidth =
                1.3 +
                audio * 1.7;

            ctx.beginPath();

            ctx.arc(
                CX,
                CY,
                r,
                arc.start +
                rotation,
                arc.start +
                rotation +
                Math.PI *
                arc.len
            );

            ctx.stroke();
        }
    );

    ctx.restore();
}

/* =========================================================
   GEODE
   ========================================================= */

function drawGeode(
    audio
) {

    const minSide =
        Math.min(W, H);

    /*
     * Deliberately smaller than the orbital system.
     */

    const base =
        minSide *
        .105;

    const pulse =
        1 +
        audio *
        .12;

    const radius =
        base *
        pulse;

    /*
     * Halo.
     */

    glowCircle(
        CX,
        CY,
        radius * 3.8,
        "rgba(28,211,243,.12)",
        .8
    );

    glowCircle(
        CX -
        radius * .28,
        CY -
        radius * .22,
        radius * 1.35,
        "rgba(96,238,255,.16)",
        .7
    );

    /*
     * Dark crystalline body.
     */

    const points = 18;

    const vertices = [];

    for (
        let i = 0;
        i < points;
        i++
    ) {

        const angle =
            (
                i /
                points
            ) *
            Math.PI *
            2 -
            Math.PI / 2;

        const irregular =
            .82 +
            seededValue(
                i,
                500
            ) *
            .24;

        const localRadius =
            radius *
            irregular;

        vertices.push({
            x:
                CX +
                Math.cos(angle) *
                localRadius,

            y:
                CY +
                Math.sin(angle) *
                localRadius
        });
    }

    /*
     * Outer crystalline silhouette.
     */

    ctx.save();

    ctx.beginPath();

    vertices.forEach(
        (p, i) => {

            if (i === 0) {
                ctx.moveTo(
                    p.x,
                    p.y
                );
            } else {
                ctx.lineTo(
                    p.x,
                    p.y
                );
            }
        }
    );

    ctx.closePath();

    const bodyGradient =
        ctx.createRadialGradient(
            CX - radius * .3,
            CY - radius * .35,
            radius * .08,
            CX,
            CY,
            radius * 1.25
        );

    bodyGradient.addColorStop(
        0,
        "rgba(130,244,255,.42)"
    );

    bodyGradient.addColorStop(
        .32,
        "rgba(10,81,103,.70)"
    );

    bodyGradient.addColorStop(
        .72,
        "rgba(3,25,35,.92)"
    );

    bodyGradient.addColorStop(
        1,
        "rgba(1,8,13,.98)"
    );

    ctx.fillStyle =
        bodyGradient;

    ctx.fill();

    ctx.strokeStyle =
        "rgba(98,238,255,.88)";

    ctx.lineWidth =
        1.5 +
        audio * 2;

    ctx.shadowBlur =
        16 +
        audio * 25;

    ctx.shadowColor =
        "rgba(35,229,255,.65)";

    ctx.stroke();

    ctx.shadowBlur = 0;

    /*
     * Faceted internal geometry.
     */

    for (
        let i = 0;
        i < points;
        i++
    ) {

        const a =
            vertices[i];

        const b =
            vertices[
                (i + 1) %
                points
            ];

        const centerOffset =
            audio *
            (
                5 +
                seededValue(
                    i,
                    600
                ) * 8
            );

        const angle =
            Math.atan2(
                a.y - CY,
                a.x - CX
            );

        const innerX =
            CX +
            Math.cos(angle) *
            (
                radius *
                .15 +
                centerOffset
            );

        const innerY =
            CY +
            Math.sin(angle) *
            (
                radius *
                .15 +
                centerOffset
            );

        ctx.beginPath();

        ctx.moveTo(
            a.x,
            a.y
        );

        ctx.lineTo(
            innerX,
            innerY
        );

        ctx.lineTo(
            b.x,
            b.y
        );

        ctx.closePath();

        ctx.fillStyle =
            i % 4 === 0
            ? "rgba(43,207,232,.13)"
            : i % 3 === 0
            ? "rgba(122,99,245,.10)"
            : "rgba(7,53,69,.20)";

        ctx.fill();

        ctx.strokeStyle =
            "rgba(78,209,229,.27)";

        ctx.lineWidth =
            .55;

        ctx.stroke();
    }

    /*
     * Crystalline internal network.
     */

    for (
        let i = 0;
        i < 13;
        i++
    ) {

        const angle =
            seededValue(
                i,
                700
            ) *
            Math.PI *
            2;

        const r1 =
            radius *
            (
                .12 +
                seededValue(
                    i,
                    701
                ) *
                .28
            );

        const r2 =
            radius *
            (
                .72 +
                seededValue(
                    i,
                    702
                ) *
                .25
            );

        const p1 =
            polar(
                r1,
                angle
            );

        const p2 =
            polar(
                r2,
                angle +
                (
                    seededValue(
                        i,
                        703
                    ) -
                    .5
                ) *
                .7
            );

        ctx.strokeStyle =
            "rgba(130,235,247,.34)";

        ctx.lineWidth =
            .55;

        ctx.beginPath();

        ctx.moveTo(
            p1.x,
            p1.y
        );

        ctx.lineTo(
            p2.x,
            p2.y
        );

        ctx.stroke();
    }

    /*
     * Inner crystal facets.
     */

    for (
        let i = 0;
        i < 8;
        i++
    ) {

        const angle =
            (
                i /
                8
            ) *
            Math.PI *
            2 +
            time *
            .0002;

        const r =
            radius *
            (
                .28 +
                audio * .05
            );

        const p =
            polar(
                r,
                angle
            );

        ctx.fillStyle =
            i % 2 === 0
            ? "rgba(70,225,247,.22)"
            : "rgba(136,104,255,.18)";

        ctx.beginPath();

        ctx.moveTo(
            CX,
            CY
        );

        ctx.lineTo(
            p.x,
            p.y
        );

        ctx.lineTo(
            CX +
            Math.cos(
                angle + .38
            ) *
            r,

            CY +
            Math.sin(
                angle + .38
            ) *
            r
        );

        ctx.closePath();

        ctx.fill();
    }

    /*
     * Core light.
     */

    const coreRadius =
        radius *
        (
            .18 +
            audio * .06
        );

    const coreGradient =
        ctx.createRadialGradient(
            CX,
            CY,
            0,
            CX,
            CY,
            coreRadius
        );

    coreGradient.addColorStop(
        0,
        "rgba(235,255,255,.95)"
    );

    coreGradient.addColorStop(
        .12,
        "rgba(117,242,255,.75)"
    );

    coreGradient.addColorStop(
        .48,
        "rgba(17,180,220,.30)"
    );

    coreGradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle =
        coreGradient;

    ctx.beginPath();

    ctx.arc(
        CX,
        CY,
        coreRadius * 2.8,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /*
     * Tiny crystalline particles.
     */

    for (
        let i = 0;
        i < 30;
        i++
    ) {

        const angle =
            seededValue(
                i,
                800
            ) *
            Math.PI *
            2;

        const r =
            radius *
            (
                .25 +
                seededValue(
                    i,
                    801
                ) *
                .70
            );

        const p =
            polar(
                r,
                angle
            );

        const s =
            .7 +
            seededValue(
                i,
                802
            ) *
            1.8 +
            audio * 1.4;

        ctx.fillStyle =
            i % 6 === 0
            ? "rgba(222,249,255,.9)"
            : "rgba(66,214,238,.55)";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            s,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.restore();
}

/* =========================================================
   VOICE WAVEFORM
   ========================================================= */

function updateWaveform(
    audio
) {

    waveBars.forEach(
        (bar, index) => {

            const center =
                waveBars.length / 2;

            const distance =
                Math.abs(
                    index -
                    center
                ) /
                center;

            const shape =
                1 -
                distance;

            const noise =
                seededValue(
                    index,
                    Math.floor(
                        time / 90
                    )
                );

            const height =
                5 +
                shape *
                (
                    audio *
                    22
                ) +
                noise *
                audio *
                8;

            bar.style.height =
                height + "px";
        }
    );
}

/* =========================================================
   RENDER
   ========================================================= */

function render() {

    readAudio();

    time++;

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    /*
     * Very subtle global breathing.
     */

    const idleBreath =
        (
            Math.sin(
                time * .018
            ) +
            1
        ) *
        .5;

    const effectiveAudio =
        Math.max(
            smoothAudio,
            idleBreath *
            .018
        );

    drawHalo();

    /*
     * Large peripheral architecture.
     */

    drawOuterArchitecture();

    /*
     * Information occupying spaces
     * between the four main rings.
     */

    drawInterRingInformation(
        effectiveAudio
    );

    /*
     * Four fixed concentric systems.
     */

    for (
        let i = 0;
        i < ringBases.length;
        i++
    ) {

        drawRing(
            i,
            ringBases[i],
            effectiveAudio
        );
    }

    /*
     * Geode LAST so that it sits
     * visually in front of the rings.
     */

    drawGeode(
        effectiveAudio
    );

    updateWaveform(
        effectiveAudio
    );

    requestAnimationFrame(
        render
    );
}

render();

/* =========================================================
   INITIAL MICROPHONE PREPARATION
   ========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.hidden &&
            audioContext
        ) {

            audioContext.suspend();

        } else if (
            !document.hidden &&
            audioContext
        ) {

            audioContext.resume();
        }
    }
);

/* =========================================================
   KEYBOARD SUPPORT
   ========================================================= */

window.addEventListener(
    "keydown",
    event => {

        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();

            microButton.click();
        }
    }
);

/* =========================================================
   RESIZE OBSERVER
   ========================================================= */

if (
    "ResizeObserver"
    in window
) {

    const observer =
        new ResizeObserver(
            resizeCanvas
        );

    observer.observe(
        coreArea
    );
}

})();
