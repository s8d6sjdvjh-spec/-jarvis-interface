<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>JARVIS — Gyrotourbillon Precision Core</title>

<style>
:root{
  --bg:#02080b;
  --cyan:#27d8f5;
  --cyanDim:#0d6676;
  --cyanFaint:#07313a;
  --text:#d9f5fa;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

body{
  position:fixed;
  inset:0;
}

#app{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 40%,
      rgba(0,55,68,.22) 0%,
      rgba(0,15,20,.10) 30%,
      transparent 58%),
    #02080b;
}

#scene{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

#grid{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.23;

  background-image:
    linear-gradient(rgba(27,130,148,.16) 1px,transparent 1px),
    linear-gradient(90deg,rgba(27,130,148,.16) 1px,transparent 1px);

  background-size:30px 30px;

  mask-image:linear-gradient(
    to bottom,
    transparent 0%,
    black 12%,
    black 88%,
    transparent 100%
  );
}

/* ---------- HEADER ---------- */

.header{
  position:absolute;
  top:max(28px,env(safe-area-inset-top));
  left:0;
  right:0;
  height:58px;
  display:flex;
  align-items:center;
  padding:0 7.5vw;
  pointer-events:none;
  z-index:5;
}

.brand{
  font-size:20px;
  letter-spacing:.42em;
  font-weight:300;
  color:#e6fbff;
  white-space:nowrap;
}

.status{
  margin-left:auto;
  display:flex;
  gap:22px;
  font-size:10px;
  letter-spacing:.35em;
  color:#60818a;
}

.status span{
  display:flex;
  align-items:center;
  gap:8px;
}

.status i{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#20d9fa;
  box-shadow:
    0 0 5px #20d9fa,
    0 0 14px rgba(32,217,250,.65);
}

/* ---------- TITLE ---------- */

.subtitle{
  position:absolute;
  top:116px;
  left:0;
  right:0;
  text-align:center;
  z-index:5;
  pointer-events:none;

  font-size:9px;
  letter-spacing:.42em;
  color:#52737c;
  white-space:nowrap;
}

/* ---------- HUD CARDS ---------- */

.cards{
  position:absolute;
  left:7.5vw;
  right:7.5vw;
  bottom:max(35px,env(safe-area-inset-bottom));
  height:190px;

  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:10px;

  z-index:6;
}

.card{
  position:relative;
  border:1px solid rgba(19,176,202,.48);
  background:
    linear-gradient(
      135deg,
      rgba(4,32,39,.52),
      rgba(1,14,19,.28)
    );

  box-shadow:
    inset 0 0 30px rgba(0,100,120,.06),
    0 0 12px rgba(0,80,100,.03);

  padding:16px 17px;
  overflow:hidden;
}

.card::before,
.card::after{
  content:"";
  position:absolute;
  width:7px;
  height:7px;
  border-color:#20cfe9;
  border-style:solid;
}

.card::before{
  left:-1px;
  top:-1px;
  border-width:1px 0 0 1px;
}

.card::after{
  right:-1px;
  bottom:-1px;
  border-width:0 1px 1px 0;
}

.label{
  font-size:9px;
  letter-spacing:.34em;
  color:#5db4c4;
  margin-bottom:13px;
}

.value{
  font-size:30px;
  line-height:1;
  font-weight:300;
  color:#d9f6fa;
}

.detail{
  margin-top:10px;
  font-size:9px;
  letter-spacing:.18em;
  color:#50727b;
}

/* ---------- CORE STATUS ---------- */

.coreReadout{
  position:absolute;
  left:0;
  right:0;
  bottom:calc(max(35px,env(safe-area-inset-bottom)) + 205px);
  text-align:center;

  font-size:8px;
  letter-spacing:.32em;
  color:#35606a;

  pointer-events:none;
  z-index:6;
}

/* ---------- PORTRAIT TUNING ---------- */

@media (orientation:landscape){

  .header{
    padding-left:5vw;
    padding-right:5vw;
  }

  .cards{
    left:5vw;
    right:5vw;
    bottom:25px;
    height:125px;
  }

  .subtitle{
    top:82px;
  }
}

@media (max-width:420px){

  .status{
    gap:10px;
    font-size:8px;
  }

  .brand{
    font-size:18px;
  }

  .subtitle{
    top:108px;
    font-size:8px;
  }
}
</style>
</head>

<body>

<div id="app">

  <canvas id="scene"></canvas>

  <div id="grid"></div>

  <div class="header">
    <div class="brand">J A R V I S</div>

    <div class="status">
      <span><i></i>ONLINE</span>
      <span><i></i>SECURE</span>
      <span><i></i>VOICE</span>
    </div>
  </div>

  <div class="subtitle">
    GYROTOURBILLON&nbsp;&nbsp;·&nbsp;&nbsp;PRECISION CORE&nbsp;&nbsp;·&nbsp;&nbsp;3 AXIS
  </div>

  <div class="coreReadout">
    PRECISION MECHANISM&nbsp;&nbsp;·&nbsp;&nbsp;LIVE
  </div>

  <div class="cards">

    <div class="card">
      <div class="label">MAISON</div>
      <div class="value">03</div>
      <div class="detail">DISPOSITIFS ACTIFS</div>
    </div>

    <div class="card">
      <div class="label">MÉTÉO</div>
      <div class="value">18°</div>
      <div class="detail">CONDITIONS STABLES</div>
    </div>

    <div class="card">
      <div class="label">SYSTÈME</div>
      <div class="value">82%</div>
      <div class="detail">PERFORMANCE</div>
    </div>

    <div class="card">
      <div class="label">ACTIVITÉ</div>
      <div class="value">12</div>
      <div class="detail">ÉVÉNEMENTS RÉCENTS</div>
    </div>

  </div>

</div>


<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>


<script type="module">

import * as THREE from "three";


/* ============================================================
   JARVIS — GYROTOURBILLON

   ARCHITECTURE

   - Couronnes = holographiques
   - Centre = véritable géométrie 3D
   - 3 cadres mécaniques indépendants
   - Rotation X / Y / Z indépendante
   - Pièces métalliques fines
   - Chanfreins
   - Gravures / graduations
   - Rubis translucide
   - InstancedMesh pour les micro-graduations
   - Mise à l'échelle automatique portrait
   ============================================================ */


/* ------------------------------------------------------------
   RENDERER
   ------------------------------------------------------------ */

const canvas = document.getElementById("scene");

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias:true,
  alpha:true,
  powerPreference:"high-performance"
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio || 1, 2)
);

renderer.setClearColor(0x000000,0);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;


/* ------------------------------------------------------------
   SCENE / CAMERA
   ------------------------------------------------------------ */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  30,
  1,
  0.01,
  100
);

camera.position.set(
  0,
  0,
  5.8
);

camera.lookAt(0,0,0);


/* ------------------------------------------------------------
   LIGHTING
   ------------------------------------------------------------ */

const ambient = new THREE.HemisphereLight(
  0x162b31,
  0x010304,
  1.25
);

scene.add(ambient);


/* cold key */
const key = new THREE.DirectionalLight(
  0xbfeeff,
  4.0
);

key.position.set(
  -2.5,
  3.5,
  5
);

scene.add(key);


/* cyan rim */
const cyanLight = new THREE.PointLight(
  0x19d8ff,
  15,
  8
);

cyanLight.position.set(
  -2.5,
  0.7,
  2.5
);

scene.add(cyanLight);


/* warm metal reflection */
const warmLight = new THREE.PointLight(
  0xffa93b,
  9,
  5
);

warmLight.position.set(
  2.2,
  -1.2,
  2
);

scene.add(warmLight);


/* subtle central light */
const coreLight = new THREE.PointLight(
  0x72eaff,
  4,
  3
);

coreLight.position.set(
  0,
  0,
  1.8
);

scene.add(coreLight);


/* ------------------------------------------------------------
   MATERIALS
   ------------------------------------------------------------ */

const steel = new THREE.MeshStandardMaterial({
  color:0x8d9ca0,
  metalness:0.95,
  roughness:0.24
});

const darkSteel = new THREE.MeshStandardMaterial({
  color:0x202a2c,
  metalness:0.96,
  roughness:0.28
});

const polished = new THREE.MeshStandardMaterial({
  color:0xc8d5d7,
  metalness:1.0,
  roughness:0.12
});

const satin = new THREE.MeshStandardMaterial({
  color:0x657376,
  metalness:0.92,
  roughness:0.38
});

const gold = new THREE.MeshStandardMaterial({
  color:0xa9792b,
  metalness:0.96,
  roughness:0.2
});

const darkGold = new THREE.MeshStandardMaterial({
  color:0x4d3210,
  metalness:0.96,
  roughness:0.3
});


/* ------------------------------------------------------------
   RUBY MATERIAL
   ------------------------------------------------------------ */

const ruby = new THREE.MeshPhysicalMaterial({

  color:0x7b001e,

  metalness:0.05,

  roughness:0.08,

  transmission:0.78,

  thickness:0.6,

  ior:1.72,

  clearcoat:1.0,

  clearcoatRoughness:0.08,

  attenuationColor:new THREE.Color(0x5b0014),

  attenuationDistance:1.5

});


/* ============================================================
   GEOMETRY HELPERS
   ============================================================ */


/* ------------------------------------------------------------
   Precision ring
   ------------------------------------------------------------ */

function precisionRing(
  radius,
  width,
  depth,
  material
){

  const shape = new THREE.Shape();

  const outer = radius + width/2;
  const inner = radius - width/2;

  shape.absarc(
    0,
    0,
    outer,
    0,
    Math.PI*2,
    false
  );

  const hole = new THREE.Path();

  hole.absarc(
    0,
    0,
    inner,
    0,
    Math.PI*2,
    true
  );

  shape.holes.push(hole);

  const geometry = new THREE.ExtrudeGeometry(
    shape,
    {
      depth,
      curveSegments:64,
      steps:1,
      bevelEnabled:true,
      bevelThickness:Math.min(width*.18,depth*.35),
      bevelSize:Math.min(width*.14,depth*.25),
      bevelSegments:3
    }
  );

  geometry.center();

  return new THREE.Mesh(
    geometry,
    material
  );
}


/* ------------------------------------------------------------
   Fine radial blade / bridge
   ------------------------------------------------------------ */

function bridge(
  length,
  width,
  depth,
  material
){

  const geometry =
    new THREE.BoxGeometry(
      length,
      width,
      depth
    );

  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );

  return mesh;
}


/* ------------------------------------------------------------
   Small screw
   ------------------------------------------------------------ */

function screw(material=polished){

  const body =
    new THREE.CylinderGeometry(
      0.035,
      0.042,
      0.018,
      20
    );

  const mesh =
    new THREE.Mesh(
      body,
      material
    );

  mesh.rotation.x =
    Math.PI/2;

  return mesh;
}


/* ------------------------------------------------------------
   Tiny jewel
   ------------------------------------------------------------ */

function jewel(){

  const geometry =
    new THREE.IcosahedronGeometry(
      0.06,
      2
    );

  return new THREE.Mesh(
    geometry,
    ruby
  );
}


/* ============================================================
   HOLOGRAPHIC OUTER RINGS
   ============================================================ */

const holoGroup =
  new THREE.Group();

scene.add(holoGroup);


/* holographic line material */

function holoMaterial(
  color=0x28d9f5,
  opacity=.55
){

  return new THREE.MeshBasicMaterial({
    color,
    transparent:true,
    opacity,
    depthWrite:false,
    blending:THREE.AdditiveBlending
  });

}


/* thin ring */

function holoRing(radius, opacity=.35){

  const geometry =
    new THREE.RingGeometry(
      radius-.004,
      radius+.004,
      256
    );

  const mesh =
    new THREE.Mesh(
      geometry,
      holoMaterial(
        0x28d9f5,
        opacity
      )
    );

  return mesh;
}


/* ------------------------------------------------------------
   Main holographic crowns
   ------------------------------------------------------------ */

const holoRadii = [
  1.34,
  1.47,
  1.61,
  1.75,
  1.89,
  2.03
];

for(
  const r of holoRadii
){

  const ring =
    holoRing(
      r,
      r > 1.8 ? .28 : .38
    );

  ring.position.z = -.025;

  holoGroup.add(ring);
}


/* ============================================================
   RADIAL PRECISION MARKINGS
   ============================================================ */


/*
   The markings point INWARD.

   They are intentionally:
   - numerous
   - short
   - irregular
   - multi-scale
   - holographic
*/

const tickGeometry =
  new THREE.BoxGeometry(
    .006,
    .055,
    .004
  );

const tickMaterial =
  holoMaterial(
    0x53e5fa,
    .55
  );


function addTicks(
  radius,
  count,
  minLength,
  maxLength
){

  const mesh =
    new THREE.InstancedMesh(
      tickGeometry,
      tickMaterial,
      count
    );

  const dummy =
    new THREE.Object3D();

  for(
    let i=0;
    i<count;
    i++
  ){

    const angle =
      (i/count)*Math.PI*2;

    const irregular =
      minLength +
      Math.random() *
      (maxLength-minLength);

    const r =
      radius +
      (Math.random()-.5)*.018;

    const x =
      Math.cos(angle)*r;

    const y =
      Math.sin(angle)*r;

    dummy.position.set(
      x,
      y,
      .015
    );

    /*
      Box initially points along Y.

      Rotation makes its long axis radial.
    */

    dummy.rotation.z =
      angle + Math.PI/2;

    dummy.scale.y =
      irregular / .055;

    dummy.updateMatrix();

    mesh.setMatrixAt(
      i,
      dummy.matrix
    );
  }

  mesh.instanceMatrix.needsUpdate = true;

  holoGroup.add(mesh);
}


/* dense precision scales */

addTicks(1.39,96,.035,.095);
addTicks(1.50,128,.025,.075);
addTicks(1.63,144,.025,.105);
addTicks(1.77,168,.018,.085);
addTicks(1.91,192,.020,.075);
addTicks(2.04,216,.015,.065);


/* ============================================================
   SYMBOL / MARKER RING
   ============================================================ */

function markerDot(radius, angle){

  const g =
    new THREE.SphereGeometry(
      .018,
      8,
      8
    );

  const m =
    new THREE.MeshBasicMaterial({
      color:0x6beeff
    });

  const mesh =
    new THREE.Mesh(g,m);

  mesh.position.set(
    Math.cos(angle)*radius,
    Math.sin(angle)*radius,
    .035
  );

  holoGroup.add(mesh);
}


for(
  let i=0;
  i<24;
  i++
){

  markerDot(
    1.98,
    i/24*Math.PI*2
  );

}


/* ============================================================
   CENTRAL GYROTOURBILLON
   ============================================================ */

const gyro =
  new THREE.Group();

scene.add(gyro);


/*
   The requested proportion is approximately:

       gyro diameter = 15% viewport width

   The whole model is later scaled according to camera distance.
*/


/* ------------------------------------------------------------
   3 mechanical gimbals
   ------------------------------------------------------------ */

const axisX =
  new THREE.Group();

const axisY =
  new THREE.Group();

const axisZ =
  new THREE.Group();


gyro.add(axisX);

axisX.add(axisY);

axisY.add(axisZ);


/*
   Three genuine mechanical frames.

   They are NOT tubes.
*/

const ringOuter =
  precisionRing(
    .43,
    .035,
    .045,
    polished
  );

const ringMiddle =
  precisionRing(
    .33,
    .032,
    .040,
    steel
  );

const ringInner =
  precisionRing(
    .24,
    .028,
    .036,
    satin
  );


axisX.add(ringOuter);

axisY.add(ringMiddle);

axisZ.add(ringInner);


/* ------------------------------------------------------------
   Additional inner mechanical lips
   ------------------------------------------------------------ */

const lip1 =
  precisionRing(
    .385,
    .010,
    .025,
    darkSteel
  );

const lip2 =
  precisionRing(
    .285,
    .009,
    .022,
    polished
  );

axisX.add(lip1);
axisY.add(lip2);


/* ------------------------------------------------------------
   Axis bridges
   ------------------------------------------------------------ */

const bridgeX =
  bridge(
    .78,
    .022,
    .025,
    polished
  );

const bridgeY =
  bridge(
    .62,
    .018,
    .022,
    steel
  );

const bridgeZ =
  bridge(
    .48,
    .015,
    .018,
    gold
  );


axisX.add(bridgeX);

axisY.add(bridgeY);

axisZ.add(bridgeZ);


/* ------------------------------------------------------------
   Rotate bridges to their mechanical planes
   ------------------------------------------------------------ */

bridgeX.rotation.z =
  Math.PI/2;

bridgeY.rotation.y =
  Math.PI/2;

bridgeZ.rotation.x =
  Math.PI/2;


/* ------------------------------------------------------------
   Fine pivot posts
   ------------------------------------------------------------ */

function pivotPost(){

  const g =
    new THREE.CylinderGeometry(
      .018,
      .022,
      .11,
      16
    );

  return new THREE.Mesh(
    g,
    darkSteel
  );

}


const p1 =
  pivotPost();

p1.position.y=.39;

axisX.add(p1);


const p2 =
  pivotPost();

p2.position.x=.29;

p2.rotation.z=Math.PI/2;

axisY.add(p2);


/* ------------------------------------------------------------
   Screws around the outer mechanical frame
   ------------------------------------------------------------ */

for(
  let i=0;
  i<8;
  i++
){

  const angle =
    i/8*Math.PI*2;

  const s =
    screw(
      i%2 ?
      polished :
      satin
    );

  s.position.set(
    Math.cos(angle)*.405,
    Math.sin(angle)*.405,
    .035
  );

  axisX.add(s);

}


/* ------------------------------------------------------------
   Center wheel
   ------------------------------------------------------------ */

const centerWheel =
  precisionRing(
    .115,
    .018,
    .025,
    gold
  );

axisZ.add(centerWheel);


/* ------------------------------------------------------------
   Central axle
   ------------------------------------------------------------ */

const axle =
  new THREE.CylinderGeometry(
    .014,
    .014,
    .25,
    20
  );

const axleMesh =
  new THREE.Mesh(
    axle,
    polished
  );

axisZ.add(axleMesh);


/* ------------------------------------------------------------
   Ruby
   ------------------------------------------------------------ */

const centerRuby =
  jewel();

centerRuby.scale.setScalar(.82);

axisZ.add(centerRuby);


/* ------------------------------------------------------------
   Tiny gold jewel housing
   ------------------------------------------------------------ */

const jewelHousing =
  new THREE.TorusGeometry(
    .078,
    .012,
    10,
    40
  );

const jewelHousingMesh =
  new THREE.Mesh(
    jewelHousing,
    gold
  );

axisZ.add(
  jewelHousingMesh
);


/* ============================================================
   MICRO DETAILS ON THE MECHANICAL CORE
   ============================================================ */


/*
   Small radial engraved-looking marks.

   These are dark metallic geometry rather than luminous
   holographic marks.
*/

const microTickGeo =
  new THREE.BoxGeometry(
    .008,
    .028,
    .006
  );

const microTickMat =
  new THREE.MeshStandardMaterial({
    color:0x20292b,
    metalness:.9,
    roughness:.35
  });

const microTicks =
  new THREE.InstancedMesh(
    microTickGeo,
    microTickMat,
    48
  );

const dummy =
  new THREE.Object3D();

for(
  let i=0;
  i<48;
  i++
){

  const a =
    i/48*Math.PI*2;

  dummy.position.set(
    Math.cos(a)*.205,
    Math.sin(a)*.205,
    .025
  );

  dummy.rotation.z =
    a + Math.PI/2;

  dummy.scale.y =
    i%4===0 ? 1.7 : 1;

  dummy.updateMatrix();

  microTicks.setMatrixAt(
    i,
    dummy.matrix
  );
}

microTicks.instanceMatrix.needsUpdate=true;

axisZ.add(
  microTicks
);


/* ============================================================
   DEPTH / SHADOW-LIKE BACKPLATE
   ============================================================ */

const backPlate =
  new THREE.Mesh(
    new THREE.CircleGeometry(
      .455,
      96
    ),
    new THREE.MeshStandardMaterial({
      color:0x031015,
      metalness:.45,
      roughness:.55
    })
  );

backPlate.position.z=-.065;

gyro.add(backPlate);


/* ============================================================
   ORIENTATION
   ============================================================ */

gyro.rotation.x =
  THREE.MathUtils.degToRad(9);

gyro.rotation.y =
  THREE.MathUtils.degToRad(-7);


/* ============================================================
   SCALE / POSITION
   ============================================================ */

function layout(){

  const w =
    window.innerWidth;

  const h =
    window.innerHeight;

  renderer.setSize(
    w,
    h,
    false
  );

  camera.aspect =
    w/h;

  camera.updateProjectionMatrix();


  /*
     Three.js perspective projection.

     We solve a world scale that makes the mechanical
     core approximately 15% of the physical viewport width.
  */

  const targetPx =
    w * .15;

  const visibleHeight =
    2 *
    Math.tan(
      THREE.MathUtils.degToRad(
        camera.fov/2
      )
    ) *
    camera.position.z;

  const visibleWidth =
    visibleHeight *
    camera.aspect;

  const targetWorld =
    visibleWidth *
    .15;


  /*
     Our mechanical core diameter is roughly .9 world units.
  */

  const naturalDiameter =
    .92;

  const s =
    targetWorld /
    naturalDiameter;

  gyro.scale.setScalar(s);


  /*
     Upper half of the portrait screen.
  */

  gyro.position.set(
    0,
    visibleHeight*.115,
    0
  );


  /*
     Holographic crowns are much larger than the mechanical
     object but remain inside the upper visual field.
  */

  holoGroup.scale.setScalar(
    Math.min(
      1,
      visibleWidth/4.25
    )
  );

  holoGroup.position.set(
    0,
    visibleHeight*.115,
    -.06
  );

}

layout();

window.addEventListener(
  "resize",
  layout,
  {passive:true}
);


/* ============================================================
   ANIMATION
   ============================================================ */

const clock =
  new THREE.Clock();


function animate(){

  requestAnimationFrame(
    animate
  );

  const t =
    clock.getElapsedTime();


  /*
     THREE DISTINCT ROTATIONAL SYSTEMS

     X = slow
     Y = medium
     Z = faster

     None of them is locked to the others.
  */

  axisX.rotation.x =
    t * .34;

  axisY.rotation.y =
    t * .61;

  axisZ.rotation.z =
    t * .92;


  /*
     Slight non-periodic mechanical modulation.
     This prevents the animation from looking like
     three perfectly synchronized UI rings.
  */

  axisX.rotation.z =
    Math.sin(t*.21)*.08;

  axisY.rotation.x =
    Math.sin(t*.31)*.12;

  axisZ.rotation.y =
    Math.cos(t*.43)*.10;


  /*
     Outer holographic system.

     Each ring family moves independently but subtly.
  */

  holoGroup.rotation.z =
    t*.018;

  holoGroup.rotation.x =
    Math.sin(t*.09)*.012;


  /*
     Jewel remains visually alive without becoming
     a red glowing LED.
  */

  const jewelScale =
    .82 +
    Math.sin(t*1.8)*.035;

  centerRuby.scale.setScalar(
    jewelScale
  );


  /*
     Very subtle central breathing of the cyan light.
  */

  coreLight.intensity =
    3.5 +
    Math.sin(t*1.3)*.55;


  renderer.render(
    scene,
    camera
  );
}


animate();


/* ============================================================
   VISIBILITY OPTIMISATION
   ============================================================ */

document.addEventListener(
  "visibilitychange",
  ()=>{
    if(
      document.hidden
    ){
      clock.getDelta();
    }
  }
);

</script>
