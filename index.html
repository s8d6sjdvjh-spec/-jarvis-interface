<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061117">
<title>JARVIS — Holographic Core</title>

<style>
:root{
    --bg:#061117;
    --cyan:#00dcff;
    --cyan2:#68f2ff;
    --blue:#008ca8;
    --violet:#687cff;
    --gold:#c39a4b;
    --white:#e7fbff;
    --voice:0;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    position:relative;
    color:var(--white);
    background:
        radial-gradient(
            ellipse at 50% 42%,
            rgba(0,93,116,.25) 0%,
            rgba(5,46,59,.18) 27%,
            rgba(3,19,26,.45) 52%,
            #02090d 100%
        ),
        #061117;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    -webkit-font-smoothing:antialiased;
}

/* =========================================================
   BACKGROUND
   ========================================================= */

.background{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.background::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
        linear-gradient(
            rgba(69,164,181,.14) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(69,164,181,.14) 1px,
            transparent 1px
        );
    background-size:54px 54px;
}

.background::after{
    content:"";
    position:absolute;
    inset:0;
    background-image:
        linear-gradient(
            rgba(68,153,170,.045) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(68,153,170,.045) 1px,
            transparent 1px
        );
    background-size:13.5px 13.5px;
}

/* =========================================================
   HEADER
   ========================================================= */

.header{
    position:absolute;
    top:calc(env(safe-area-inset-top) + 5vh);
    left:0;
    right:0;
    padding:0 6vw;
    display:flex;
    align-items:center;
    z-index:100;
}

.logo{
    font-size:clamp(23px,6vw,35px);
    font-weight:300;
    letter-spacing:.48em;
    color:#e5faff;
}

.status{
    margin-left:auto;
    display:flex;
    gap:13px;
    align-items:center;
    color:#66939c;
    font-size:clamp(7px,2vw,10px);
    letter-spacing:.22em;
}

.dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--cyan);
    box-shadow:
        0 0 6px var(--cyan),
        0 0 15px rgba(0,220,255,.55);
}

/* =========================================================
   LABELS
   ========================================================= */

.subtitle{
    position:absolute;
    top:calc(env(safe-area-inset-top) + 15.5vh);
    left:0;
    right:0;
    text-align:center;
    font-size:clamp(7px,2.3vw,11px);
    letter-spacing:.43em;
    color:rgba(94,170,182,.82);
    z-index:80;
}

.system-label{
    position:absolute;
    top:calc(env(safe-area-inset-top) + 18vh);
    left:0;
    right:0;
    text-align:center;
    font-size:7px;
    letter-spacing:.34em;
    color:rgba(69,132,143,.65);
    z-index:80;
}

/* =========================================================
   CORE STAGE
   ========================================================= */

.core-stage{
    position:absolute;
    top:calc(env(safe-area-inset-top) + 19.5vh);
    left:50%;
    width:min(94vw,490px);
    height:min(52vh,550px);
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:visible;
    z-index:20;
}

/* =========================================================
   ATMOSPHERIC HALO
   ========================================================= */

.halo{
    position:absolute;
    left:50%;
    top:50%;
    width:94%;
    aspect-ratio:1;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:
        radial-gradient(
            circle,
            rgba(0,225,255,.06) 0%,
            rgba(0,211,255,.09) 25%,
            rgba(0,139,170,.055) 45%,
            transparent 72%
        );
    filter:
        blur(
            calc(
                20px + var(--voice) * 17px
            )
        );
    opacity:
        calc(
            .68 + var(--voice) * .30
        );
    transition:
        opacity 40ms linear,
        filter 40ms linear;
}

/* =========================================================
   RING SYSTEM
   ========================================================= */

.ring-system{
    position:absolute;
    left:50%;
    top:50%;
    width:93%;
    aspect-ratio:1;
    transform:translate(-50%,-50%);
    overflow:visible;
    pointer-events:none;
}

.voice-ring{
    position:absolute;
    left:50%;
    top:50%;
    transform:
        translate(-50%,-50%)
        scale(var(--ring-scale,1));
    transform-origin:center;
    transition:
        transform 35ms cubic-bezier(.04,.94,.13,1);
    will-change:transform;
}

/*
   PLUS COMPACTES AU REPOS.

   La voix les dilate vers l'ancien espace maximal.
*/

.ring-1{
    width:94%;
    height:94%;
}

.ring-2{
    width:78%;
    height:78%;
}

.ring-3{
    width:61%;
    height:61%;
}

.ring-4{
    width:44%;
    height:44%;
}

/* =========================================================
   SVG
   ========================================================= */

.ring-svg{
    width:100%;
    height:100%;
    overflow:visible;
}

/* =========================================================
   ROTATION DES COURONNES
   ========================================================= */

.rotating-main{
    transform-origin:250px 250px;
    animation:
        ringClockwise
        28s
        linear
        infinite;
}

.rotating-main.slow{
    animation-duration:43s;
}

.rotating-main.fast{
    animation-duration:19s;
}

@keyframes ringClockwise{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

/* =========================================================
   CONTRE-ROTATION DES ARCS
   ========================================================= */

.counter-arcs{
    transform-origin:250px 250px;
    animation:
        ringCounter
        15s
        linear
        infinite
}

.counter-arcs.slow{
    animation-duration:31s;
}

@keyframes ringCounter{
    from{
        transform:rotate(360deg);
    }
    to{
        transform:rotate(0deg);
    }
}

/* =========================================================
   HOLOGRAPHIC RINGS
   ========================================================= */

.ring-halo{
    fill:none;
    stroke:rgba(0,218,255,.22);
    stroke-width:9;
    filter:blur(7px);
}

.ring-separator{
    fill:none;
    stroke:rgba(1,23,30,.94);
    stroke-width:4;
}

.ring-thick{
    fill:none;
    stroke:rgba(61,229,246,.78);
    stroke-width:2.6;
    filter:
        drop-shadow(
            0 0 3px
            rgba(89,241,255,.95)
        )
        drop-shadow(
            0 0 9px
            rgba(0,207,255,.42)
        );
}

.ring-inner{
    fill:none;
    stroke:rgba(106,238,255,.50);
    stroke-width:1.1;
}

.ring-dash{
    fill:none;
    stroke:rgba(36,190,215,.78);
    stroke-width:1;
    stroke-dasharray:2 7;
}

.ring-gold{
    fill:none;
    stroke:rgba(194,151,69,.78);
    stroke-width:1.7;
    filter:
        drop-shadow(
            0 0 4px
            rgba(197,151,65,.35)
        );
}

.ring-violet{
    fill:none;
    stroke:rgba(111,133,255,.65);
    stroke-width:1;
}

.tick{
    stroke:rgba(96,207,223,.68);
    stroke-width:.8;
}

.tick-major{
    stroke:rgba(218,248,252,.92);
    stroke-width:1.55;
    filter:
        drop-shadow(
            0 0 3px
            rgba(99,232,248,.55)
        );
}

.tick-gold{
    stroke:rgba(201,156,70,.78);
    stroke-width:1;
}

.ring-number{
    fill:rgba(166,230,239,.80);
    font-size:10px;
    font-weight:300;
    letter-spacing:.08em;
}

.ring-label{
    fill:rgba(80,163,176,.74);
    font-size:6.5px;
    letter-spacing:.2em;
}

/* =========================================================
   POLYGON ORB
   ========================================================= */

.orb{
    position:absolute;
    left:50%;
    top:50%;
    width:clamp(82px,20vw,108px);
    aspect-ratio:1;
    transform:
        translate(-50%,-50%)
        scale(1);
    z-index:40;
    transition:
        transform 32ms cubic-bezier(.03,.95,.12,1);
}

/*
   Noyau sombre.
*/

.orb-core{
    position:absolute;
    inset:9%;
    border-radius:50%;
    background:
        radial-gradient(
            circle at 31% 26%,
            #d9fbff 0%,
            #4ee1f3 4%,
            #0d8ba8 15%,
            #064252 34%,
            #021923 62%,
            #01080c 100%
        );
    border:
        1px solid
        rgba(107,239,252,.86);
    box-shadow:
        inset -15px -18px 27px rgba(0,0,0,.82),
        inset 9px 7px 20px rgba(100,232,247,.28),
        0 0 17px rgba(0,220,255,.45),
        0 0 60px rgba(0,153,187,.28);
}

/*
   Couche polygonale.
*/

.polygon-shell{
    position:absolute;
    inset:0;
    transform-origin:center;
    animation:
        polygonSpin
        24s
        linear
        infinite;
}

@keyframes polygonSpin{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

/*
   Les facettes.
*/

.facet{
    position:absolute;
    left:50%;
    top:50%;
    width:72%;
    height:72%;
    transform-origin:center;
    border:1px solid rgba(83,232,249,.72);
    clip-path:
        polygon(
            50% 0%,
            93% 23%,
            100% 68%,
            67% 100%,
            25% 89%,
            0% 51%,
            19% 15%
        );
    background:
        linear-gradient(
            135deg,
            rgba(155,247,255,.15),
            rgba(7,88,108,.05) 42%,
            rgba(0,10,17,.32)
        );
    box-shadow:
        0 0 8px
        rgba(0,215,255,.16);
    transition:
        transform 45ms cubic-bezier(.04,.94,.12,1),
        opacity 45ms linear;
}

/*
   Chaque facette s'écarte légèrement
   lorsque la voix augmente.
*/

.f1{
    transform:
        translate(-50%,-50%)
        rotate(0deg)
        translateY(
            calc(
                var(--voice) * -5px
            )
        )
        scale(
            calc(
                1 + var(--voice) * .11
            )
        );
}

.f2{
    transform:
        translate(-50%,-50%)
        rotate(51deg)
        translateY(
            calc(
                var(--voice) * -6px
            )
        )
        scale(
            calc(
                1 + var(--voice) * .13
            )
        );
}

.f3{
    transform:
        translate(-50%,-50%)
        rotate(102deg)
        translateY(
            calc(
                var(--voice) * -5px
            )
        )
        scale(
            calc(
                1 + var(--voice) * .09
            )
        );
}

.f4{
    transform:
        translate(-50%,-50%)
        rotate(153deg)
        translateY(
            calc(
                var(--voice) * -7px
            )
        )
        scale(
            calc(
                1 + var(--voice) * .12
            )
        );
}

.f5{
    transform:
        translate(-50%,-50%)
        rotate(204deg)
        translateY(
            calc(
                var(--voice) * -5px
            )
        )
        scale(
            calc(
                1 + var(--voice) * .10
            )
        );
}

.f6{
    transform:
        translate(-50%,-50%)
        rotate(255deg)
        translateY(
            calc(
                var(--voice) * -6px
            )
        )
        scale(
            calc(
                1 + var(--voice) * .12
            )
        );
}

.f7{
    transform:
        translate(-50%,-50%)
        rotate(306deg)
        translateY(
            calc(
                var(--voice) * -5px
            )
        )
        scale(
            calc(
                1 + var(--voice) * .10
            )
        );
}


/* =========================================================
   SECONDARY POLYGON
   ========================================================= */

.polygon-inner{
    position:absolute;
    inset:20%;
    border:
        1px solid
        rgba(101,232,247,.55);
    clip-path:
        polygon(
            50% 0%,
            90% 20%,
            100% 61%,
            70% 100%,
            28% 90%,
            0% 51%,
            15% 17%
        );
    transform:
        rotate(23deg);
    background:
        rgba(10,118,142,.08);
}


/* =========================================================
   ORB LIGHT
   ========================================================= */

.orb-light{
    position:absolute;
    left:18%;
    top:14%;
    width:18%;
    height:18%;
    border-radius:50%;
    background:
        rgba(232,254,255,.98);
    filter:blur(4px);
    box-shadow:
        0 0 14px
        rgba(123,242,255,.95),
        0 0 31px
        rgba(0,218,255,.62);
}


/* =========================================================
   ORB TEXT
   ========================================================= */

.orb-text{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:20;
    pointer-events:none;
}

.core-title{
    font-size:10px;
    letter-spacing:.40em;
    padding-left:.40em;
    color:rgba(225,250,253,.95);
}

.core-state{
    margin-top:6px;
    font-size:6px;
    letter-spacing:.30em;
    padding-left:.30em;
    color:rgba(81,187,201,.86);
}


/* =========================================================
   AUDIO WAVE
   ========================================================= */

.audio-wave{
    position:absolute;
    bottom:1%;
    left:50%;
    width:55%;
    height:34px;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:3px;
    z-index:70;
}

.audio-bar{
    width:2px;
    height:4px;
    background:var(--cyan);
    box-shadow:
        0 0 6px
        rgba(0,220,255,.75);
    transition:
        height 30ms linear;
}


/* =========================================================
   TRANSCRIPTION
   ========================================================= */

.voice-output{
    position:absolute;
    left:7vw;
    right:7vw;
    top:calc(env(safe-area-inset-top) + 70vh);
    min-height:47px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px 18px;
    border-left:
        1px solid
        rgba(0,214,240,.55);
    border-right:
        1px solid
        rgba(0,214,240,.27);
    background:
        linear-gradient(
            90deg,
            rgba(0,61,76,.08),
            rgba(0,135,159,.12),
            rgba(0,61,76,.08)
        );
    z-index:90;
}

.voice-text{
    text-align:center;
    font-size:clamp(8px,2.4vw,11px);
    letter-spacing:.17em;
    color:rgba(177,234,241,.76);
    text-transform:uppercase;
}


/* =========================================================
   BUTTONS
   ========================================================= */

.controls{
    position:absolute;
    left:5vw;
    right:5vw;
    bottom:
        calc(
            env(safe-area-inset-bottom)
            + 5vh
        );
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    z-index:100;
}

.control{
    height:55px;
    border:
        1px solid
        rgba(0,199,224,.58);
    background:
        rgba(3,21,28,.78);
    color:
        rgba(159,226,234,.92);
    font-family:inherit;
    font-size:clamp(7px,2vw,9px);
    letter-spacing:.18em;
    cursor:pointer;
}

.control.active,
.control:active{
    border-color:
        rgba(91,240,255,.98);
    background:
        rgba(0,104,126,.26);
    box-shadow:
        inset
        0 0 18px
        rgba(0,220,255,.10),
        0 0 16px
        rgba(0,220,255,.18);
    color:#e4fbff;
}


@media(max-width:430px){

    .header{
        padding-left:5.5vw;
        padding-right:5.5vw;
    }

    .status{
        gap:8px;
    }

    .core-stage{
        width:97vw;
    }

    .ring-system{
        width:96%;
    }
}

</style>
</head>

>

ACTIVER<br>MICRO

ENVOYER<br>RACCOURCIS

>
VOIX<br>JARVIS
</button>

<script>

/* =========================================================
   JARVIS AUDIO ENGINE
   ========================================================= */

const orb =
    document.getElementById(
        "orb"
    );

const coreState =
    document.getElementById(
        "coreState"
    );

const voiceText =
    document.getElementById(
        "voiceText"
    );

const microButton =
    document.getElementById(
        "microButton"
    );

const shortcutButton =
    document.getElementById(
        "shortcutButton"
    );

const speakButton =
    document.getElementById(
        "speakButton"
    );

const audioWave =
    document.getElementById(
        "audioWave"
    );


const rings =
    [
        ...document.querySelectorAll(
            ".voice-ring"
        )
    ];


let audioContext =
    null;

let analyser =
    null;

let microphoneSource =
    null;

let microphoneStream =
    null;

let audioActive =
    false;

let animationRunning =
    false;


let visualLevel =
    0;

let targetLevel =
    0;


let recognition =
    null;

let finalTranscript =
    "";


/* =========================================================
   AUDIO BARS
   ========================================================= */

for(
    let i=0;
    i<31;
    i++
){

    const bar =
        document.createElement(
            "div"
        );

    bar.className =
        "audio-bar";

    audioWave.appendChild(
        bar
    );
}


const bars =
    [
        ...document.querySelectorAll(
            ".audio-bar"
        )
    ];


/* =========================================================
   TICKS
   ========================================================= */

function createTicks(
    id,
    count,
    radius,
    majorEvery
){

    const group =
        document.getElementById(
            id
        );

    if(!group){
        return;
    }


    const ns =
        "http://www.w3.org/2000/svg";


    for(
        let i=0;
        i<count;
        i++
    ){

        const angle =
            i /
            count *
            Math.PI *
            2;


        const major =
            i %
            majorEvery ===
            0;


        const inner =
            radius -
            (
                major
                ? 14
                : 7
            );


        const x1 =
            250 +
            Math.cos(angle) *
            inner;


        const y1 =
            250 +
            Math.sin(angle) *
            inner;


        const x2 =
            250 +
            Math.cos(angle) *
            radius;


        const y2 =
            250 +
            Math.sin(angle) *
            radius;


        const line =
            document.createElementNS(
                ns,
                "line"
            );


        line.setAttribute(
            "x1",
            x1
        );

        line.setAttribute(
            "y1",
            y1
        );

        line.setAttribute(
            "x2",
            x2
        );

        line.setAttribute(
            "y2",
            y2
        );


        line.setAttribute(
            "class",
            major
            ? "tick-major"
            : (
                i % 3 === 0
                ? "tick-gold"
                : "tick"
            )
        );


        group.appendChild(
            line
        );
    }
}


createTicks(
    "ticks1",
    112,
    237,
    8
);

createTicks(
    "ticks2",
    96,
    200,
    8
);

createTicks(
    "ticks3",
    80,
    158,
    8
);

createTicks(
    "ticks4",
    64,
    114,
    8
);


/* =========================================================
   MICROPHONE
   ========================================================= */

async function startMicrophone(){

    if(audioActive){
        return;
    }


    try{

        microphoneStream =
            await navigator
            .mediaDevices
            .getUserMedia({
                audio:{
                    echoCancellation:true,
                    noiseSuppression:true,
                    autoGainControl:true
                }
            });


        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        analyser =
            audioContext
            .createAnalyser();


        analyser.fftSize =
            256;

        analyser.smoothingTimeConstant =
            .38;


        microphoneSource =
            audioContext
            .createMediaStreamSource(
                microphoneStream
            );


        microphoneSource.connect(
            analyser
        );


        audioActive =
            true;


        microButton.classList.add(
            "active"
        );


        microButton.innerHTML =
            "MICRO<br>ACTIF";


        coreState.textContent =
            "LISTENING";


        startVisualEngine();

        startRecognition();

    }catch(error){

        console.error(
            error
        );

        voiceText.textContent =
            "ACCÈS MICROPHONE REFUSÉ";

        coreState.textContent =
            "MIC ERROR";
    }
}


/* =========================================================
   STOP
   ========================================================= */

function stopMicrophone(){

    if(
        microphoneStream
    ){

        microphoneStream
        .getTracks()
        .forEach(
            track =>
                track.stop()
        );
    }


    if(
        microphoneSource
    ){

        microphoneSource.disconnect();

        microphoneSource =
            null;
    }


    if(
        audioContext
    ){

        audioContext.close();

        audioContext =
            null;
    }


    analyser =
        null;

    audioActive =
        false;

    visualLevel =
        0;

    targetLevel =
        0;


    rings.forEach(
        ring =>
            ring.style.setProperty(
                "--ring-scale",
                "1"
            )
    );


    document.documentElement
        .style
        .setProperty(
            "--voice",
            "0"
        );


    orb.style.transform =
        "translate(-50%,-50%) scale(1)";


    microButton.classList.remove(
        "active"
    );

    microButton.innerHTML =
        "ACTIVER<br>MICRO";


    coreState.textContent =
        "READY";
}


/* =========================================================
   VISUAL ENGINE
   ========================================================= */

function startVisualEngine(){

    if(animationRunning){
        return;
    }


    animationRunning =
        true;


    requestAnimationFrame(
        updateVisuals
    );
}


function updateVisuals(){

    if(
        !audioActive ||
        !analyser
    ){

        animationRunning =
            false;

        return;
    }


    const data =
        new Uint8Array(
            analyser.frequencyBinCount
        );


    analyser.getByteFrequencyData(
        data
    );


    let sum =
        0;

    let count =
        0;


    for(
        let i=2;
        i<46;
        i++
    ){

        sum +=
            data[i];

        count++;
    }


    const average =
        sum / count;


    targetLevel =
        Math.min(
            average / 70,
            1
        );


    /*
       ATTAQUE RAPIDE.
    */

    if(
        targetLevel >
        visualLevel
    ){

        visualLevel +=
            (
                targetLevel -
                visualLevel
            ) *
            .48;

    }else{

        visualLevel +=
            (
                targetLevel -
                visualLevel
            ) *
            .16;
    }


    if(
        visualLevel <
        .015
    ){

        visualLevel =
            0;
    }


    document.documentElement
        .style
        .setProperty(
            "--voice",
            visualLevel
        );


    /* =====================================================
       RINGS

       Au repos : compacts.

       À voix maximale :
       retour presque exactement à l'espace
       occupé par la version précédente.
    ===================================================== */


    const maximumExpansion =
        .075;


    const scales = [

        1 +
        visualLevel *
        maximumExpansion,

        1 +
        visualLevel *
        maximumExpansion,

        1 +
        visualLevel *
        maximumExpansion,

        1 +
        visualLevel *
        maximumExpansion
    ];


    rings.forEach(
        (
            ring,
            index
        ) => {

            ring.style.setProperty(
                "--ring-scale",
                scales[index]
            );
        }
    );


    /* =====================================================
       ORB BEAT
    ===================================================== */


    const orbScale =
        1 +
        visualLevel *
        .18;


    orb.style.transform =
        `
        translate(-50%,-50%)
        scale(${orbScale})
        `;


    /* =====================================================
       AUDIO BARS
    ===================================================== */

    bars.forEach(
        (
            bar,
            index
        ) => {

            const position =
                index /
                (
                    bars.length -
                    1
                );


            const frequency =
                Math.floor(
                    position *
                    55
                );


            const value =
                data[
                    frequency
                ] || 0;


            const local =
                value /
                255;


            const height =
                3 +
                local *
                28 *
                (
                    .5 +
                    visualLevel *
                    2
                );


            bar.style.height =
                `${height}px`;
        }
    );


    /* =====================================================
       ORB LIGHT
    ===================================================== */

    const glow =
        18 +
        visualLevel *
        48;


    const deep =
        60 +
        visualLevel *
        145;


    const core =
        0.45 +
        visualLevel *
        .3;


    orb.querySelector(
        ".orb-core"
    ).style.boxShadow = `

        inset
        -15px -18px 27px
        rgba(0,0,0,.82),

        inset
        9px 7px 20px
        rgba(100,232,247,.30),

        0 0 ${glow}px
        rgba(0,220,255,${core}),

        0 0 ${deep}px
        rgba(0,153,187,.34)
    `;


    /* =====================================================
       STATE
    ===================================================== */

    coreState.textContent =
        visualLevel > .06
        ? "LISTENING"
        : "READY";


    requestAnimationFrame(
        updateVisuals
    );
}


/* =========================================================
   SPEECH RECOGNITION
   ========================================================= */

function startRecognition(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(
        !SpeechRecognition
    ){

        voiceText.textContent =
            "RECONNAISSANCE VOCALE INDISPONIBLE";

        return;
    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "fr-FR";


    recognition.continuous =
        true;


    recognition.interimResults =
        true;


    recognition.onresult =
        event => {

            let interim =
                "";

            let finalText =
                "";


            for(
                let i =
                    event.resultIndex;

                i <
                    event.results.length;

                i++
            ){

                const result =
                    event.results[i];


                const text =
                    result[0]
                    .transcript;


                if(
                    result.isFinal
                ){

                    finalText +=
                        text +
                        " ";

                }else{

                    interim +=
                        text;
                }
            }


            if(finalText){

                finalTranscript +=
                    finalText;
            }


            const display =
                (
                    finalTranscript +
                    interim
                ).trim();


            if(display){

                voiceText.textContent =
                    display.toUpperCase();
            }
        };


    recognition.onerror =
        error => {

            console.log(
                error
            );
        };


    recognition.onend =
        () => {

            if(
                audioActive
            ){

                setTimeout(
                    () => {

                        try{
                            recognition.start();
                        }catch(e){}

                    },
                    250
                );
            }
        };


    try{

        recognition.start();

    }catch(error){

        console.log(
            error
        );
    }
}


/* =========================================================
   SHORTCUTS
   ========================================================= */

function sendToShortcuts(){

    const command =
        finalTranscript.trim();


    if(
        !command
    ){

        return;
    }


    const url =
        "shortcuts://run-shortcut?name=" +
        encodeURIComponent(
            "JARVIS"
        ) +
        "&input=" +
        encodeURIComponent(
            command
        );


    window.location.href =
        url;
}


/* =========================================================
   SYNTHÈSE VOCALE
   ========================================================= */

function speakJarvis(){

    if(
        !("speechSynthesis" in window)
    ){

        return;
    }


    const text =
        finalTranscript.trim() ||
        "Je suis prêt. Quelle est votre commande ?";


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "fr-FR";

    utterance.rate =
        .9;

    utterance.pitch =
        .72;

    utterance.volume =
        .95;


    const voices =
        window.speechSynthesis
        .getVoices();


    const french =
        voices.find(
            voice =>
                voice.lang
                .toLowerCase()
                .startsWith("fr")
        );


    if(french){

        utterance.voice =
            french;
    }


    utterance.onstart =
        () => {

            coreState.textContent =
                "SPEAKING";

            speakButton.classList.add(
                "active"
            );
        };


    utterance.onend =
        () => {

            coreState.textContent =
                "READY";

            speakButton.classList.remove(
                "active"
            );
        };


    window.speechSynthesis.speak(
        utterance
    );
}


/* =========================================================
   BUTTONS
   ========================================================= */

microButton.addEventListener(
    "click",
    async () => {

        if(
            audioActive
        ){

            stopMicrophone();

        }else{

            await startMicrophone();
        }
    }
);


shortcutButton.addEventListener(
    "click",
    sendToShortcuts
);


speakButton.addEventListener(
    "click",
    speakJarvis
);


orb.addEventListener(
    "click",
    async () => {

        if(
            !audioActive
        ){

            await startMicrophone();

        }else{

            speakJarvis();
        }
    }
);


/* =========================================================
   INITIAL
   ========================================================= */

coreState.textContent =
    "READY";

voiceText.textContent =
    "EN ATTENTE DE COMMANDE";

</script>
