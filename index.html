<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,
               viewport-fit=cover,user-scalable=no">

<title>JARVIS — Voice Core</title>

<style>
:root{
    --bg:#02090d;
    --grid:#0b2b35;
    --cyan:#21d9ff;
    --cyan2:#7cecff;
    --blue:#3d8dff;
    --violet:#8b73ff;
    --gold:#c9a04a;
    --white:#d9faff;
    --muted:#47717c;
    --panel:#04151b;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--white);
    font-family:
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
}

body{
    position:fixed;
    inset:0;
}

/* =========================================================
   MAIN FRAME
========================================================= */

#app{
    position:relative;
    width:100%;
    height:100%;
    min-height:100dvh;
    overflow:hidden;
    background:
        radial-gradient(
            ellipse at 50% 45%,
            rgba(0,91,112,.20) 0%,
            rgba(0,25,32,.12) 35%,
            rgba(0,0,0,0) 70%
        ),
        #02090d;
}

/* Fine technical grid */

#app::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;

    background-image:
        linear-gradient(
            rgba(35,145,165,.105) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(35,145,165,.105) 1px,
            transparent 1px
        );

    background-size:
        34px 34px,
        34px 34px;

    opacity:.78;
}

#app::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;

    background:
        radial-gradient(
            circle at 50% 48%,
            transparent 0 34%,
            rgba(0,0,0,.12) 58%,
            rgba(0,0,0,.48) 100%
        );

    z-index:3;
}

/* =========================================================
   HEADER
========================================================= */

.header{
    position:absolute;
    z-index:20;
    top:0;
    left:0;
    width:100%;
    height:13.5dvh;

    padding:
        max(4.5dvh,env(safe-area-inset-top))
        5.5vw 0;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    font-size:clamp(25px,7vw,38px);
    font-weight:300;
    letter-spacing:.30em;
    white-space:nowrap;
}

.status{
    display:flex;
    align-items:center;
    gap:4vw;
    font-size:9px;
    letter-spacing:.31em;
    color:#6d949d;
    white-space:nowrap;
}

.statusItem{
    display:flex;
    align-items:center;
    gap:7px;
}

.statusDot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#1fdcff;
    box-shadow:
        0 0 7px #1fdcff,
        0 0 17px rgba(31,220,255,.7);
}

/* =========================================================
   TITLES
========================================================= */

.titleBlock{
    position:absolute;
    z-index:20;
    top:15.5dvh;
    left:0;
    width:100%;
    text-align:center;
    pointer-events:none;
}

.title{
    font-size:clamp(11px,3.2vw,16px);
    letter-spacing:.38em;
    color:#6797a2;
    text-transform:uppercase;
}

.subtitle{
    margin-top:13px;
    font-size:8px;
    letter-spacing:.34em;
    color:#365a63;
    text-transform:uppercase;
}

/* =========================================================
   CORE VISUAL
========================================================= */

.coreStage{
    position:absolute;
    z-index:5;

    left:0;
    top:20dvh;

    width:100%;
    height:51dvh;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;
}

#coreCanvas{
    display:block;
    width:100%;
    height:100%;
}

/* =========================================================
   TRANSCRIPT
========================================================= */

.voicePanel{
    position:absolute;
    z-index:20;

    left:5vw;
    right:5vw;
    top:72.5dvh;
    height:9.5dvh;

    border-top:1px solid rgba(31,214,255,.45);
    border-bottom:1px solid rgba(31,214,255,.28);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(0,50,61,.12),
            transparent
        );

    pointer-events:none;
}

.voiceState{
    font-size:9px;
    letter-spacing:.32em;
    color:#67a8b5;
    text-transform:uppercase;
}

.transcript{
    margin-top:8px;

    max-width:90%;
    overflow:hidden;

    font-size:14px;
    font-weight:300;
    letter-spacing:.08em;

    color:#d9fbff;

    white-space:nowrap;
    text-overflow:ellipsis;

    text-shadow:
        0 0 10px rgba(35,220,255,.35);
}

/* =========================================================
   AUDIO LEVEL
========================================================= */

.audioMeter{
    position:absolute;
    z-index:21;

    top:84dvh;
    left:50%;
    transform:translateX(-50%);

    width:44vw;
    max-width:260px;
    height:14px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:3px;

    pointer-events:none;
}

.audioBar{
    width:3px;
    height:5px;

    background:#20dfff;

    box-shadow:
        0 0 5px #20dfff,
        0 0 12px rgba(32,223,255,.6);

    transform-origin:center;
    transition:height .05s linear;
}

/* =========================================================
   CONTROLS
========================================================= */

.controls{
    position:absolute;
    z-index:30;

    left:4.5vw;
    right:4.5vw;
    bottom:max(5.8dvh,env(safe-area-inset-bottom));

    height:8.8dvh;

    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:2.4vw;
}

.control{
    appearance:none;
    border:1px solid rgba(31,218,255,.60);

    background:
        linear-gradient(
            180deg,
            rgba(7,39,48,.66),
            rgba(1,17,23,.72)
        );

    color:#9bdce6;

    font-family:inherit;

    letter-spacing:.20em;
    font-size:9px;
    text-transform:uppercase;

    position:relative;
    overflow:hidden;

    transition:
        transform .15s ease,
        border-color .15s ease,
        background .15s ease;

    -webkit-user-select:none;
    user-select:none;
}

.control::before{
    content:"";
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(34,222,255,.09),
            transparent
        );

    transform:translateX(-100%);
}

.control:active{
    transform:scale(.97);
    border-color:#6ff0ff;
    background:rgba(9,61,73,.8);
}

.control.active{
    border-color:#61efff;

    box-shadow:
        0 0 10px rgba(31,220,255,.25),
        inset 0 0 18px rgba(31,220,255,.06);

    color:#d9fbff;
}

.controlIcon{
    display:block;
    font-size:17px;
    margin-bottom:5px;
}

.smallNote{
    position:absolute;
    z-index:25;

    left:0;
    width:100%;

    bottom:1.8dvh;

    text-align:center;

    font-size:6px;
    letter-spacing:.30em;
    color:#274a53;
}

/* =========================================================
   DESKTOP SAFETY
========================================================= */

@media(min-width:700px){

    .coreStage{
        height:53dvh;
        top:19dvh;
    }

    .voicePanel{
        top:72dvh;
    }

    .controls{
        max-width:620px;
        margin:auto;
        left:50%;
        right:auto;
        width:620px;
        transform:translateX(-50%);
    }

    .header{
        padding-left:4vw;
        padding-right:4vw;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- =====================================================

    <header class="header">

        <div class="brand">

        </div>

    <!-- =====================================================
         AUDIO METER
    ====================================================== -->

    <div class="audioMeter" id="audioMeter">

        <span class="audioBar"></span>
        <span class="audioBar"></span>
        <span class="audioBar"></span>
        <span class="audioBar"></span>
        <span class="audioBar"></span>
        <span class="audioBar"></span>
        <span class="audioBar"></span>
        <span class="audioBar"></span>
        <span class="audioBar"></span>
        <span class="audioBar"></span>
        <span class="audioBar"></span>
        <span class="audioBar"></span>
        <span class="audioBar"></span>
        <span class="audioBar"></span>
        <span class="audioBar"></span>
        <span class="audioBar"></span>
        <span class="audioBar"></span>
        <span class="audioBar"></span>
        <span class="audioBar"></span>
        <span class="audioBar"></span>

            VOIX

<script>
"use strict";

/* =========================================================
   JARVIS CORE ENGINE
   =========================================================

   Principes :

   1. Le centre ne bouge jamais.
   2. Les quatre couronnes partagent exactement le même centre.
   3. La voix modifie leur rayon, pas leur position.
   4. Les rotations sont uniquement angulaires.
   5. La géode reste centrée.
   6. Les informations sont générées radialement.
   7. Aucun objet n'est autorisé à sortir de la zone du core.
========================================================= */


/* =========================================================
   DOM
========================================================= */

const canvas =
    document.getElementById("coreCanvas");

const ctx =
    canvas.getContext("2d");

const micButton =
    document.getElementById("micButton");

const shortcutButton =
    document.getElementById("shortcutButton");

const speakButton =
    document.getElementById("speakButton");

const transcript =
    document.getElementById("transcript");

const voiceState =
    document.getElementById("voiceState");

const audioBars =
    [...document.querySelectorAll(".audioBar")];


/* =========================================================
   CANVAS
========================================================= */

let W = 0;
let H = 0;
let DPR = 1;

function resizeCanvas(){

    const rect =
        canvas.getBoundingClientRect();

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W = rect.width;
    H = rect.height;

    canvas.width =
        Math.round(W * DPR);

    canvas.height =
        Math.round(H * DPR);

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resizeCanvas,
    {passive:true}
);

resizeCanvas();


/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;
let analyser = null;
let microphoneSource = null;
let audioData = null;

let audioLevel = 0;
let smoothedAudio = 0;

async function startMicrophone(){

    if(analyser){
        return;
    }

    try{

        const stream =
            await navigator.mediaDevices.getUserMedia({
                audio:{
                    echoCancellation:true,
                    noiseSuppression:true,
                    autoGainControl:true
                }
            });

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        microphoneSource =
            audioContext.createMediaStreamSource(
                stream
            );

        analyser =
            audioContext.createAnalyser();

        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = .72;

        audioData =
            new Uint8Array(
                analyser.fftSize
            );

        microphoneSource.connect(
            analyser
        );

        micButton.classList.add("active");

        voiceState.textContent =
            "VOICE SYSTEM · LISTENING";

    }catch(error){

        console.error(error);

        voiceState.textContent =
            "MICROPHONE UNAVAILABLE";

    }
}


function updateAudio(){

    if(!analyser){

        audioLevel *= .92;
        return;
    }

    analyser.getByteTimeDomainData(
        audioData
    );

    let sum = 0;

    for(
        let i = 0;
        i < audioData.length;
        i++
    ){

        const v =
            (audioData[i] - 128) / 128;

        sum += v * v;
    }

    const rms =
        Math.sqrt(
            sum / audioData.length
        );

    const normalized =
        Math.min(
            1,
            rms * 5.2
        );

    audioLevel =
        audioLevel * .72 +
        normalized * .28;

    smoothedAudio =
        smoothedAudio * .82 +
        audioLevel * .18;
}


/* =========================================================
   AUDIO METER
========================================================= */

function updateAudioBars(){

    const level =
        Math.max(
            .04,
            smoothedAudio
        );

    audioBars.forEach(
        (bar,index)=>{

            const center =
                Math.abs(
                    index -
                    (audioBars.length-1)/2
                );

            const envelope =
                Math.max(
                    .15,
                    1 - center /
                    (audioBars.length/2)
                );

            const variation =
                Math.sin(
                    time * .012 +
                    index * .8
                ) * .08;

            const h =
                4 +
                level *
                38 *
                envelope +
                variation *
                20;

            bar.style.height =
                Math.max(
                    4,
                    h
                ) + "px";
        }
    );
}


/* =========================================================
   DRAWING HELPERS
========================================================= */

function polar(
    cx,
    cy,
    radius,
    angle
){

    return {
        x:
            cx +
            Math.cos(angle) *
            radius,

        y:
            cy +
            Math.sin(angle) *
            radius
    };
}


function line(
    x1,
    y1,
    x2,
    y2,
    color,
    width=1,
    alpha=1
){

    ctx.save();

    ctx.globalAlpha =
        alpha;

    ctx.strokeStyle =
        color;

    ctx.lineWidth =
        width;

    ctx.beginPath();

    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);

    ctx.stroke();

    ctx.restore();
}


function circle(
    cx,
    cy,
    radius,
    stroke,
    width=1,
    alpha=1
){

    ctx.save();

    ctx.globalAlpha =
        alpha;

    ctx.strokeStyle =
        stroke;

    ctx.lineWidth =
        width;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radius,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.restore();
}


function arc(
    cx,
    cy,
    radius,
    start,
    end,
    color,
    width=1,
    alpha=1
){

    ctx.save();

    ctx.globalAlpha =
        alpha;

    ctx.strokeStyle =
        color;

    ctx.lineWidth =
        width;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radius,
        start,
        end
    );

    ctx.stroke();

    ctx.restore();
}


/* =========================================================
   TEXT ALONG RADIAL POSITION
========================================================= */

function radialText(
    text,
    cx,
    cy,
    radius,
    angle,
    color,
    size,
    alpha=1
){

    const p =
        polar(
            cx,
            cy,
            radius,
            angle
        );

    ctx.save();

    ctx.translate(
        p.x,
        p.y
    );

    ctx.rotate(
        angle + Math.PI/2
    );

    ctx.globalAlpha =
        alpha;

    ctx.fillStyle =
        color;

    ctx.font =
        `${size}px monospace`;

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        text,
        0,
        0
    );

    ctx.restore();
}


/* =========================================================
   TECHNICAL GRID INSIDE CORE
========================================================= */

function drawCoreGrid(
    cx,
    cy,
    radius
){

    ctx.save();

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radius,
        0,
        Math.PI*2
    );

    ctx.clip();

    const step =
        Math.max(
            12,
            radius / 9
        );

    ctx.strokeStyle =
        "rgba(29,165,190,.08)";

    ctx.lineWidth =
        .6;

    for(
        let x = cx-radius;
        x <= cx+radius;
        x += step
    ){

        line(
            x,
            cy-radius,
            x,
            cy+radius,
            "#1a8395",
            .55,
            .25
        );
    }

    for(
        let y = cy-radius;
        y <= cy+radius;
        y += step
    ){

        line(
            cx-radius,
            y,
            cx+radius,
            y,
            "#1a8395",
            .55,
            .25
        );
    }

    ctx.restore();
}


/* =========================================================
   RING DEFINITIONS
========================================================= */

const rings = [

    {
        base:.205,
        rotation:.00055,
        phase:0,
        cyan:"#37eaff",
        secondary:"#6f83ff"
    },

    {
        base:.335,
        rotation:-.00034,
        phase:1.7,
        cyan:"#28dfff",
        secondary:"#b28aff"
    },

    {
        base:.465,
        rotation:.00022,
        phase:3.2,
        cyan:"#1ed6f2",
        secondary:"#caa14b"
    },

    {
        base:.595,
        rotation:-.00016,
        phase:4.8,
        cyan:"#46e9ff",
        secondary:"#b89753"
    }

];


/* =========================================================
   RING RENDERER
========================================================= */

function drawRing(
    ring,
    cx,
    cy,
    coreRadius,
    index
){

    /*
       Audio expansion is deliberately constrained.

       The rings never translate.
       They only increase their radius.
    */

    const breathing =
        smoothedAudio *
        (index + 1) *
        coreRadius *
        .026;

    const radius =
        coreRadius *
        ring.base +
        breathing;

    const rotation =
        time *
        ring.rotation +
        ring.phase;

    /* Main holographic body */

    circle(
        cx,
        cy,
        radius,
        ring.cyan,
        1.7,
        .82
    );

    circle(
        cx,
        cy,
        radius + 3,
        ring.cyan,
        .55,
        .30
    );

    circle(
        cx,
        cy,
        radius - 4,
        ring.cyan,
        .45,
        .34
    );

    /* Secondary information track */

    circle(
        cx,
        cy,
        radius - 9,
        "#38bfd4",
        .55,
        .55
    );

    circle(
        cx,
        cy,
        radius - 17,
        "#276e7c",
        .45,
        .55
    );

    /* Counter rotating arcs */

    const arcDirection =
        index % 2 === 0
        ? 1
        : -1;

    for(
        let a=0;
        a<5;
        a++
    ){

        const start =
            rotation *
            arcDirection +
            a *
            1.18;

        const length =
            .34 +
            index * .045;

        arc(
            cx,
            cy,
            radius - 11,
            start,
            start + length,
            ring.secondary,
            1.5,
            .72
        );

        arc(
            cx,
            cy,
            radius - 24,
            -start * .8,
            -start * .8 + length*.75,
            ring.cyan,
            1,
            .55
        );
    }

    /* Major graduations */

    const majorTicks = 24;

    for(
        let i=0;
        i<majorTicks;
        i++
    ){

        const angle =
            rotation +
            i *
            Math.PI*2 /
            majorTicks;

        const outer =
            radius - 1;

        const inner =
            radius -
            (i % 3 === 0 ? 13 : 8);

        const p1 =
            polar(
                cx,
                cy,
                inner,
                angle
            );

        const p2 =
            polar(
                cx,
                cy,
                outer,
                angle
            );

        line(
            p1.x,
            p1.y,
            p2.x,
            p2.y,
            i % 6 === 0
                ? "#e1fbff"
                : ring.cyan,
            i % 6 === 0
                ? 1.25
                : .65,
            i % 6 === 0
                ? .88
                : .62
        );
    }

    /* Micro graduations */

    const micro =
        96;

    for(
        let i=0;
        i<micro;
        i++
    ){

        const angle =
            rotation +
            i *
            Math.PI*2 /
            micro;

        const len =
            i % 4 === 0
            ? 5
            : 2.5;

        const p1 =
            polar(
                cx,
                cy,
                radius - 1,
                angle
            );

        const p2 =
            polar(
                cx,
                cy,
                radius - len,
                angle
            );

        line(
            p1.x,
            p1.y,
            p2.x,
            p2.y,
            "#79d8e5",
            .5,
            .48
        );
    }

    /* Numerical information */

    const numbers = [
        "000","030","060","090",
        "120","150","180","210",
        "240","270","300","330"
    ];

    numbers.forEach(
        (value,i)=>{

            const angle =
                rotation +
                i *
                Math.PI*2 /
                numbers.length;

            radialText(
                value,
                cx,
                cy,
                radius - 31,
                angle,
                "#86bbc4",
                Math.max(
                    7,
                    coreRadius*.023
                ),
                .72
            );
        }
    );

    /* Information artifacts */

    for(
        let i=0;
        i<18;
        i++
    ){

        const angle =
            rotation * 1.4 +
            i *
            Math.PI*2 /
            18;

        const rr =
            radius -
            34 -
            (i%3)*7;

        const p =
            polar(
                cx,
                cy,
                rr,
                angle
            );

        ctx.save();

        ctx.translate(
            p.x,
            p.y
        );

        ctx.rotate(
            angle
        );

        ctx.globalAlpha =
            .42 +
            smoothedAudio*.3;

        ctx.strokeStyle =
            i%4===0
            ? "#d2ae55"
            : "#43d7ea";

        ctx.lineWidth =
            .65;

        if(i%3===0){

            ctx.strokeRect(
                -2,
                -2,
                4,
                4
            );

        }else{

            ctx.beginPath();

            ctx.moveTo(-3,0);
            ctx.lineTo(3,0);

            ctx.stroke();
        }

        ctx.restore();
    }

    /* Bright data nodes */

    for(
        let i=0;
        i<4;
        i++
    ){

        const angle =
            rotation +
            i *
            Math.PI/2 +
            .5;

        const p =
            polar(
                cx,
                cy,
                radius - 2,
                angle
            );

        const pulse =
            1 +
            smoothedAudio*3 +
            Math.sin(
                time*.004+i
            );

        ctx.save();

        ctx.shadowBlur =
            10 + smoothedAudio*18;

        ctx.shadowColor =
            ring.cyan;

        ctx.fillStyle =
            ring.cyan;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            2*pulse,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();
    }
}


/* =========================================================
   GEODE
========================================================= */

function polygonPoint(
    cx,
    cy,
    radius,
    sides,
    index,
    irregularity
){

    const angle =
        index *
        Math.PI*2 /
        sides -
        Math.PI/2;

    const wave =
        Math.sin(
            index*2.37
        ) * irregularity;

    const r =
        radius *
        (1 + wave);

    return polar(
        cx,
        cy,
        r,
        angle
    );
}


function drawPolygon(
    cx,
    cy,
    radius,
    sides,
    rotation,
    irregularity,
    stroke,
    width,
    alpha,
    fill
){

    ctx.save();

    ctx.beginPath();

    for(
        let i=0;
        i<sides;
        i++
    ){

        const angle =
            rotation +
            i *
            Math.PI*2 /
            sides;

        const irregular =
            1 +
            Math.sin(
                i*2.71
            ) *
            irregularity;

        const r =
            radius *
            irregular;

        const x =
            cx +
            Math.cos(angle)*r;

        const y =
            cy +
            Math.sin(angle)*r;

        if(i===0){
            ctx.moveTo(x,y);
        }else{
            ctx.lineTo(x,y);
        }
    }

    ctx.closePath();

    if(fill){

        ctx.fillStyle =
            fill;

        ctx.fill();
    }

    ctx.globalAlpha =
        alpha;

    ctx.strokeStyle =
        stroke;

    ctx.lineWidth =
        width;

    ctx.stroke();

    ctx.restore();
}


/* =========================================================
   GEODE FACETS
========================================================= */

function drawGeode(
    cx,
    cy,
    radius
){

    const pulse =
        1 +
        smoothedAudio *
        .14;

    const r =
        radius *
        pulse;

    /* Outer crystalline halo */

    const glow =
        ctx.createRadialGradient(
            cx,
            cy,
            r*.1,
            cx,
            cy,
            r*1.6
        );

    glow.addColorStop(
        0,
        "rgba(30,224,255,.26)"
    );

    glow.addColorStop(
        .45,
        "rgba(24,138,176,.10)"
    );

    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle =
        glow;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        r*1.6,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* Back polygon shell */

    drawPolygon(
        cx,
        cy,
        r,
        14,
        time*.00018,
        .075,
        "#3bdff1",
        1.2,
        .82,
        "rgba(2,26,34,.72)"
    );

    /* Middle crystal layer */

    drawPolygon(
        cx,
        cy,
        r*.80,
        11,
        -time*.00024,
        .105,
        "#7bd8ff",
        .85,
        .72,
        "rgba(3,43,54,.42)"
    );

    /* Inner crystal layer */

    drawPolygon(
        cx,
        cy,
        r*.58,
        9,
        time*.00031,
        .13,
        "#4eeaff",
        .8,
        .76,
        "rgba(5,58,70,.28)"
    );

    /* Facet network */

    const sides = 14;

    const outer = [];

    for(
        let i=0;
        i<sides;
        i++
    ){

        outer.push(
            polygonPoint(
                cx,
                cy,
                r*.92,
                sides,
                i,
                .075
            )
        );
    }

    for(
        let i=0;
        i<sides;
        i++
    ){

        const a =
            outer[i];

        const b =
            outer[
                (i+1)%sides
            ];

        const inner =
            polar(
                cx,
                cy,
                r*.35 +
                Math.sin(i*1.9)*r*.05,
                i*Math.PI*2/sides +
                time*.0002
            );

        line(
            a.x,
            a.y,
            inner.x,
            inner.y,
            i%3===0
                ? "#8befff"
                : "#32899c",
            i%3===0
                ? .75
                : .45,
            .62
        );

        line(
            inner.x,
            inner.y,
            b.x,
            b.y,
            "#287383",
            .42,
            .48
        );
    }

    /* Floating crystal vertices */

    for(
        let i=0;
        i<18;
        i++
    ){

        const angle =
            time*.0004 +
            i *
            Math.PI*2 /
            18;

        const rr =
            r *
            (.35 +
            (i%5)*.11);

        const p =
            polar(
                cx,
                cy,
                rr,
                angle
            );

        const size =
            1.5 +
            smoothedAudio*3;

        ctx.save();

        ctx.shadowBlur =
            8 + smoothedAudio*15;

        ctx.shadowColor =
            i%4===0
            ? "#c9a04a"
            : "#30e7ff";

        ctx.fillStyle =
            i%4===0
            ? "#d6b25b"
            : "#65edff";

        ctx.globalAlpha =
            .45 +
            smoothedAudio*.35;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            size,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();
    }

    /* Central crystal */

    const coreGlow =
        ctx.createRadialGradient(
            cx,
            cy,
            0,
            cx,
            cy,
            r*.48
        );

    coreGlow.addColorStop(
        0,
        "rgba(220,255,255,.80)"
    );

    coreGlow.addColorStop(
        .12,
        "rgba(62,225,255,.52)"
    );

    coreGlow.addColorStop(
        .42,
        "rgba(0,149,185,.18)"
    );

    coreGlow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle =
        coreGlow;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        r*.48,
        0,
        Math.PI*2
    );

    ctx.fill();

    drawPolygon(
        cx,
        cy,
        r*.26,
        8,
        time*.0007,
        .09,
        "#a6f6ff",
        1,
        .9,
        "rgba(3,43,53,.62)"
    );

    /* Core label */

    ctx.save();

    ctx.fillStyle =
        "#d7fbff";

    ctx.font =
        `${Math.max(10,r*.16)}px monospace`;

    ctx.letterSpacing =
        "4px";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.globalAlpha =
        .85;

    ctx.fillText(
        "CORE",
        cx,
        cy-3
    );

    ctx.fillStyle =
        "#4e8995";

    ctx.font =
        `${Math.max(6,r*.08)}px monospace`;

    ctx.fillText(
        smoothedAudio > .08
        ? "LISTENING"
        : "READY",
        cx,
        cy+13
    );

    ctx.restore();
}


/* =========================================================
   CENTRAL AXIS
========================================================= */

function drawAxis(
    cx,
    cy,
    radius
){

    ctx.save();

    ctx.globalAlpha =
        .25 +
        smoothedAudio*.35;

    const axisLength =
        radius*1.15;

    line(
        cx-axisLength,
        cy,
        cx+axisLength,
        cy,
        "#5bdbea",
        .45,
        1
    );

    line(
        cx,
        cy-axisLength,
        cx,
        cy+axisLength,
        "#5bdbea",
        .45,
        1
    );

    ctx.restore();
}


/* =========================================================
   OUTER INFORMATION FIELD
========================================================= */

function drawOuterArtifacts(
    cx,
    cy,
    radius
){

    const count = 32;

    for(
        let i=0;
        i<count;
        i++
    ){

        const angle =
            i *
            Math.PI*2 /
            count;

        const rr =
            radius +
            10 +
            (i%3)*6;

        const p =
            polar(
                cx,
                cy,
                rr,
                angle
            );

        const size =
            i%4===0
            ? 3
            : 1.3;

        ctx.save();

        ctx.globalAlpha =
            .28 +
            smoothedAudio*.35;

        ctx.fillStyle =
            i%7===0
            ? "#d0a64e"
            : "#43dff2";

        if(i%5===0){

            ctx.strokeStyle =
                ctx.fillStyle;

            ctx.lineWidth =
                .7;

            ctx.strokeRect(
                p.x-size,
                p.y-size,
                size*2,
                size*2
            );

        }else{

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                size,
                0,
                Math.PI*2
            );

            ctx.fill();
        }

        ctx.restore();
    }
}


/* =========================================================
   MAIN RENDER
========================================================= */

let time = 0;

function render(){

    time++;

    updateAudio();

    updateAudioBars();

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    /* -----------------------------------------------------
       Central geometry

       The visual is deliberately constrained to the
       available width so that no ring can escape the
       iPhone viewport.
    ----------------------------------------------------- */

    const cx =
        W/2;

    const cy =
        H*.48;

    const maxRadius =
        Math.min(
            W*.465,
            H*.47
        );

    /* ambient core glow */

    const ambient =
        ctx.createRadialGradient(
            cx,
            cy,
            0,
            cx,
            cy,
            maxRadius*1.18
        );

    ambient.addColorStop(
        0,
        "rgba(0,158,188,.11)"
    );

    ambient.addColorStop(
        .45,
        "rgba(0,79,101,.06)"
    );

    ambient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle =
        ambient;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        maxRadius*1.18,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* Technical grid */

    drawCoreGrid(
        cx,
        cy,
        maxRadius
    );

    /* Four fixed concentric rings */

    rings.forEach(
        (ring,index)=>{

            drawRing(
                ring,
                cx,
                cy,
                maxRadius,
                index
            );
        }
    );

    /* Outer information */

    drawOuterArtifacts(
        cx,
        cy,
        maxRadius
    );

    /* Axis */

    drawAxis(
        cx,
        cy,
        maxRadius
    );

    /* Central geode */

    drawGeode(
        cx,
        cy,
        maxRadius*.165
    );

    /* Compass labels */

    const labels = [
        ["N", -Math.PI/2],
        ["E", 0],
        ["S", Math.PI/2],
        ["W", Math.PI]
    ];

    labels.forEach(
        ([label,angle])=>{

            const p =
                polar(
                    cx,
                    cy,
                    maxRadius*.91,
                    angle
                );

            ctx.save();

            ctx.fillStyle =
                "#b8eaf0";

            ctx.globalAlpha =
                .76;

            ctx.font =
                `${Math.max(
                    9,
                    maxRadius*.045
                )}px monospace`;

            ctx.textAlign =
                "center";

            ctx.textBaseline =
                "middle";

            ctx.fillText(
                label,
                p.x,
                p.y
            );

            ctx.restore();
        }
    );

    /* Audio-driven micro pulse */

    if(smoothedAudio > .025){

        ctx.save();

        ctx.globalAlpha =
            smoothedAudio*.18;

        ctx.strokeStyle =
            "#4beaff";

        ctx.lineWidth =
            1;

        ctx.beginPath();

        ctx.arc(
            cx,
            cy,
            maxRadius *
            (
                .18 +
                smoothedAudio*.13
            ),
            0,
            Math.PI*2
        );

        ctx.stroke();

        ctx.restore();
    }

    requestAnimationFrame(
        render
    );
}

render();


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

let recognition = null;

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if(SpeechRecognition){

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "fr-FR";

    recognition.continuous =
        true;

    recognition.interimResults =
        true;

    recognition.onstart =
        ()=>{

            voiceState.textContent =
                "VOICE SYSTEM · LISTENING";

            micButton.classList.add(
                "active"
            );
        };

    recognition.onresult =
        event=>{

            let finalText = "";
            let interimText = "";

            for(
                let i=event.resultIndex;
                i<event.results.length;
                i++
            ){

                const result =
                    event.results[i];

                const text =
                    result[0].transcript;

                if(result.isFinal){

                    finalText +=
                        text;

                }else{

                    interimText +=
                        text;
                }
            }

            const display =
                finalText ||
                interimText;

            if(display){

                transcript.textContent =
                    display
                    .trim()
                    .toUpperCase();
            }

            if(finalText){

                window.jarvisLastCommand =
                    finalText.trim();
            }
        };

    recognition.onerror =
        event=>{

            console.log(
                "Speech recognition:",
                event.error
            );
        };

    recognition.onend =
        ()=>{

            if(
                micButton.classList.contains(
                    "active"
                )
            ){

                try{
                    recognition.start();
                }catch(e){}
            }
        };

}


/* =========================================================
   MICROPHONE BUTTON
========================================================= */

micButton.addEventListener(
    "click",
    async()=>{

        await startMicrophone();

        if(!recognition){

            voiceState.textContent =
                "AUDIO ACTIVE · TRANSCRIPTION UNAVAILABLE";

            return;
        }

        try{

            recognition.start();

        }catch(error){

            console.log(error);
        }

    }
);


/* =========================================================
   SEND TO SHORTCUTS
========================================================= */

shortcutButton.addEventListener(
    "click",
    ()=>{

        const command =
            (
                window.jarvisLastCommand ||
                transcript.textContent ||
                ""
            ).trim();

        if(!command){

            voiceState.textContent =
                "NO COMMAND AVAILABLE";

            return;
        }

        /*
           The shortcut name can be changed here.

           Example:
           shortcuts://run-shortcut?name=JARVIS
        */

        const shortcutName =
            "JARVIS";

        const url =
            "shortcuts://run-shortcut" +
            "?name=" +
            encodeURIComponent(
                shortcutName
            ) +
            "&input=" +
            encodeURIComponent(
                command
            );

        window.location.href =
            url;

    }
);


/* =========================================================
   SYNTHETIC JARVIS VOICE
========================================================= */

function speakJarvis(text){

    if(!("speechSynthesis" in window)){

        voiceState.textContent =
            "SPEECH SYNTHESIS UNAVAILABLE";

        return;
    }

    window.speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(
            text
        );

    utterance.lang =
        "fr-FR";

    utterance.rate =
        .94;

    utterance.pitch =
        .78;

    utterance.volume =
        1;

    utterance.onstart =
        ()=>{

            voiceState.textContent =
                "JARVIS VOICE · OUTPUT";

            speakButton.classList.add(
                "active"
            );
        };

    utterance.onend =
        ()=>{

            voiceState.textContent =
                "VOICE SYSTEM · READY";

            speakButton.classList.remove(
                "active"
            );
        };

    window.speechSynthesis.speak(
        utterance
    );
}


speakButton.addEventListener(
    "click",
    ()=>{

        const text =
            window.jarvisLastCommand
            ? "Commande reçue."
            : "Je vous écoute.";

        speakJarvis(
            text
        );
    }
);


/* =========================================================
   INITIAL STATE
========================================================= */

window.jarvisLastCommand =
    "";

voiceState.textContent =
    "VOICE SYSTEM · READY";

transcript.textContent =
    "EN ATTENTE DE COMMANDE";

========================================================= */

document.addEventListener(

        event.preventDefault();
    },
    {passive:false}
);

document.addEventListener(
    "gesturestart",
    event=>{
        event.preventDefault();
    },
    {passive:false}
);
