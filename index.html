<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>JARVIS — Crystalline Voice Core</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02090d;
    color:#d8faff;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

body{
    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(10,80,96,.20),
            transparent 43%
        ),
        #02090d;
}

/* ================= BACKGROUND ================= */

#bg{
    position:fixed;
    inset:0;
    background-image:
        linear-gradient(rgba(40,140,158,.105) 1px,transparent 1px),
        linear-gradient(90deg,rgba(40,140,158,.105) 1px,transparent 1px),
        linear-gradient(rgba(40,140,158,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(40,140,158,.035) 1px,transparent 1px);
    background-size:
        32px 32px,
        32px 32px,
        8px 8px,
        8px 8px;
}

/* ================= APP ================= */

#app{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    flex-direction:column;
    padding:
        max(18px,env(safe-area-inset-top))
        18px
        max(14px,env(safe-area-inset-bottom));
}

/* ================= HEADER ================= */

header{
    height:65px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:29px;
    font-weight:300;
    letter-spacing:.27em;
    white-space:nowrap;
}

.status{
    display:flex;
    gap:16px;
    font-size:9px;
    letter-spacing:.27em;
    color:#607f89;
}

.status span{
    display:flex;
    align-items:center;
    gap:6px;
}

.dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#23e4ff;
    box-shadow:
        0 0 7px #23e4ff,
        0 0 18px rgba(35,228,255,.65);
}

/* ================= TITLES ================= */

.title{
    text-align:center;
    flex:none;
    margin-top:8px;
}

.title-main{
    font-size:11px;
    letter-spacing:.34em;
    color:#67949f;
}

.title-sub{
    margin-top:13px;
    font-size:7px;
    letter-spacing:.38em;
    color:#365963;
}

/* ================= CORE ================= */

#core{
    position:relative;
    flex:1;
    min-height:0;
    display:flex;
    justify-content:center;
    align-items:center;
}

#visual{
    width:min(96vw,720px);
    height:min(96vw,720px);
}

canvas{
    width:100%;
    height:100%;
    display:block;
}

/* ================= VOICE ================= */

#voice{
    position:absolute;
    bottom:7%;
    left:50%;
    transform:translateX(-50%);
    width:92%;
    text-align:center;
    border-top:1px solid rgba(38,213,235,.35);
    border-bottom:1px solid rgba(38,213,235,.28);
    padding:10px;
}

#state{
    font-size:8px;
    letter-spacing:.34em;
    color:#5e8b95;
}

#text{
    margin-top:7px;
    font-size:16px;
    letter-spacing:.11em;
    color:#c8f7fc;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* ================= METER ================= */

#meter{
    position:absolute;
    bottom:14%;
    left:50%;
    transform:translateX(-50%);
    height:24px;
    display:flex;
    align-items:flex-end;
    gap:3px;
}

.bar{
    width:3px;
    height:4px;
    background:#25e7ff;
    box-shadow:0 0 8px #25e7ff;
}

/* ================= BUTTONS ================= */

.controls{
    flex:none;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

button{
    height:66px;
    border:1px solid rgba(35,225,248,.62);
    background:rgba(3,27,34,.65);
    color:#c6f5f9;
    font:inherit;
    font-size:9px;
    letter-spacing:.17em;
}

button:active{
    background:rgba(25,100,112,.3);
}

button.active{
    border-color:#5cf4ff;
    box-shadow:
        0 0 25px rgba(35,225,248,.22),
        inset 0 0 25px rgba(35,225,248,.08);
}

.icon{
    display:block;
    font-size:17px;
    margin-bottom:7px;
    color:#35eaff;
}

@media(max-height:720px){
    header{height:54px}
    .logo{font-size:25px}
    .title{margin-top:3px}
    .title-sub{margin-top:7px}
    button{height:55px}
}

@media(max-width:390px){
    .status{gap:8px;font-size:7px}
    .logo{font-size:24px}
    .title-main{font-size:9px}
}
</style>
</head>

<body>

<div id="bg"></div>

<div id="app">

<header>
    <div class="logo">JARVIS</div>

    <div class="status">
        <span><i class="dot"></i>ONLINE</span>
        <span><i class="dot"></i>SECURE</span>
        <span><i class="dot"></i>VOICE</span>
    </div>
</header>

<div class="title">
    <div class="title-main">
        VOICE CORE · CRYSTALLINE MATRIX · 3 AXIS
    </div>

    <div class="title-sub">
        HOLOGRAPHIC CONCENTRIC SYSTEM · AUDIO REACTIVE
    </div>
</div>

<div id="core">

    <div id="visual">
        <canvas id="canvas"></canvas>
    </div>

    <div id="meter"></div>

    <div id="voice">
        <div id="state">VOICE SYSTEM · READY</div>
        <div id="text">EN ATTENTE DE COMMANDE</div>
    </div>

</div>

<div class="controls">

    <button id="mic">
        <span class="icon">◉</span>
        MICRO ACTIF
    </button>

    <button id="send">
        <span class="icon">↗</span>
        ENVOYER<br>RACCOURCIS
    </button>

    <button id="speak">
        <span class="icon">◌</span>
        VOIX JARVIS
    </button>

</div>

</div>

<script>

/* =========================================================
   JARVIS CRYSTALLINE CORE
========================================================= */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W,H,DPR;

function resize(){

    const r=canvas.getBoundingClientRect();

    W=r.width;
    H=r.height;

    DPR=Math.min(devicePixelRatio||1,2);

    canvas.width=W*DPR;
    canvas.height=H*DPR;

    ctx.setTransform(DPR,0,0,DPR,0,0);
}

window.addEventListener("resize",resize);
resize();


/* =========================================================
   AUDIO
========================================================= */

let audioLevel=0;
let targetAudio=0;
let listening=false;

let analyser=null;
let audioData=null;

async function startMic(){

    try{

        const stream=
            await navigator.mediaDevices
            .getUserMedia({audio:true});

        const AC=
            window.AudioContext||
            window.webkitAudioContext;

        const audioContext=new AC();

        analyser=
            audioContext.createAnalyser();

        analyser.fftSize=512;
        analyser.smoothingTimeConstant=.72;

        const source=
            audioContext
            .createMediaStreamSource(stream);

        source.connect(analyser);

        audioData=
            new Uint8Array(analyser.fftSize);

        listening=true;

        document
            .getElementById("mic")
            .classList.add("active");

        document
            .getElementById("state")
            .textContent="VOICE SYSTEM · LISTENING";

        readAudio();

    }catch(e){

        document
            .getElementById("text")
            .textContent="AUTORISATION MICRO REQUISE";
    }
}

function readAudio(){

    if(!analyser)return;

    analyser.getByteTimeDomainData(audioData);

    let sum=0;

    for(let i=0;i<audioData.length;i++){

        const v=(audioData[i]-128)/128;
        sum+=v*v;
    }

    const rms=Math.sqrt(sum/audioData.length);

    /*
       Amplification volontaire :
       la dilatation doit être évidente
       même avec une voix normale.
    */

    targetAudio=Math.min(1,rms*7);

    requestAnimationFrame(readAudio);
}


/* =========================================================
   HELPERS
========================================================= */

function P(cx,cy,r,a){

    return {
        x:cx+Math.cos(a)*r,
        y:cy+Math.sin(a)*r
    };
}

function glowArc(
    cx,cy,r,a1,a2,color,width,alpha
){

    ctx.save();

    ctx.strokeStyle=color;
    ctx.globalAlpha=alpha;
    ctx.lineWidth=width;

    ctx.shadowColor=color;
    ctx.shadowBlur=width*5;

    ctx.beginPath();

    ctx.arc(
        cx,cy,r,a1,a2
    );

    ctx.stroke();

    ctx.restore();
}


/* =========================================================
   PARTICLES
========================================================= */

const particles=[];

for(let i=0;i<75;i++){

    particles.push({
        angle:Math.random()*Math.PI*2,
        radius:.55+Math.random()*.5,
        size:.4+Math.random()*1.3,
        speed:.00002+Math.random()*.00008,
        phase:Math.random()*10
    });
}

function drawParticles(cx,cy,R,time){

    ctx.save();

    particles.forEach(p=>{

        const a=
            p.angle+
            time*p.speed;

        const r=
            R*p.radius*
            (1+audioLevel*.08);

        const q=P(cx,cy,r,a);

        const alpha=
            .12+
            .22*
            (.5+
            .5*Math.sin(
                time*.002+p.phase
            ));

        ctx.fillStyle=
            `rgba(75,220,240,${alpha})`;

        ctx.beginPath();

        ctx.arc(
            q.x,
            q.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    });

    ctx.restore();
}


/* =========================================================
   FOUR AIRY RINGS
========================================================= */

function drawRings(cx,cy,R,time){

    /*
       Les quatre couronnes sont FIXES
       autour du centre.

       Elles s'écartent uniquement
       radialement avec la voix.
    */

    const expansion=
        audioLevel*.13;

    const radii=[
        .31,
        .43,
        .55,
        .67
    ];

    radii.forEach((base,i)=>{

        const r=
            R*(base+expansion);

        const dir=
            i%2===0?1:-1;

        const rot=
            time*.00015*
            (1+i*.35)*
            dir;


        /* halo très discret */

        glowArc(
            cx,cy,r,
            0,Math.PI*2,
            "#20ddf5",
            1.2+audioLevel*1.2,
            .18+audioLevel*.18
        );


        /* cercle holographique principal */

        glowArc(
            cx,cy,r,
            0,Math.PI*2,
            "#27e6ff",
            1.7+audioLevel*1.1,
            .62
        );


        /* deuxième ligne */

        ctx.save();

        ctx.strokeStyle=
            "rgba(100,239,249,.28)";

        ctx.lineWidth=.65;

        ctx.beginPath();

        ctx.arc(
            cx,
            cy,
            r-7,
            0,
            Math.PI*2
        );

        ctx.stroke();

        ctx.restore();


        /* graduations */

        const count=96;

        ctx.save();

        for(let n=0;n<count;n++){

            const a=
                rot+
                n/count*Math.PI*2;

            let len=4;

            let alpha=.42;

            if(n%12===0){
                len=13;
                alpha=.85;
            }
            else if(n%4===0){
                len=8;
                alpha=.62;
            }

            const a1=P(cx,cy,r,a);
            const a2=P(cx,cy,r-len,a);

            ctx.strokeStyle=
                `rgba(188,247,252,${alpha})`;

            ctx.lineWidth=
                n%12===0?1.2:.55;

            ctx.beginPath();

            ctx.moveTo(a1.x,a1.y);
            ctx.lineTo(a2.x,a2.y);

            ctx.stroke();
        }

        ctx.restore();


        /* arcs techniques */

        const arcData=[
            [0.25,.62,"#c59b45"],
            [2.05,2.47,"#35ddff"],
            [3.48,3.92,"#6654d5"],
            [4.65,5.08,"#b48b42"]
        ];

        arcData.forEach((a,j)=>{

            /*
               Les arcs internes tournent
               dans le sens opposé.
            */

            const reverse=
                -rot*1.7;

            glowArc(
                cx,
                cy,
                r-14,
                a[0]+reverse,
                a[1]+reverse,
                a[2],
                1.15+audioLevel*.7,
                .72
            );
        });


        /* petits points lumineux */

        for(let n=0;n<12;n++){

            const a=
                rot+
                n/12*Math.PI*2;

            const p=P(
                cx,
                cy,
                r,
                a
            );

            ctx.fillStyle=
                n%3===0
                ? "#d7b55c"
                : "#38eaff";

            ctx.shadowColor=
                ctx.fillStyle;

            ctx.shadowBlur=8;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                n%3===0?2.2:1.7,
                0,
                Math.PI*2
            );

            ctx.fill();
        }
    });
}


/* =========================================================
   TRANSLUCENT GEODE
========================================================= */

function drawGeode(cx,cy,R,time){

    /*
       Géode plus grande.
       Aucun trait radial dominant.
       Les facettes sont translucides.
    */

    const pulse=
        1+
        audioLevel*.22+
        Math.sin(time*.003)*.012;

    R*=pulse;

    const N=26;

    const v=[];

    for(let i=0;i<N;i++){

        const a=
            i/N*Math.PI*2;

        const irregular=
            1+
            Math.sin(i*2.17)*.07+
            Math.sin(i*5.71)*.035;

        v.push(
            P(
                cx,
                cy,
                R*irregular,
                a
            )
        );
    }


    /* halo externe */

    const halo=
        ctx.createRadialGradient(
            cx,cy,R*.15,
            cx,cy,R*1.35
        );

    halo.addColorStop(
        0,
        "rgba(55,235,255,.22)"
    );

    halo.addColorStop(
        .45,
        "rgba(30,180,205,.08)"
    );

    halo.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle=halo;

    ctx.beginPath();

    ctx.arc(
        cx,cy,R*1.35,
        0,Math.PI*2
    );

    ctx.fill();


    /* corps translucide */

    const glass=
        ctx.createRadialGradient(
            cx-R*.35,
            cy-R*.42,
            R*.04,
            cx,
            cy,
            R
        );

    glass.addColorStop(
        0,
        "rgba(190,250,255,.34)"
    );

    glass.addColorStop(
        .22,
        "rgba(77,220,239,.22)"
    );

    glass.addColorStop(
        .58,
        "rgba(20,130,154,.11)"
    );

    glass.addColorStop(
        .82,
        "rgba(5,48,62,.08)"
    );

    glass.addColorStop(
        1,
        "rgba(0,10,16,.03)"
    );

    ctx.save();

    ctx.beginPath();

    v.forEach((p,i)=>{

        if(i===0)
            ctx.moveTo(p.x,p.y);
        else
            ctx.lineTo(p.x,p.y);
    });

    ctx.closePath();

    ctx.fillStyle=glass;
    ctx.fill();

    ctx.restore();


    /* facettes internes */

    ctx.save();

    for(let layer=1;layer<=4;layer++){

        const ratio=
            layer/5;

        const rr=
            R*ratio;

        const count=
            11+layer*3;

        for(let i=0;i<count;i++){

            const a=
                i/count*Math.PI*2+
                layer*.41;

            const p1=
                P(
                    cx,
                    cy,
                    rr,
                    a
                );

            const p2=
                P(
                    cx,
                    cy,
                    rr*.83,
                    a+.42
                );

            /*
               Lignes extrêmement fines,
               transparentes, seulement pour
               suggérer les plans cristallins.
            */

            ctx.strokeStyle=
                `rgba(
                    110,
                    239,
                    255,
                    ${.07+audioLevel*.12}
                )`;

            ctx.lineWidth=.45;

            ctx.beginPath();

            ctx.moveTo(
                p1.x,p1.y
            );

            ctx.lineTo(
                p2.x,p2.y
            );

            ctx.stroke();
        }
    }

    ctx.restore();


    /* arêtes de la géode */

    ctx.save();

    for(let i=0;i<N;i++){

        const a=v[i];
        const b=v[(i+1)%N];

        const brightness=
            .18+
            Math.abs(
                Math.sin(i*1.83)
            )*.45+
            audioLevel*.35;

        ctx.strokeStyle=
            `rgba(
                125,
                245,
                255,
                ${brightness}
            )`;

        ctx.lineWidth=
            .7+
            audioLevel*.7;

        ctx.shadowColor="#36eaff";
        ctx.shadowBlur=
            4+
            audioLevel*8;

        ctx.beginPath();

        ctx.moveTo(a.x,a.y);
        ctx.lineTo(b.x,b.y);

        ctx.stroke();
    }

    ctx.restore();


    /* réfraction lumineuse */

    const lights=[
        [-.36,-.30,.22],
        [.34,-.16,.16],
        [-.25,.31,.12],
        [.28,.27,.09]
    ];

    lights.forEach((l,i)=>{

        const x=cx+l[0]*R;
        const y=cy+l[1]*R;
        const rr=l[2]*R;

        const g=
            ctx.createRadialGradient(
                x,y,0,
                x,y,rr
            );

        g.addColorStop(
            0,
            `rgba(
                225,
                255,
                255,
                ${.28+audioLevel*.25}
            )`
        );

        g.addColorStop(
            .22,
            `rgba(
                50,
                224,
                247,
                ${.12+audioLevel*.12}
            )`
        );

        g.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );

        ctx.fillStyle=g;

        ctx.beginPath();

        ctx.arc(
            x,y,rr,
            0,Math.PI*2
        );

        ctx.fill();
    });


    /* lumière qui balaie les facettes */

    const sweep=
        time*.0007;

    for(let i=0;i<7;i++){

        const a=
            sweep+
            i*.86;

        const p=
            P(
                cx,
                cy,
                R*.72,
                a
            );

        const g=
            ctx.createRadialGradient(
                p.x,p.y,0,
                p.x,p.y,R*.18
            );

        g.addColorStop(
            0,
            "rgba(180,250,255,.20)"
        );

        g.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );

        ctx.fillStyle=g;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            R*.18,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    /* centre */

    const coreGlow=
        ctx.createRadialGradient(
            cx,cy,0,
            cx,cy,R*.34
        );

    coreGlow.addColorStop(
        0,
        "rgba(185,250,255,.30)"
    );

    coreGlow.addColorStop(
        .25,
        "rgba(40,220,244,.12)"
    );

    coreGlow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle=coreGlow;

    ctx.beginPath();

    ctx.arc(
        cx,cy,R*.34,
        0,Math.PI*2
    );

    ctx.fill();


    /* CORE */

    ctx.save();

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.font="13px sans-serif";

    ctx.fillStyle="#e0fbff";

    ctx.shadowColor="#39ecff";
    ctx.shadowBlur=12;

    ctx.fillText(
        "CORE",
        cx,
        cy-3
    );

    ctx.font="7px monospace";

    ctx.fillStyle="#75aab3";
    ctx.shadowBlur=0;

    ctx.fillText(
        listening?"LISTENING":"READY",
        cx,
        cy+13
    );

    ctx.restore();
}


/* =========================================================
   MAIN RENDER
========================================================= */

let rotation=0;

function render(time){

    ctx.clearRect(
        0,0,W,H
    );

    /*
       IMPORTANT :
       visualisation plus grande et
       beaucoup moins compacte.
    */

    const cx=W/2;
    const cy=H/2;

    const R=
        Math.min(W,H)*.455;


    /* smoothing audio */

    audioLevel+=
        (targetAudio-audioLevel)*.16;


    /* environnement */

    drawParticles(
        cx,cy,R,time
    );


    /*
       quatre anneaux aérés
    */

    drawRings(
        cx,cy,R,time
    );


    /*
       géode translucide
    */

    drawGeode(
        cx,
        cy,
        R*.265,
        time
    );


    /*
       rotation lente permanente.
       Les anneaux restent centrés.
    */

    rotation+=
        .00055+
        audioLevel*.0025;


    requestAnimationFrame(render);
}

requestAnimationFrame(render);


/* =========================================================
   AUDIO METER
========================================================= */

const meter=
    document.getElementById("meter");

const bars=[];

for(let i=0;i<34;i++){

    const b=
        document.createElement("div");

    b.className="bar";

    meter.appendChild(b);

    bars.push(b);
}

function meterAnimation(){

    bars.forEach((b,i)=>{

        const wave=
            Math.abs(
                Math.sin(
                    performance.now()*.012+
                    i*.65
                )
            );

        const h=
            listening
            ? 4+
              audioLevel*
              (8+wave*23)
            : 4;

        b.style.height=h+"px";
    });

    requestAnimationFrame(
        meterAnimation
    );
}

meterAnimation();


/* =========================================================
   BUTTONS
========================================================= */

document
.getElementById("mic")
.addEventListener(
    "click",
    startMic
);


/* reconnaissance vocale */

let recognition=null;

const SpeechRecognition=
    window.SpeechRecognition||
    window.webkitSpeechRecognition;

if(SpeechRecognition){

    recognition=
        new SpeechRecognition();

    recognition.lang="fr-FR";
    recognition.continuous=true;
    recognition.interimResults=true;

    recognition.onresult=e=>{

        let result="";

        for(
            let i=e.resultIndex;
            i<e.results.length;
            i++
        ){

            result+=
                e.results[i][0]
                .transcript;
        }

        if(result.trim()){

            document
            .getElementById("text")
            .textContent=
                result.trim();
        }
    };
}

document
.getElementById("mic")
.addEventListener(
    "click",
    ()=>{

        if(recognition){

            try{
                recognition.start();
            }catch(e){}
        }
    }
);


/* =========================================================
   RACCOURCIS
========================================================= */

document
.getElementById("send")
.addEventListener(
    "click",
    ()=>{

        const text=
            document
            .getElementById("text")
            .textContent;

        const url=
            "shortcuts://run-shortcut"+
            "?name="+
            encodeURIComponent("JARVIS")+
            "&input="+
            encodeURIComponent(text);

        location.href=url;
    }
);


/* =========================================================
   VOIX JARVIS
========================================================= */

document
.getElementById("speak")
.addEventListener(
    "click",
    ()=>{

        const text=
            document
            .getElementById("text")
            .textContent;

        if(
            !text||
            text==="EN ATTENTE DE COMMANDE"
        )return;

        speechSynthesis.cancel();

        const u=
            new SpeechSynthesisUtterance(
                text
            );

        u.lang="fr-FR";
        u.rate=.9;
        u.pitch=.72;

        u.onstart=()=>{
            listening=true;
            targetAudio=.32;
            document
            .getElementById("state")
            .textContent=
                "VOICE SYSTEM · SPEAKING";
        };

        u.onend=()=>{
            listening=false;
            targetAudio=0;
            document
            .getElementById("state")
            .textContent=
                "VOICE SYSTEM · READY";
        };

        speechSynthesis.speak(u);
    }
);

</script>

</body>
</html>
