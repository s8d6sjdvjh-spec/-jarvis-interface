<title>JARVIS — Geode Interface</title>

<style>

/* =========================================================
   JARVIS GEODE CORE
   MOBILE FIRST / iPHONE
   ========================================================= */

:root{

    --bg:#02070a;

    --cyan:#11dfff;
    --cyanBright:#9cf7ff;
    --cyanDim:#17677a;
    --cyanDark:#06313d;

    --white:#dffaff;

    --gold:#b89555;
    --goldBright:#e4c67c;

    --panel:rgba(3,18,24,.84);

}


/* =========================================================
   RESET
   ========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}


html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:
        #02070a;

    color:
        var(--white);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

}


body{

    overscroll-behavior:none;

}


/* =========================================================
   MAIN
   ========================================================= */

#app{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:

        radial-gradient(
            ellipse at 50% 42%,
            rgba(0,94,120,.16),
            transparent 31%
        ),

        radial-gradient(
            ellipse at 50% 45%,
            rgba(0,35,48,.22),
            transparent 57%
        ),

        #02070a;

}


/* =========================================================
   BACKGROUND GRID
   ========================================================= */

#backgroundGrid{

    position:absolute;

    inset:0;

    opacity:.30;

    pointer-events:none;

    background-image:

        linear-gradient(
            rgba(28,104,119,.17) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(28,104,119,.17) 1px,
            transparent 1px
        );

    background-size:
        44px 44px;

}


/* =========================================================
   VERY SUBTLE DIAGONAL TECH LINES
   ========================================================= */

.techLine{

    position:absolute;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(15,180,210,.18),
            transparent
        );

    opacity:.45;

    pointer-events:none;

}


.techLine.one{

    width:70%;

    left:-12%;

    top:29%;

    transform:
        rotate(-13deg);

}


.techLine.two{

    width:68%;

    right:-13%;

    top:51%;

    transform:
        rotate(12deg);

}


/* =========================================================
   HEADER
   ========================================================= */

#header{

    position:absolute;

    z-index:50;

    top:0;
    left:0;
    right:0;

    height:
        calc(
            86px +
            env(safe-area-inset-top)
        );

    padding:

        env(safe-area-inset-top)
        25px
        0
        25px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    pointer-events:none;

}


.brand{

    font-size:17px;

    font-weight:300;

    letter-spacing:
        .54em;

    white-space:nowrap;

}


.status{

    display:flex;

    align-items:center;

    gap:14px;

}


.statusItem{

    display:flex;

    align-items:center;

    gap:6px;

    color:#5d858e;

    font-size:8px;

    letter-spacing:.27em;

    white-space:nowrap;

}


.statusDot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:
        #14ddff;

    box-shadow:

        0 0 7px
        #14ddff,

        0 0 16px
        rgba(20,221,255,.55);

}


/* =========================================================
   TITLE
   ========================================================= */

#title{

    position:absolute;

    z-index:30;

    top:
        calc(
            112px +
            env(safe-area-inset-top)
        );

    left:0;
    right:0;

    text-align:center;

    color:#507b86;

    font-size:9px;

    letter-spacing:.39em;

    white-space:nowrap;

    pointer-events:none;

}


/* =========================================================
   CORE STAGE
   ========================================================= */

#coreStage{

    position:absolute;

    z-index:10;

    left:0;
    right:0;

    top:
        calc(
            146px +
            env(safe-area-inset-top)
        );

    height:
        min(
            52vh,
            520px
        );

    display:flex;

    align-items:center;

    justify-content:center;

}


/* =========================================================
   CORE CONTAINER
   ========================================================= */

#core{

    position:relative;

    width:
        min(
            86vw,
            420px
        );

    aspect-ratio:1/1;

}


/* =========================================================
   HUD SVG
   ========================================================= */

#hud{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    overflow:visible;

    pointer-events:none;

}


/* =========================================================
   HUD BASE
   ========================================================= */

.hudRing{

    fill:none;

    stroke:
        rgba(26,191,221,.42);

    stroke-width:1;

}


.hudRingBright{

    fill:none;

    stroke:
        rgba(68,229,255,.82);

    stroke-width:1.2;

}


.hudRingDim{

    fill:none;

    stroke:
        rgba(13,111,134,.34);

    stroke-width:.8;

}


.hudGold{

    fill:none;

    stroke:
        rgba(197,157,82,.72);

    stroke-width:.8;

}


/* =========================================================
   ORBIT DASHES
   ========================================================= */

.dashRing{

    fill:none;

    stroke:
        rgba(30,204,236,.62);

    stroke-width:1;

    stroke-dasharray:
        2 8;

}


.dashRingFine{

    fill:none;

    stroke:
        rgba(74,220,245,.46);

    stroke-width:.7;

    stroke-dasharray:
        1 5;

}


/* =========================================================
   ROTATING GROUPS
   ========================================================= */

.rotateSlow{

    transform-origin:
        50% 50%;

    animation:
        rotateSlow
        42s
        linear
        infinite;

}


.rotateReverse{

    transform-origin:
        50% 50%;

    animation:
        rotateReverse
        31s
        linear
        infinite;

}


.rotateFast{

    transform-origin:
        50% 50%;

    animation:
        rotateFast
        18s
        linear
        infinite;

}


@keyframes rotateSlow{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}


@keyframes rotateReverse{

    from{
        transform:rotate(360deg);
    }

    to{
        transform:rotate(0deg);
    }

}


@keyframes rotateFast{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   HUD TEXT
   ========================================================= */

.hudText{

    fill:
        rgba(117,220,236,.78);

    font-size:4.2px;

    letter-spacing:1.3px;

    font-family:
        Arial,
        sans-serif;

}


.hudTextBright{

.hudNumber{

.tickGold{

#coreLabel span{

/* =========================================================
   SMALL STATUS ABOVE CORE

#coreStatus{

    left:50%;

        translateX(-50%);

    font-size:6px;

    letter-spacing:.35em;

    white-space:nowrap;

/* =========================================================
   INFORMATION MARKERS
   ========================================================= */

.marker{

    z-index:25;

    height:6px;

.marker.m1{

}

.marker.m2{

    top:34%;

.marker.m3{

}

.marker.m4{

/* =========================================================
   INFORMATION PANELS
   ========================================================= */

#panels{

    z-index:40;

    left:20px;
    right:20px;

    bottom:
        calc(
            25px +
            env(safe-area-inset-bottom)

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:10px;

/* =========================================================

.panel{

.panelValue{

.panelSub{

/* =========================================================

@media(

/* =========================================================

    }

        font-size:22px;
    }

}

</style>

<script type="module">

import * as THREE from "three";


/* =========================================================
   SVG TICKS
   ========================================================= */

const majorTicks =
    document.getElementById(
        "majorTicks"
    );


const numbers =
    document.getElementById(
        "numbers"
    );


const svgNS =
    "http://www.w3.org/2000/svg";


/* =========================================================
   GENERATE PRECISION TICKS
   ========================================================= */

for(
    let i = 0;
    i < 120;
    i++
){

    const angle =
        (i / 120) *
        Math.PI * 2;


    const major =
        i % 10 === 0;


    const medium =
        i % 5 === 0;


    const r1 =
        major
        ? 42.9
        : medium
        ? 42.5
        : 42.0;


    const r2 =
        major
        ? 40.9
        : medium
        ? 41.5
        : 41.5;


    const x1 =
        50 +
        Math.cos(angle) *
        r1;


    const y1 =
        50 +
        Math.sin(angle) *
        r1;


    const x2 =
        50 +
        Math.cos(angle) *
        r2;


    const y2 =
        50 +
        Math.sin(angle) *
        r2;


    const line =
        document.createElementNS(
            svgNS,
            "line"
        );


    line.setAttribute(
        "x1",
        x1
    );

    line.setAttribute(
        "y1",
        y1
    );

    line.setAttribute(
        "x2",
        x2
    );

    line.setAttribute(
        "y2",
        y2
    );


    line.setAttribute(
        "class",
        major
        ? "tickMajor"
        : medium
        ? "tick"
        : "tick"
    );


    majorTicks.appendChild(
        line
    );

}


/* =========================================================
   GENERATE NUMERIC MARKERS
   ========================================================= */

const labels = [
    "00",
    "15",
    "30",
    "45",
    "60",
    "75",
    "90",
    "105",
    "120",
    "135",
    "150",
    "165",
    "180",
    "195",
    "210",
    "225",
    "240",
    "255",
    "270",
    "285",
    "300",
    "315",
    "330",
    "345"
];


for(
    let i=0;
    i<labels.length;
    i++
){

    const angle =
        (i / labels.length) *
        Math.PI * 2;


    const r =
        39.2;


    const x =
        50 +
        Math.cos(angle) *
        r;


    const y =
        50 +
        Math.sin(angle) *
        r;


    const text =
        document.createElementNS(
            svgNS,
            "text"
        );


    text.setAttribute(
        "x",
        x
    );


    text.setAttribute(
        "y",
        y
    );


    text.setAttribute(
        "text-anchor",
        "middle"
    );


    text.setAttribute(
        "dominant-baseline",
        "middle"
    );


    text.textContent =
        labels[i];


    numbers.appendChild(
        text
    );

}


/* =========================================================

/* =========================================================

geode.add(

/* =========================================================

const shellGeometry =

    );


const shellMaterial =
    new THREE.MeshPhysicalMaterial({

        color:
            0x102f38,

        metalness:
            .82,

        roughness:
            .17,

        clearcoat:
            1,

        clearcoatRoughness:
            .09,

        transparent:

/* =========================================================

const shellEdges =

        new THREE.EdgesGeometry(
            shellGeometry,

        ),

shellEdges.rotation.copy(
    shell.rotation

geode.add(

/* =========================================================
   CENTRAL CRYSTAL
   ========================================================= */

const crystalGeometry =
    new THREE.IcosahedronGeometry(
        .43,
        2
    );


const crystalMaterial =
    new THREE.MeshPhysicalMaterial({

        color:
            0x16a9bd,

        metalness:
            .38,

        roughness:
            .08,

        transmission:
            .25,

        thickness:
            .7,

        clearcoat:
            1,

        clearcoatRoughness:
            .04,

        emissive:
            0x00505f,

        emissiveIntensity:
            1.1

    });


const crystal =
    new THREE.Mesh(
        crystalGeometry,
        crystalMaterial
    );


geode.add(
    crystal

/* =========================================================
   CRYSTAL EDGES
   ========================================================= */

    new THREE.LineSegments(

        new THREE.EdgesGeometry(
            crystalGeometry
        ),

        new THREE.LineBasicMaterial({

            color:
                0xb9fbff,

            transparent:
                true,

            opacity:
                .9

        })

geode.add(
    crystalEdges

/* =========================================================
   INTERNAL CRYSTAL SHARDS
   ========================================================= */

const shards =
    new THREE.Group();


geode.add(
    shards
);


const shardMaterial =
    new THREE.MeshPhysicalMaterial({

        color:
            0x8bdde4,

        metalness:
            .55,

        roughness:
            .16,

        transparent:
            true,

        opacity:
            .64,

        emissive:
            0x003f4a,

        emissiveIntensity:
            .5

    });


for(
    let i=0;
    i<26;
    i++
){

    const radius =
        .50 +
        Math.random()*.54;


    const theta =
        Math.random() *
        Math.PI*2;


    const phi =
        Math.acos(
            2*Math.random()-1
        );


    const shard =
        new THREE.Mesh(

            new THREE.TetrahedronGeometry(
                .025 +
                Math.random()*.045,
                0
            ),

            shardMaterial

        );


    shard.position.set(

        radius *
        Math.sin(phi) *
        Math.cos(theta),

        radius *
        Math.sin(phi) *
        Math.sin(theta),

        radius *
        Math.cos(phi)

    );


    shard.rotation.set(

        Math.random()*Math.PI,

        Math.random()*Math.PI,

        Math.random()*Math.PI

    );


    shards.add(
        shard
    );

}


/* =========================================================
   PARTICLE FIELD
   ========================================================= */

const particleGeometry =
    new THREE.BufferGeometry();


const particlePositions =
    new Float32Array(
        260 * 3
    );


for(
    let i=0;
    i<260;
    i++
){

    const radius =
        .35 +
        Math.random()*1.10;


    const theta =
        Math.random() *
        Math.PI*2;


    const phi =
        Math.acos(
            2*Math.random()-1
        );


    particlePositions[
        i*3
    ] =
        radius *
        Math.sin(phi) *
        Math.cos(theta);


    particlePositions[
        i*3+1
    ] =
        radius *
        Math.sin(phi) *
        Math.sin(theta);


    particlePositions[
        i*3+2
    ] =
        radius *
        Math.cos(phi);

}


particleGeometry.setAttribute(

    "position",

    new THREE.BufferAttribute(
        particlePositions,
        3

);


const particleMaterial =
    new THREE.PointsMaterial({

            0x9ef8ff,

        size:
            .014,

        transparent:
            true,

            .65,

/* =========================================================
   RESIZE
   ========================================================= */

function resize(){

    const rect =
        canvas.getBoundingClientRect();


    const width =
        Math.max(
            1,
            rect.width
        );


    const height =
        Math.max(
            1,
            rect.height
        );


    renderer.setSize(
        width,
        height,
        false
    );


    camera.aspect =
        width/height;


    camera.updateProjectionMatrix();

}


window.addEventListener(
    "resize",
    resize,
    {passive:true}
);


resize();


/* =========================================================
   ANIMATION
   ========================================================= */

const clock =
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );


    const t =
        clock.getElapsedTime();


    /* ---------------------------------------------
       MAIN GEODE
       --------------------------------------------- */

    geode.rotation.y =
        t*.075;


    geode.rotation.x =
        Math.sin(t*.21)*.045;


    /* ---------------------------------------------
       OUTER FACETS
       --------------------------------------------- */

    outerEdges.rotation.y =
        -t*.025;


    /* ---------------------------------------------
       INNER SHELL
       --------------------------------------------- */

    shell.rotation.y =
        t*-.13;


    shell.rotation.z =
        Math.sin(t*.28)*.08;


    shellEdges.rotation.y =
        shell.rotation.y;


    shellEdges.rotation.z =
        shell.rotation.z;


    /* ---------------------------------------------
       CRYSTAL
       --------------------------------------------- */

    crystal.rotation.x =
        t*.16;


    crystal.rotation.y =
        t*.23;


    crystalEdges.rotation.x =
        crystal.rotation.x;


    crystalEdges.rotation.y =
        crystal.rotation.y;


    /* ---------------------------------------------
       SHARDS
       --------------------------------------------- */

    shards.rotation.y =
        -t*.16;


    shards.rotation.x =
        Math.sin(t*.17)*.06;


    /* ---------------------------------------------
       PARTICLES
       --------------------------------------------- */

    particles.rotation.y =
        -t*.045;


    particles.rotation.x =
        Math.sin(t*.13)*.03;


    /* ---------------------------------------------
       ORBITS
       --------------------------------------------- */

    orbit.rotation.z =
        t*.28;


    orbit.rotation.y =
        t*.19;


    goldOrbit.rotation.z =
        -t*.17;


    goldOrbit.rotation.y =
        t*.11;


    /* ---------------------------------------------
       CORE PULSE
       --------------------------------------------- */

    const pulse =
        1 +
        Math.sin(t*1.7)*.025;


    crystal.scale.setScalar(
        pulse
    );


    coreLight.intensity =
        14 +
        Math.sin(t*1.7)*2.5;


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =========================================================
   POINTER PARALLAX
   ========================================================= */

let targetX = 0;
let targetY = 0;

let currentX = 0;
let currentY = 0;


window.addEventListener(

    "pointermove",

    event => {

        targetX =
            (
                event.clientX /
                window.innerWidth -
                .5
            )*.16;


        targetY =
            (
                event.clientY /
                window.innerHeight -
                .5
            )*.12;

    },

    {passive:true}

);


function parallax(){

    currentX +=
        (
            targetX -
            currentX
        )*.035;


    currentY +=
        (
            targetY -
            currentY
        )*.035;


    geode.rotation.z =
        currentX;


    requestAnimationFrame(
        parallax
    );

}


parallax();


</script>
