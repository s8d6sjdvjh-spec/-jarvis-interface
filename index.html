<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>JARVIS — Gyrotourbillon</title>

<style>
:root{
  --cyan:#00d9ff;
  --cyan-soft:#62e8ff;
  --cyan-dim:#164e5c;
  --bg:#02080b;
  --panel:rgba(2,14,18,.78);
  --line:rgba(0,210,245,.48);
  --text:#d9f7ff;
  --muted:#47717d;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#020609;
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}

body{
  overflow-x:hidden;
}

/* =========================================================
   APP
   ========================================================= */

.jarvis{
  position:relative;
  width:100%;
  min-height:100svh;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 50% 39%,
      rgba(0,44,58,.22),
      transparent 38%
    ),
    #02080b;
}

/* grille très discrète */

.jarvis::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.24;
  background-image:
    linear-gradient(
      rgba(0,125,150,.17) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(0,125,150,.17) 1px,
      transparent 1px
    );
  background-size:54px 54px;
}

/* =========================================================
   HEADER
   ========================================================= */

.header{
  position:relative;
  z-index:20;

  display:flex;
  align-items:center;
  justify-content:space-between;

  width:100%;
  padding:
    calc(env(safe-area-inset-top) + 28px)
    42px
    0;
}

.brand{
  font-size:31px;
  font-weight:300;
  letter-spacing:.34em;
  white-space:nowrap;
}

.status{
  display:flex;
  align-items:center;
  gap:28px;

  color:#547782;
  font-size:12px;
  letter-spacing:.32em;
}

.status-item{
  display:flex;
  align-items:center;
  gap:9px;
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--cyan);
  box-shadow:
    0 0 7px var(--cyan),
    0 0 18px rgba(0,217,255,.55);
}

/* =========================================================
   TITRE
   ========================================================= */

.subtitle{
  position:relative;
  z-index:15;

  text-align:center;
  margin-top:76px;

  color:#3f6975;
  font-size:11px;
  letter-spacing:.44em;
  text-transform:uppercase;
}

/* =========================================================
   ZONE MÉCANISME
   ========================================================= */

.mechanism-area{
  position:relative;
  z-index:5;

  width:100%;
  height:clamp(560px, 67svh, 780px);

  margin-top:10px;

  display:flex;
  justify-content:center;
  align-items:flex-start;

  overflow:hidden;
}

#scene{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  display:block;
}

/* =========================================================
   CARTES
   ========================================================= */

.dashboard{
  position:relative;
  z-index:30;

  width:calc(100% - 84px);
  max-width:820px;

  margin:0 auto;

  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.card{
  height:118px;

  padding:25px 22px;

  border:1px solid var(--line);

  background:
    linear-gradient(
      135deg,
      rgba(5,27,34,.82),
      rgba(1,10,14,.73)
    );

  box-shadow:
    inset 0 0 35px rgba(0,190,220,.035);
}

.card-label{
  color:#4ea4b6;
  font-size:11px;
  letter-spacing:.35em;
  margin-bottom:14px;
}

.card-value{
  font-size:39px;
  font-weight:300;
  letter-spacing:.02em;
  line-height:1;
}

.card-description{
  margin-top:13px;
  color:#456875;
  font-size:11px;
  letter-spacing:.23em;
}

/* =========================================================
   PORTRAIT
   ========================================================= */

@media(max-width:600px){

  .header{
    padding-left:42px;
    padding-right:28px;
  }

  .brand{
    font-size:29px;
    letter-spacing:.29em;
  }

  .status{
    gap:14px;
    font-size:10px;
    letter-spacing:.22em;
  }

  .status-item{
    gap:6px;
  }

  .subtitle{
    margin-top:74px;
    font-size:9px;
    letter-spacing:.37em;
  }

  .mechanism-area{
    /*
      La scène possède volontairement une grande zone verticale,
      mais la géométrie elle-même est calculée sur la largeur.
    */
    height:clamp(570px, 63svh, 720px);
  }

  .dashboard{
    width:calc(100% - 84px);
    gap:12px;
  }

  .card{
    height:116px;
    padding:22px 20px;
  }

  .card-value{
    font-size:35px;
  }
}

@media(max-width:380px){

  .header{
    padding-left:28px;
  }

  .brand{
    font-size:25px;
  }

  .status{
    gap:8px;
    font-size:8px;
  }

  .dashboard{
    width:calc(100% - 56px);
  }
}

/* =========================================================
   PAYSAGE
   ========================================================= */

@media(min-width:700px){

  .mechanism-area{
    height:62vh;
  }

  .dashboard{
    max-width:900px;
  }
}
</style>
</head>

<body>

<div class="jarvis">

  <header class="header">

    <div class="brand">JARVIS</div>

    <div class="status">

      <div class="status-item">
        <span class="status-dot"></span>
        ONLINE
      </div>

      <div class="status-item">
        <span class="status-dot"></span>
        SECURE
      </div>

      <div class="status-item">
        <span class="status-dot"></span>
        VOICE
      </div>

    </div>

  </header>

  <div class="subtitle">
    GYROTOURBILLON&nbsp;&nbsp;·&nbsp;&nbsp;
    PRECISION CORE&nbsp;&nbsp;·&nbsp;&nbsp;
    3 AXIS
  </div>

  <main class="mechanism-area">
    <canvas id="scene"></canvas>
  </main>

  <section class="dashboard">

    <div class="card">
      <div class="card-label">MAISON</div>
      <div class="card-value">03</div>
      <div class="card-description">DISPOSITIFS ACTIFS</div>
    </div>

    <div class="card">
      <div class="card-label">MÉTÉO</div>
      <div class="card-value">18°</div>
      <div class="card-description">CONDITIONS STABLES</div>
    </div>

    <div class="card">
      <div class="card-label">SYSTÈME</div>
      <div class="card-value">82%</div>
      <div class="card-description">PERFORMANCE</div>
    </div>

    <div class="card">
      <div class="card-label">ACTIVITÉ</div>
      <div class="card-value">12</div>
      <div class="card-description">ÉVÉNEMENTS RÉCENTS</div>
    </div>

  </section>

</div>


<script type="module">

import * as THREE from
  "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


/* =========================================================
   CANVAS / RENDERER
   ========================================================= */

const canvas = document.getElementById("scene");

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias:true,
  alpha:true,
  powerPreference:"high-performance"
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio || 1, 2)
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;


/* =========================================================
   SCÈNE
   ========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x02080b);


/* caméra */

const camera = new THREE.PerspectiveCamera(
  32,
  1,
  0.1,
  100
);

camera.position.set(
  0,
  0,
  15
);


/* =========================================================
   LUMIÈRES
   ========================================================= */

const ambient = new THREE.AmbientLight(
  0x5d8d9a,
  1.15
);

scene.add(ambient);


const keyLight = new THREE.DirectionalLight(
  0xdffaff,
  5.2
);

keyLight.position.set(
  -4,
  5,
  7
);

scene.add(keyLight);


const cyanLight = new THREE.PointLight(
  0x00d9ff,
  14,
  16
);

cyanLight.position.set(
  -4,
  1,
  5
);

scene.add(cyanLight);


const warmLight = new THREE.PointLight(
  0xffb54a,
  4,
  12
);

warmLight.position.set(
  4,
  -3,
  4
);

scene.add(warmLight);


/* =========================================================
   MATIÈRES
   ========================================================= */

const steel = new THREE.MeshStandardMaterial({
  color:0x53646a,
  metalness:.96,
  roughness:.24
});

const darkSteel = new THREE.MeshStandardMaterial({
  color:0x11191d,
  metalness:.98,
  roughness:.19
});

const blackSteel = new THREE.MeshStandardMaterial({
  color:0x05090b,
  metalness:.98,
  roughness:.14
});

const titanium = new THREE.MeshStandardMaterial({
  color:0x7d969b,
  metalness:1,
  roughness:.18
});

const brass = new THREE.MeshStandardMaterial({
  color:0x936522,
  metalness:.96,
  roughness:.25
});

const cyanMaterial = new THREE.MeshStandardMaterial({
  color:0x0b5665,
  emissive:0x003c49,
  emissiveIntensity:.55,
  metalness:.8,
  roughness:.28
});


/*
  Rubis :
  sombre, translucide et légèrement lumineux.
  Il ne doit surtout pas ressembler à une LED rouge.
*/

const ruby = new THREE.MeshPhysicalMaterial({
  color:0x36040c,
  roughness:.12,
  metalness:.05,
  transmission:.72,
  thickness:.8,
  ior:1.7,
  clearcoat:1,
  clearcoatRoughness:.08
});


/* =========================================================
   UTILITAIRES
   ========================================================= */

function tubeRing(
  radius,
  tube,
  material,
  segments=128
){
  const geometry =
    new THREE.TorusGeometry(
      radius,
      tube,
      12,
      segments
    );

  return new THREE.Mesh(
    geometry,
    material
  );
}


function cylinder(
  radius,
  depth,
  material,
  radial=32
){
  return new THREE.Mesh(
    new THREE.CylinderGeometry(
      radius,
      radius,
      depth,
      radial
    ),
    material
  );
}


/* =========================================================
   COURONNES DE PRÉCISION
   ========================================================= */

const crownGroup = new THREE.Group();

scene.add(crownGroup);


/*
  IMPORTANT :
  toutes les dimensions principales sont calculées
  à partir de la largeur du viewport.

  gyro = 20 % de W
  première couronne = gyro + espace
  couronne extérieure = bord - marge
*/

let layout = {
  gyroRadius:1,
  firstRadius:2,
  outerRadius:4
};


function buildCrown(
  radius,
  tube,
  material,
  tickCount,
  phase=0
){

  const group = new THREE.Group();

  /* anneau mécanique */
  group.add(
    tubeRing(
      radius,
      tube,
      material,
      192
    )
  );


  /*
    couronne intérieure secondaire :
    très fine, légèrement décalée en profondeur.
  */

  group.add(
    tubeRing(
      radius - tube*2.2,
      tube*.18,
      cyanMaterial,
      192
    )
  );


  /*
    Graduations.
    Elles pointent vers le centre.
  */

  for(let i=0;i<tickCount;i++){

    const a =
      phase +
      (i/tickCount)*Math.PI*2;

    const major =
      i % 17 === 0;

    const medium =
      i % 5 === 0;

    const length =
      major
        ? tube*4.5
        : medium
          ? tube*2.9
          : tube*(1.25 + ((i*13)%7)*.17);

    const width =
      major
        ? tube*.36
        : tube*.20;

    const tickGeometry =
      new THREE.BoxGeometry(
        width,
        length,
        tube*.28
      );

    const tick =
      new THREE.Mesh(
        tickGeometry,
        major
          ? titanium
          : cyanMaterial
      );

    /*
      Dans le plan X/Y :
      les graduations sont radialement orientées.
    */

    const r =
      radius - tube*1.25 - length/2;

    tick.position.set(
      Math.cos(a)*r,
      Math.sin(a)*r,
      (i%3-1)*.012
    );

    /*
      La longueur pointe vers le centre.
    */

    tick.rotation.z =
      a - Math.PI/2;

    group.add(tick);


    /*
      Petits symboles ponctuels sur certaines graduations.
    */

    if(i % 17 === 0){

      const marker =
        new THREE.Mesh(
          new THREE.OctahedronGeometry(
            tube*.55,
            0
          ),
          steel
        );

      const mr =
        radius - tube*4.0;

      marker.position.set(
        Math.cos(a)*mr,
        Math.sin(a)*mr,
        .04
      );

      marker.rotation.z = a;

      group.add(marker);
    }
  }

  return group;
}


/* =========================================================
   GYROTOURBILLON
   ========================================================= */

const gyro = new THREE.Group();

scene.add(gyro);


/*
  Chaque axe possède son propre groupe.
  Cela permet le véritable mouvement sphérique.
*/

const axisX = new THREE.Group();
const axisY = new THREE.Group();
const axisZ = new THREE.Group();

gyro.add(axisX);
axisX.add(axisY);
axisY.add(axisZ);


/* =========================================================
   CAGE EXTÉRIEURE
   ========================================================= */

function createCage(radius){

  const cage = new THREE.Group();

  /*
    anneau principal
  */

  const ring =
    tubeRing(
      radius,
      radius*.075,
      darkSteel,
      96
    );

  cage.add(ring);


  /*
    seconde pièce métallique légèrement
    en arrière : donne de la profondeur.
  */

  const rear =
    tubeRing(
      radius*.86,
      radius*.035,
      steel,
      96
    );

  rear.rotation.x=.12;

  cage.add(rear);


  /*
    petits points de fixation
  */

  for(let i=0;i<8;i++){

    const a =
      i/8*Math.PI*2;

    const screw =
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          radius*.055,
          radius*.055,
          radius*.035,
          16
        ),
        blackSteel
      );

    screw.position.set(
      Math.cos(a)*radius,
      Math.sin(a)*radius,
      .04
    );

    screw.rotation.x=Math.PI/2;

    cage.add(screw);
  }


  return cage;
}


/* =========================================================
   AXES HORLOGERS
   ========================================================= */

function createAxis(
  radius,
  material
){

  const group =
    new THREE.Group();


  /*
    barre centrale fine.
  */

  const bar =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        radius*2,
        radius*.035,
        radius*.035
      ),
      material
    );

  group.add(bar);


  /*
    contre-pièce perpendiculaire.
  */

  const second =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        radius*.035,
        radius*2,
        radius*.035
      ),
      material
    );

  group.add(second);


  /*
    petits éléments de liaison.
  */

  for(let i=0;i<6;i++){

    const a =
      i/6*Math.PI*2;

    const p =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          radius*.035,
          radius*.20,
          radius*.035
        ),
        darkSteel
      );

    const r=radius*.63;

    p.position.set(
      Math.cos(a)*r,
      Math.sin(a)*r,
      0
    );

    p.rotation.z=a;

    group.add(p);
  }

  return group;
}


/* =========================================================
   MINI-ROUES DENTÉES
   ========================================================= */

function gear(
  radius,
  teeth,
  thickness,
  material
){

  const group =
    new THREE.Group();


  /*
    disque central.
  */

  const body =
    cylinder(
      radius*.72,
      thickness,
      material,
      48
    );

  body.rotation.x=Math.PI/2;

  group.add(body);


  /*
    dents individuelles.
  */

  for(let i=0;i<teeth;i++){

    const a =
      i/teeth*Math.PI*2;

    const tooth =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          radius*.12,
          radius*.24,
          thickness
        ),
        material
      );

    const r=radius*.92;

    tooth.position.set(
      Math.cos(a)*r,
      Math.sin(a)*r,
      0
    );

    tooth.rotation.z=a;

    group.add(tooth);
  }


  /*
    trou central.
  */

  const hub =
    tubeRing(
      radius*.23,
      radius*.045,
      darkSteel,
      48
    );

  group.add(hub);

  return group;
}


/* =========================================================
   CONSTRUCTION DU GYRO
   ========================================================= */

function rebuild(){

  while(crownGroup.children.length)
    crownGroup.remove(
      crownGroup.children[0]
    );

  while(gyro.children.length)
    gyro.remove(
      gyro.children[0]
    );

  gyro.add(axisX);
  axisX.add(axisY);
  axisY.add(axisZ);


  /*
    ---------------------------------------------------------
    CALCUL DE L'ÉCHELLE
    ---------------------------------------------------------
  */

  const width =
    renderer.domElement.clientWidth;

  /*
    20 % de la largeur de l'iPhone.
    Le diamètre du gyro correspond donc à :
    0.20 * largeur.
  */

  const gyroDiameter =
    width * .20;

  /*
    conversion largeur écran -> unité monde.
  */

  const worldPerPixel =
    8.8 / width;

  const gyroWorldRadius =
    gyroDiameter *
    worldPerPixel /
    2;

  /*
    0,7 cm approximativement en CSS px.
    Sur écran mobile on utilise 26 px comme
    approximation stable.
  */

  const gapPx=26;

  /*
    marge ≈ 1,2 cm.
    On conserve une marge visuelle importante
    et stable sur les différents iPhone.
  */

  const edgePx=44;

  const outerDiameterPx =
    width - edgePx*2;

  const outerWorldRadius =
    outerDiameterPx *
    worldPerPixel /
    2;

  const firstWorldRadius =
    gyroWorldRadius +
    gapPx*worldPerPixel;


  layout.gyroRadius =
    gyroWorldRadius;

  layout.firstRadius =
    firstWorldRadius;

  layout.outerRadius =
    outerWorldRadius;


  /* ---------------------------------------------------------
     COURONNES
     --------------------------------------------------------- */

  /*
    4 couronnes principales.
    La dernière reste nettement à l'intérieur
    des bords.
  */

  const radii=[
    firstWorldRadius,
    firstWorldRadius +
      (outerWorldRadius-firstWorldRadius)*.28,
    firstWorldRadius +
      (outerWorldRadius-firstWorldRadius)*.58,
    outerWorldRadius
  ];


  const tubes=[
    .035,
    .030,
    .026,
    .021
  ];


  radii.forEach((r,index)=>{

    const crown =
      buildCrown(
        r,
        tubes[index],
        index===0
          ? steel
          : darkSteel,
        index===0
          ? 96
          : 128,
        index*.17
      );

    /*
      chaque couronne reçoit une légère profondeur.
    */

    crown.position.z =
      -index*.035;

    crownGroup.add(crown);
  });


  /* ---------------------------------------------------------
     GYRO
     --------------------------------------------------------- */

  /*
    Cage extérieure.
  */

  axisZ.add(
    createCage(
      gyroWorldRadius
    )
  );


  /*
    axe principal.
  */

  axisZ.add(
    createAxis(
      gyroWorldRadius*.82,
      titanium
    )
  );


  /*
    petite roue dentée interne.
  */

  const g1 =
    gear(
      gyroWorldRadius*.50,
      28,
      gyroWorldRadius*.065,
      brass
    );

  g1.position.z=.07;

  axisZ.add(g1);


  /*
    seconde roue plus petite.
  */

  const g2 =
    gear(
      gyroWorldRadius*.32,
      20,
      gyroWorldRadius*.075,
      darkSteel
    );

  g2.position.z=.12;

  axisZ.add(g2);


  /*
    axe X
  */

  const cageX =
    createCage(
      gyroWorldRadius*.70
    );

  cageX.rotation.z=.28;

  axisX.add(cageX);


  /*
    axe Y
  */

  const cageY =
    createCage(
      gyroWorldRadius*.53
    );

  cageY.rotation.x=.5;

  axisY.add(cageY);


  /*
    micro-structure interne
  */

  for(let i=0;i<8;i++){

    const a =
      i/8*Math.PI*2;

    const spoke =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          gyroWorldRadius*.62,
          gyroWorldRadius*.018,
          gyroWorldRadius*.025
        ),
        i%2
          ? darkSteel
          : titanium
      );

    spoke.position.set(
      Math.cos(a)*
      gyroWorldRadius*.31,

      Math.sin(a)*
      gyroWorldRadius*.31,

      .17
    );

    spoke.rotation.z=a;

    axisZ.add(spoke);
  }


  /*
    RUBIS CENTRAL
  */

  const jewel =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        gyroWorldRadius*.105,
        32,
        24
      ),
      ruby
    );

  jewel.position.z=.28;

  axisZ.add(jewel);


  /*
    minuscule reflet du rubis,
    très faible — pas de halo rouge.
  */

  const rubyLight =
    new THREE.PointLight(
      0x7a0c20,
      .55,
      gyroWorldRadius*2
    );

  rubyLight.position.z=.45;

  axisZ.add(rubyLight);


  /*
    petites vis autour du centre.
  */

  for(let i=0;i<6;i++){

    const a =
      i/6*Math.PI*2;

    const screw =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          gyroWorldRadius*.025,
          12,
          8
        ),
        steel
      );

    const r =
      gyroWorldRadius*.38;

    screw.position.set(
      Math.cos(a)*r,
      Math.sin(a)*r,
      .31
    );

    axisZ.add(screw);
  }
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

function resize(){

  const rect =
    canvas.parentElement.getBoundingClientRect();

  const width =
    Math.max(1,rect.width);

  const height =
    Math.max(1,rect.height);

  renderer.setSize(
    width,
    height,
    false
  );

  camera.aspect =
    width/height;

  camera.updateProjectionMatrix();

  rebuild();
}

window.addEventListener(
  "resize",
  resize,
  {passive:true}
);


/* =========================================================
   ANIMATION
   ========================================================= */

let previous=performance.now();

function animate(now){

  requestAnimationFrame(animate);

  const dt =
    Math.min(
      .05,
      (now-previous)/1000
    );

  previous=now;


  /*
    COURONNES :
    mouvement très lent et différent
    pour éviter l'effet "simple cercle".
  */

  crownGroup.rotation.z += dt*.018;


  /*
    TROIS AXES INDÉPENDANTS.
  */

  axisX.rotation.x += dt*.82;

  axisY.rotation.y += dt*1.17;

  axisZ.rotation.z += dt*1.62;


  /*
    précession très lente de l'ensemble.
  */

  gyro.rotation.x =
    Math.sin(now*.00023)*.09;

  gyro.rotation.y =
    Math.cos(now*.00019)*.075;


  /*
    Les petites roues ont leurs propres mouvements.
  */

  axisZ.traverse(obj=>{

    if(
      obj.userData &&
      obj.userData.rotor
    ){
      obj.rotation.z +=
        dt*obj.userData.rotor;
    }

  });


  renderer.render(
    scene,
    camera
  );
}


/* =========================================================
   DÉMARRAGE
   ========================================================= */

resize();

requestAnimationFrame(
  animate
);

</script>

</body>
</html>
