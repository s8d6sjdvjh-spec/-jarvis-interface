<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>JARVIS — Voice Core</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020a0e;
    color:#d9faff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    position:fixed;
    inset:0;
}

/* =========================================================
   BACKGROUND
========================================================= */

#app{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 47%,
            rgba(0,185,215,.075) 0%,
            rgba(0,90,110,.035) 24%,
            transparent 52%),
        linear-gradient(rgba(10,105,125,.12) 1px,transparent 1px),
        linear-gradient(90deg,rgba(10,105,125,.12) 1px,transparent 1px),
        #020a0e;
    background-size:
        auto,
        38px 38px,
        38px 38px,
        auto;
}

#app:before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(rgba(50,180,200,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(50,180,200,.035) 1px,transparent 1px);
    background-size:10px 10px;
    mask-image:linear-gradient(
        to bottom,
        transparent,
        black 8%,
        black 90%,
        transparent
    );
}

/* =========================================================
   HEADER
========================================================= */

header{
    position:absolute;
    top:max(42px,env(safe-area-inset-top));
    left:0;
    width:100%;
    height:90px;
    padding:0 38px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    z-index:20;
}

.brand{
    font-size:30px;
    font-weight:300;
    letter-spacing:.38em;
    white-space:nowrap;
}

.status{
    display:flex;
    gap:25px;
    padding-top:9px;
    font-size:11px;
    letter-spacing:.35em;
    color:#7899a2;
    white-space:nowrap;
}

.status span{
    display:flex;
    align-items:center;
    gap:8px;
}

.status i{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#12dfff;
    box-shadow:
        0 0 8px #12dfff,
        0 0 18px rgba(18,223,255,.65);
}

.status .voice i{
    background:#68f7ff;
}

/* =========================================================
   TITLES
========================================================= */

.title{
    position:absolute;
    top:175px;
    width:100%;
    text-align:center;
    z-index:15;
    color:#6b9da8;
    letter-spacing:.42em;
    font-size:13px;
    font-weight:400;
}

.subtitle{
    position:absolute;
    top:211px;
    width:100%;
    text-align:center;
    color:#315b65;
    font-size:9px;
    letter-spacing:.42em;
    z-index:15;
}

/* =========================================================
   MAIN CORE AREA
========================================================= */

#visual{
    position:absolute;
    left:50%;
    top:46%;
    width:min(94vw,720px);
    aspect-ratio:1;
    transform:translate(-50%,-50%);
    z-index:5;
}

#visualGlow{
    position:absolute;
    inset:8%;
    border-radius:50%;
    background:
        radial-gradient(circle,
            rgba(0,225,255,.12),
            rgba(0,150,190,.035) 35%,
            transparent 68%);
    filter:blur(14px);
    transform:scale(1);
    transition:transform .08s linear;
}

svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:visible;
}

/* =========================================================
   FOUR FIXED RINGS
========================================================= */

.ring{
    transform-origin:50% 50%;
    transform-box:fill-box;
}

.ring-base{
    fill:none;
    stroke:#18d9ef;
    stroke-width:2.2;
    opacity:.72;
    filter:url(#cyanGlow);
}

.ring-secondary{
    fill:none;
    stroke:#54f4ff;
    stroke-width:1;
    opacity:.42;
}

.ring-thin{
    fill:none;
    stroke:#217b8b;
    stroke-width:.7;
    opacity:.65;
}

.ring-gold{
    fill:none;
    stroke:#c79c42;
    stroke-width:1.5;
    opacity:.65;
}

.ring-violet{
    fill:none;
    stroke:#8e75ff;
    stroke-width:1;
    opacity:.58;
}

/* =========================================================
   CENTRAL CRYSTAL
========================================================= */

#crystalGroup{
    transform-origin:50% 50%;
    transform-box:fill-box;
}

.crystal-shell{
    fill:
        radial-gradient(
            circle at 35% 30%,
            rgba(190,255,255,.48),
            rgba(0,110,135,.25) 28%,
            rgba(0,20,30,.68) 72%
        );
    stroke:#7ff7ff;
    stroke-width:1.4;
    opacity:.95;
    filter:url(#crystalGlow);
}

.facet{
    fill:none;
    stroke:#61e9f5;
    stroke-width:.8;
    opacity:.55;
}

.facet2{
    fill:rgba(34,214,230,.045);
    stroke:#2e9eae;
    stroke-width:.65;
}

.core-light{
    fill:#c9ffff;
    filter:url(#coreGlow);
}

.core-text{
    fill:#d8fbff;
    font-size:13px;
    letter-spacing:5px;
    text-anchor:middle;
}

.core-state{
    fill:#61949d;
    font-size:7px;
    letter-spacing:3px;
    text-anchor:middle;
}

/* =========================================================
   AUDIO BAR
========================================================= */

#audioLine{
    position:absolute;
    top:calc(46% + min(47vw,360px));
    left:50%;
    transform:translateX(-50%);
    width:min(58vw,300px);
    height:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:3px;
    z-index:20;
}

.bar{
    width:3px;
    height:5px;
    background:#1eddf2;
    box-shadow:0 0 7px rgba(30,221,242,.7);
    border-radius:2px;
    transition:height .045s linear;
}

/* =========================================================
   COMMAND AREA
========================================================= */

#command{
    position:absolute;
    top:calc(46% + min(51vw,390px));
    left:7%;
    width:86%;
    min-height:70px;
    border-top:1px solid rgba(47,194,213,.35);
    border-bottom:1px solid rgba(47,194,213,.35);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:20;
}

.command-state{
    font-size:9px;
    letter-spacing:.4em;
    color:#507b84;
}

.command-text{
    margin-top:9px;
    min-height:22px;
    max-width:90%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    color:#c9faff;
    font-size:15px;
    letter-spacing:.08em;
}

/* =========================================================
   BUTTONS
========================================================= */

.controls{
    position:absolute;
    bottom:max(46px,calc(env(safe-area-inset-bottom) + 24px));
    left:4%;
    width:92%;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    z-index:30;
}

button{
    min-height:64px;
    border:1px solid rgba(24,222,244,.75);
    background:
        linear-gradient(
            135deg,
            rgba(9,54,64,.55),
            rgba(2,15,21,.8)
        );
    color:#bceef4;
    font:inherit;
    letter-spacing:.17em;
    font-size:10px;
    cursor:pointer;
    box-shadow:
        inset 0 0 18px rgba(0,210,240,.035),
        0 0 10px rgba(0,180,220,.04);
}

button:active{
    transform:scale(.97);
}

button.active{
    border-color:#54f6ff;
    box-shadow:
        0 0 16px rgba(0,229,255,.25),
        inset 0 0 20px rgba(0,229,255,.09);
}

button small{
    display:block;
    margin-top:5px;
    color:#527d86;
    letter-spacing:.1em;
}

/* =========================================================
   RESPONSIVE IPHONE
========================================================= */

@media(max-width:430px){

    header{
        padding-left:30px;
        padding-right:20px;
    }

    .brand{
        font-size:27px;
        letter-spacing:.32em;
    }

    .status{
        gap:13px;
        font-size:8px;
        letter-spacing:.24em;
    }

    .title{
        top:174px;
        font-size:11px;
        letter-spacing:.29em;
        white-space:nowrap;
    }

    .subtitle{
        top:205px;
        font-size:7px;
        letter-spacing:.32em;
    }

    #visual{
        width:92vw;
        top:45%;
    }

    #command{
        top:calc(45% + 47vw);
    }

    #audioLine{
        top:calc(45% + 43vw);
    }

    .controls{
        bottom:calc(env(safe-area-inset-bottom) + 24px);
    }

    button{
        min-height:61px;
        font-size:9px;
        letter-spacing:.13em;
    }
}

/* =========================================================
   LARGE PHONES
========================================================= */

@media(min-height:850px) and (max-width:430px){

    #visual{
        top:43%;
        width:94vw;
    }

    #audioLine{
        top:calc(43% + 45vw);
    }

    #command{
        top:calc(43% + 49vw);
    }
}
</style>
</head>

<body>

<!-- =====================================================

<script>

/* =========================================================
   BASIC ELEMENTS
========================================================= */

const visual =
    document.getElementById("visual");

const glow =
    document.getElementById("visualGlow");

const crystal =
    document.getElementById("crystalGroup");

const coreLight =
    document.getElementById("coreLight");

const coreState =
    document.getElementById("coreState");

const commandState =
    document.getElementById("commandState");

const commandText =
    document.getElementById("commandText");

const micButton =
    document.getElementById("micButton");

const shortcutButton =
    document.getElementById("shortcutButton");

const voiceButton =
    document.getElementById("voiceButton");

const ring1 =
    document.getElementById("ring1");

const ring2 =
    document.getElementById("ring2");

const ring3 =
    document.getElementById("ring3");

const ring4 =
    document.getElementById("ring4");

const artifacts =
    document.getElementById("artifacts");

const audioLine =
    document.getElementById("audioLine");


/* =========================================================
   AUDIO BARS
========================================================= */

const bars=[];

for(let i=0;i<36;i++){

    const b=document.createElement("div");

    b.className="bar";

    audioLine.appendChild(b);

    bars.push(b);
}


/* =========================================================
   RING TICKS
========================================================= */

function createTicks(target,count,radius){

    const group=document.getElementById(target);

    for(let i=0;i<count;i++){

        const angle=(i/count)*Math.PI*2;

        const major=i%10===0;

        const r1=radius-(major?15:7);
        const r2=radius+1;

        const x1=500+Math.cos(angle)*r1;
        const y1=500+Math.sin(angle)*r1;

        const x2=500+Math.cos(angle)*r2;
        const y2=500+Math.sin(angle)*r2;

        const line=
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "line"
            );

        line.setAttribute("x1",x1);
        line.setAttribute("y1",y1);
        line.setAttribute("x2",x2);
        line.setAttribute("y2",y2);

        line.setAttribute(
            "stroke",
            major ? "#d6fbff" : "#38c9d8"
        );

        line.setAttribute(
            "stroke-width",
            major ? "2" : ".7"
        );

        line.setAttribute(
            "opacity",
            major ? ".9" : ".55"
        );

        group.appendChild(line);
    }
}

createTicks("ticks1",120,178);
createTicks("ticks2",144,235);
createTicks("ticks3",180,295);
createTicks("ticks4",216,355);


/* =========================================================
   NUMBERS
========================================================= */

function createNumbers(target,radius,step){

    const group=document.getElementById(target);

    for(let i=0;i<360;i+=step){

        const angle=(i-90)*Math.PI/180;

        const x=500+
            Math.cos(angle)*radius;

        const y=500+
            Math.sin(angle)*radius;

        const text=
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "text"
            );

        text.setAttribute("x",x);
        text.setAttribute("y",y);

        text.setAttribute(
            "fill",
            i%90===0
                ? "#c9fbff"
                : "#5c9da7"
        );

        text.setAttribute(
            "font-family",
            "monospace"
        );

        text.setAttribute(
            "font-size",
            i%90===0 ? "12" : "8"
        );

        text.setAttribute(
            "text-anchor",
            "middle"
        );

        text.setAttribute(
            "dominant-baseline",
            "middle"
        );

        text.textContent=
            String(i).padStart(3,"0");

        group.appendChild(text);
    }
}

createNumbers("numbers1",160,30);
createNumbers("numbers2",217,30);
createNumbers("numbers3",276,30);
createNumbers("numbers4",336,30);

/* =========================================================
   ROTATION
========================================================= */

let rot1=0;
let rot2=0;
let rot3=0;
let rot4=0;

let lastTime=performance.now();

function rotate(){

    const now=performance.now();

    const dt=(now-lastTime)/1000;

    lastTime=now;

    rot1+=dt*3.0;
    rot2-=dt*2.1;
    rot3+=dt*1.25;
    rot4-=dt*.65;

    ring1.style.transform=
        `rotate(${rot1}deg)`;

    ring2.style.transform=
        `rotate(${rot2}deg)`;

    ring3.style.transform=
        `rotate(${rot3}deg)`;

    ring4.style.transform=
        `rotate(${rot4}deg)`;

    requestAnimationFrame(rotate);
}

rotate();


/* =========================================================
   AUDIO ENGINE
========================================================= */

let audioContext=null;
let analyser=null;
let microphone=null;
let audioData=null;

let audioLevel=0;
let targetLevel=0;

let listening=false;


/* =========================================================
   START MICROPHONE
========================================================= */

async function startAudio(){

    try{

        const stream=
            await navigator.mediaDevices.getUserMedia({
                audio:{
                    echoCancellation:true,
                    noiseSuppression:true,
                    autoGainControl:true
                }
            });

        audioContext=
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        analyser=
            audioContext.createAnalyser();

        analyser.fftSize=512;

        analyser.smoothingTimeConstant=.55;

        microphone=
            audioContext.createMediaStreamSource(stream);

        microphone.connect(analyser);

        audioData=
            new Uint8Array(
                analyser.fftSize
            );

        listening=true;

        micButton.classList.add("active");

        commandState.textContent=
            "VOICE SYSTEM · LISTENING";

        coreState.textContent=
            "LISTENING";

        listenLoop();

    }catch(error){

        commandState.textContent=
            "MICROPHONE · ACCESS REQUIRED";

        console.error(error);
    }
}


/* =========================================================
   AUDIO LOOP
========================================================= */

function listenLoop(){

    if(!analyser){

        requestAnimationFrame(
            listenLoop
        );

        return;
    }

    analyser.getByteTimeDomainData(
        audioData
    );

    let sum=0;

    for(
        let i=0;
        i<audioData.length;
        i++
    ){

        const v=
            (audioData[i]-128)/128;

        sum+=v*v;
    }

    const rms=
        Math.sqrt(
            sum/audioData.length
        );

    /*
       VERY IMPORTANT:
       amplification intentionally high so
       normal speech produces visible movement.
    */

    targetLevel=
        Math.min(
            1,
            Math.max(
                0,
                (rms-.015)*5.8
            )
        );

    /*
       Fast attack / slower release.
    */

    if(targetLevel>audioLevel){

        audioLevel +=
            (targetLevel-audioLevel)*.42;

    }else{

        audioLevel +=
            (targetLevel-audioLevel)*.075;
    }

    updateVisual(audioLevel);

    requestAnimationFrame(
        listenLoop
    );
}


/* =========================================================
   VISUAL AUDIO REACTION
========================================================= */

function updateVisual(level){

    /*
       The rings NEVER move sideways.
       Only their scale / spacing changes.
    */

    const pulse=
        1+
        level*.17;

    const inner=
        1+
        level*.24;

    ring1.style.transform=
        `rotate(${rot1}deg) scale(${inner})`;

    ring2.style.transform=
        `rotate(${rot2}deg) scale(${pulse})`;

    ring3.style.transform=
        `rotate(${rot3}deg) scale(${pulse*1.015})`;

    ring4.style.transform=
        `rotate(${rot4}deg) scale(${pulse*1.03})`;

    /*
       Crystal breathes with voice.
    */

    const crystalScale=
        1+
        level*.16;

    crystal.style.transform=
        `scale(${crystalScale})`;

    /*
       Glow.
    */

    glow.style.transform=
        `scale(${1+level*.45})`;

    /*
       Central light.
    */

    coreLight.setAttribute(
        "r",
        7+level*13
    );

    /*
       Bars.
    */

    bars.forEach((bar,i)=>{

        const wave=
            Math.sin(
                i*.75+
                performance.now()*.006
            );

        const height=
            Math.max(
                4,
                5+
                level*42*
                Math.max(
                    0,
                    wave
                )
            );

        bar.style.height=
            `${height}px`;
    });

    /*
       Visual state.
    */

    if(level>.08){

        coreState.textContent=
            "LISTENING";

        commandState.textContent=
            "VOICE SYSTEM · RECEIVING";

    }else{

        coreState.textContent=
            listening
                ? "READY"
                : "STANDBY";

        commandState.textContent=
            listening
                ? "VOICE SYSTEM · READY"
                : "VOICE SYSTEM · STANDBY";
    }
}


/* =========================================================
   MICROPHONE BUTTON
========================================================= */

micButton.addEventListener(
    "click",
    async ()=>{

        if(!listening){

            await startAudio();

        }else{

            listening=false;

            micButton.classList.remove(
                "active"
            );

            commandState.textContent=
                "VOICE SYSTEM · STANDBY";

            coreState.textContent=
                "STANDBY";
        }
    }
);


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

const SpeechRecognition=
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition=null;

if(SpeechRecognition){

    recognition=
        new SpeechRecognition();

    recognition.lang="fr-FR";

    recognition.continuous=true;

    recognition.interimResults=true;

    recognition.onstart=()=>{

        commandState.textContent=
            "VOICE SYSTEM · RECOGNIZING";

    };

    recognition.onresult=(event)=>{

        let finalText="";

        let interimText="";

        for(
            let i=event.resultIndex;
            i<event.results.length;
            i++
        ){

            const result=
                event.results[i];

            const text=
                result[0].transcript;

            if(result.isFinal){

                finalText+=text;

            }else{

                interimText+=text;
            }
        }

        const display=
            finalText ||
            interimText;

        if(display){

            commandText.textContent=
                display.trim();

            commandState.textContent=
                finalText
                    ? "VOICE SYSTEM · COMMAND CAPTURED"
                    : "VOICE SYSTEM · LISTENING";
        }
    };

    recognition.onerror=(event)=>{

        commandState.textContent=
            "VOICE SYSTEM · READY";

        console.log(
            "Speech recognition:",
            event.error
        );
    };

    recognition.onend=()=>{

        if(listening){

            try{
                recognition.start();
            }catch(e){}
        }
    };

}else{

    commandState.textContent=
        "VOICE SYSTEM · SPEECH API UNAVAILABLE";
}


/* =========================================================
   RECOGNITION START
========================================================= */

micButton.addEventListener(
    "click",
    ()=>{

        if(
            recognition &&
            !recognition.started
        ){

            try{

                recognition.start();

                recognition.started=true;

            }catch(e){}
        }
    }
);

        /*

           Remplace "JARVIS" par le nom exact

        */

    }
);


/* =========================================================
   SYNTHETIC VOICE
========================================================= */

voiceButton.addEventListener(
    "click",
    ()=>{

        const text=
            commandText.textContent.trim();

        if(
            !text ||
            text==="EN ATTENTE DE COMMANDE"
        ){

            speak(
                "Je suis prêt."
            );

        }else{

            speak(
                text
            );
        }
    }
);

function speak(text){

    if(!("speechSynthesis" in window)){

        return;
    }

    window.speechSynthesis.cancel();

    const utterance=
        new SpeechSynthesisUtterance(text);

    utterance.lang="fr-FR";

    utterance.rate=.94;

    utterance.pitch=.78;

    utterance.volume=1;

    utterance.onstart=()=>{

        commandState.textContent=
            "VOICE SYSTEM · SPEAKING";

        coreState.textContent=
            "OUTPUT";

    };

    utterance.onend=()=>{

        commandState.textContent=
            listening
                ? "VOICE SYSTEM · READY"
                : "VOICE SYSTEM · STANDBY";

        coreState.textContent=
            listening
                ? "READY"
                : "STANDBY";
    };

    window.speechSynthesis.speak(
        utterance
    );
}


/* =========================================================
   INITIAL STATE
========================================================= */

commandText.textContent=
    "EN ATTENTE DE COMMANDE";

coreState.textContent=
    "STANDBY";


/* =========================================================
   IDLE CRYSTAL ANIMATION
========================================================= */

let idleTime=0;

function idleCrystal(){

    idleTime+=.016;

    if(!listening || audioLevel<.02){

        const breathe=
            1+
            Math.sin(idleTime*1.4)*.018;

        crystal.style.transform=
            `scale(${breathe})`;

        coreLight.setAttribute(
            "r",
            7+
            Math.sin(idleTime*1.4)*1.5
        );
    }

    requestAnimationFrame(
        idleCrystal
    );
}

idleCrystal();


/* =========================================================
   PREVENT DOUBLE TAP ZOOM
========================================================= */

let lastTouch=0;

document.addEventListener(
    "touchend",
    function(event){

        const now=
            Date.now();

        if(
            now-lastTouch<=300
        ){

            event.preventDefault();
        }

        lastTouch=now;
    },
    {passive:false}
);
