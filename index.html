<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<title>JARVIS — Gyrotourbillon</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #01070a;
  color: #d8f8ff;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
}

body {
  position: relative;
}

#app {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 42%,
      rgba(0,48,63,.16) 0%,
      rgba(0,12,17,.08) 32%,
      rgba(0,0,0,0) 58%),
    #01070a;
}

/* grille très discrète */
#app::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: .16;
  background-image:
    linear-gradient(rgba(45,177,201,.10) 1px, transparent 1px),
    linear-gradient(90deg, rgba(45,177,201,.10) 1px, transparent 1px);
  background-size: 72px 72px;
  pointer-events: none;
}

/* ---------------------------------------
   HEADER
--------------------------------------- */

.header {
  position: absolute;
  z-index: 20;
  top: max(28px, env(safe-area-inset-top));
  left: 0;
  right: 0;
  height: 72px;
  padding: 0 7vw;

  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: clamp(23px, 6vw, 34px);
  font-weight: 300;
  letter-spacing: .38em;
  white-space: nowrap;
}

.status {
  display: flex;
  gap: clamp(16px, 4vw, 34px);
  font-size: 10px;
  letter-spacing: .32em;
  color: rgba(186,225,235,.58);
}

.statusItem {
  display: flex;
  align-items: center;
  gap: 8px;
}

.statusDot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #00dfff;
  box-shadow:
    0 0 5px #00dfff,
    0 0 14px rgba(0,223,255,.65);
}

/* ---------------------------------------
   TITRE
--------------------------------------- */

.subtitle {
  position: absolute;
  z-index: 15;
  top: 18.5vh;
  left: 0;
  width: 100%;
  text-align: center;

  font-size: clamp(8px, 2.4vw, 13px);
  letter-spacing: .48em;
  color: rgba(106,188,205,.52);
}

/* ---------------------------------------
   CANVAS
--------------------------------------- */

#scene {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

/* ---------------------------------------
   PANNEAUX
--------------------------------------- */

.panels {
  position: absolute;
  z-index: 25;

  left: 5.5vw;
  right: 5.5vw;
  bottom: max(72px, calc(env(safe-area-inset-bottom) + 52px));

  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.panel {
  min-height: 104px;
  padding: 20px 18px 16px;

  border: 1px solid rgba(0,188,225,.48);

  background:
    linear-gradient(
      135deg,
      rgba(0,35,45,.34),
      rgba(0,10,15,.48)
    );

  box-shadow:
    inset 0 0 25px rgba(0,125,150,.035),
    0 0 16px rgba(0,150,180,.025);

  backdrop-filter: blur(5px);
}

.panelLabel {
  font-size: 10px;
  letter-spacing: .42em;
  color: rgba(117,202,219,.70);
  margin-bottom: 12px;
}

.panelValue {
  font-size: clamp(28px, 7vw, 42px);
  font-weight: 300;
  letter-spacing: .04em;
}

.panelInfo {
  margin-top: 7px;
  font-size: 9px;
  letter-spacing: .25em;
  color: rgba(137,190,201,.42);
}

/* ---------------------------------------
   MOBILE
--------------------------------------- */

@media (max-width: 600px) {

  .header {
    top: max(20px, env(safe-area-inset-top));
    padding: 0 6vw;
  }

  .logo {
    font-size: 24px;
    letter-spacing: .34em;
  }

  .status {
    gap: 13px;
    font-size: 8px;
    letter-spacing: .22em;
  }

  .statusDot {
    width: 6px;
    height: 6px;
  }

  .subtitle {
    top: 19.2vh;
    font-size: 8px;
    letter-spacing: .38em;
  }

  .panels {
    bottom: max(62px, calc(env(safe-area-inset-bottom) + 46px));
    gap: 12px;
  }

  .panel {
    min-height: 101px;
    padding: 17px 14px 13px;
  }

  .panelLabel {
    font-size: 8px;
    margin-bottom: 10px;
  }

  .panelValue {
    font-size: 30px;
  }

  .panelInfo {
    font-size: 7px;
  }
}
</style>
</head>

<body>

<div id="app">

  <div class="header">
    <div class="logo">JARVIS</div>

    <div class="status">
      <div class="statusItem">
        <span class="statusDot"></span>
        ONLINE
      </div>

      <div class="statusItem">
        <span class="statusDot"></span>
        SECURE
      </div>

      <div class="statusItem">
        <span class="statusDot"></span>
        VOICE
      </div>
    </div>
  </div>

  <div class="subtitle">
    GYROTOURBILLON&nbsp;&nbsp;·&nbsp;&nbsp;PRECISION CORE&nbsp;&nbsp;·&nbsp;&nbsp;3 AXIS
  </div>

  <canvas id="scene"></canvas>

  <div class="panels">

    <div class="panel">
      <div class="panelLabel">MAISON</div>
      <div class="panelValue">03</div>
      <div class="panelInfo">DISPOSITIFS ACTIFS</div>
    </div>

    <div class="panel">
      <div class="panelLabel">MÉTÉO</div>
      <div class="panelValue">18°</div>
      <div class="panelInfo">CONDITIONS STABLES</div>
    </div>

    <div class="panel">
      <div class="panelLabel">SYSTÈME</div>
      <div class="panelValue">82%</div>
      <div class="panelInfo">PERFORMANCE</div>
    </div>

    <div class="panel">
      <div class="panelLabel">ACTIVITÉ</div>
      <div class="panelValue">12</div>
      <div class="panelInfo">ÉVÉNEMENTS RÉCENTS</div>
    </div>

  </div>

</div>


<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>


<script type="module">

import * as THREE from "three";


/* =========================================================
   JARVIS — GYROTOURBILLON
   ---------------------------------------------------------
   Architecture :
   - couronnes holographiques
   - cage extérieure
   - cage intermédiaire
   - cage intérieure
   - axes X/Y/Z indépendants
   - ponts horlogers
   - roues dentées
   - rubis central
   - pièces plates chanfreinées
========================================================= */


/* ---------------------------------------------------------
   SCÈNE
--------------------------------------------------------- */

const canvas = document.getElementById("scene");

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  alpha: true,
  powerPreference: "high-performance"
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;


const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  35,
  window.innerWidth / window.innerHeight,
  .1,
  100
);

camera.position.set(0, 0, 10);


/* ---------------------------------------------------------
   LUMIÈRES
--------------------------------------------------------- */

scene.add(
  new THREE.AmbientLight(
    0x12313a,
    1.2
  )
);

const cyanLight = new THREE.PointLight(
  0x5eefff,
  15,
  15
);

cyanLight.position.set(
  -3,
  4,
  5
);

scene.add(cyanLight);


const whiteLight = new THREE.PointLight(
  0xffffff,
  11,
  12
);

whiteLight.position.set(
  3,
  2,
  4
);

scene.add(whiteLight);


const warmLight = new THREE.PointLight(
  0xffb347,
  4,
  9
);

warmLight.position.set(
  -2,
  -3,
  4
);

scene.add(warmLight);


/* =========================================================
   MATIÈRES
========================================================= */

const metalDark = new THREE.MeshStandardMaterial({
  color: 0x10171a,
  metalness: .94,
  roughness: .28
});

const metalSteel = new THREE.MeshStandardMaterial({
  color: 0x88969a,
  metalness: 1,
  roughness: .20
});

const metalBright = new THREE.MeshStandardMaterial({
  color: 0xd4dde0,
  metalness: 1,
  roughness: .13
});

const metalBlack = new THREE.MeshStandardMaterial({
  color: 0x05090b,
  metalness: .92,
  roughness: .22
});

const gold = new THREE.MeshStandardMaterial({
  color: 0x9c6718,
  metalness: 1,
  roughness: .20
});

const rubyMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x5c0712,
  metalness: .05,
  roughness: .08,
  transmission: .72,
  thickness: .55,
  ior: 1.75,
  clearcoat: 1,
  clearcoatRoughness: .08
});


/* =========================================================
   GROUPE PRINCIPAL
========================================================= */

const system = new THREE.Group();

scene.add(system);


/* =========================================================
   OUTER HOLOGRAPHIC CROWNS
========================================================= */

const crownGroup = new THREE.Group();

system.add(crownGroup);


/*
  Le gyrotourbillon représente environ 20 %
  de la largeur de l'écran.

  Les couronnes occupent la majeure partie
  de la zone supérieure sans toucher les bords.
*/

function makeRing(radius, thickness, material) {

  const geometry = new THREE.RingGeometry(
    radius - thickness,
    radius,
    160
  );

  const mesh = new THREE.Mesh(
    geometry,
    material
  );

  return mesh;
}


const holoMaterial = new THREE.MeshBasicMaterial({
  color: 0x36d7ec,
  transparent: true,
  opacity: .23,
  side: THREE.DoubleSide
});


const holoFine = new THREE.MeshBasicMaterial({
  color: 0x6fefff,
  transparent: true,
  opacity: .34,
  side: THREE.DoubleSide
});


/* Trois couronnes principales */

const crown1 = makeRing(
  3.72,
  .018,
  holoMaterial
);

const crown2 = makeRing(
  3.28,
  .014,
  holoFine
);

const crown3 = makeRing(
  2.84,
  .012,
  holoMaterial
);

crownGroup.add(
  crown1,
  crown2,
  crown3
);


/* ---------------------------------------------------------
   GRADUATIONS RADIALES
--------------------------------------------------------- */

function createGraduations(
  radius,
  count,
  innerLength,
  outerLength
) {

  const group = new THREE.Group();

  const material = new THREE.LineBasicMaterial({
    color: 0x58d9e9,
    transparent: true,
    opacity: .45
  });

  for (let i = 0; i < count; i++) {

    const angle =
      (i / count) * Math.PI * 2;

    /*
      longueur volontairement irrégulière
      pour éviter l'aspect numérique parfaitement uniforme
    */

    const variation =
      0.55 +
      Math.abs(
        Math.sin(i * 7.13)
      ) * .45;

    const inner =
      radius - innerLength * variation;

    const outer =
      radius + outerLength * variation;

    const x1 =
      Math.cos(angle) * inner;

    const y1 =
      Math.sin(angle) * inner;

    const x2 =
      Math.cos(angle) * outer;

    const y2 =
      Math.sin(angle) * outer;

    const geometry =
      new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(x1, y1, .02),
        new THREE.Vector3(x2, y2, .02)
      ]);

    group.add(
      new THREE.Line(
        geometry,
        material
      )
    );
  }

  return group;
}


crownGroup.add(
  createGraduations(
    3.68,
    128,
    .075,
    .075
  )
);

crownGroup.add(
  createGraduations(
    3.27,
    104,
    .065,
    .065
  )
);

crownGroup.add(
  createGraduations(
    2.83,
    88,
    .055,
    .055
  )
);


/* ---------------------------------------------------------
   PETITS SYMBOLS / POINTS HOLOGRAPHIQUES
--------------------------------------------------------- */

function createMarkers(radius, count) {

  const group = new THREE.Group();

  for (let i = 0; i < count; i++) {

    const angle =
      i / count * Math.PI * 2;

    const r =
      radius +
      Math.sin(i * 2.77) * .025;

    const geometry =
      new THREE.BoxGeometry(
        .035,
        .035,
        .012
      );

    const material =
      new THREE.MeshBasicMaterial({
        color:
          i % 7 === 0
            ? 0xc9faff
            : 0x1fa9ba,
        transparent: true,
        opacity: .65
      });

    const marker =
      new THREE.Mesh(
        geometry,
        material
      );

    marker.position.set(
      Math.cos(angle) * r,
      Math.sin(angle) * r,
      .03
    );

    group.add(marker);
  }

  return group;
}

crownGroup.add(
  createMarkers(3.53, 96)
);


/* =========================================================
   GYROTOURBILLON
========================================================= */

const gyro = new THREE.Group();

system.add(gyro);


/*
  Taille cible :
  environ 20 % de la largeur de l'iPhone
  en portrait.

  On ajuste légèrement selon l'écran.
*/

function updateGyroScale() {

  const portrait =
    window.innerHeight >= window.innerWidth;

  const target =
    portrait
      ? 0.20
      : 0.25;

  /*
    La caméra donne une taille indépendante
    du nombre de pixels.
  */

  gyro.scale.setScalar(
    target * 10
  );
}

updateGyroScale();


/* ---------------------------------------------------------
   GÉOMÉTRIE DE CAGE PLATE
--------------------------------------------------------- */

function createCageRing(
  radius,
  width,
  depth,
  material
) {

  const shape = new THREE.Shape();

  const outer =
    radius + width / 2;

  const inner =
    radius - width / 2;

  shape.absarc(
    0,
    0,
    outer,
    0,
    Math.PI * 2,
    false
  );

  const hole =
    new THREE.Path();

  hole.absarc(
    0,
    0,
    inner,
    0,
    Math.PI * 2,
    true
  );

  shape.holes.push(hole);

  const geometry =
    new THREE.ExtrudeGeometry(
      shape,
      {
        depth,
        bevelEnabled: true,
        bevelSegments: 2,
        bevelSize: width * .12,
        bevelThickness: depth * .12,
        curveSegments: 96
      }
    );

  geometry.center();

  return new THREE.Mesh(
    geometry,
    material
  );
}


/* =========================================================
   CAGE 1 — AXE Z
========================================================= */

const cageZ = new THREE.Group();

gyro.add(cageZ);

const ringZ =
  createCageRing(
    1.00,
    .095,
    .10,
    metalDark
  );

cageZ.add(ringZ);


/* ---------------------------------------------------------
   Ponts fins de la cage Z
--------------------------------------------------------- */

function createBridge(
  length,
  width,
  depth,
  material
) {

  const geometry =
    new THREE.BoxGeometry(
      length,
      width,
      depth
    );

  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );

  return mesh;
}


const bridgeZ1 =
  createBridge(
    1.92,
    .055,
    .065,
    metalSteel
  );

bridgeZ1.rotation.z =
  Math.PI / 2;

cageZ.add(bridgeZ1);


const bridgeZ2 =
  createBridge(
    1.92,
    .045,
    .060,
    metalBright
  );

bridgeZ2.rotation.z =
  Math.PI / 4;

cageZ.add(bridgeZ2);


/* =========================================================
   CAGE 2 — AXE X
========================================================= */

const cageX = new THREE.Group();

cageZ.add(cageX);

const ringX =
  createCageRing(
    .78,
    .085,
    .085,
    metalSteel
  );

cageX.add(ringX);


/*
  Cage elliptique visuelle :
  la cage reste circulaire en géométrie,
  mais son orientation dans l'espace
  crée l'ellipse en projection.
*/

cageX.rotation.y =
  Math.PI / 2;


/* Ponts */

const bridgeX =
  createBridge(
    1.48,
    .045,
    .055,
    metalBright
  );

bridgeX.rotation.z =
  Math.PI / 6;

cageX.add(bridgeX);


/* =========================================================
   CAGE 3 — AXE Y
========================================================= */

const cageY = new THREE.Group();

cageX.add(cageY);

const ringY =
  createCageRing(
    .59,
    .072,
    .075,
    metalDark
  );

cageY.add(ringY);

cageY.rotation.x =
  Math.PI / 2;


/* Ponts extrêmement fins */

const bridgeY1 =
  createBridge(
    1.10,
    .035,
    .045,
    metalBright
  );

bridgeY1.rotation.z =
  Math.PI / 3;

cageY.add(bridgeY1);


const bridgeY2 =
  createBridge(
    1.08,
    .028,
    .040,
    gold
  );

bridgeY2.rotation.z =
  -Math.PI / 5;

cageY.add(bridgeY2);


/* =========================================================
   MICRO-ROUES DENTÉES
========================================================= */

function createGear(
  radius,
  teeth,
  thickness,
  material
) {

  const group =
    new THREE.Group();

  /*
    Roue centrale
  */

  const disc =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        radius,
        radius,
        thickness,
        64
      ),
      material
    );

  disc.rotation.x =
    Math.PI / 2;

  group.add(disc);


  /*
    Dents individuelles
  */

  for (let i = 0; i < teeth; i++) {

    const angle =
      i / teeth * Math.PI * 2;

    const tooth =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          radius * .16,
          radius * .34,
          thickness * 1.05
        ),
        material
      );

    const r =
      radius * 1.10;

    tooth.position.set(
      Math.cos(angle) * r,
      Math.sin(angle) * r,
      0
    );

    tooth.rotation.z =
      angle;

    group.add(tooth);
  }

  return group;
}


const gearOuter =
  createGear(
    .32,
    28,
    .055,
    metalBright
  );

cageY.add(gearOuter);


const gearInner =
  createGear(
    .20,
    22,
    .05,
    gold
  );

cageY.add(gearInner);


/* =========================================================
   BALANCIER / CŒUR DU TOURBILLON
========================================================= */

const escapement =
  new THREE.Group();

cageY.add(escapement);


/* petit cercle mécanique */

const escapementRing =
  createCageRing(
    .38,
    .038,
    .05,
    metalBright
  );

escapement.add(
  escapementRing
);


/* bras */

for (let i = 0; i < 4; i++) {

  const arm =
    createBridge(
      .62,
      .025,
      .035,
      i % 2
        ? metalSteel
        : gold
    );

  arm.rotation.z =
    i * Math.PI / 2;

  escapement.add(arm);
}


/* =========================================================
   RUBIS CENTRAL
========================================================= */

const ruby =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .105,
      32,
      24
    ),
    rubyMaterial
  );

escapement.add(ruby);


/*
  Petite pierre interne plus sombre.
*/

const rubyCore =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .045,
      20,
      16
    ),
    new THREE.MeshPhysicalMaterial({
      color: 0x230006,
      metalness: .1,
      roughness: .03,
      transmission: .85,
      thickness: .3,
      ior: 1.8
    })
  );

ruby.add(rubyCore);


/* =========================================================
   AXES MÉCANIQUES
========================================================= */

function createAxis(
  length,
  material
) {

  const geometry =
    new THREE.CylinderGeometry(
      .018,
      .018,
      length,
      16
    );

  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );

  return mesh;
}


/* axe X */

const axisX =
  createAxis(
    2.05,
    metalBright
  );

axisX.rotation.z =
  Math.PI / 2;

cageZ.add(axisX);


/* axe Y */

const axisY =
  createAxis(
    1.75,
    metalSteel
  );

axisY.rotation.x =
  Math.PI / 2;

cageZ.add(axisY);


/* axe Z */

const axisZ =
  createAxis(
    1.85,
    gold
  );

cageZ.add(axisZ);


/* =========================================================
   PETITES VIS / PALIERS
========================================================= */

function addPivot(
  parent,
  x,
  y,
  z,
  radius = .035
) {

  const pivot =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        radius,
        radius,
        .025,
        24
      ),
      metalBright
    );

  pivot.rotation.x =
    Math.PI / 2;

  pivot.position.set(
    x,
    y,
    z
  );

  parent.add(pivot);
}


/* positions visibles */

addPivot(
  cageZ,
  0,
  1.0,
  .08
);

addPivot(
  cageZ,
  0,
  -1.0,
  .08
);

addPivot(
  cageX,
  .78,
  0,
  .05
);

addPivot(
  cageX,
  -.78,
  0,
  .05
);


/* =========================================================
   PETITES GRADUATIONS MÉCANIQUES
========================================================= */

function addFineTicks(
  parent,
  radius,
  count
) {

  const group =
    new THREE.Group();

  const material =
    new THREE.MeshStandardMaterial({
      color: 0xa8b9bc,
      metalness: 1,
      roughness: .32
    });

  for (
    let i = 0;
    i < count;
    i++
  ) {

    const angle =
      i / count *
      Math.PI * 2;

    const length =
      i % 5 === 0
        ? .075
        : .045;

    const tick =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .012,
          length,
          .012
        ),
        material
      );

    const r =
      radius;

    tick.position.set(
      Math.cos(angle) * r,
      Math.sin(angle) * r,
      .065
    );

    tick.rotation.z =
      angle;

    group.add(tick);
  }

  parent.add(group);
}

addFineTicks(
  gearOuter,
  .325,
  48
);


/* =========================================================
   ROTATIONS
========================================================= */

let lastTime =
  performance.now();

function animate(now) {

  requestAnimationFrame(animate);

  const dt =
    Math.min(
      (now - lastTime) / 1000,
      .05
    );

  lastTime = now;


  /*
    Trois axes indépendants.

    Les vitesses sont volontairement
    différentes pour rendre le mouvement
    perceptible sur iPhone.
  */

  cageZ.rotation.z +=
    dt * .34;

  cageX.rotation.x +=
    dt * .61;

  cageY.rotation.y +=
    dt * .87;


  /*
    mécanisme interne
  */

  gearOuter.rotation.z +=
    dt * 1.05;

  gearInner.rotation.z -=
    dt * 1.42;

  escapement.rotation.z +=
    dt * 1.85;


  /*
    très légère respiration de l'ensemble
    pour donner une sensation de système vivant
  */

  const breathing =
    1 +
    Math.sin(now * .00065) * .008;

  gyro.scale.setScalar(
    gyro.userData.baseScale *
    breathing
  );


  renderer.render(
    scene,
    camera
  );
}


/* =========================================================
   POSITIONNEMENT RESPONSIVE
========================================================= */

function layout() {

  const w =
    window.innerWidth;

  const h =
    window.innerHeight;

  const portrait =
    h >= w;


  camera.aspect =
    w / h;

  camera.updateProjectionMatrix();


  /*
    Zone du mécanisme :
    centre de la moitié supérieure.

    Les panneaux restent en dessous.
  */

  gyro.position.x = 0;

  gyro.position.y =
    portrait
      ? .15
      : .05;


  /*
    Base de taille.

    On évite le problème des versions précédentes
    où le gyrotourbillon devenait énorme ou minuscule
    selon l'orientation.
  */

  const baseScale =
    portrait
      ? 1.18
      : 1.45;

  gyro.userData.baseScale =
    baseScale;

  gyro.scale.setScalar(
    baseScale
  );


  /*
    Couronnes :
    légèrement comprimées en paysage,
    grandes et proches du gyro en portrait.
  */

  crownGroup.scale.set(
    portrait ? 1.0 : .88,
    portrait ? 1.0 : .88,
    1
  );
}


window.addEventListener(
  "resize",
  () => {

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    layout();
  },
  { passive: true }
);


layout();


/* =========================================================
   INTERACTION TACTILE DISCRÈTE
========================================================= */

let touchX = 0;
let touchY = 0;

window.addEventListener(
  "touchstart",
  event => {

    const t =
      event.touches[0];

    touchX =
      t.clientX;

    touchY =
      t.clientY;
  },
  { passive: true }
);


window.addEventListener(
  "touchmove",
  event => {

    const t =
      event.touches[0];

    const dx =
      t.clientX - touchX;

    const dy =
      t.clientY - touchY;

    gyro.rotation.y +=
      dx * .0009;

    gyro.rotation.x +=
      dy * .0009;

    touchX =
      t.clientX;

    touchY =
      t.clientY;
  },
  { passive: true }
);


/* lancement */

animate(
  performance.now()
);

</script>
