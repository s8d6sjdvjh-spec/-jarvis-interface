<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
viewport-fit=cover">

<title>JARVIS — Geode Core</title>

<style>

:root{
  --bg:#02070a;
  --cyan:#16dcff;
  --cyan2:#75efff;
  --cyan3:#0a7894;
  --text:#dffaff;
  --muted:#527783;
  --panel:rgba(2,16,22,.82);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}

body{
  overscroll-behavior:none;
}

#app{
  position:fixed;
  inset:0;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 39%,
      rgba(0,100,130,.22),
      transparent 34%
    ),
    radial-gradient(
      circle at 50% 42%,
      rgba(0,35,50,.25),
      transparent 55%
    ),
    #02070a;
}

/* ---------------------------------------------------------
   GRID
--------------------------------------------------------- */

#grid{
  position:absolute;
  inset:0;

  opacity:.27;

  background-image:
    linear-gradient(
      rgba(25,111,128,.18) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(25,111,128,.18) 1px,
      transparent 1px
    );

  background-size:
    44px 44px;

  pointer-events:none;
}

/* ---------------------------------------------------------
   TOP BAR
--------------------------------------------------------- */

#topbar{
  position:absolute;
  z-index:20;

  top:0;
  left:0;
  right:0;

  height:94px;

  padding:
    env(safe-area-inset-top)
    22px
    0
    22px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  pointer-events:none;
}

.brand{
  font-size:17px;
  font-weight:300;
  letter-spacing:.55em;
  white-space:nowrap;
}

.status{
  display:flex;
  align-items:center;
  gap:14px;
}

.statusItem{
  display:flex;
  align-items:center;
  gap:6px;

  color:#5e858e;

  font-size:8px;
  letter-spacing:.27em;

  white-space:nowrap;
}

.dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#18ddff;

  box-shadow:
    0 0 8px #18ddff,
    0 0 18px rgba(24,221,255,.55);
}

/* ---------------------------------------------------------
   SUBTITLE
--------------------------------------------------------- */

#subtitle{
  position:absolute;
  z-index:15;

  top:104px;
  left:0;
  right:0;

  text-align:center;

  color:#51818d;

  font-size:9px;
  letter-spacing:.38em;

  white-space:nowrap;

  pointer-events:none;
}

/* ---------------------------------------------------------
   3D AREA
--------------------------------------------------------- */

#scene{
  position:absolute;

  left:0;
  right:0;

  top:118px;
  bottom:255px;

  overflow:hidden;
}

#three{
  width:100%;
  height:100%;

  display:block;
}

/* ---------------------------------------------------------
   CENTRAL LABEL
--------------------------------------------------------- */

#coreLabel{
  position:absolute;

  z-index:16;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  text-align:center;

  pointer-events:none;

  color:rgba(175,241,252,.72);

  font-size:8px;
  letter-spacing:.34em;

  text-shadow:
    0 0 10px rgba(22,220,255,.5);
}

#coreLabel strong{
  display:block;

  margin-bottom:5px;

  color:#d8fbff;

  font-size:11px;
  font-weight:300;

  letter-spacing:.42em;
}

#coreLabel span{
  opacity:.55;
}

/* ---------------------------------------------------------
   CORE STATUS
--------------------------------------------------------- */

#activity{
  position:absolute;

  z-index:15;

  top:137px;
  left:50%;

  transform:translateX(-50%);

  color:#406c77;

  font-size:7px;

  letter-spacing:.32em;

  white-space:nowrap;

  pointer-events:none;
}

/* ---------------------------------------------------------
   PANELS
--------------------------------------------------------- */

#panels{
  position:absolute;

  z-index:30;

  left:20px;
  right:20px;

  bottom:28px;

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:9px;
}

.panel{
  min-height:87px;

  padding:
    14px
    13px
    12px;

  border:
    1px solid
    rgba(18,202,235,.40);

  background:
    linear-gradient(
      145deg,
      rgba(8,38,47,.78),
      rgba(1,10,14,.82)
    );

  box-shadow:
    inset 0 0 24px
    rgba(0,150,190,.055),

    0 0 18px
    rgba(0,120,160,.025);
}

.panelTitle{
  color:#55bfd2;

  font-size:8px;

  letter-spacing:.36em;

  margin-bottom:10px;
}

.panelValue{
  color:#d9faff;

  font-size:25px;

  font-weight:300;

  line-height:1;
}

.panelSub{
  margin-top:9px;

  color:#4e7780;

  font-size:8px;

  letter-spacing:.16em;
}

/* ---------------------------------------------------------
   SMALL SCREEN ADAPTATION
--------------------------------------------------------- */

@media(max-width:380px){

  .brand{
    font-size:14px;
  }

  .status{
    gap:8px;
  }

  .statusItem{
    font-size:7px;
    letter-spacing:.20em;
  }

  #subtitle{
    font-size:7px;
  }

}

</style>
</head>


<body>

<div id="app">

  <div id="grid"></div>

  <header id="topbar">

    <div class="brand">
      J A R V I S
    </div>

    <div class="status">

      <div class="statusItem">
        <span class="dot"></span>
        ONLINE
      </div>

      <div class="statusItem">
        <span class="dot"></span>
        SECURE
      </div>

      <div class="statusItem">
        <span class="dot"></span>
        VOICE
      </div>

    </div>

  </header>


  <div id="subtitle">
    GEODE CORE · CRYSTALLINE MATRIX · 3D
  </div>


  <div id="scene">

    <canvas id="three"></canvas>

    <div id="coreLabel">
      <strong>CORE</strong>
      <span>ACTIVE</span>
    </div>

  </div>


  <div id="activity">
    CRYSTALLINE SYSTEM · ACTIVE
  </div>


  <section id="panels">

    <div class="panel">

      <div class="panelTitle">
        MAISON
      </div>

      <div class="panelValue">
        03
      </div>

      <div class="panelSub">
        DISPOSITIFS ACTIFS
      </div>

    </div>


    <div class="panel">

      <div class="panelTitle">
        MÉTÉO
      </div>

      <div class="panelValue">
        18°
      </div>

      <div class="panelSub">
        CONDITIONS STABLES
      </div>

    </div>


    <div class="panel">

      <div class="panelTitle">
        SYSTÈME
      </div>

      <div class="panelValue">
        82%
      </div>

      <div class="panelSub">
        PERFORMANCE
      </div>

    </div>


    <div class="panel">

      <div class="panelTitle">
        ACTIVITÉ
      </div>

      <div class="panelValue">
        12
      </div>

      <div class="panelSub">
        ÉVÉNEMENTS RÉCENTS
      </div>

    </div>

  </section>

</div>


<!-- ======================================================
     THREE.JS
====================================================== -->

<script type="importmap">
{
  "imports":{
    "three":
    "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js"
  }
}
</script>


<script type="module">

import * as THREE from "three";


/* ======================================================
   CANVAS
====================================================== */

const canvas =
  document.getElementById("three");


/* ======================================================
   RENDERER
====================================================== */

const renderer =
  new THREE.WebGLRenderer({

    canvas:canvas,

    antialias:true,

    alpha:true,

    powerPreference:
      "high-performance"

  });


renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio || 1,
    2
  )
);


renderer.outputColorSpace =
  THREE.SRGBColorSpace;


renderer.toneMapping =
  THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
  1.18;


/* ======================================================
   SCENE
====================================================== */

const scene =
  new THREE.Scene();


scene.background =
  new THREE.Color(
    0x02070a
  );


/* ======================================================
   CAMERA
====================================================== */

const camera =
  new THREE.PerspectiveCamera(
    32,
    1,
    0.1,
    100
  );


camera.position.set(
  0,
  0,
  7.8
);


camera.lookAt(
  0,
  0,
  0
);


/* ======================================================
   ENVIRONMENT
====================================================== */

function createEnvironment(){

  const c =
    document.createElement(
      "canvas"
    );

  c.width = 512;
  c.height = 256;

  const ctx =
    c.getContext("2d");


  const gradient =
    ctx.createLinearGradient(
      0,
      0,
      0,
      256
    );


  gradient.addColorStop(
    0,
    "#071b23"
  );


  gradient.addColorStop(
    .35,
    "#02090d"
  );


  gradient.addColorStop(
    .65,
    "#061820"
  );


  gradient.addColorStop(
    1,
    "#010406"
  );


  ctx.fillStyle =
    gradient;

  ctx.fillRect(
    0,
    0,
    512,
    256
  );


  const strips = [

    [50,90,.22],
    [160,50,.14],
    [270,120,.26],
    [405,45,.18],
    [475,35,.12]

  ];


  for(
    const strip of strips
  ){

    const g =
      ctx.createLinearGradient(
        strip[0],
        0,
        strip[0]+strip[1],
        0
      );


    g.addColorStop(
      0,
      "rgba(30,210,255,0)"
    );


    g.addColorStop(
      .5,
      `rgba(100,235,255,${strip[2]})`
    );


    g.addColorStop(
      1,
      "rgba(30,210,255,0)"
    );


    ctx.fillStyle = g;


    ctx.fillRect(
      strip[0],
      0,
      strip[1],
      256
    );

  }


  const texture =
    new THREE.CanvasTexture(c);


  texture.mapping =
    THREE.EquirectangularReflectionMapping;


  texture.colorSpace =
    THREE.SRGBColorSpace;


  scene.environment =
    texture;

}


createEnvironment();


/* ======================================================
   LIGHTING
====================================================== */

const ambient =
  new THREE.HemisphereLight(
    0x72ddff,
    0x010304,
    1.7
  );


scene.add(
  ambient
);


const key =
  new THREE.DirectionalLight(
    0xffffff,
    4.2
  );


key.position.set(
  -4,
  5,
  6
);


scene.add(
  key
);


const cyanLight =
  new THREE.PointLight(
    0x12ddff,
    14,
    9
  );


cyanLight.position.set(
  3,
  1,
  3
);


scene.add(
  cyanLight
);


const cyanLight2 =
  new THREE.PointLight(
    0x008cff,
    10,
    7
  );


cyanLight2.position.set(
  -3,
  -2,
  2
);


scene.add(
  cyanLight2
);


const coreLight =
  new THREE.PointLight(
    0x18eaff,
    18,
    4
  );


coreLight.position.set(
  0,
  0,
  1
);


scene.add(
  coreLight
);


/* ======================================================
   ORBE ROOT
====================================================== */

const geode =
  new THREE.Group();


scene.add(
  geode
);


/* ======================================================
   OUTER GEODE
====================================================== */

const outerGeometry =
  new THREE.IcosahedronGeometry(
    1.78,
    4
  );


const outerMaterial =
  new THREE.MeshPhysicalMaterial({

    color:
      0x163d48,

    metalness:
      .78,

    roughness:
      .23,

    clearcoat:
      .85,

    clearcoatRoughness:
      .14,

    transmission:
      .05,

    transparent:
      true,

    opacity:
      .82,

    envMapIntensity:
      2.4

  });


const outerMesh =
  new THREE.Mesh(
    outerGeometry,
    outerMaterial
  );


geode.add(
  outerMesh
);


/* ======================================================
   FACET EDGES
====================================================== */

const edgeGeometry =
  new THREE.EdgesGeometry(
    outerGeometry,
    22
  );


const edgeMaterial =
  new THREE.LineBasicMaterial({

    color:
      0x25dfff,

    transparent:
      true,

    opacity:
      .72

  });


const outerEdges =
  new THREE.LineSegments(
    edgeGeometry,
    edgeMaterial
  );


outerEdges.scale.setScalar(
  1.002
);


geode.add(
  outerEdges
);


/* ======================================================
   SECOND INNER CRYSTAL SHELL
====================================================== */

const innerGeometry =
  new THREE.IcosahedronGeometry(
    1.34,
    3
  );


const innerMaterial =
  new THREE.MeshPhysicalMaterial({

    color:
      0x0a2530,

    metalness:
      .88,

    roughness:
      .17,

    clearcoat:
      1,

    clearcoatRoughness:
      .08,

    transparent:
      true,

    opacity:
      .76,

    envMapIntensity:
      2.8

  });


const innerMesh =
  new THREE.Mesh(
    innerGeometry,
    innerMaterial
  );


innerMesh.rotation.set(
  .35,
  .2,
  .15
);


geode.add(
  innerMesh
);


/* ======================================================
   INNER CRYSTAL WIREFRAME
====================================================== */

const innerEdgesGeometry =
  new THREE.EdgesGeometry(
    innerGeometry,
    18
  );


const innerEdgesMaterial =
  new THREE.LineBasicMaterial({

    color:
      0x6defff,

    transparent:
      true,

    opacity:
      .54

  });


const innerEdges =
  new THREE.LineSegments(
    innerEdgesGeometry,
    innerEdgesMaterial
  );


innerEdges.rotation.copy(
  innerMesh.rotation
);


geode.add(
  innerEdges
);


/* ======================================================
   CENTRAL CRYSTAL
====================================================== */

const coreGeometry =
  new THREE.IcosahedronGeometry(
    .58,
    2
  );


const coreMaterial =
  new THREE.MeshPhysicalMaterial({

    color:
      0x08768b,

    metalness:
      .35,

    roughness:
      .08,

    transmission:
      .32,

    transparent:
      true,

    opacity:
      .92,

    clearcoat:
      1,

    clearcoatRoughness:
      .04,

    emissive:
      0x004f62,

    emissiveIntensity:
      1.25

  });


const core =
  new THREE.Mesh(
    coreGeometry,
    coreMaterial
  );


geode.add(
  core
);


/* ======================================================
   CORE EDGES
====================================================== */

const coreEdges =
  new THREE.LineSegments(

    new THREE.EdgesGeometry(
      coreGeometry
    ),

    new THREE.LineBasicMaterial({

      color:
        0xb2faff,

      transparent:
        true,

      opacity:
        .88

    })

  );


geode.add(
  coreEdges
);


/* ======================================================
   CRYSTAL NODES
====================================================== */

const nodeGeometry =
  new THREE.SphereGeometry(
    .027,
    8,
    8
  );


const nodeMaterial =
  new THREE.MeshBasicMaterial({

    color:
      0x8ff7ff

  });


const nodes =
  new THREE.Group();


geode.add(
  nodes
);


const nodeCount =
  100;


for(
  let i=0;
  i<nodeCount;
  i++
){

  const p =
    new THREE.Vector3();

  const u =
    Math.random();

  const v =
    Math.random();

  const theta =
    2*Math.PI*u;

  const phi =
    Math.acos(
      2*v-1
    );


  const radius =
    1.78 +
    (Math.random()-.5)*.025;


  p.x =
    radius *
    Math.sin(phi) *
    Math.cos(theta);


  p.y =
    radius *
    Math.sin(phi) *
    Math.sin(theta);


  p.z =
    radius *
    Math.cos(phi);


  const node =
    new THREE.Mesh(
      nodeGeometry,
      nodeMaterial
    );


  node.position.copy(
    p
  );


  nodes.add(
    node
  );

}


/* ======================================================
   INTERNAL PARTICLES
====================================================== */

const particleGeometry =
  new THREE.BufferGeometry();


const particlePositions =
  new Float32Array(
    420 * 3
  );


for(
  let i=0;
  i<420;
  i++
){

  const radius =
    .55 +
    Math.random()*1.55;


  const theta =
    Math.random() *
    Math.PI * 2;


  const phi =
    Math.acos(
      2*Math.random()-1
    );


  particlePositions[
    i*3
  ] =
    radius *
    Math.sin(phi) *
    Math.cos(theta);


  particlePositions[
    i*3+1
  ] =
    radius *
    Math.sin(phi) *
    Math.sin(theta);


  particlePositions[
    i*3+2
  ] =
    radius *
    Math.cos(phi);

}


particleGeometry.setAttribute(
  "position",
  new THREE.BufferAttribute(
    particlePositions,
    3
  )
);


const particleMaterial =
  new THREE.PointsMaterial({

    color:
      0x35dfff,

    size:
      .018,

    transparent:
      true,

    opacity:
      .72,

    blending:
      THREE.AdditiveBlending

  });


const particles =
  new THREE.Points(
    particleGeometry,
    particleMaterial
  );


geode.add(
  particles
);


/* ======================================================
   VERY SUBTLE AURA
====================================================== */

const auraGeometry =
  new THREE.SphereGeometry(
    1.92,
    32,
    32
  );


const auraMaterial =
  new THREE.MeshBasicMaterial({

    color:
      0x007f9c,

    transparent:
      true,

    opacity:
      .055,

    side:
      THREE.BackSide,

    blending:
      THREE.AdditiveBlending

  });


const aura =
  new THREE.Mesh(
    auraGeometry,
    auraMaterial
  );


geode.add(
  aura
);


/* ======================================================
   SCALE
====================================================== */

geode.scale.setScalar(
  .96
);


/* ======================================================
   RESIZE
====================================================== */

function resize(){

  const rect =
    canvas.getBoundingClientRect();


  const width =
    Math.max(
      1,
      rect.width
    );


  const height =
    Math.max(
      1,
      rect.height
    );


  renderer.setSize(
    width,
    height,
    false
  );


  camera.aspect =
    width / height;


  camera.updateProjectionMatrix();

}


window.addEventListener(
  "resize",
  resize,
  {passive:true}
);


resize();


/* ======================================================
   ANIMATION
====================================================== */

const clock =
  new THREE.Clock();


function animate(){

  requestAnimationFrame(
    animate
  );


  const t =
    clock.getElapsedTime();


  /*
     Rotation lente de plusieurs
     couches indépendantes.
  */

  geode.rotation.y =
    t * .105;


  geode.rotation.x =
    Math.sin(t*.23) * .075;


  outerEdges.rotation.y =
    -t * .018;


  innerMesh.rotation.y =
    t * -.17;


  innerMesh.rotation.z =
    Math.sin(t*.31)*.09;


  innerEdges.rotation.y =
    innerMesh.rotation.y;


  core.rotation.x =
    t * .19;


  core.rotation.y =
    t * .27;


  coreEdges.rotation.x =
    core.rotation.x;


  coreEdges.rotation.y =
    core.rotation.y;


  particles.rotation.y =
    -t * .045;


  particles.rotation.x =
    Math.sin(t*.17)*.04;


  nodes.rotation.y =
    t * .055;


  /*
     Pulsation extrêmement légère
     du noyau lumineux.
  */

  const pulse =
    1 +
    Math.sin(t*1.8)*.035;


  core.scale.setScalar(
    pulse
  );


  coreLight.intensity =
    16 +
    Math.sin(t*1.8)*3;


  renderer.render(
    scene,
    camera
  );

}


animate();


/* ======================================================
   TOUCH INTERACTION
====================================================== */

let targetX = 0;
let targetY = 0;

let currentX = 0;
let currentY = 0;


window.addEventListener(
  "pointermove",
  event => {

    const x =
      event.clientX /
      window.innerWidth;


    const y =
      event.clientY /
      window.innerHeight;


    targetX =
      (x-.5)*.22;


    targetY =
      (y-.5)*.16;

  },
  {passive:true}
);


function interaction(){

  currentX +=
    (targetX-currentX)*.035;


  currentY +=
    (targetY-currentY)*.035;


  geode.rotation.z =
    currentX;


  geode.rotation.x +=
    currentY*.002;


  requestAnimationFrame(
    interaction
  );

}


interaction();

</script>

</body>
</html>
