<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>JARVIS — Gyrotourbillon Precision Core</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#01070a;
    color:#d9faff;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
                 "Helvetica Neue",Arial,sans-serif;
}

#app{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 42%,
            rgba(0,155,190,.09),
            transparent 30%),
        #01070a;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

/* ---------------- HEADER ---------------- */

.header{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:82px;
    z-index:10;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 7vw;

    background:linear-gradient(
        to bottom,
        rgba(1,7,10,.92),
        rgba(1,7,10,.45),
        transparent
    );
}

.logo{
    font-size:21px;
    letter-spacing:.48em;
    font-weight:300;
    color:#e4fbff;
}

.status{
    display:flex;
    gap:24px;
    font-size:10px;
    letter-spacing:.32em;
    color:#7698a3;
}

.status span{
    display:flex;
    align-items:center;
    gap:8px;
}

.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#16d9ff;
    box-shadow:
        0 0 8px #16d9ff,
        0 0 20px rgba(22,217,255,.7);
}

/* ---------------- LABEL ---------------- */

.subtitle{
    position:absolute;
    top:112px;
    left:0;
    right:0;
    z-index:5;
    text-align:center;

    font-size:10px;
    letter-spacing:.42em;
    color:#4f7480;
}

/* ---------------- PANELS ---------------- */

.panels{
    position:absolute;
    z-index:8;
    left:4.5vw;
    right:4.5vw;
    bottom:7vh;

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px 18px;
}

.panel{
    height:112px;

    border:1px solid rgba(0,196,231,.46);

    background:
        linear-gradient(
            135deg,
            rgba(4,35,43,.52),
            rgba(1,10,14,.62)
        );

    box-shadow:
        inset 0 0 25px rgba(0,150,180,.045),
        0 0 18px rgba(0,100,130,.035);

    padding:18px 18px 14px;
}

.panel-title{
    font-size:10px;
    letter-spacing:.36em;
    color:#63b8ca;
    margin-bottom:10px;
}

.panel-value{
    font-size:31px;
    font-weight:300;
    color:#d8faff;
    line-height:1;
}

.panel-info{
    margin-top:11px;
    font-size:9px;
    letter-spacing:.19em;
    color:#557984;
}

/* ---------------- SMALL CORE INDICATOR ---------------- */

.core-status{
    position:absolute;
    z-index:9;
    left:50%;
    bottom:2.8vh;
    transform:translateX(-50%);

    width:58px;
    height:58px;
    border-radius:50%;

    border:1px solid rgba(24,210,244,.7);

    box-shadow:
        0 0 20px rgba(0,205,255,.18),
        inset 0 0 18px rgba(0,205,255,.08);

    display:flex;
    align-items:center;
    justify-content:center;
}

.core-status::before{
    content:"";
    width:11px;
    height:11px;
    border-radius:50%;
    background:#d9fbff;
    box-shadow:
        0 0 5px #fff,
        0 0 18px #00d9ff;
}

/* ---------------- MOBILE ---------------- */

@media(max-width:600px){

    .header{
        height:70px;
        padding:0 5vw;
    }

    .logo{
        font-size:18px;
        letter-spacing:.42em;
    }

    .status{
        gap:11px;
        font-size:8px;
        letter-spacing:.20em;
    }

    .subtitle{
        top:91px;
        font-size:8px;
        letter-spacing:.27em;
    }

    .panels{
        bottom:6vh;
        gap:10px 12px;
        left:4vw;
        right:4vw;
    }

    .panel{
        height:92px;
        padding:13px 14px;
    }

    .panel-title{
        font-size:8px;
        margin-bottom:8px;
    }

    .panel-value{
        font-size:27px;
    }

    .panel-info{
        margin-top:8px;
        font-size:7px;
    }

    .core-status{
        width:50px;
        height:50px;
        bottom:1.8vh;
    }
}
</style>
</head>

<body>

<div id="app">

    <div class="header">
        <div class="logo">JARVIS</div>

        <div class="status">
            <span><i class="dot"></i>ONLINE</span>
            <span><i class="dot"></i>SECURE</span>
            <span><i class="dot"></i>VOICE</span>
        </div>
    </div>

    <div class="subtitle">
        GYROTOURBILLON&nbsp;&nbsp;·&nbsp;&nbsp;PRECISION CORE&nbsp;&nbsp;·&nbsp;&nbsp;3 AXIS
    </div>

    <div class="panels">

        <div class="panel">
            <div class="panel-title">MAISON</div>
            <div class="panel-value">03</div>
            <div class="panel-info">DISPOSITIFS ACTIFS</div>
        </div>

        <div class="panel">
            <div class="panel-title">MÉTÉO</div>
            <div class="panel-value">18°</div>
            <div class="panel-info">CONDITIONS STABLES</div>
        </div>

        <div class="panel">
            <div class="panel-title">SYSTÈME</div>
            <div class="panel-value">82%</div>
            <div class="panel-info">PERFORMANCE</div>
        </div>

        <div class="panel">
            <div class="panel-title">ACTIVITÉ</div>
            <div class="panel-value">12</div>
            <div class="panel-info">ÉVÉNEMENTS RÉCENTS</div>
        </div>

    </div>

    <div class="core-status"></div>

</div>

<script type="importmap">
{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
        "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from "three";

/* =========================================================
   JARVIS — REALISTIC GYROTOURBILLON
   ========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x01070a);

/* ---------------- CAMERA ---------------- */

const camera = new THREE.PerspectiveCamera(
    38,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

camera.position.set(0,0,15);

/* ---------------- RENDERER ---------------- */

const renderer = new THREE.WebGLRenderer({
    antialias:true,
    alpha:true,
    powerPreference:"high-performance"
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;

document.getElementById("app").appendChild(renderer.domElement);


/* =========================================================
   LIGHTING
   ========================================================= */

const ambient = new THREE.AmbientLight(
    0x688b96,
    1.5
);

scene.add(ambient);


/* Cyan rim */

const cyanLight = new THREE.PointLight(
    0x19dfff,
    13,
    18
);

cyanLight.position.set(
    -4,
    4,
    6
);

scene.add(cyanLight);


/* White precision light */

const whiteLight = new THREE.PointLight(
    0xdffcff,
    18,
    15
);

whiteLight.position.set(
    4,
    5,
    8
);

scene.add(whiteLight);


/* Warm mechanical light */

const warmLight = new THREE.PointLight(
    0xffa52c,
    7,
    9
);

warmLight.position.set(
    -3,
    -2,
    4
);

scene.add(warmLight);


/* =========================================================
   MATERIALS
   ========================================================= */

const steel = new THREE.MeshPhysicalMaterial({

    color:0x788d91,

    metalness:0.96,

    roughness:0.18,

    clearcoat:1,

    clearcoatRoughness:.11
});


const polishedSteel = new THREE.MeshPhysicalMaterial({

    color:0xc9e4e7,

    metalness:1,

    roughness:.10,

    clearcoat:1,

    clearcoatRoughness:.06
});


const darkSteel = new THREE.MeshPhysicalMaterial({

    color:0x10191c,

    metalness:.98,

    roughness:.24,

    clearcoat:.8
});


const gold = new THREE.MeshPhysicalMaterial({

    color:0xb57a28,

    metalness:.98,

    roughness:.16,

    clearcoat:1,

    clearcoatRoughness:.08
});


const blackMetal = new THREE.MeshPhysicalMaterial({

    color:0x05090a,

    metalness:.96,

    roughness:.14,

    clearcoat:1
});


const ruby = new THREE.MeshPhysicalMaterial({

    color:0x7a001e,

    metalness:.18,

    roughness:.08,

    emissive:0x3c0010,

    emissiveIntensity:1.3,

    clearcoat:1
});


const holographic = new THREE.MeshBasicMaterial({

    color:0x16dfff,

    transparent:true,

    opacity:.38
});


const holoBright = new THREE.MeshBasicMaterial({

    color:0x66efff,

    transparent:true,

    opacity:.72
});


/* =========================================================
   HOLOGRAPHIC OUTER SYSTEM
   ========================================================= */

const holoGroup = new THREE.Group();

scene.add(holoGroup);


/* torus helper */

function holoRing(radius, tube, opacity=.35){

    const mat = new THREE.MeshBasicMaterial({

        color:0x19dfff,

        transparent:true,

        opacity:opacity
    });

    const geo = new THREE.TorusGeometry(
        radius,
        tube,
        12,
        160
    );

    const mesh = new THREE.Mesh(
        geo,
        mat
    );

    holoGroup.add(mesh);

    return mesh;
}


const outer1 = holoRing(4.05,.018,.48);
const outer2 = holoRing(3.72,.012,.34);
const outer3 = holoRing(3.42,.026,.56);
const outer4 = holoRing(3.08,.014,.42);
const outer5 = holoRing(2.74,.025,.72);


/* =========================================================
   RADIAL HOLOGRAPHIC MARKERS
   ========================================================= */

const markerGroup = new THREE.Group();

holoGroup.add(markerGroup);

for(let i=0;i<72;i++){

    const a = (i/72)*Math.PI*2;

    const major = i%6===0;

    const radius = major ? 3.82 : 3.57;

    const length = major ? .17 : .08;

    const geo = new THREE.BoxGeometry(
        major ? .035 : .018,
        length,
        .012
    );

    const mesh = new THREE.Mesh(
        geo,
        major ? holoBright : holographic
    );

    mesh.position.set(
        Math.cos(a)*radius,
        Math.sin(a)*radius,
        0
    );

    mesh.rotation.z = a + Math.PI/2;

    markerGroup.add(mesh);
}


/* =========================================================
   MECHANICAL CORE
   ========================================================= */

const gyro = new THREE.Group();

gyro.position.set(
    0,
    .25,
    .15
);

scene.add(gyro);


/* ---------------- OUTER CASE ---------------- */

const outerCase = new THREE.Mesh(
    new THREE.TorusGeometry(
        2.15,
        .18,
        24,
        128
    ),
    polishedSteel
);

gyro.add(outerCase);


/* secondary dark housing */

const housing = new THREE.Mesh(
    new THREE.TorusGeometry(
        1.92,
        .12,
        20,
        128
    ),
    darkSteel
);

gyro.add(housing);


/* inner machined ring */

const machinedRing = new THREE.Mesh(
    new THREE.TorusGeometry(
        1.63,
        .055,
        16,
        128
    ),
    steel
);

gyro.add(machinedRing);


/* =========================================================
   ENGRAVED GRADUATIONS
   ========================================================= */

const graduationGroup = new THREE.Group();

gyro.add(graduationGroup);

for(let i=0;i<60;i++){

    const a = i/60*Math.PI*2;

    const major = i%5===0;

    const radius = 1.78;

    const h = major ? .16 : .085;

    const geo = new THREE.BoxGeometry(
        major ? .025 : .012,
        h,
        .018
    );

    const mesh = new THREE.Mesh(
        geo,
        darkSteel
    );

    mesh.position.set(
        Math.cos(a)*radius,
        Math.sin(a)*radius,
        .08
    );

    mesh.rotation.z =
        a + Math.PI/2;

    graduationGroup.add(mesh);
}


/* =========================================================
   THREE AXIS GIMBAL SYSTEM
   ========================================================= */

const axisA = new THREE.Group();
const axisB = new THREE.Group();
const axisC = new THREE.Group();

gyro.add(axisA);
axisA.add(axisB);
axisB.add(axisC);


/* outer gimbal */

const gimbal1 = new THREE.Mesh(
    new THREE.TorusGeometry(
        1.47,
        .075,
        20,
        128
    ),
    polishedSteel
);

axisA.add(gimbal1);

gimbal1.rotation.x = Math.PI/2;


/* second gimbal */

const gimbal2 = new THREE.Mesh(
    new THREE.TorusGeometry(
        1.18,
        .075,
        20,
        128
    ),
    steel
);

axisB.add(gimbal2);

gimbal2.rotation.y = Math.PI/2;


/* third gimbal */

const gimbal3 = new THREE.Mesh(
    new THREE.TorusGeometry(
        .88,
        .068,
        20,
        128
    ),
    gold
);

axisC.add(gimbal3);

gimbal3.rotation.x = Math.PI/2;


/* =========================================================
   CROSS ARMS
   ========================================================= */

function arm(length, thickness, material){

    const geo = new THREE.BoxGeometry(
        length,
        thickness,
        thickness
    );

    return new THREE.Mesh(
        geo,
        material
    );
}


const arm1 = arm(
    2.65,
    .095,
    polishedSteel
);

axisA.add(arm1);

const arm2 = arm(
    2.15,
    .085,
    steel
);

axisB.add(arm2);

arm2.rotation.z =
    Math.PI/2;


const arm3 = arm(
    1.62,
    .07,
    gold
);

axisC.add(arm3);

arm3.rotation.z =
    Math.PI/2;


/* =========================================================
   MICRO SCREWS
   ========================================================= */

function screw(x,y,z,r=.055){

    const group = new THREE.Group();

    const body = new THREE.Mesh(
        new THREE.CylinderGeometry(
            r,
            r,
            .035,
            16
        ),
        polishedSteel
    );

    body.rotation.x =
        Math.PI/2;

    group.add(body);

    const slot = new THREE.Mesh(
        new THREE.BoxGeometry(
            r*1.35,
            .018,
            .008
        ),
        darkSteel
    );

    slot.position.z=.025;

    group.add(slot);

    group.position.set(
        x,y,z
    );

    return group;
}


for(let i=0;i<8;i++){

    const a =
        i/8*Math.PI*2;

    const r=1.88;

    gyro.add(
        screw(
            Math.cos(a)*r,
            Math.sin(a)*r,
            .18
        )
    );
}


/* screws around gimbals */

for(let i=0;i<6;i++){

    const a =
        i/6*Math.PI*2;

    const r=.91;

    axisC.add(
        screw(
            Math.cos(a)*r,
            Math.sin(a)*r,
            .12,
            .042
        )
    );
}


/* =========================================================
   CENTRAL TOURBILLON CAGE
   ========================================================= */

const cage = new THREE.Group();

axisC.add(cage);


/* cage ring */

const cageRing = new THREE.Mesh(
    new THREE.TorusGeometry(
        .62,
        .045,
        18,
        96
    ),
    polishedSteel
);

cage.add(cageRing);


/* fine cage ring */

const cageInner = new THREE.Mesh(
    new THREE.TorusGeometry(
        .48,
        .025,
        14,
        96
    ),
    gold
);

cage.add(cageInner);


/* central shaft */

const shaft = new THREE.Mesh(
    new THREE.CylinderGeometry(
        .055,
        .055,
        1.22,
        20
    ),
    polishedSteel
);

shaft.rotation.x =
    Math.PI/2;

cage.add(shaft);


/* =========================================================
   CENTRAL RUBY
   ========================================================= */

const rubyOuter = new THREE.Mesh(
    new THREE.SphereGeometry(
        .24,
        32,
        32
    ),
    ruby
);

cage.add(rubyOuter);


/* ruby highlight */

const rubyGlow = new THREE.PointLight(
    0xff1450,
    3.5,
    2
);

rubyGlow.position.z=.4;

cage.add(rubyGlow);


/* =========================================================
   TINY GEAR TEETH
   ========================================================= */

function gear(
    radius,
    teeth,
    material,
    z
){

    const group = new THREE.Group();

    const base = new THREE.Mesh(
        new THREE.CylinderGeometry(
            radius,
            radius,
            .055,
            48
        ),
        material
    );

    base.position.z=z;

    group.add(base);


    for(let i=0;i<teeth;i++){

        const a =
            i/teeth*Math.PI*2;

        const tooth = new THREE.Mesh(
            new THREE.BoxGeometry(
                .075,
                .16,
                .065
            ),
            material
        );

        tooth.position.set(
            Math.cos(a)*(radius+.045),
            Math.sin(a)*(radius+.045),
            z
        );

        tooth.rotation.z=a;

        group.add(tooth);
    }

    return group;
}


const gear1 =
    gear(.76,36,gold,.02);

axisC.add(gear1);


const gear2 =
    gear(.55,30,darkSteel,.08);

cage.add(gear2);


/* =========================================================
   FINE MACHINED BRIDGES
   ========================================================= */

function bridge(length, width, material){

    const shape = new THREE.Shape();

    shape.moveTo(-length/2,0);
    shape.lineTo(length/2,0);
    shape.lineTo(length/2-.08,width);
    shape.lineTo(-length/2+.08,width);
    shape.closePath();

    const geo =
        new THREE.ExtrudeGeometry(
            shape,
            {
                depth:.055,
                bevelEnabled:true,
                bevelSegments:2,
                bevelSize:.025,
                bevelThickness:.018
            }
        );

    const mesh =
        new THREE.Mesh(
            geo,
            material
        );

    mesh.position.z=.22;

    return mesh;
}


const bridge1 =
    bridge(
        1.18,
        .12,
        polishedSteel
    );

bridge1.rotation.z=.25;

cage.add(bridge1);


const bridge2 =
    bridge(
        .95,
        .10,
        gold
    );

bridge2.rotation.z=-.82;

cage.add(bridge2);


/* =========================================================
   MICRO BEARINGS
   ========================================================= */

for(let i=0;i<5;i++){

    const a =
        i/5*Math.PI*2;

    const r=.72;

    const bearing =
        new THREE.Mesh(
            new THREE.TorusGeometry(
                .065,
                .014,
                10,
                32
            ),
            polishedSteel
        );

    bearing.position.set(
        Math.cos(a)*r,
        Math.sin(a)*r,
        .25
    );

    cage.add(bearing);
}


/* =========================================================
   DEPTH / BACK PLATE
   ========================================================= */

const backPlate =
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            1.76,
            1.76,
            .035,
            96
        ),
        blackMetal
    );

backPlate.rotation.x =
    Math.PI/2;

backPlate.position.z=-.12;

gyro.add(backPlate);


/* =========================================================
   SUBTLE CENTRAL GLOW
   ========================================================= */

const glowMaterial =
    new THREE.MeshBasicMaterial({
        color:0x00b9d6,
        transparent:true,
        opacity:.055
    });

const glowDisc =
    new THREE.Mesh(
        new THREE.CircleGeometry(
            2.2,
            96
        ),
        glowMaterial
    );

glowDisc.position.z=-.18;

scene.add(glowDisc);


/* =========================================================
   ANIMATION
   ========================================================= */

const clock =
    new THREE.Clock();


function animate(){

    requestAnimationFrame(animate);

    const t =
        clock.getElapsedTime();


    /* -----------------------------------------
       THREE AXES
       Each axis has a different mechanical speed.
       ----------------------------------------- */

    axisA.rotation.z =
        t*.42;

    axisA.rotation.x =
        Math.sin(t*.23)*.18;


    axisB.rotation.y =
        t*.68;

    axisB.rotation.z =
        Math.sin(t*.31)*.16;


    axisC.rotation.x =
        t*1.08;

    axisC.rotation.z =
        Math.sin(t*.47)*.12;


    /* central cage */

    cage.rotation.z =
        t*1.65;


    /* gears */

    gear1.rotation.z =
        -t*.95;

    gear2.rotation.z =
        t*1.55;


    /* holographic rings remain independent */

    outer1.rotation.z =
        t*.035;

    outer2.rotation.z =
        -t*.055;

    outer3.rotation.z =
        t*.08;

    outer4.rotation.z =
        -t*.11;

    outer5.rotation.z =
        t*.14;


    markerGroup.rotation.z =
        -t*.025;


    /* very subtle mechanical breathing */

    const pulse =
        1 +
        Math.sin(t*.7)*.008;

    gyro.scale.set(
        pulse,
        pulse,
        pulse
    );


    renderer.render(
        scene,
        camera
    );
}


animate();


/* =========================================================
   RESPONSIVE
   ========================================================= */

window.addEventListener(
    "resize",
    ()=>{
        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                2
            )
        );
    }
);


/* =========================================================
   TOUCH / POINTER — légère profondeur interactive
   ========================================================= */

let targetX=0;
let targetY=0;

window.addEventListener(
    "pointermove",
    e=>{

        targetX =
            (e.clientX /
            window.innerWidth -.5)*.18;

        targetY =
            (e.clientY /
            window.innerHeight -.5)*.12;
    }
);


function cameraMotion(){

    camera.position.x +=
        (targetX-camera.position.x)*.025;

    camera.position.y +=
        (-targetY-camera.position.y)*.025;

    camera.lookAt(
        0,
        .15,
        0
    );

    requestAnimationFrame(
        cameraMotion
    );
}

cameraMotion();

</script>

</body>
</html>
