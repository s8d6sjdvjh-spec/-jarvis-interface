<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1,
           maximum-scale=1,
           viewport-fit=cover">

<title>JARVIS — Precision Gyrotourbillon</title>

<style>
:root{
  --bg:#02070a;
  --cyan:#24dcff;
  --cyanSoft:#79edff;
  --text:#d9f8ff;
  --muted:#527984;
  --panel:#031117;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02070a;
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}

#app{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 50% 39%,
      rgba(0,110,135,.18),
      transparent 30%
    ),
    radial-gradient(
      circle at 50% 43%,
      rgba(0,40,52,.16),
      transparent 48%
    ),
    #02070a;
}

#grid{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.30;

  background-image:
    linear-gradient(
      rgba(25,105,120,.14) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(25,105,120,.14) 1px,
      transparent 1px
    );

  background-size:44px 44px;
}

#topbar{
  position:absolute;
  z-index:20;
  top:0;
  left:0;
  right:0;
  height:92px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:
    env(safe-area-inset-top)
    24px
    0
    24px;
}

.brand{
  font-size:17px;
  font-weight:300;
  letter-spacing:.54em;
  white-space:nowrap;
}

.status{
  display:flex;
  align-items:center;
  gap:20px;
}

.statusItem{
  display:flex;
  align-items:center;
  gap:7px;

  color:#668b94;
  font-size:9px;
  letter-spacing:.34em;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#16dcff;

  box-shadow:
    0 0 7px #16dcff,
    0 0 18px rgba(22,220,255,.55);
}

#subtitle{
  position:absolute;
  z-index:20;
  top:104px;
  left:0;
  right:0;

  text-align:center;

  color:#4d7781;
  font-size:8px;
  letter-spacing:.40em;
}

#scene{
  position:absolute;
  left:0;
  right:0;
  top:115px;
  bottom:245px;
}

#three{
  width:100%;
  height:100%;
  display:block;
}

#panels{
  position:absolute;
  z-index:30;

  left:28px;
  right:28px;
  bottom:28px;

  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.panel{
  min-height:86px;

  padding:14px 14px 12px;

  border:1px solid rgba(18,202,235,.38);

  background:
    linear-gradient(
      145deg,
      rgba(5,30,38,.82),
      rgba(1,9,13,.88)
    );

  box-shadow:
    inset 0 0 24px rgba(0,160,200,.035),
    0 0 15px rgba(0,130,170,.025);
}

.panelTitle{
  margin-bottom:9px;

  color:#57c4d6;
  font-size:8px;
  letter-spacing:.38em;
}

.panelValue{
  color:#d9faff;
  font-size:26px;
  line-height:1;
  font-weight:300;
}

.panelSub{
  margin-top:8px;

  color:#4c747e;
  font-size:8px;
  letter-spacing:.16em;
}

@media(max-width:430px){

  #topbar{
    padding-left:18px;
    padding-right:18px;
  }

  .brand{
    font-size:15px;
  }

  .status{
    gap:11px;
  }

  .statusItem{
    font-size:7px;
    gap:5px;
    letter-spacing:.22em;
  }

  #subtitle{
    top:97px;
    font-size:7px;
  }

  #scene{
    top:108px;
    bottom:245px;
  }

  #panels{
    left:20px;
    right:20px;
    bottom:22px;
    gap:8px;
  }

  .panel{
    min-height:84px;
    padding:13px 12px 11px;
  }

  .panelValue{
    font-size:24px;
  }
}
</style>
</head>

<body>

<div id="app">

  <div id="grid"></div>

  <header id="topbar">

    <div class="brand">
      J A R V I S
    </div>

    <div class="status">

      <div class="statusItem">
        <span class="dot"></span>
        ONLINE
      </div>

      <div class="statusItem">
        <span class="dot"></span>
        SECURE
      </div>

      <div class="statusItem">
        <span class="dot"></span>
        VOICE
      </div>

    </div>

  </header>

  <div id="subtitle">
    GYROTOURBILLON · PRECISION CORE · 3 AXIS
  </div>

  <div id="scene">
    <canvas id="three"></canvas>
  </div>

  <section id="panels">

    <div class="panel">
      <div class="panelTitle">MAISON</div>
      <div class="panelValue">03</div>
      <div class="panelSub">DISPOSITIFS ACTIFS</div>
    </div>

    <div class="panel">
      <div class="panelTitle">MÉTÉO</div>
      <div class="panelValue">18°</div>
      <div class="panelSub">CONDITIONS STABLES</div>
    </div>

    <div class="panel">
      <div class="panelTitle">SYSTÈME</div>
      <div class="panelValue">82%</div>
      <div class="panelSub">PERFORMANCE</div>
    </div>

    <div class="panel">
      <div class="panelTitle">ACTIVITÉ</div>
      <div class="panelValue">12</div>
      <div class="panelSub">ÉVÉNEMENTS RÉCENTS</div>
    </div>

  </section>

</div>


<script type="importmap">
{
  "imports":{
    "three":
      "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js"
  }
}
</script>


<script type="module">

import * as THREE from "three";


/* ============================================================
   RENDERER
============================================================ */

const canvas =
  document.getElementById("three");

const renderer =
  new THREE.WebGLRenderer({
    canvas,
    antialias:true,
    alpha:false,
    powerPreference:"high-performance"
  });

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio,2)
);

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

renderer.toneMapping =
  THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
  1.15;


/* ============================================================
   SCENE
============================================================ */

const scene =
  new THREE.Scene();

scene.background =
  new THREE.Color(0x02070a);


/* ============================================================
   CAMERA
============================================================ */

const camera =
  new THREE.PerspectiveCamera(
    31,
    1,
    .1,
    100
  );

camera.position.set(
  0,
  .10,
  8.8
);

camera.lookAt(
  0,
  0,
  0
);


/* ============================================================
   ENVIRONMENT
============================================================ */

function createEnvironment(){

  const c =
    document.createElement("canvas");

  c.width=1024;
  c.height=512;

  const ctx =
    c.getContext("2d");

  const g =
    ctx.createLinearGradient(
      0,0,
      0,512
    );

  g.addColorStop(
    0,
    "#0b2028"
  );

  g.addColorStop(
    .25,
    "#02090d"
  );

  g.addColorStop(
    .55,
    "#07151b"
  );

  g.addColorStop(
    .78,
    "#010407"
  );

  g.addColorStop(
    1,
    "#000204"
  );

  ctx.fillStyle=g;
  ctx.fillRect(
    0,0,
    1024,512
  );


  /* bandes de réflexion */

  const strips=[
    [70,170],
    [240,90],
    [470,140],
    [700,70],
    [890,120]
  ];

  for(
    const [x,w]
    of strips
  ){

    const lg =
      ctx.createLinearGradient(
        x,0,
        x+w,0
      );

    lg.addColorStop(
      0,
      "rgba(120,230,255,0)"
    );

    lg.addColorStop(
      .5,
      "rgba(210,250,255,.23)"
    );

    lg.addColorStop(
      1,
      "rgba(80,220,255,0)"
    );

    ctx.fillStyle=lg;

    ctx.fillRect(
      x,0,
      w,512
    );
  }


  const texture =
    new THREE.CanvasTexture(c);

  texture.mapping =
    THREE.EquirectangularReflectionMapping;

  texture.colorSpace =
    THREE.SRGBColorSpace;

  scene.environment=
    texture;
}

createEnvironment();


/* ============================================================
   LIGHTING
============================================================ */

const hemi =
  new THREE.HemisphereLight(
    0xa8eaff,
    0x020306,
    1.5
  );

scene.add(hemi);


const key =
  new THREE.DirectionalLight(
    0xffffff,
    5
  );

key.position.set(
  -4,
  5,
  7
);

scene.add(key);


const cyanLight =
  new THREE.DirectionalLight(
    0x29ddff,
    3.5
  );

cyanLight.position.set(
  5,
  1,
  -4
);

scene.add(cyanLight);


const warm =
  new THREE.PointLight(
    0xffa94f,
    14,
    9
  );

warm.position.set(
  -2,
  -1,
  3
);

scene.add(warm);


/* ============================================================
   MATERIALS
============================================================ */

const steel =
  new THREE.MeshPhysicalMaterial({

    color:0xaec7cb,

    metalness:.98,

    roughness:.20,

    clearcoat:1,

    clearcoatRoughness:.12,

    envMapIntensity:2.7
  });


const polishedSteel =
  new THREE.MeshPhysicalMaterial({

    color:0xe2f3f5,

    metalness:1,

    roughness:.075,

    clearcoat:1,

    clearcoatRoughness:.045,

    envMapIntensity:3.5
  });


const darkSteel =
  new THREE.MeshPhysicalMaterial({

    color:0x142329,

    metalness:.98,

    roughness:.24,

    clearcoat:.9,

    clearcoatRoughness:.12,

    envMapIntensity:2
  });


const blackMetal =
  new THREE.MeshPhysicalMaterial({

    color:0x020506,

    metalness:.96,

    roughness:.25,

    envMapIntensity:1.8
  });


const brass =
  new THREE.MeshPhysicalMaterial({

    color:0xb67625,

    metalness:.97,

    roughness:.17,

    clearcoat:1,

    clearcoatRoughness:.08,

    envMapIntensity:2.6
  });


const darkBrass =
  new THREE.MeshPhysicalMaterial({

    color:0x704315,

    metalness:.98,

    roughness:.22,

    envMapIntensity:2
  });


const ruby =
  new THREE.MeshPhysicalMaterial({

    color:0xff0649,

    metalness:.05,

    roughness:.055,

    clearcoat:1,

    clearcoatRoughness:.025,

    emissive:0x61001d,

    emissiveIntensity:.7
  });


const cyanMetal =
  new THREE.MeshPhysicalMaterial({

    color:0x42d8ef,

    metalness:.9,

    roughness:.15,

    clearcoat:1,

    clearcoatRoughness:.08,

    envMapIntensity:2.5
  });


/* ============================================================
   GYRO ROOT
============================================================ */

const gyro =
  new THREE.Group();

gyro.scale.setScalar(.82);

scene.add(gyro);


/* ============================================================
   HELPERS
============================================================ */

function torus(
  radius,
  tube,
  material,
  segments=96,
  radial=16
){

  const geo =
    new THREE.TorusGeometry(
      radius,
      tube,
      radial,
      segments
    );

  const mesh =
    new THREE.Mesh(
      geo,
      material
    );

  mesh.castShadow=true;
  mesh.receiveShadow=true;

  return mesh;
}


function cylinder(
  radius,
  depth,
  material,
  segments=48
){

  const geo =
    new THREE.CylinderGeometry(
      radius,
      radius,
      depth,
      segments
    );

  const mesh =
    new THREE.Mesh(
      geo,
      material
    );

  mesh.castShadow=true;
  mesh.receiveShadow=true;

  return mesh;
}


function screw(
  radius,
  depth,
  material
){

  const g =
    new THREE.Group();

  const body =
    cylinder(
      radius,
      depth,
      material,
      32
    );

  g.add(body);


  const slot =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        radius*1.45,
        depth+.01,
        radius*.18
      ),
      blackMetal
    );

  slot.rotation.z=
    Math.PI/2;

  g.add(slot);

  return g;
}


/* ============================================================
   OUTER HOROLOGICAL HOUSING
============================================================ */

const housing =
  new THREE.Group();

gyro.add(housing);


/* épaulement arrière */

const rear =
  torus(
    1.66,
    .105,
    darkSteel
  );

housing.add(rear);


/* corps métallique principal */

const outerRing =
  torus(
    1.54,
    .125,
    polishedSteel
  );

housing.add(outerRing);


/* anneau intérieur */

const innerRing =
  torus(
    1.36,
    .060,
    steel
  );

housing.add(innerRing);


/* gorge noire */

const groove =
  torus(
    1.27,
    .035,
    blackMetal
  );

housing.add(groove);


/* ============================================================
   OUTER GRADUATIONS
============================================================ */

const graduationRing =
  new THREE.Group();

housing.add(
  graduationRing
);

const tickCount=72;

for(
  let i=0;
  i<tickCount;
  i++
){

  const a =
    i/tickCount*
    Math.PI*2;

  const major =
    i%6===0;

  const length =
    major ? .13 : .075;

  const width =
    major ? .020 : .012;

  const geo =
    new THREE.BoxGeometry(
      width,
      length,
      .018
    );

  const tick =
    new THREE.Mesh(
      geo,
      major
        ? polishedSteel
        : darkSteel
    );

  const r =
    1.395;

  tick.position.set(
    Math.cos(a)*r,
    Math.sin(a)*r,
    .10
  );

  tick.rotation.z=
    a-Math.PI/2;

  graduationRing.add(tick);
}


/* ============================================================
   SCREWS ON HOUSING
============================================================ */

const screwRing =
  new THREE.Group();

housing.add(screwRing);

for(
  let i=0;
  i<8;
  i++
){

  const a =
    i/8*Math.PI*2;

  const s =
    screw(
      .060,
      .028,
      polishedSteel
    );

  s.position.set(
    Math.cos(a)*1.48,
    Math.sin(a)*1.48,
    .16
  );

  screwRing.add(s);
}


/* ============================================================
   THREE AXIS GIMBAL SYSTEM
============================================================ */


/*
   AXE 1
   Anneau principal
*/

const axis1 =
  new THREE.Group();

gyro.add(axis1);

axis1.rotation.z=
  THREE.MathUtils.degToRad(8);


const gimbal1 =
  torus(
    1.08,
    .075,
    polishedSteel,
    96,
    18
  );

axis1.add(gimbal1);


/* supports axe 1 */

for(
  const y of [-1.08,1.08]
){

  const support =
    cylinder(
      .055,
      .32,
      darkSteel
    );

  support.rotation.z=
    Math.PI/2;

  support.position.set(
    0,
    y,
    .02
  );

  axis1.add(support);
}


/*
   AXE 2
   second gimbal
*/

const axis2 =
  new THREE.Group();

gyro.add(axis2);

axis2.rotation.x=
  THREE.MathUtils.degToRad(18);


const gimbal2 =
  torus(
    .86,
    .070,
    steel,
    96,
    18
  );

axis2.add(gimbal2);


/*
   axe 2 crosses
*/

const cross2 =
  new THREE.Group();

axis2.add(cross2);


const axle2 =
  cylinder(
    .038,
    1.95,
    darkSteel
  );

cross2.add(axle2);


const axle2Cap1 =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .075,
      24,
      16
    ),
    polishedSteel
  );

axle2Cap1.position.y=
  .98;

cross2.add(axle2Cap1);


const axle2Cap2 =
  axle2Cap1.clone();

axle2Cap2.position.y=
  -.98;

cross2.add(axle2Cap2);


/*
   AXE 3
   cœur du gyrotourbillon
*/

const axis3 =
  new THREE.Group();

gyro.add(axis3);

axis3.rotation.y=
  THREE.MathUtils.degToRad(25);


const gimbal3 =
  torus(
    .63,
    .060,
    polishedSteel,
    96,
    18
  );

axis3.add(gimbal3);


/* ============================================================
   CENTRAL CAGE
============================================================ */

const cage =
  new THREE.Group();

axis3.add(cage);


/* cage circulaire */

const cageRing =
  torus(
    .43,
    .048,
    brass,
    96,
    14
  );

cage.add(cageRing);


/* cage intérieure */

const cageInner =
  torus(
    .29,
    .036,
    steel,
    80,
    12
  );

cage.add(cageInner);


/* ============================================================
   CENTRAL BALANCE
============================================================ */

const balance =
  new THREE.Group();

cage.add(balance);


/* axe vertical */

const balanceAxle =
  cylinder(
    .027,
    .82,
    polishedSteel
  );

balance.add(balanceAxle);


/* roue */

const balanceWheel =
  torus(
    .245,
    .030,
    brass,
    96,
    14
  );

balance.add(balanceWheel);


/* roue noire interne */

const balanceInner =
  torus(
    .175,
    .020,
    darkSteel,
    72,
    12
  );

balance.add(balanceInner);


/* rubis central */

const jewel =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .115,
      32,
      24
    ),
    ruby
  );

balance.add(jewel);


/* ============================================================
   BALANCE SPOKES
============================================================ */

for(
  let i=0;
  i<6;
  i++
){

  const a =
    i/6*Math.PI*2;

  const spoke =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .020,
        .39,
        .020
      ),
      brass
    );

  spoke.position.set(
    Math.cos(a)*.10,
    Math.sin(a)*.10,
    .035
  );

  spoke.rotation.z=
    a;

  balance.add(spoke);
}


/* ============================================================
   MICRO GRADUATIONS AROUND CORE
============================================================ */

const microMarks =
  new THREE.Group();

cage.add(microMarks);

for(
  let i=0;
  i<36;
  i++
){

  const a =
    i/36*Math.PI*2;

  const major =
    i%3===0;

  const mark =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        major ? .017 : .010,
        major ? .075 : .045,
        .012
      ),
      major
        ? polishedSteel
        : darkSteel
    );

  const r=.50;

  mark.position.set(
    Math.cos(a)*r,
    Math.sin(a)*r,
    .035
  );

  mark.rotation.z=
    a-Math.PI/2;

  microMarks.add(mark);
}


/* ============================================================
   SECONDARY AXLE
============================================================ */

const secondaryAxis =
  new THREE.Group();

cage.add(secondaryAxis);

const secondaryBar =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      .76,
      .026,
      .032
    ),
    polishedSteel
  );

secondaryAxis.add(
  secondaryBar
);


/* petites vis */

for(
  let i=0;
  i<4;
  i++
){

  const a =
    i/4*Math.PI*2;

  const s =
    screw(
      .032,
      .018,
      polishedSteel
    );

  s.position.set(
    Math.cos(a)*.38,
    Math.sin(a)*.38,
    .055
  );

  cage.add(s);
}


/* ============================================================
   OUTER TECHNICAL RINGS
============================================================ */

function technicalRing(
  radius,
  tube,
  material,
  rotationZ=0
){

  const ring =
    torus(
      radius,
      tube,
      material,
      128,
      12
    );

  ring.rotation.z=
    rotationZ;

  gyro.add(ring);

  return ring;
}


const tech1 =
  technicalRing(
    1.78,
    .018,
    cyanMetal,
    .15
  );


const tech2 =
  technicalRing(
    1.90,
    .012,
    darkSteel,
    -.21
  );


const tech3 =
  technicalRing(
    2.02,
    .009,
    cyanMetal,
    .08
  );


/* ============================================================
   OUTER INDEX MARKS
============================================================ */

const indexes =
  new THREE.Group();

gyro.add(indexes);

for(
  let i=0;
  i<48;
  i++
){

  const a =
    i/48*Math.PI*2;

  const major =
    i%4===0;

  const r =
    major ? 2.08 : 2.02;

  const len =
    major ? .11 : .055;

  const mark =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        major ? .020 : .010,
        len,
        .010
      ),
      major
        ? polishedSteel
        : cyanMetal
    );

  mark.position.set(
    Math.cos(a)*r,
    Math.sin(a)*r,
    -.02
  );

  mark.rotation.z=
    a-Math.PI/2;

  indexes.add(mark);
}


/* ============================================================
   CENTRAL SHADOW DISC
============================================================ */

const shadowDisc =
  new THREE.Mesh(
    new THREE.CircleGeometry(
      .72,
      96
    ),
    new THREE.MeshBasicMaterial({
      color:0x020609
    })
  );

shadowDisc.position.z=
  -.045;

gyro.add(shadowDisc);


/* ============================================================
   RE-ORDER FRONT OBJECTS
============================================================ */

gyro.traverse(
  obj=>{
    if(obj.isMesh){
      obj.renderOrder=2;
    }
  }
);


/* ============================================================
   ANIMATION
============================================================ */

const clock =
  new THREE.Clock();


function animate(){

  requestAnimationFrame(
    animate
  );

  const t =
    clock.getElapsedTime();


  /*
     mouvement lent du gyrotourbillon.
     Chaque axe possède sa propre vitesse.
  */

  axis1.rotation.z =
    THREE.MathUtils.degToRad(8)
    +
    Math.sin(t*.34)*.16
    +
    t*.055;


  axis2.rotation.x =
    THREE.MathUtils.degToRad(18)
    +
    Math.sin(t*.27)*.12;


  axis2.rotation.z =
    Math.cos(t*.19)*.08;


  axis3.rotation.y =
    THREE.MathUtils.degToRad(25)
    +
    t*.22;


  cage.rotation.z =
    t*.72;


  balance.rotation.z =
    -t*1.9;


  secondaryAxis.rotation.z =
    t*2.8;


  /*
     petite respiration de la mécanique
  */

  const pulse =
    1 +
    Math.sin(t*1.15)*.006;

  cage.scale.setScalar(
    pulse
  );


  /*
     rotation extrêmement lente
     de l'ensemble extérieur
  */

  tech1.rotation.z =
    .15+t*.018;

  tech2.rotation.z =
    -.21-t*.012;

  tech3.rotation.z =
    .08+t*.008;


  renderer.render(
    scene,
    camera
  );
}


/* ============================================================
   RESIZE
============================================================ */

function resize(){

  const w =
    canvas.clientWidth;

  const h =
    canvas.clientHeight;

  if(!w || !h){
    return;
  }

  renderer.setSize(
    w,
    h,
    false
  );

  camera.aspect =
    w/h;

  camera.updateProjectionMatrix();
}


const resizeObserver =
  new ResizeObserver(
    resize
  );

resizeObserver.observe(
  canvas
);

resize();

animate();


/* ============================================================
   TOUCH / POINTER — MICRO PARALLAX
============================================================ */

let targetX=0;
let targetY=0;

window.addEventListener(
  "pointermove",
  e=>{

    const x =
      (e.clientX /
       window.innerWidth)-.5;

    const y =
      (e.clientY /
       window.innerHeight)-.5;

    targetX=x;
    targetY=y;
  },
  {passive:true}
);


function parallax(){

  camera.position.x +=
    (targetX*.28 -
     camera.position.x)*.025;

  camera.position.y +=
    (0.10-targetY*.20 -
     camera.position.y)*.025;

  camera.lookAt(
    0,
    0,
    0
  );

  requestAnimationFrame(
    parallax
  );
}

parallax();

</script>
