<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>JARVIS — Precision Gyrotourbillon</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02070a;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    color:#d9faff;
}

#app{
    position:fixed;
    inset:0;
    overflow:hidden;

    background:
        radial-gradient(
            ellipse at 50% 42%,
            rgba(0,105,130,.18),
            rgba(0,20,26,.05) 38%,
            transparent 68%
        ),
        #02070a;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

header{
    position:absolute;
    z-index:20;

    top:0;
    left:0;
    right:0;

    height:105px;

    padding:
        calc(env(safe-area-inset-top) + 28px)
        34px
        0;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    pointer-events:none;
}

.brand{
    font-size:19px;
    font-weight:300;
    letter-spacing:.47em;
}

.status{
    display:flex;
    gap:25px;

    color:#5d7b84;

    font-size:10px;
    letter-spacing:.30em;
}

.status span{
    display:flex;
    align-items:center;
    gap:8px;
}

.status i{
    width:7px;
    height:7px;
    border-radius:50%;

    background:#09d9ff;

    box-shadow:
        0 0 6px #09d9ff,
        0 0 17px rgba(9,217,255,.65);
}

.subtitle{
    position:absolute;

    top:112px;
    left:0;
    right:0;

    text-align:center;

    color:#52727b;

    font-size:8px;
    letter-spacing:.42em;
}

.panels{
    position:absolute;

    z-index:20;

    left:29px;
    right:29px;
    bottom:30px;

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:11px;
}

.panel{
    height:91px;

    padding:15px 18px;

    border:1px solid rgba(0,185,220,.40);

    background:
        linear-gradient(
            135deg,
            rgba(6,29,36,.84),
            rgba(2,12,17,.72)
        );

    box-shadow:
        inset 0 0 25px rgba(0,190,220,.035);
}

.label{
    color:#58b8c8;

    font-size:9px;
    letter-spacing:.37em;
}

.value{
    margin-top:7px;

    color:#d9faff;

    font-size:28px;
    font-weight:300;
}

.detail{
    margin-top:4px;

    color:#506f78;

    font-size:9px;
    letter-spacing:.15em;
}

.vignette{
    position:absolute;
    inset:0;

    z-index:15;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 43%,
            rgba(0,0,0,.20) 74%,
            rgba(0,0,0,.56) 100%
        );
}
</style>
</head>

<body>

<div id="app">

<canvas id="scene"></canvas>

<header>

    <div class="brand">JARVIS</div>

    <div class="status">
        <span><i></i>ONLINE</span>
        <span><i></i>SECURE</span>
        <span><i></i>VOICE</span>
    </div>

    <div class="subtitle">
        GYROTOURBILLON · PRECISION CORE · 3 AXIS
    </div>

</header>


<div class="panels">

    <div class="panel">
        <div class="label">MAISON</div>
        <div class="value">03</div>
        <div class="detail">DISPOSITIFS ACTIFS</div>
    </div>

    <div class="panel">
        <div class="label">MÉTÉO</div>
        <div class="value">18°</div>
        <div class="detail">CONDITIONS STABLES</div>
    </div>

    <div class="panel">
        <div class="label">SYSTÈME</div>
        <div class="value">82%</div>
        <div class="detail">PERFORMANCE</div>
    </div>

    <div class="panel">
        <div class="label">ACTIVITÉ</div>
        <div class="value">12</div>
        <div class="detail">ÉVÉNEMENTS RÉCENTS</div>
    </div>

</div>

<div class="vignette"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>

(() => {

"use strict";


/* ==========================================================
   RENDERER
   ========================================================== */

const canvas =
    document.getElementById("scene");

const renderer =
    new THREE.WebGLRenderer({

        canvas,

        antialias:true,

        alpha:true,

        powerPreference:
            "high-performance"
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        2
    )
);

renderer.setSize(
    innerWidth,
    innerHeight,
    false
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    1.12;


/* ==========================================================
   SCENE
   ========================================================== */

const scene =
    new THREE.Scene();


/* ==========================================================
   CAMERA
   ========================================================== */

const camera =
    new THREE.PerspectiveCamera(
        30,
        innerWidth / innerHeight,
        .1,
        100
    );

camera.position.set(
    0,
    0.10,
    8.6
);

camera.lookAt(
    0,
    .22,
    0
);


/* ==========================================================
   LIGHTING
   ========================================================== */

scene.add(
    new THREE.AmbientLight(
        0x667b80,
        1.25
    )
);

const white =
    new THREE.DirectionalLight(
        0xf3ffff,
        4.6
    );

white.position.set(
    -4,
    5,
    7
);

scene.add(white);


const cyan =
    new THREE.DirectionalLight(
        0x19dfff,
        2.5
    );

cyan.position.set(
    4,
    1,
    4
);

scene.add(cyan);


const warm =
    new THREE.DirectionalLight(
        0xc28b46,
        .85
    );

warm.position.set(
    -3,
    -2,
    4
);

scene.add(warm);


/* ==========================================================
   MATERIALS
   ========================================================== */

const steel =
    new THREE.MeshPhysicalMaterial({

        color:0xaebfc2,

        metalness:1,

        roughness:.20,

        clearcoat:1,

        clearcoatRoughness:.08
    });


const polished =
    new THREE.MeshPhysicalMaterial({

        color:0xdce8e9,

        metalness:1,

        roughness:.105,

        clearcoat:1,

        clearcoatRoughness:.045
    });


const satin =
    new THREE.MeshPhysicalMaterial({

        color:0x65777b,

        metalness:1,

        roughness:.31,

        clearcoat:.65,

        clearcoatRoughness:.15
    });


const darkMetal =
    new THREE.MeshPhysicalMaterial({

        color:0x11191c,

        metalness:1,

        roughness:.25,

        clearcoat:1
    });


const blackMetal =
    new THREE.MeshPhysicalMaterial({

        color:0x05090b,

        metalness:.98,

        roughness:.34
    });


const brass =
    new THREE.MeshPhysicalMaterial({

        color:0x8d6426,

        metalness:1,

        roughness:.22,

        clearcoat:1
    });


/* ==========================================================
   CORE
   ========================================================== */

const core =
    new THREE.Group();

core.position.y =
    .34;

scene.add(core);


/* ==========================================================
   BEVELED RING
   ========================================================== */

function beveledRing(
    outer,
    inner,
    depth,
    material,
    bevel=.025
){

    const shape =
        new THREE.Shape();

    shape.absarc(
        0,
        0,
        outer,
        0,
        Math.PI*2,
        false
    );

    const hole =
        new THREE.Path();

    hole.absarc(
        0,
        0,
        inner,
        0,
        Math.PI*2,
        true
    );

    shape.holes.push(hole);

    const geometry =
        new THREE.ExtrudeGeometry(
            shape,
            {
                depth,

                bevelEnabled:true,

                bevelSegments:3,

                bevelSize:bevel,

                bevelThickness:bevel
            }
        );

    geometry.center();

    return new THREE.Mesh(
        geometry,
        material
    );
}


/* ==========================================================
   OUTER METALLIC CROWN
   ========================================================== */

core.add(
    beveledRing(
        1.08,
        .985,
        .105,
        darkMetal,
        .035
    )
);

core.add(
    beveledRing(
        1.00,
        .935,
        .075,
        polished,
        .025
    )
);


/* ==========================================================
   MICRO GRADUATIONS SUR LA BAGUE
   ========================================================== */

const engravingMaterial =
    new THREE.MeshStandardMaterial({

        color:0x152023,

        metalness:.95,

        roughness:.42
    });


const engraving =
    new THREE.Group();

for(let i=0;i<120;i++){

    const a =
        i / 120 *
        Math.PI * 2;

    const major =
        i % 10 === 0;

    const length =
        major
            ? .070
            : .035;

    const mark =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .010,
                length,
                .010
            ),
            engravingMaterial
        );

    mark.position.set(
        Math.cos(a)*.958,
        Math.sin(a)*.958,
        .075
    );

    mark.rotation.z =
        a;

    engraving.add(mark);
}

core.add(engraving);


/* ==========================================================
   VIS EXTERNES
   ========================================================== */

function screw(x,y,z=.10){

    const g =
        new THREE.Group();

    const head =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .035,
                .035,
                .022,
                20
            ),
            polished
        );

    head.rotation.x =
        Math.PI/2;

    head.position.set(
        x,
        y,
        z
    );

    g.add(head);

    const slit =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .042,
                .006,
                .006
            ),
            darkMetal
        );

    slit.position.set(
        x,
        y,
        z+.014
    );

    slit.rotation.z =
        .35;

    g.add(slit);

    return g;
}


for(let i=0;i<8;i++){

    const a =
        i/8 *
        Math.PI*2;

    core.add(
        screw(
            Math.cos(a)*1.01,
            Math.sin(a)*1.01
        )
    );
}


/* ==========================================================
   AXE X
   ========================================================== */

const axisX =
    new THREE.Group();

axisX.rotation.z =
    .15;

axisX.rotation.y =
    -.18;

core.add(axisX);


/* ==========================================================
   AXE X : CAGE PLATE
   ========================================================== */

const cageX =
    beveledRing(
        .77,
        .66,
        .075,
        polished,
        .028
    );

cageX.rotation.x =
    Math.PI/2;

axisX.add(cageX);


/* ==========================================================
   PONT X
   ========================================================== */

const bridgeX =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .030,
            1.34,
            .050
        ),
        satin
    );

bridgeX.position.z =
    .06;

axisX.add(bridgeX);


/* ==========================================================
   AXE Y
   ========================================================== */

const axisY =
    new THREE.Group();

axisY.rotation.x =
    THREE.MathUtils.degToRad(34);

axisY.rotation.y =
    THREE.MathUtils.degToRad(-18);

axisX.add(axisY);


/* ==========================================================
   CAGE Y
   ========================================================== */

const cageY =
    beveledRing(
        .59,
        .49,
        .070,
        steel,
        .025
    );

cageY.rotation.y =
    Math.PI/2;

axisY.add(cageY);


/* ==========================================================
   PONT Y
   ========================================================== */

const bridgeY =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            1.04,
            .028,
            .045
        ),
        polished
    );

bridgeY.position.z =
    .07;

axisY.add(bridgeY);


/* ==========================================================
   AXE Z
   ========================================================== */

const axisZ =
    new THREE.Group();

axisZ.rotation.x =
    THREE.MathUtils.degToRad(-39);

axisZ.rotation.y =
    THREE.MathUtils.degToRad(28);

axisY.add(axisZ);


/* ==========================================================
   CAGE Z
   ========================================================== */

const cageZ =
    beveledRing(
        .425,
        .325,
        .060,
        brass,
        .022
    );

axisZ.add(cageZ);


/* ==========================================================
   PONT Z
   ========================================================== */

const bridgeZ =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .028,
            .70,
            .040
        ),
        polished
    );

bridgeZ.position.z =
    .075;

axisZ.add(bridgeZ);


/* ==========================================================
   PETITE ROUE DENTÉE
   ========================================================== */

function gear(
    radius,
    teeth,
    material
){

    const g =
        new THREE.Group();

    g.add(
        beveledRing(
            radius,
            radius-.025,
            .035,
            material,
            .009
        )
    );

    for(let i=0;i<teeth;i++){

        const a =
            i/teeth *
            Math.PI*2;

        const tooth =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .018,
                    .045,
                    .026
                ),
                material
            );

        tooth.position.set(
            Math.cos(a)*radius,
            Math.sin(a)*radius,
            .055
        );

        tooth.rotation.z =
            a;

        g.add(tooth);
    }

    return g;
}


const gearA =
    gear(
        .27,
        28,
        steel
    );

const gearB =
    gear(
        .205,
        22,
        brass
    );

axisZ.add(gearA);
axisZ.add(gearB);


/* ==========================================================
   PIVOTS
   ========================================================== */

function pivot(radius=.043){

    return new THREE.Mesh(
        new THREE.SphereGeometry(
            radius,
            24,
            16
        ),
        polished
    );
}


const p1 =
    pivot();

p1.position.y =
    .54;

axisY.add(p1);


const p2 =
    pivot();

p2.position.y =
    -.54;

axisY.add(p2);


/* ==========================================================
   RUBIS — CABOCHON
   ========================================================== */

const rubyMaterial =
    new THREE.MeshPhysicalMaterial({

        color:0x9b0038,

        metalness:.02,

        roughness:.08,

        transmission:.42,

        thickness:.55,

        ior:1.76,

        clearcoat:1,

        clearcoatRoughness:.04,

        emissive:0x28000d,

        emissiveIntensity:.55
    });


const ruby =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .095,
            40,
            32
        ),
        rubyMaterial
    );

ruby.scale.z =
    .68;

ruby.position.z =
    .17;

axisZ.add(ruby);


/* ==========================================================
   REFLET ROUGE TRÈS DISCRET
   ========================================================== */

const rubyLight =
    new THREE.PointLight(
        0xff174f,
        .42,
        .8
    );

rubyLight.position.z =
    .25;

axisZ.add(rubyLight);


/* ==========================================================
   MICRO VIS SUR AXE Z
   ========================================================== */

for(let i=0;i<6;i++){

    const a =
        i/6 *
        Math.PI*2;

    const s =
        screw(
            Math.cos(a)*.39,
            Math.sin(a)*.39,
            .11
        );

    axisZ.add(s);
}


/* ==========================================================
   COURONNES HOLOGRAPHIQUES
   ========================================================== */

const holo =
    new THREE.Group();

holo.position.y =
    .34;

scene.add(holo);


function holoCircle(
    radius,
    opacity,
    width
){

    const material =
        new THREE.MeshBasicMaterial({

            color:0x19dfff,

            transparent:true,

            opacity,

            blending:
                THREE.AdditiveBlending,

            depthWrite:false
        });

    holo.add(
        new THREE.Mesh(
            new THREE.TorusGeometry(
                radius,
                width,
                8,
                180
            ),
            material
        )
    );
}


/* couronnes principales */

holoCircle(
    1.38,
    .42,
    .004
);

holoCircle(
    1.58,
    .34,
    .003
);

holoCircle(
    1.82,
    .27,
    .003
);

holoCircle(
    2.08,
    .20,
    .0025
);

holoCircle(
    2.36,
    .14,
    .002
);

holoCircle(
    2.63,
    .10,
    .0018
);


/* ==========================================================
   GRADUATIONS HOLOGRAPHIQUES IRRÉGULIÈRES
   ========================================================== */

const hud =
    new THREE.Group();

hud.position.y =
    .34;

scene.add(hud);


const hudMat =
    new THREE.MeshBasicMaterial({

        color:0x31dcff,

        transparent:true,

        opacity:.55,

        blending:
            THREE.AdditiveBlending,

        depthWrite:false
    });


const radii = [
    1.45,
    1.68,
    1.92,
    2.16,
    2.42,
    2.68
];


radii.forEach(
    (radius,index)=>{

        const count =
            72 + index*12;

        for(let i=0;i<count;i++){

            /*
               On ne veut volontairement
               PAS une horloge parfaitement
               régulière.
            */

            const irregular =
                Math.sin(i*7.13+index)*.045;

            const a =
                i/count *
                Math.PI*2 +
                irregular;

            const important =
                i%12===0 ||
                (index>2 && i%19===0);

            const len =
                important
                    ? .095
                    : .036 + 
                      Math.abs(
                        Math.sin(i*3.7)
                      )*.026;

            const tick =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        len,
                        .006,
                        .006
                    ),
                    hudMat
                );

            tick.position.set(
                Math.cos(a)*radius,
                Math.sin(a)*radius,
                0
            );

            tick.rotation.z =
                a;

            hud.add(tick);
        }
    }
);


/* ==========================================================
   PETITS POINTS LUMINEUX
   ========================================================== */

const pointMat =
    new THREE.MeshBasicMaterial({
        color:0xd8fbff
    });


for(let i=0;i<16;i++){

    const a =
        i/16 *
        Math.PI*2;

    const r =
        i%2===0
            ? 2.69
            : 2.47;

    const dot =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                i%2===0 ? .025 : .012,
                12,
                12
            ),
            pointMat
        );

    dot.position.set(
        Math.cos(a)*r,
        .34 +
        Math.sin(a)*r,
        0
    );

    scene.add(dot);
}


/* ==========================================================
   ANIMATION
   ========================================================== */

const clock =
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );

    const t =
        clock.getElapsedTime();


    /*
     ========================================================
     LES TROIS AXES
     ========================================================

     X = rotation lente
     Y = rotation indépendante
     Z = rotation plus rapide

     Ils sont imbriqués :

     scène
       └── X
            └── Y
                 └── Z

     Le mouvement résultant devient
     réellement tridimensionnel.
    */


    axisX.rotation.z =
        .15 +
        t*.52;

    axisX.rotation.y =
        -.18 +
        Math.sin(t*.37)*.055;


    axisY.rotation.x =
        THREE.MathUtils.degToRad(34) +
        t*.78;

    axisY.rotation.z =
        Math.sin(t*.43)*.10;


    axisZ.rotation.y =
        THREE.MathUtils.degToRad(28) +
        t*1.23;

    axisZ.rotation.x =
        THREE.MathUtils.degToRad(-39) +
        Math.sin(t*.57)*.075;


    /*
     ========================================================
     ROUE INTERNE
     ========================================================
    */

    gearA.rotation.z =
        -t*1.75;

    gearB.rotation.z =
        t*2.65;


    /*
     ========================================================
     RUBIS
     ========================================================
    */

    ruby.scale.z =
        .68 +
        Math.sin(t*1.7)*.025;


    /*
     ========================================================
     COURONNES HUD
     ========================================================
    */

    holo.rotation.z =
        t*.018;

    hud.rotation.z =
        -t*.033;


    /*
     ========================================================
     LÉGER MOUVEMENT DE L'ENSEMBLE
     ========================================================
    */

    core.rotation.y =
        Math.sin(t*.17)*.035;

    core.rotation.x =
        Math.cos(t*.13)*.018;


    renderer.render(
        scene,
        camera
    );
}


animate();


/* ==========================================================
   RESPONSIVE
   ========================================================== */

function resize(){

    const w =
        innerWidth;

    const h =
        innerHeight;

    renderer.setSize(
        w,
        h,
        false
    );

    camera.aspect =
        w/h;

    camera.updateProjectionMatrix();


    /*
       Le mécanisme reste volontairement
       plus petit que les couronnes.
    */

    const s =
        w < 600
            ? .82
            : .96;

    core.scale.setScalar(s);
}


window.addEventListener(
    "resize",
    resize
);

resize();

})();

</script>

</body>
</html>
