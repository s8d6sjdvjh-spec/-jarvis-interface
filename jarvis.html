<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>JARVIS</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020508;
        color: #dffaff;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                     "Helvetica Neue", sans-serif;
    }

    body {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
            radial-gradient(circle at center,
                rgba(0, 145, 190, 0.16) 0%,
                rgba(0, 35, 55, 0.08) 28%,
                rgba(0, 0, 0, 0) 58%),
            #020508;
    }

    /* =========================
       FOND
       ========================= */

    .grid {
        position: absolute;
        inset: -50%;
        opacity: 0.16;
        background-image:
            linear-gradient(rgba(0, 170, 210, 0.12) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 170, 210, 0.12) 1px, transparent 1px);
        background-size: 42px 42px;
        transform: perspective(600px) rotateX(62deg) translateY(15%);
        transform-origin: center;
    }

    .vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
            circle,
            transparent 35%,
            rgba(0, 0, 0, 0.45) 100%
        );
    }

    /* =========================
       INTERFACE
       ========================= */

    .interface {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 35px 25px;
    }

    .top {
        position: absolute;
        top: 42px;
        left: 0;
        right: 0;
        text-align: center;
    }

    .system-name {
        font-size: 13px;
        letter-spacing: 7px;
        font-weight: 500;
        color: rgba(180, 240, 255, 0.75);
        margin-left: 7px;
    }

    .system-status {
        margin-top: 12px;
        font-size: 9px;
        letter-spacing: 4px;
        color: #00cfff;
        opacity: 0.8;
    }

    /* =========================
       ORBE
       ========================= */

    .reactor {
        position: relative;
        width: min(72vw, 330px);
        height: min(72vw, 330px);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .ring {
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(0, 205, 255, 0.34);
    }

    .ring.one {
        inset: 7%;
        animation: rotate 18s linear infinite;
        border-top-color: rgba(0, 225, 255, 0.9);
        border-bottom-color: transparent;
    }

    .ring.two {
        inset: 15%;
        border-color: rgba(0, 170, 220, 0.24);
        border-left-color: rgba(0, 220, 255, 0.85);
        animation: rotateReverse 11s linear infinite;
    }

    .ring.three {
        inset: 24%;
        border-style: dashed;
        border-color: rgba(0, 200, 240, 0.28);
        animation: rotate 8s linear infinite;
    }

    .ring.four {
        inset: 33%;
        border-color: rgba(80, 230, 255, 0.2);
    }

    .core {
        position: relative;
        width: 28%;
        height: 28%;
        border-radius: 50%;
        background:
            radial-gradient(circle at 40% 35%,
                #ffffff 0%,
                #9df5ff 12%,
                #00cfff 32%,
                #006c96 55%,
                #00121c 78%);
        box-shadow:
            0 0 20px rgba(0, 215, 255, 0.8),
            0 0 60px rgba(0, 160, 230, 0.45),
            0 0 110px rgba(0, 100, 180, 0.22);
        animation: breathe 3.2s ease-in-out infinite;
    }

    .core::after {
        content: "";
        position: absolute;
        inset: 18%;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.7);
        opacity: 0.6;
    }

    .orbit {
        position: absolute;
        inset: 2%;
        border-radius: 50%;
        border: 1px solid transparent;
        border-top-color: rgba(0, 230, 255, 0.5);
        transform: rotate(-25deg) scaleY(0.38);
        animation: orbit 5s linear infinite;
    }

    /* =========================
       INFORMATIONS
       ========================= */

    .state {
        position: absolute;
        bottom: 145px;
        text-align: center;
    }

    .state-label {
        font-size: 11px;
        letter-spacing: 5px;
        color: rgba(180, 240, 255, 0.55);
        margin-bottom: 10px;
    }

    .state-value {
        font-size: 20px;
        letter-spacing: 5px;
        font-weight: 300;
        color: #e5fbff;
        text-shadow: 0 0 15px rgba(0, 210, 255, 0.55);
        transition: all 0.3s ease;
    }

    .message {
        position: absolute;
        bottom: 82px;
        left: 25px;
        right: 25px;
        text-align: center;
        min-height: 28px;
        font-size: 15px;
        font-weight: 300;
        color: rgba(215, 248, 255, 0.85);
        letter-spacing: 0.5px;
    }

    /* =========================
       PETITS INDICATEURS
       ========================= */

    .telemetry {
        position: absolute;
        left: 24px;
        bottom: 27px;
        font-family: monospace;
        font-size: 8px;
        line-height: 1.7;
        letter-spacing: 1px;
        color: rgba(0, 190, 230, 0.45);
    }

    .telemetry span {
        color: rgba(130, 230, 255, 0.8);
    }

    .connection {
        position: absolute;
        right: 24px;
        bottom: 27px;
        text-align: right;
        font-size: 8px;
        letter-spacing: 2px;
        color: rgba(0, 200, 240, 0.55);
    }

    .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-right: 5px;
        border-radius: 50%;
        background: #00d9ff;
        box-shadow: 0 0 10px #00d9ff;
    }

    /* =========================
       ETAT ACTIF
       ========================= */

    body.active .core {
        animation:
            breathe 1.1s ease-in-out infinite,
            pulse 1.1s ease-in-out infinite;
    }

    body.active .ring.one {
        border-top-color: #ffffff;
    }

    body.active .state-value {
        color: #ffffff;
        text-shadow:
            0 0 10px #00d9ff,
            0 0 25px rgba(0, 200, 255, 0.8);
    }

    /* =========================
       ANIMATIONS
       ========================= */

    @keyframes rotate {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
    }

    @keyframes rotateReverse {
        from { transform: rotate(360deg); }
        to   { transform: rotate(0deg); }
    }

    @keyframes orbit {
        from { transform: rotate(0deg) scaleY(0.38); }
        to   { transform: rotate(360deg) scaleY(0.38); }
    }

    @keyframes breathe {
        0%, 100% {
            transform: scale(0.92);
        }
        50% {
            transform: scale(1.08);
        }
    }

    @keyframes pulse {
        0%, 100% {
            box-shadow:
                0 0 20px rgba(0, 215, 255, 0.8),
                0 0 60px rgba(0, 160, 230, 0.45);
        }
        50% {
            box-shadow:
                0 0 30px rgba(0, 240, 255, 1),
                0 0 100px rgba(0, 190, 255, 0.7),
                0 0 150px rgba(0, 120, 220, 0.3);
        }
    }
</style>
</head>

<body>

<div class="grid"></div>
<div class="vignette"></div>

<main class="interface">

    <header class="top">
        <div class="system-name">J A R V I S</div>
        <div class="system-status">PERSONAL AI SYSTEM</div>
    </header>

    <section class="reactor" id="reactor">

        <div class="ring one"></div>
        <div class="ring two"></div>
        <div class="ring three"></div>
        <div class="ring four"></div>

        <div class="orbit"></div>

        <div class="core"></div>

    </section>

    <section class="state">
        <div class="state-label">SYSTEM STATUS</div>
        <div class="state-value" id="state">STANDBY</div>
    </section>

    <div class="message" id="message">
        En attente de votre commande.
    </div>

    <div class="telemetry">
        CORE <span>ONLINE</span><br>
        VOICE <span>READY</span><br>
        HOMEKIT <span>READY</span>
    </div>

    <div class="connection">
        <span class="dot"></span>
        SYSTEM ONLINE
    </div>

</main>

<script>
    const state = document.getElementById("state");
const message = document.getElementById("message");
const reactor = document.getElementById("reactor");

const shortcutName = "JARVIS — Lumière ON";

reactor.addEventListener("click", () => {

    document.body.classList.add("active");

    // 1 — Jarvis écoute
    state.textContent = "LISTENING";
    message.textContent = "Oui, monsieur.";

    // 2 — Jarvis traite la commande
    setTimeout(() => {
        state.textContent = "PROCESSING";
        message.textContent = "Activation de la lumière…";
    }, 1200);

    // 3 — Appel réel du raccourci iOS
    setTimeout(() => {

        const shortcutURL =
            "shortcuts://run-shortcut?name=" +
            encodeURIComponent(shortcutName);

        window.location.href = shortcutURL;

    }, 2200);

    // 4 — État visuel après l'envoi de la commande
    setTimeout(() => {

        state.textContent = "LIGHT ONLINE";
        message.textContent = "Commande HomeKit exécutée.";

        document.body.classList.remove("active");

    }, 4000);

});
</script>

</body>
</html>
